# Include this file inside the existing www.gyuwon.net <VirtualHost *:443>.
# Required modules: proxy, proxy_http, ssl

SSLProxyEngine On
ProxyRequests Off
ProxyPreserveHost Off

# The Mupid build emits these public files at the upstream origin root.
ProxyPassMatch "^/(mupid-logo\.svg|mupid-mark\.svg|favicon\.svg|og-mupid\.png|og-editorial\.png|og\.png)$" "https://mupid.gyuone.chatgpt.site/$1"

# The build emits JavaScript, CSS, and fonts below /_next/static/.
ProxyPass        "/_next/static/" "https://mupid.gyuone.chatgpt.site/_next/static/"
ProxyPassReverse "/_next/static/" "https://mupid.gyuone.chatgpt.site/_next/static/"

# Put the slash form first because ProxyPass rules use first-match ordering.
ProxyPass        "/mupid/" "https://mupid.gyuone.chatgpt.site/mupid/"
ProxyPassReverse "/mupid/" "https://mupid.gyuone.chatgpt.site/mupid/"
ProxyPass        "/mupid"  "https://mupid.gyuone.chatgpt.site/mupid"
ProxyPassReverse "/mupid"  "https://mupid.gyuone.chatgpt.site/mupid"

# Validate and reload after adding the include to the TLS virtual host:
#   apachectl configtest
#   systemctl reload apache2
#
# Smoke tests:
#   curl -fsSI https://www.gyuwon.net/mupid
#   curl -fsS https://www.gyuwon.net/mupid | grep -o '/_next/static/[^" ]*' | head
