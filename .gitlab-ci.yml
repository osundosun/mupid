stages:
  - verify
  - ai-review
  - package
  - deploy

include:
  # 영역 라벨(Frontend·Backend·AI·Data)이 MR 파이프라인을 고른다. 라벨이 없는
  # MR 은 require-area-label 이 막는다. 자세한 것은 그 파일 머리말에 있다.
  - local: infra/ci/labels.yml
  - local: infra/ci/frontend.yml
  - local: infra/ci/backend.yml
  - local: infra/ci/data.yml
  - local: infra/ci/app.yml
  - local: infra/ci/manifests.yml
  # infra/ci/release.yml (Compose 배포) 는 뺐다. frontend.yml·backend.yml 은
  # backend-verify·frontend-verify 때문에 남는다 — k8s job 이 needs 로 쓴다.
  - local: infra_k8s/ci/k8s-release.yml
  - local: infra/ci/ai-server.yml

gemini-code-review:
  stage: ai-review
  image: python:3.12-slim
  interruptible: true
  allow_failure: true
  timeout: 5m
  variables:
    GIT_DEPTH: "0"
    GEMINI_MODEL: "gemini-3.7-flash"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^study\/이규원\//'
    - when: never
  script:
    - python scripts/gemini_review.py
