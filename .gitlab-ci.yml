stages:
  - verify
  - ai-review
  - package
  - deploy

include:
  - local: infra/ci/frontend.yml
  - local: infra/ci/backend.yml
  # infra/ci/release.yml (Compose 배포) 는 뺐다. frontend.yml·backend.yml 은
  # backend-verify·frontend-verify 때문에 남는다 — k8s job 이 needs 로 쓴다.
  - local: infra_k8s/ci/k8s-release.yml

gemini-code-review:
  stage: ai-review
  image: python:3.12-slim
  interruptible: true
  allow_failure: true
  timeout: 5m
  variables:
    GIT_DEPTH: "0"
    GEMINI_MODEL: "gemini-3.7-flash"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^study\/이규원\//'
    - when: never
  script:
    - python scripts/gemini_review.py
