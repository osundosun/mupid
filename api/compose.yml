# 개발용: 스프링은 호스트(IDE/`./gradlew bootRun`)에서 직접 실행하고,
# 여기서는 인프라와 nginx 만 띄운다.
#   docker compose up -d
#   ./gradlew bootRun
#
# 스프링까지 컨테이너로 띄우는 운영 구성은 compose.prod.yml 을 사용할 것.
#
# nginx 는 호스트에서 도는 스프링(host.docker.internal:8800)으로 프록시하므로
# http://localhost:8080/api/... 로 운영과 같은 경로로 확인할 수 있다.
name: mupid-dev

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: mupid-dev-nginx
    restart: unless-stopped
    environment:
      API_UPSTREAM: host.docker.internal:${MUPID_PORT:-8800}
      NGINX_ENVSUBST_FILTER: "^API_UPSTREAM$$"
      TZ: Asia/Seoul
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    ports:
      - "${MUPID_NGINX_PORT:-8080}:80"
    networks:
      - frontend
    # Docker Desktop 이 아닌 리눅스에서도 host.docker.internal 이 호스트를 가리키도록
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: mupid-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MUPID_MYSQL_PASSWORD}
      MYSQL_DATABASE: mupid
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # 호스트의 스프링이 붙어야 하므로 반드시 포트를 노출한다 (.env 의 MUPID_MYSQL_URL 과 동일)
    ports:
      - "${MUPID_MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: mupid-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${MUPID_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  frontend:
    name: mupid-dev-frontend
    driver: bridge
  backend:
    name: mupid-dev-backend
    driver: bridge

volumes:
  mysql-data:
    name: mupid-dev-mysql-data
  redis-data:
    name: mupid-dev-redis-data
