name: mupid-dev

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: mupid-dev-nginx
    restart: unless-stopped
    environment:
      API_UPSTREAM: host.docker.internal:${MUPID_PORT:-8800}
      NGINX_ENVSUBST_FILTER: "^API_UPSTREAM$$"
      TZ: Asia/Seoul
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    ports:
      - "${MUPID_NGINX_PORT:-8080}:80"
    networks:
      - frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: mupid-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MUPID_MYSQL_PASSWORD}
      MYSQL_DATABASE: mupid
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MUPID_MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: mupid-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${MUPID_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  storage:
    image: chrislusf/seaweedfs
    container_name: mupid-dev-storage
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-filer"]
    environment:
      - AWS_ACCESS_KEY_ID=${MUPID_S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${MUPID_S3_SECRET}
      - S3_BUCKET=${MUPID_S3_BUCKET}
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    volumes:
      - storage-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  frontend:
    name: mupid-dev-frontend
    driver: bridge
  backend:
    name: mupid-dev-backend
    driver: bridge

volumes:
  mysql-data:
    name: mupid-dev-mysql-data
  redis-data:
    name: mupid-dev-redis-data
  storage-data:
    name: mupid-dev-storage-data
