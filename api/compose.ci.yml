# Isolated integration-test environment. No host ports or production volumes.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ci-only-root-password
      MYSQL_DATABASE: mupid_ci
      MYSQL_USER: mupid_ci
      MYSQL_PASSWORD: ci-only-app-password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  test:
    image: azul-zulu:21-jdk
    working_dir: /workspace
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
    environment:
      MUPID_MYSQL_URL: jdbc:mysql://mysql:3306/mupid_ci?allowPublicKeyRetrieval=true&useSSL=false
      MUPID_MYSQL_USER: mupid_ci
      MUPID_MYSQL_PASSWORD: ci-only-app-password
      MUPID_REDIS_HOST: redis
      MUPID_REDIS_PORT: '6379'
      MUPID_JWT_SECRET: Y2ktb25seS10ZXN0LWtleS1ub3QtZm9yLXByb2R1Y3Rpb24=
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [bash, gradlew, --no-daemon, --console=plain, build]
volumes:
  gradle-cache:
