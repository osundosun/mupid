  content: |-
    # Stream

    음악 스트리밍 API 입니다. 음원 하나(_music_)당 여러 비트레이트·코덱의
    스트림이 존재하고, 각 스트림은 재생 순서대로 번호가 매겨진 청크(chunk)들로
    구성됩니다.

    | 엔드포인트 | 동작 | 인증 |
    | --- | --- | --- |
    | `GET /api/v1/music/{musicId}/stream` | 스트림 목록 조회 | 필요 |
    | `POST /api/v1/music/{musicId}/stream` | 스트림 생성 | SYSTEM/ADMIN |
    | `GET /api/v1/chunk/{streamId}` | 청크 목록 조회 | 필요 |
    | `GET /api/v1/chunk/{streamId}/{index}` | 청크 다운로드 | 필요 |
    | `PUT /upload/chunk/{streamId}/{index}` | 청크 업로드 (**스토리지 직행**) | SYSTEM/ADMIN |
    | `POST /api/v1/chunk/{streamId}/{index}` | 청크 등록 (메타 커밋) | SYSTEM/ADMIN |
    | `PATCH /api/v1/stream/{streamId}` | 스트림 상태 변경 | SYSTEM/ADMIN |
    | `DELETE /api/v1/stream/{streamId}` | 스트림 삭제 | SYSTEM/ADMIN |

    ## 오디오 등록 순서

    음악(`Music` 폴더) 을 먼저 등록한 뒤 아래 순서로 음원을 올립니다.
    `music_chunking` 배치가 이 순서를 그대로 호출합니다.

    1. `스트림 생성` — 청크 개수·재생 길이를 선언한다 (`PENDING`)
    2. 청크마다 두 번:
       - `청크 업로드` — 바이트를 스토리지에 올린다 (nginx 가 처리, 스프링은 인증만)
       - `청크 등록` — 길이·해시·크기를 기록한다 (첫 등록에서 `IN_PROGRESS` 로 바뀜)
    3. `스트림 상태 변경` → `DONE` — 이때 청크 수가 맞는지 검사한다

    `DONE` 이 되기 전까지는 `스트림 목록 조회` 에 나오지 않습니다. 재생 중에
    끊기는 반쪽짜리 스트림을 클라이언트가 보지 못하게 하기 위해서입니다.

    다시 올리려면 `스트림 삭제` 로 청크·스토리지 파일까지 지운 뒤 1번부터
    반복합니다. 같은 음악에 같은 코덱·비트레이트를 두 번 만들면
    `MUPID_DUPLICATE_STREAM` (409) 입니다.

    ## 음원 바이트는 스프링을 거치지 않습니다

    업로드도 다운로드도 스프링은 **인증과 스토리지 경로 결정만** 합니다.
    바이트는 nginx 가 오브젝트 스토리지와 직접 주고받습니다. 고용량 음원이
    JVM 힙에 올라오지 않게 하려는 구조입니다
    ([decision/0016](../../knowledge/decision/0016-audio-upload-three-step.md)).

    | 방향 | nginx 기능 | 스프링이 주는 것 |
    | --- | --- | --- |
    | 다운로드 | `X-Accel-Redirect` (응답 헤더) | `/storage/buckets/…` 내부 URI |
    | 업로드 | `auth_request` (본문 없는 선행 서브요청) | `X-Storage-Path: /buckets/…` |

    `X-Accel-Redirect` 는 응답 시점 리다이렉트라 본문이 있는 업로드에는 쓸 수
    없습니다. 그래서 업로드만 `auth_request` 를 씁니다.

    **nginx 설정이 없으면 두 경로 모두 동작하지 않습니다.** 다운로드는
    `internal` 인 `/storage/` location 이, 업로드는 `/upload/chunk/` location 과
    `auth_request` 가 필요합니다. 스프링만 띄워서는 음원을 올리거나 받을 수 없습니다.

    ### 업로드 오류는 헤더로 옵니다

    nginx `auth_request` 는 인증 서브요청의 **401·403 만** 넘기고 그 밖의 4xx 는
    전부 500 으로 바꾸며 본문도 버립니다. 사유는 `X-Mupid-Error` 응답 헤더에
    실려 옵니다. 자세한 건 `청크 업로드` 문서를 보세요.

    ## 코드 값

    - `codec` — `AAC`, `OPUS`
    - `status` — `PENDING` / `IN_PROGRESS` / `DONE` / `FAILED`

    삭제된 음악의 스트림·청크는 모두 404 (`MUPID_MUSIC_NOT_FOUND` /
    `MUPID_CHUNK_NOT_FOUND`) 로 취급됩니다.
