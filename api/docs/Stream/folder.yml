    # Stream

    음악 스트리밍 API 입니다. 음원 하나(_music_)당 여러 비트레이트의 스트림이
    존재하고, 각 스트림은 재생 순서대로 번호가 매겨진 청크(chunk)들로 구성됩니다.

    | 엔드포인트 | 동작 | 인증 |
    | --- | --- | --- |
    | `GET /api/v1/stream/{musicId}` | 스트림 정보 조회 | 필요 |
    | `GET /api/v1/chunk/{streamId}/{index}` | 청크 1개 조회 | 필요 |
    | `GET /api/v1/chunk/{streamId}?from=...&to=...` | 청크 범위 조회 | 필요 |

    ## 코드 값

    - `codec` — `AAC`, `OPUS`
    - `status` — `PENDING` / `IN_PROGRESS` / `DONE` / `FAILED`

    삭제된 음악을 조회하면 `MUPID_MUSIC_NOT_FOUND` 가,
    스트림이 없으면 `MUPID_STREAM_NOT_FOUND` 가 반환됩니다.
    삭제된 음원의 청크는 모두 404 (`MUPID_CHUNK_NOT_FOUND`) 입니다.