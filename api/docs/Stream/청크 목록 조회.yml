info:
  name: 청크 목록 조회
  type: http
  seq: 6

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/chunk/{{STREAM_ID}}"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

runtime:
  variables:
    - name: STREAM_ID
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 조회 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "chunks": [
                {
                  "index": 0,
                  "duration_ms": 6000,
                  "file_hash": "40f2bd0d49a0d1ec069be784f84ef32d55d90c7b9b9e32219e9afc6a704316d5"
                },
                {
                  "index": 1,
                  "duration_ms": 1020,
                  "file_hash": "69a7919743d65fe53ebbca0da96f6420145276effa9dca6535a4b15faacbb6d7"
                }
              ]
            }
          }
  - name: 200 청크 없음 / 삭제된 음악
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "chunks": []
            }
          }

docs: |-
  # 청크 목록 조회

  `GET /api/v1/chunk/{streamId}` · 인증 필요

  스트림의 청크 목록을 재생 순서(`index` 오름차순)로 조회합니다.

  ## 응답 필드

  | 필드 | 타입 | 설명 |
  | --- | --- | --- |
  | `data.chunks[].index` | int | 청크 순서 (0 부터) |
  | `data.chunks[].duration_ms` | int | 이 청크의 재생 길이 (ms) |
  | `data.chunks[].file_hash` | string | SHA-256 (소문자 hex) |

  `file_hash` 는 서버가 수신한 바이트로 계산한 값입니다. 클라이언트가
  다운로드한 청크를 검증하거나 캐시 키로 쓸 수 있습니다.

  마지막 청크는 세그먼트 길이보다 짧습니다. `duration_ms` 를 설정값으로
  가정하지 말고 응답 값을 쓰세요.

  ## 없는 스트림

  존재하지 않는 스트림 번호나 삭제된 음악의 스트림은 404 가 아니라 **빈
  배열**이 돌아옵니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
