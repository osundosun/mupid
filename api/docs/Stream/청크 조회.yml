info:
  name: 청크 조회
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/chunk/{{STREAM_ID}}/{{CHUNK_INDEX}}"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

runtime:
  variables:
    - name: CHUNK_INDEX
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 조회 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "index": 0,
              "duration_ms": 24000,
              "file_url": "/api/v1/chunk/data/17",
              "file_hash": "6e0c3d09a9e22b6ec1ea3d8a41f9e0a8"
            }
          }
  - name: 404 청크 없음
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_CHUNK_NOT_FOUND",
            "message": "요청한 청크를 찾을 수 없습니다.",
            "error_details": null
          }

docs: |-
  # 청크 조회

  `GET /api/v1/chunk/{streamId}/{index}` · 인증 필요

  스트림의 청크 1개를 조회합니다. 인덱스는 `0` 부터 시작하며
  `chunk_count - 1` 까지 유효합니다.

  ## 응답 필드

  | 필드 | 타입 | 설명 |
  | --- | --- | --- |
  | `data.index` | int | 청크 순서 |
  | `data.duration_ms` | int | 청크 재생 길이 (ms) |
  | `data.file_url` | string | 청크 파일 경로 (`/api/v1/chunk/data/{chunkId}`) |
  | `data.file_hash` | string | 청크 파일 해시 (무결성 검증용) |

  `file_url` 은 실제 오디오 데이터를 담고 있는 경로입니다. 파일 바이너리를
  내려주는 엔드포인트는 별도로 준비되어 있으며, 이 컬렉션에는 아직 요청으로
  추가하지 않았습니다 (구현 시 `Chunk` 라는 이름으로 추가).

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
  | `MUPID_CHUNK_NOT_FOUND` | 404 | 청크 없음 또는 원본 음원이 삭제됨 |