info:
  name: 스트림 삭제
  type: http
  seq: 8

http:
  method: DELETE
  url: "{{BASE_URL}}/api/v1/stream/{{STREAM_ID}}"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

runtime:
  variables:
    - name: STREAM_ID
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 삭제 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "스트림이 삭제되었습니다.",
            "data": null
          }
  - name: 404 스트림 없음
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_STREAM_NOT_FOUND",
            "message": "요청한 스트림을 찾을 수 없습니다.",
            "error_details": null
          }

docs: |-
  # 스트림 삭제

  `DELETE /api/v1/stream/{streamId}` · `ROLE_SYSTEM` / `ROLE_ADMIN` 필요

  스트림과 딸린 청크, 오브젝트 스토리지의 청크 파일까지 모두 지웁니다.
  같은 음악에 같은 코덱·비트레이트로 **다시 올릴 때** 쓰는 엔드포인트입니다.

  ## 삭제 범위

  | 대상 | 방식 |
  | --- | --- |
  | `chunks` 행 | 하드 삭제 |
  | `streams` 행 | 하드 삭제 |
  | 오브젝트 스토리지의 청크 파일 | 실제 삭제 |
  | `object_storage_files` 행 | 소프트 삭제 (`is_deleted = true`) |

  음악·앨범·아티스트는 건드리지 않습니다. 곡은 그대로 두고 음원만 교체하는
  용도입니다.

  삭제된 음악의 스트림도 지울 수 있습니다 (정리 목적).

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
  | `MUPID_FORBIDDEN` | 403 | SYSTEM/ADMIN 이 아닌 토큰 |
  | `MUPID_STREAM_NOT_FOUND` | 404 | 스트림 없음 |
