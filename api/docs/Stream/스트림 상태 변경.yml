info:
  name: 스트림 상태 변경
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{BASE_URL}}/api/v1/stream/{{STREAM_ID}}"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "{{STREAM_STATUS}}"
      }
  auth: inherit

runtime:
  variables:
    - name: STREAM_ID
      value: "1"
    - name: STREAM_STATUS
      value: DONE

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 변경 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "스트림 상태가 변경되었습니다.",
            "data": null
          }
  - name: 409 청크 미완료
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_STREAM_CHUNK_INCOMPLETE",
            "message": "청크가 모두 업로드되지 않아 완료 처리할 수 없습니다.",
            "error_details": null
          }
  - name: 404 스트림 없음
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_STREAM_NOT_FOUND",
            "message": "요청한 스트림을 찾을 수 없습니다.",
            "error_details": null
          }

docs: |-
  # 스트림 상태 변경

  `PATCH /api/v1/stream/{streamId}` · `ROLE_SYSTEM` / `ROLE_ADMIN` 필요

  오디오 등록 **3단계**. 청크를 다 올린 뒤 `DONE` 으로 올려야 재생 대상이
  됩니다. `DONE` 이 되기 전에는 `스트림 목록 조회` 에 나오지 않습니다.

  ## 요청 본문

  | 필드 | 타입 | 필수 | 설명 |
  | --- | --- | --- | --- |
  | `status` | string | ✅ | `PENDING` / `IN_PROGRESS` / `DONE` / `FAILED` |

  ## DONE 검사

  `DONE` 은 "이 스트림은 이제 재생해도 된다" 는 선언입니다. 그래서 업로드된
  청크 수가 `스트림 생성` 때 선언한 `chunk_count` 와 정확히 같을 때만
  허용합니다. 모자라면 409 (`MUPID_STREAM_CHUNK_INCOMPLETE`) 입니다.

  인코딩이 실패했다면 `FAILED` 로 표시해 두면 됩니다. 검사 없이 바뀝니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
  | `MUPID_FORBIDDEN` | 403 | SYSTEM/ADMIN 이 아닌 토큰 |
  | `MUPID_INVALID_REQUEST_BODY` | 400 | `status` 누락 |
  | `MUPID_STREAM_NOT_FOUND` | 404 | 스트림 없음 또는 음악이 삭제됨 |
  | `MUPID_STREAM_CHUNK_INCOMPLETE` | 409 | 청크 수가 `chunk_count` 와 다름 |
