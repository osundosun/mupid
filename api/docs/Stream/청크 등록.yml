info:
  name: 청크 등록
  type: http
  seq: 4

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/chunk/{{STREAM_ID}}/{{CHUNK_INDEX}}"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "duration_ms": {{CHUNK_DURATION_MS}},
        "file_hash": "{{CHUNK_FILE_HASH}}",
        "size_bytes": {{CHUNK_SIZE_BYTES}}
      }
  auth: inherit

runtime:
  variables:
    - name: STREAM_ID
      value: "1"
    - name: CHUNK_INDEX
      value: "0"
    - name: CHUNK_DURATION_MS
      value: "6000"
    - name: CHUNK_FILE_HASH
      value: 40f2bd0d49a0d1ec069be784f84ef32d55d90c7b9b9e32219e9afc6a704316d5
    - name: CHUNK_SIZE_BYTES
      value: "105098"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 등록 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "청크가 등록되었습니다.",
            "data": {
              "stream_id": 1,
              "index": 0,
              "file_id": 3,
              "file_hash": "40f2bd0d49a0d1ec069be784f84ef32d55d90c7b9b9e32219e9afc6a704316d5"
            }
          }
  - name: 409 업로드 안 됨
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_CHUNK_NOT_UPLOADED",
            "message": "스토리지에 청크 파일이 올라와 있지 않습니다.",
            "error_details": null
          }
  - name: 409 크기 불일치
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_CHUNK_SIZE_MISMATCH",
            "message": "스토리지에 저장된 청크 크기가 일치하지 않습니다.",
            "error_details": null
          }
  - name: 400 순서 범위 밖
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_INVALID_CHUNK_INDEX",
            "message": "청크 순서가 올바르지 않습니다.",
            "error_details": null
          }

docs: |-
  # 청크 등록

  `POST /api/v1/chunk/{streamId}/{index}` · `ROLE_SYSTEM` / `ROLE_ADMIN` 필요

  오디오 등록 **2-b 단계**. `청크 업로드` 로 스토리지에 올린 청크의
  메타데이터를 확정합니다. **파일은 보내지 않습니다** — JSON 만 보냅니다.

  첫 청크가 등록되면 스트림 상태가 `PENDING` → `IN_PROGRESS` 로 바뀝니다.

  ## 요청 본문

  | 필드 | 타입 | 필수 | 설명 |
  | --- | --- | --- | --- |
  | `duration_ms` | int | ✅ | 이 청크의 재생 길이 (ms) |
  | `file_hash` | string | ✅ | 올린 쪽이 계산한 SHA-256 (소문자 hex) |
  | `size_bytes` | int | ✅ | 올린 바이트 수 |

  ## 서버가 검증하는 것

  스프링은 업로드 본문을 보지 못했으므로 **길이와 해시는 올린 쪽 말을 믿습니다.**
  대신 오브젝트 스토리지에 `HEAD` 를 날려(본문은 받지 않습니다) 두 가지를
  확인합니다.

  | 확인 | 실패 시 |
  | --- | --- |
  | 오브젝트가 실제로 있는가 | `MUPID_CHUNK_NOT_UPLOADED` (409) |
  | 저장된 크기가 `size_bytes` 와 같은가 | `MUPID_CHUNK_SIZE_MISMATCH` (409) |

  `file_hash` 는 서버가 대조하지 않습니다. 클라이언트가 다운로드한 청크를
  스스로 검증할 때 쓰는 값입니다 ([decision/0016](../../knowledge/decision/0016-audio-upload-three-step.md)).

  ## 재시도

  같은 `index` 를 다시 등록하면 **덮어씁니다.**

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
  | `MUPID_FORBIDDEN` | 403 | SYSTEM/ADMIN 이 아닌 토큰 |
  | `MUPID_INVALID_REQUEST_BODY` | 400 | 검증 규칙 위반 |
  | `MUPID_INVALID_CHUNK_INDEX` | 400 | `index` 가 `0 ~ chunk_count-1` 범위 밖 |
  | `MUPID_STREAM_NOT_FOUND` | 404 | 스트림 없음 또는 음악이 삭제됨 |
  | `MUPID_STREAM_ALREADY_DONE` | 409 | 완료된 스트림은 바꿀 수 없음 |
  | `MUPID_CHUNK_NOT_UPLOADED` | 409 | 스토리지에 파일이 없음 (업로드 먼저) |
  | `MUPID_CHUNK_SIZE_MISMATCH` | 409 | 저장된 크기가 신고한 크기와 다름 |
