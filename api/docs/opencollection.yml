info:
  name: Mupid API
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: BASE_URL
      value: http://localhost:8800
      description: API 서버 주소
    - name: BASE_URL
      value: j15a204.p.ssafy.io
      description: API 서버 주소 (운영)
      disabled: true

docs:
  content: |-
    # Mupid API

    Spring Boot 기반 회원/인증/음악/스트리밍 API 컬렉션입니다.

    ## 폴더 구성

    | 폴더 | 내용 |
    | --- | --- |
    | `Auth` | 로그인, 토큰 재발급, 로그아웃 |
    | `User` | 회원가입/조회/수정/탈퇴, 프로필 사진, 비밀번호 재설정, 시스템 계정 발급 |
    | `Email` | 이메일 인증 |
    | `Music` | 음악/앨범/아티스트/가사 관리 (SYSTEM/ADMIN 전용) |
    | `Stream` | 스트림/청크 조회·다운로드, 오디오 등록 (업로드는 SYSTEM/ADMIN 전용) |
    | `Storage` | 범용 이미지 스토리지 (프로필 사진 포함) |
    | `AI` | Mupid AI 대화 (곡 추천은 tool calling, 아직 목업) |
    | `Admin` | 관리자 화면이 쓰는 자원 CRUD·대시보드 (ADMIN 전용) |
    | `Actuator` / `Error` | 헬스체크, 오류 응답 확인 |

    ## 환경 변수

    `Local` 환경을 선택한 뒤 사용하세요.

    | 변수 | 채워지는 방법 |
    | --- | --- |
    | `BASE_URL` | 직접 입력 (기본 `http://localhost:8800`) |
    | `ACCESS_TOKEN` | `Auth / 로그인`, `Auth / 액세스 토큰 재발급` 응답에서 자동 저장 |
    | `REFRESH_TOKEN` | 로그인 응답의 `Set-Cookie: refresh_token=...` 값을 직접 붙여넣기 |
    | `VERIFICATION_ID` | `Email / 인증 메일 발송`, `User / 비밀번호 재설정 메일 발송` 응답에서 자동 저장 |
    | `USER_ID` | `Auth / 로그인` 응답에서 자동 저장 |
    | `MUSIC_ID` | 직접 입력 (`Music / 음악 추가` 응답에서도 자동 저장) |
    | `ARTIST_ID` | 직접 입력 (`Music / 아티스트 생성` 응답에서도 자동 저장) |
    | `ALBUM_ID` | 직접 입력 (`Music / 앨범 생성` 응답에서도 자동 저장) |
    | `LYRIC_ID` | 직접 입력 (`Music / 가사 추가` 응답에서도 자동 저장) |
    | `IMAGE_FILE_ID` | `Storage / 이미지 업로드` 응답에서 자동 저장 |
    | `STREAM_ID` | `Stream / 스트림 생성`·`스트림 목록 조회` 응답에서 자동 저장 |
    | `SYSTEM_REFRESH_TOKEN` | `User / 시스템 계정 생성` 응답에서 자동 저장 |
    | `CHUNK_INDEX` | 직접 입력 (청크 순서, 0 부터) |

    ## ⚠️ 요청/응답 필드는 snake_case

    `application.yaml` 에 `spring.jackson.property-naming-strategy: SNAKE_CASE` 가
    설정되어 있어, **요청 본문과 응답 본문의 모든 필드명이 snake_case** 입니다.
    Java DTO 의 `emailVerificationId` 는 JSON 에서 `email_verification_id` 입니다.

    **단, multipart 폼 필드명은 예외로 camelCase 입니다.** `SNAKE_CASE` 는
    JSON 본문에만 적용되고 `@RequestParam` 이름에는 적용되지 않습니다
    (`imageFile`).

    청크 업로드는 multipart 가 아니라 **본문에 바이너리를 그대로 싣는 PUT** 이고,
    스프링이 아니라 nginx 가 처리합니다 (`Stream / 청크 업로드`).

    ## 목록 응답 형식

    목록 API 는 아래 모양으로 감싼다. `page` 는 **0부터** 센다.

    ```json
    {
      "items": [],
      "page": 0,
      "size": 20,
      "total_elements": 0,
      "total_pages": 0
    }
    ```

    `Music / 곡 목록 조회` 가 첫 사례이고, 이후 목록 API 도 같은 모양을 쓴다.

    ## 응답 형식

    성공 응답은 `BaseResponse` 로 감싸집니다.

    ```json
    {
      "message": "회원가입 되었습니다.",
      "data": null
    }
    ```

    실패 응답은 `ErrorResponse` 입니다. 오류 코드는 `MUPID_<enum 이름>` 규칙으로 만들어집니다.

    ```json
    {
      "code": "MUPID_USER_NOT_FOUND",
      "message": "요청한 유저를 찾을 수 없습니다.",
      "error_details": null
    }
    ```

    `error_details` 는 검증 실패(`MUPID_INVALID_REQUEST_BODY`)일 때만 채워지며,
    **키는 Java 필드명 그대로(camelCase)** 입니다. Map 의 키라서 snake_case 변환 대상이
    아니기 때문입니다.

    ```json
    {
      "code": "MUPID_INVALID_REQUEST_BODY",
      "message": "데이터가 잘못 입력되었습니다.",
      "error_details": {
        "birthYear": "출생 연도가 입력되지 않았습니다.",
        "emailVerificationId": "이메일 인증이 필요합니다."
      }
    }
    ```

    ### ⚠️ 401 / 403 만 필드명이 다릅니다

    토큰이 없거나 유효하지 않아 Spring Security 가 직접 거절하는 경우
    (`AuthUnauthorizedHandler`, `AuthForbiddenHandler`)는 Spring 이 설정한
    ObjectMapper 가 아니라 `new ObjectMapper()` 를 쓰기 때문에 snake_case 가
    적용되지 않습니다. 이때만 `error_details` 가 아니라 `errorDetails` 로 옵니다.

    ```json
    {
      "code": "MUPID_UNAUTHORIZED",
      "message": "인증 정보가 유효하지 않거나 존재하지 않습니다.",
      "errorDetails": null
    }
    ```

    ### 오류 코드는 `X-Mupid-Error` 헤더로도 옵니다

    모든 오류 응답에 `X-Mupid-Error: MUPID_...` 헤더가 함께 나갑니다.
    청크 업로드처럼 nginx `auth_request` 를 거쳐 본문이 사라지는 경로에서
    사유를 알아내려고 넣은 것입니다.

    ## 인증

    - 액세스 토큰: `Authorization: Bearer {{ACCESS_TOKEN}}` 헤더
    - 리프레시 토큰: `refresh_token` HttpOnly + Secure 쿠키

    리프레시 토큰 쿠키는 `Secure` 로 발급되므로 `http://localhost` 에서는 브라우저/Bruno 의
    쿠키 저장소에 남지 않습니다. 그래서 재발급·로그아웃 요청에는 `Cookie` 헤더를 직접
    넣도록 작성해 두었습니다.

    ## 인증 없이 호출 가능한 엔드포인트

    `SecurityConfig` 기준으로 아래만 `permitAll` 이고, **나머지는 모두 액세스 토큰이 필요합니다.**

    - `POST /api/v1/auth` (로그인)
    - `GET /api/v1/auth` (액세스 토큰 재발급 — 자격증명은 리프레시 토큰 쿠키)
    - `POST /api/v1/user` (회원가입)
    - `GET`, `POST /api/v1/user/reset` (비밀번호 재설정)
    - `GET`, `POST /api/v1/mail/verification` (이메일 인증)
    - `GET /api/v1/mail/verification/**`
    - `GET /api/actuator/**`
    - `GET /api/v1/onboarding/option` (온보딩 선택지 — 무드·장르 이름 목록)
    - `GET /api/v1/storage/image/ALBUM/*`, `.../ARTIST/*` (앨범·아티스트 이미지)

    스트리밍(`Stream` 폴더) 엔드포인트는 모두 액세스 토큰이 필요합니다.

    곡 목록·상세·가사·분석·아티스트·앨범 조회는 **더 이상 공개가 아닙니다.**
    첫 방문자가 로그인 전에 곡을 둘러본다고 보아 열어 두었으나, 로그인해야만
    서비스를 쓸 수 있게 되면서(비로그인이 갈 수 있는 화면은 `/`·`/login`·
    `/signup` 뿐) 근거가 사라졌습니다. 앨범·아티스트 이미지만 예외로 남습니다 —
    `<img src>` 에는 Authorization 헤더를 붙일 수 없어 닫으면 표지가 깨지고,
    키가 앨범·아티스트 이름이라 개인 정보도 아닙니다. 프로필 사진(`PROFILE`)은
    개인 정보라 닫혀 있고, 토큰을 붙여 바이트를 받아 씁니다.

    ### `/api/` 밖에 있는 엔드포인트

    청크 업로드(`PUT /upload/chunk/{streamId}/{index}`)만 `/api/` 아래가
    아닙니다. 스프링이 본문을 받지 않고 nginx 가 스토리지로 직접 흘려보내기
    때문입니다. 권한 검사는 nginx `auth_request` 가 스프링에 물어서 합니다.

    청크 바이너리가 놓인 `/storage/` 경로는 nginx 에서 `internal` 이라
    외부에서 직접 칠 수 없습니다.

    ## 권한별 접근

    | 권한 | 접근 가능 |
    | --- | --- |
    | `ROLE_USER` | 일반 API (User, Auth, Email, Storage) + `Stream` 조회·다운로드 |
    | `ROLE_SYSTEM` / `ROLE_ADMIN` | 위 + `Music` 폴더 전체, `Stream` 의 등록·삭제 |
    | `ROLE_ADMIN` | 위 + `User / 시스템 계정 생성`, `Admin` 폴더 전체 |

    `Music` 폴더 엔드포인트와 `Stream` 의 등록 계열은 `@SystemRole`
    (`hasAnyRole('SYSTEM', 'ADMIN')`) 이 붙어 있어 일반 사용자 토큰으로
    호출하면 403 (`MUPID_FORBIDDEN`) 이 반환됩니다. 401/403 응답만
    `errorDetails` (camelCase) 필드를 씁니다.

    `ROLE_SYSTEM` 계정은 `User / 시스템 계정 생성` 으로 관리자가 발급합니다.
    `music_chunking` 배치가 이 계정의 리프레시 토큰으로 동작합니다.

    관리자 화면의 **HTML 골격**(`GET /api/admin`, `GET /api/admin/login`)만
    `permitAll` 입니다. 브라우저 주소창으로 들어오는 요청에는 `Authorization`
    헤더를 붙일 수 없는데 `AuthFilter` 는 헤더의 Bearer 토큰만 보기 때문입니다.
    그 HTML 에는 데이터가 없고, 화면이 fetch 로 부르는 `Admin` 폴더의
    `/api/v1/admin/**` 가 `@AdminRole` 로 막혀 있습니다 — 실제 방어선은 그쪽입니다.
    `/admin` 이 아니라 `/api/admin` 인 것은 운영 nginx 가 `/api/` 만 스프링으로
    넘기기 때문입니다 (액추에이터를 `/api/actuator` 로 옮긴 것과 같은 이유).

    ## 코드 값

    enum 이름이 그대로 직렬화/역직렬화 값입니다.

    - `gender` — `M`, `F`, `ETC`
    - `role` / `user_role` — `ROLE_USER`, `ROLE_SYSTEM`, `ROLE_ADMIN`
    - `status` (user) — `PENDING`, `ACTIVE`, `WITHDRAW`
    - `codec` — `AAC`, `OPUS`
    - `status` (stream) — `PENDING`, `IN_PROGRESS`, `DONE`, `FAILED`
    - `category` (storage) — `PROFILE`, `ARTIST`, `ALBUM`, `STREAMING`

    가입 직후에는 `status = PENDING`(온보딩 필요), `role = ROLE_USER` 입니다.

    ## 공통 코드

    분위기·장르는 `codes` 표의 행이고, API 는 이름이 아니라 `code_id` 로
    주고받습니다. 목록은 `Onboarding / 설문 항목 조회` 로 받습니다.

    `codes` 는 기준 데이터라 사람이 직접 넣습니다 —
    `knowledge/domain/seed-codes.sql`. 비어 있으면 온보딩이 503 입니다.

    ## 프로필 사진

    유저 프로필 사진 전용 엔드포인트는 없어지고 `Storage` 폴더의 범용 API 로
    통합되었습니다. `PROFILE` 카테고리 + 유저 번호(`{{USER_ID}}`)를 키로 사용합니다.

    ## 응답이 Raw 로 보일 때

    Bruno 응답 패널의 표시 형식은 응답의 `Content-Type` 헤더로 정해지고,
    판별에 실패하면 `Raw` 로 남습니다. 이 API 는 모두 `application/json` 을
    보내므로 실제 요청 응답은 자동으로 JSON 으로 표시됩니다.

    저장된 Example 은 파일에 적어 둔 `response.headers` 만 보므로,
    각 Example 에 `Content-Type: application/json` 을 넣어 두었습니다.
    그래도 Raw 로 보이면 응답 패널 우측 상단의 형식 드롭다운에서 `JSON` 을
    고르면 되고, 그 선택은 해당 요청에 저장됩니다.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
