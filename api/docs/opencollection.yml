opencollection: 1.0.0

info:
  name: Mupid API

config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: BASE_URL
      value: http://localhost:8800
      description: API 서버 주소

docs: |-
  # Mupid API

  Spring Boot 기반 회원/인증 API 컬렉션입니다.

  ## 환경 변수

  `Local` 환경을 선택한 뒤 사용하세요.

  | 변수 | 채워지는 방법 |
  | --- | --- |
  | `BASE_URL` | 직접 입력 (기본 `http://localhost:8800`) |
  | `ACCESS_TOKEN` | `Auth / 로그인`, `Auth / 액세스 토큰 재발급` 응답에서 자동 저장 |
  | `REFRESH_TOKEN` | 로그인 응답의 `Set-Cookie: refresh_token=...` 값을 직접 붙여넣기 |
  | `VERIFICATION_ID` | `Email / 인증 메일 발송`, `User / 비밀번호 재설정 메일 발송` 응답에서 자동 저장 |
  | `USER_ID` | `Auth / 로그인` 응답에서 자동 저장 |

  ## ⚠️ 요청/응답 필드는 snake_case

  `application.yaml` 에 `spring.jackson.property-naming-strategy: SNAKE_CASE` 가
  설정되어 있어, **요청 본문과 응답 본문의 모든 필드명이 snake_case** 입니다.
  Java DTO 의 `emailVerificationId` 는 JSON 에서 `email_verification_id` 입니다.

  ## 응답 형식

  성공 응답은 `BaseResponse` 로 감싸집니다.

  ```json
  {
    "message": "회원가입 되었습니다.",
    "data": null
  }
  ```

  실패 응답은 `ErrorResponse` 입니다. 오류 코드는 `MUPID_<enum 이름>` 규칙으로 만들어집니다.

  ```json
  {
    "code": "MUPID_USER_NOT_FOUND",
    "message": "요청한 유저를 찾을 수 없습니다.",
    "error_details": null
  }
  ```

  `error_details` 는 검증 실패(`MUPID_INVALID_REQUEST_BODY`)일 때만 채워지며,
  **키는 Java 필드명 그대로(camelCase)** 입니다. Map 의 키라서 snake_case 변환 대상이
  아니기 때문입니다.

  ```json
  {
    "code": "MUPID_INVALID_REQUEST_BODY",
    "message": "데이터가 잘못 입력되었습니다.",
    "error_details": {
      "birthYear": "출생 연도가 입력되지 않았습니다.",
      "emailVerificationId": "이메일 인증이 필요합니다."
    }
  }
  ```

  ### ⚠️ 401 / 403 만 필드명이 다릅니다

  토큰이 없거나 유효하지 않아 Spring Security 가 직접 거절하는 경우
  (`AuthUnauthorizedHandler`, `AuthForbiddenHandler`)는 Spring 이 설정한
  ObjectMapper 가 아니라 `new ObjectMapper()` 를 쓰기 때문에 snake_case 가
  적용되지 않습니다. 이때만 `error_details` 가 아니라 `errorDetails` 로 옵니다.

  ```json
  {
    "code": "MUPID_UNAUTHORIZED",
    "message": "인증 정보가 유효하지 않거나 존재하지 않습니다.",
    "errorDetails": null
  }
  ```

  ## 인증

  - 액세스 토큰: `Authorization: Bearer {{ACCESS_TOKEN}}` 헤더
  - 리프레시 토큰: `refresh_token` HttpOnly + Secure 쿠키

  리프레시 토큰 쿠키는 `Secure` 로 발급되므로 `http://localhost` 에서는 브라우저/Bruno 의
  쿠키 저장소에 남지 않습니다. 그래서 재발급·로그아웃 요청에는 `Cookie` 헤더를 직접
  넣도록 작성해 두었습니다.

  ## 인증 없이 호출 가능한 엔드포인트

  `SecurityConfig` 기준으로 아래만 `permitAll` 이고, **나머지는 모두 액세스 토큰이 필요합니다.**

  - `POST /api/v1/auth` (로그인)
  - `POST /api/v1/user` (회원가입)
  - `GET`, `POST /api/v1/user/reset` (비밀번호 재설정)
  - `GET`, `POST /api/v1/mail/verification` (이메일 인증)
  - `GET /api/v1/mail/verification/**`
  - `GET /api/actuator/**`

  ## 코드 값

  enum 이름이 그대로 직렬화/역직렬화 값입니다.

  - `gender` — `M`, `F`, `ETC`
  - `role` / `user_role` — `ROLE_USER`, `ROLE_SYSTEM`, `ROLE_ADMIN`
  - `status` — `PENDING`, `ACTIVE`, `WITHDRAW`

  가입 직후에는 `status = PENDING`(온보딩 필요), `role = USER` 입니다.

  ## 응답이 Raw 로 보일 때

  Bruno 응답 패널의 표시 형식은 응답의 `Content-Type` 헤더로 정해지고,
  판별에 실패하면 `Raw` 로 남습니다. 이 API 는 모두 `application/json` 을
  보내므로 실제 요청 응답은 자동으로 JSON 으로 표시됩니다.

  저장된 Example 은 파일에 적어 둔 `response.headers` 만 보므로,
  각 Example 에 `Content-Type: application/json` 을 넣어 두었습니다.
  그래도 Raw 로 보이면 응답 패널 우측 상단의 형식 드롭다운에서 `JSON` 을
  고르면 되고, 그 선택은 해당 요청에 저장됩니다.

bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
