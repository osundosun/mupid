info:
  name: NotFound
  type: http
  seq: 5

http:
  method: GET
  url: "{{BASE_URL}}/api/actuator/no-such-endpoint"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 404 존재하지 않는 엔드포인트
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_NOT_FOUND",
            "message": "Endpoint가 존재하지 않습니다.",
            "error_details": null
          }
  - name: 401 permitAll 이 아닌 경로일 때
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json;charset=UTF-8
      body:
        type: json
        data: |-
          {
            "code": "MUPID_UNAUTHORIZED",
            "message": "인증 정보가 유효하지 않거나 존재하지 않습니다.",
            "errorDetails": null
          }

docs: |-
  # NotFound

  존재하지 않는 경로를 호출해 `GlobalExceptionHandler` 의 404 처리를 확인하는
  요청입니다. 실제 API 가 아닙니다.

  ## 왜 `/api/actuator/...` 인가

  Spring Security 필터가 `DispatcherServlet` 보다 먼저 동작하므로,
  `permitAll` 이 아닌 경로는 존재 여부와 상관없이 **401 이 먼저 반환**됩니다.
  실제로 `/api/v1/something` 을 호출하면 404 가 아니라 401 이 옵니다.

  404(`NoResourceFoundException`)를 보려면 `permitAll` 범위 안에서 없는 경로를
  호출해야 하므로 `/api/actuator/**` 를 사용합니다.

  ## 기대 응답

  ```json
  {
    "code": "MUPID_NOT_FOUND",
    "message": "Endpoint가 존재하지 않습니다.",
    "error_details": null
  }
  ```

  `forwardAuthorizationHeader` 를 `false` 로 두어 토큰 없이 호출합니다.
