  content: |-
    # Playlist

    플레이리스트 생성·조회·삭제 + 수록곡 추가.

    | 엔드포인트 | 동작 | 인증 |
    | --- | --- | --- |
    | `GET /api/v1/playlist` | 내 플레이리스트 목록 | 필요 |
    | `POST /api/v1/playlist` | 플레이리스트 생성 | 필요 |
    | `GET /api/v1/playlist/{playlist_id}` | 상세 + 수록곡 전부 | 필요 |
    | `DELETE /api/v1/playlist/{playlist_id}` | 플레이리스트 삭제 (소프트) | 필요 |
    | `POST /api/v1/playlist/{playlist_id}/track` | 수록곡 한 곡 추가 | 필요 |

    ## 스키마

    `playlists` 테이블은 ERD 기준입니다 (`api/knowledge/domain/erd.sql`).

    - 제목 컬럼은 `title` 입니다 (`name` 이 아닙니다).
    - `music_count` 는 수록곡 수의 역정규화 값이고 생성 직후에는 `0` 입니다.
      곡을 추가할 때 같은 트랜잭션에서 함께 올립니다.
    - 소유자(`user_id`)는 NULL 을 허용합니다 — 시스템/추천이 만든 플레이리스트를 위한 자리입니다.
      생성 API 로 만들면 항상 요청자의 소유가 되고, 곡 추가는 **소유자 본인만** 할 수 있습니다.
    - 삭제는 `deleted_at` 에 시각을 남기는 소프트 삭제입니다.

    수록곡은 `playlist_tracks` 입니다 (`PlaylistTrack` 엔티티 기준).
    `(playlist_id, track_order)` 복합키이고, 한 곡이 두 번 담기지 않도록
    `(playlist_id, music_id)` 유니크 제약(`uq_playlist_track_music`)이 걸려 있습니다.

    ## 아직 없는 것

    수록곡 삭제·순서 변경, 제목 수정, 삭제 취소(되살리기), 공유는 별도 티켓입니다.

    목록 조회(`GET /api/v1/playlist`)는 곡 수만 내려보냅니다. 곡까지 필요하면
    상세 조회를 부릅니다.
