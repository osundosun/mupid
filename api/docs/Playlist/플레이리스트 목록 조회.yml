info:
  name: 플레이리스트 목록 조회
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/playlist"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 조회 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "playlists": [
                {
                  "playlist_id": 38,
                  "title": "새벽 드라이브",
                  "music_count": 0,
                  "created_at": "2026-09-14T10:53:44",
                  "updated_at": "2026-09-14T10:53:44"
                },
                {
                  "playlist_id": 37,
                  "title": "밤에 듣는 재즈",
                  "music_count": 2,
                  "created_at": "2026-09-14T10:53:15",
                  "updated_at": "2026-09-14T10:53:24"
                }
              ]
            }
          }
  - name: 200 플레이리스트 없음
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "playlists": []
            }
          }
  - name: 401 인증 없음
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_UNAUTHORIZED",
            "message": "인증 정보가 유효하지 않거나 존재하지 않습니다.",
            "errorDetails": null
          }

docs: |-
  # 플레이리스트 목록 조회

  `GET /api/v1/playlist` · 인증 필요

  액세스 토큰의 사용자가 만든 플레이리스트를 **최근에 만든 것부터** 돌려줍니다.
  페이지네이션은 없습니다 — 개인 플레이리스트라 전부 내려보냅니다.

  ## 목록에서 빠지는 것

  - 소프트 삭제된 플레이리스트 (`deleted_at` 이 있는 것)
  - 소유자가 없는 시스템/추천 플레이리스트 (`user_id` 가 NULL)
  - 다른 사용자의 플레이리스트

  하나도 없으면 오류가 아니라 **빈 배열**입니다.

  ## 응답 데이터

  `data.playlists` 는 배열이고, 각 항목은 다음과 같습니다.

  | 필드 | 타입 | 설명 |
  | --- | --- | --- |
  | `playlist_id` | int | 플레이리스트 번호 |
  | `title` | string | 제목 |
  | `music_count` | int | 수록곡 수 (역정규화 값) |
  | `created_at` | datetime | 생성 일시. 정렬 기준 |
  | `updated_at` | datetime | 수정 일시. 곡을 추가하면 갱신됩니다 |

  > **수록곡은 들어 있지 않습니다.** 곡 수만 옵니다. 목록 화면에 곡까지 붙이면
  > 플레이리스트 수만큼 조회가 늘어나서, 수록곡은 별도 API 로 뺐습니다(아직 없습니다).

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
  | `MUPID_USER_NOT_FOUND` | 404 | 토큰의 사용자가 없거나 이미 탈퇴 |

  > 401 은 시큐리티 필터 단계에서 만들어져 **snake_case 가 적용되지 않습니다** —
  > 이 응답만 `errorDetails` 로 나갑니다.
