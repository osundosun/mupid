info:
  name: 플레이리스트 곡 빼기
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{BASE_URL}}/api/v1/playlist/{{PLAYLIST_ID}}/track/{{MUSIC_ID}}"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

runtime:
  variables:
    - name: PLAYLIST_ID
      value: "12"
    - name: MUSIC_ID
      value: "42"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 빼기 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "플레이리스트에서 곡을 뺐습니다.",
            "data": null
          }
  - name: 403 내 플레이리스트가 아님
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_PLAYLIST_ACCESS_DENIED",
            "message": "플레이리스트에 접근할 권한이 없습니다.",
            "error_details": null
          }
  - name: 404 담겨 있지 않은 곡
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_PLAYLIST_TRACK_NOT_FOUND",
            "message": "플레이리스트에 담겨 있지 않은 곡입니다.",
            "error_details": null
          }
  - name: 404 플레이리스트 없음
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_PLAYLIST_NOT_FOUND",
            "message": "요청한 플레이리스트를 찾을 수 없습니다.",
            "error_details": null
          }

docs: |-
  # 플레이리스트 곡 빼기

  `DELETE /api/v1/playlist/{playlist_id}/track/{music_id}` · 인증 필요

  내 플레이리스트에서 **곡 한 곡**을 뺍니다. 여러 곡을 한 번에 뺄 수는 없으니
  클라이언트가 곡마다 호출합니다.

  ## 경로 변수

  | 변수 | 타입 | 설명 |
  | --- | --- | --- |
  | `playlist_id` | int | 대상 플레이리스트 번호 |
  | `music_id` | int | 뺄 곡 번호. 트랙 순서가 아닙니다 |

  ## 담겨 있지 않으면 404 입니다

  곡 추가에서 중복을 200 으로 처리한 것과 **반대**입니다. 추가에서 중복을 성공으로 본 것은
  요청한 상태("이 곡이 여기 있다")가 이미 이뤄져 있어서인데, 없는 곡을 빼는 것을 성공으로
  처리하면 화면과 서버가 어긋난 것을 클라이언트가 끝까지 모릅니다. 이때는 목록을 다시
  불러오는 편이 낫습니다.

  ## 트랙 순서는 다시 매기지 않습니다

  3곡짜리에서 2번을 빼면 남은 트랙 순서는 `1, 3` 이 됩니다. 순서는 정렬에만 쓰이고
  빈 번호가 있어도 정렬 결과는 같은데, 다시 매기면 한 곡을 뺄 때마다 수록곡 전부를
  UPDATE 해야 합니다. 다음에 추가되는 곡은 `MAX(track_order) + 1` 을 받으므로
  빈 번호를 재사용하지 않습니다.

  `music_count` 는 1 줄어듭니다. 0 아래로는 내려가지 않습니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
  | `MUPID_PLAYLIST_ACCESS_DENIED` | 403 | 내 플레이리스트가 아님 |
  | `MUPID_PLAYLIST_NOT_FOUND` | 404 | 없거나 이미 삭제된 플레이리스트 |
  | `MUPID_PLAYLIST_TRACK_NOT_FOUND` | 404 | 그 플레이리스트에 담겨 있지 않은 곡 |
  | `MUPID_MUSIC_NOT_FOUND` | 404 | 없거나 삭제된 곡 |
  | `MUPID_USER_NOT_FOUND` | 404 | 토큰의 사용자가 없음 |
