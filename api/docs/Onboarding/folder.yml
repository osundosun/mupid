  content: |-
    # Onboarding

    회원가입 뒤 **한 번만** 답하는 설문입니다. 좋아하는 분위기·장르를 받습니다.
    이력이 없는 사람의 첫 추천을 만드는 **콜드스타트 입력**이라, 고쳐 가며 쓰는
    값이 아닙니다.

    | 엔드포인트 | 동작 | 인증 |
    | --- | --- | --- |
    | `GET /api/v1/onboarding/option` | 고를 수 있는 항목 | **불필요** |
    | `POST /api/v1/onboarding` | 제출. **계정당 한 번** | 필요 |
    | `GET /api/v1/user/{userId}/onboarding` | 사용자 번호로 결과 조회 | **`ROLE_SYSTEM`** |

    선택지는 로그인 전에도 온보딩 화면이 떠야 해서 열어 두었습니다.

    ## 본인이 제출 내용을 읽는 길은 없습니다

    `GET /api/v1/onboarding` 은 **없앴습니다.** 화면이 답을 되돌려 받을 일이
    없어서입니다. 진입 분기에 필요한 "마쳤는가" 는 `GET /api/v1/user` 의
    `onboarding_submitted` 로 옵니다.

    제출 내용을 읽는 것은 추천 서버뿐이고, 그쪽은 `/api/v1/user/{userId}/onboarding`
    을 씁니다. 경로가 `/api/v1/user` 아래인 것은 남의 결과를 읽는 배치 전용이라
    권한이 다르고, `/api/v1/onboarding/{userId}` 로 두면 바로 옆의 `/option` 이
    사용자 번호 자리로 보이기 때문입니다.

    ## 이름이 아니라 번호로 주고받습니다

    분위기·장르는 `codes` 표의 행입니다. 이름이 바뀌어도 저장된 응답이
    흔들리지 않도록 요청·응답 모두 `code_id` 를 씁니다. 화면에 뿌릴 이름은
    `GET /api/v1/onboarding/option` 이 함께 내려줍니다.

    `codes` 는 기준 데이터라 사람이 직접 넣습니다 —
    [knowledge/domain/seed-codes.sql](../../knowledge/domain/seed-codes.sql).
    **비어 있으면 `GET /option` 이 503 입니다.**

    ## 조합으로 저장됩니다

    `onboarding_survey` 한 줄은 `(user_id, mood_code_id, genre_code_id)` 이고
    두 코드가 모두 NOT NULL 입니다. 화면은 분위기와 장르를 짝지어 묻지 않으므로
    **고른 분위기 × 고른 장르의 모든 조합**이 저장됩니다. 분위기 3개 · 장르 2개를
    보내면 6줄입니다. 읽을 때는 각 축을 중복 제거해 돌려주므로 보낸 그대로
    돌아옵니다.

    자세한 배경과 더 나은 스키마 제안은
    [knowledge/decision/0017](../../knowledge/decision/0017-onboarding-survey-cross-product.md).

    ## 닉네임은 받지 않습니다

    회원가입이 이미 2~10자로 받습니다. 예전에는 설문도 닉네임을 받아
    `users.nickname` 을 덮어썼는데, 같은 값을 두 번 묻는 꼴이었습니다.
    고치는 길은 `PATCH /api/v1/user` 하나입니다.

    ## 오류

    | 코드 | 상태 | 설명 |
    | --- | --- | --- |
    | `MUPID_ONBOARDING_INVALID_CODE` | 400 | 없는 번호이거나 용도가 다른 번호 |
    | `MUPID_ONBOARDING_ALREADY_SUBMITTED` | 409 | 이미 제출함 |
    | `MUPID_ONBOARDING_OPTION_EMPTY` | 503 | `codes` 가 비어 있음 |
    | `MUPID_INVALID_REQUEST_BODY` | 400 | 빈 목록 |
