  content: |-
    # Onboarding

    첫 방문자가 앱에 들어가기 전에 답하는 설문입니다. 닉네임과 좋아하는
    분위기·장르를 받습니다.

    | 엔드포인트 | 동작 | 인증 |
    | --- | --- | --- |
    | `GET /api/v1/onboarding/option` | 고를 수 있는 항목 | **불필요** |
    | `GET /api/v1/onboarding` | 제출 여부·제출 내용 | 필요 |
    | `POST /api/v1/onboarding` | 제출(재제출 시 교체) | 필요 |

    선택지는 로그인 전에도 온보딩 화면이 떠야 해서 열어 두었습니다.

    ## 이름이 아니라 번호로 주고받습니다

    분위기·장르는 `codes` 표의 행입니다. 이름이 바뀌어도 저장된 응답이
    흔들리지 않도록 요청·응답 모두 `code_id` 를 씁니다. 화면에 뿌릴 이름은
    `GET /api/v1/onboarding/option` 이 함께 내려줍니다.

    `codes` 는 기준 데이터라 사람이 직접 넣습니다 —
    [knowledge/domain/seed-codes.sql](../../knowledge/domain/seed-codes.sql).
    **비어 있으면 `GET /option` 이 503 입니다.**

    ## 조합으로 저장됩니다

    `onboarding_survey` 한 줄은 `(user_id, mood_code_id, genre_code_id)` 이고
    두 코드가 모두 NOT NULL 입니다. 화면은 분위기와 장르를 짝지어 묻지 않으므로
    **고른 분위기 × 고른 장르의 모든 조합**이 저장됩니다. 분위기 3개 · 장르 2개를
    보내면 6줄입니다. 읽을 때는 각 축을 중복 제거해 돌려주므로 보낸 그대로
    돌아옵니다.

    자세한 배경과 더 나은 스키마 제안은
    [knowledge/decision/0017](../../knowledge/decision/0017-onboarding-survey-cross-product.md).

    ## 닉네임

    제출한 닉네임은 계정 닉네임(`users.nickname`)에도 반영됩니다. 규칙은
    회원가입과 같은 2~10자입니다.

    ## 오류

    | 코드 | 상태 | 설명 |
    | --- | --- | --- |
    | `MUPID_ONBOARDING_INVALID_CODE` | 400 | 없는 번호이거나 용도가 다른 번호 |
    | `MUPID_ONBOARDING_OPTION_EMPTY` | 503 | `codes` 가 비어 있음 |
    | `MUPID_INVALID_REQUEST_BODY` | 400 | 닉네임 길이·빈 목록 |
