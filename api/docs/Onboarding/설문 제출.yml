info:
  name: 설문 제출
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/onboarding"
  body: json
  auth: inherit

body:
  json: |-
    {
      "nickname": "규원",
      "mood_code_ids": [1, 3, 5],
      "genre_code_ids": [12, 15]
    }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 저장 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "취향을 저장했습니다.",
            "data": null
          }
  - name: 400 선택할 수 없는 항목
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_ONBOARDING_INVALID_CODE",
            "message": "선택할 수 없는 항목이 있습니다.",
            "error_details": null
          }
  - name: 400 입력값 오류
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_INVALID_REQUEST_BODY",
            "message": "데이터가 잘못 입력되었습니다.",
            "error_details": {
              "moodCodeIds": "분위기를 하나 이상 선택해주세요."
            }
          }

docs: |-
  # 설문 제출

  `POST /api/v1/onboarding` · **인증 필요**

  분위기·장르를 **각각 하나 이상** 보내야 합니다. 한쪽만으로는 저장할 수
  없습니다 — `onboarding_survey` 의 두 코드 칼럼이 모두 NOT NULL 입니다.

  | 필드 | 규칙 |
  | --- | --- |
  | `nickname` | 2~10자. 계정 닉네임에도 반영됩니다 |
  | `mood_code_ids` | `MOOD` 코드 번호. 1~16개, 중복은 무시 |
  | `genre_code_ids` | `GENRE` 코드 번호. 1~16개, 중복은 무시 |

  분위기 자리에 장르 번호를 넣으면 `MUPID_ONBOARDING_INVALID_CODE` 입니다.

  ## 다시 제출하면

  이전 응답은 **통째로 지워지고** 새 응답으로 바뀝니다. 부분 수정은 없습니다.

  ## 몇 줄이 쌓이나

  분위기 개수 × 장르 개수 만큼입니다. 위 예시(3 × 2)는 6줄입니다.
  이유는 [knowledge/decision/0017](../../knowledge/decision/0017-onboarding-survey-cross-product.md).

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_ONBOARDING_INVALID_CODE` | 400 | 없는 번호 · 용도가 다른 번호 |
  | `MUPID_INVALID_REQUEST_BODY` | 400 | 닉네임 길이 · 빈 목록 |
  | `MUPID_UNAUTHORIZED` | 401 | 토큰 없음/만료 |
