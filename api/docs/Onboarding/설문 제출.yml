info:
  name: 설문 제출
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/onboarding"
  body: json
  auth: inherit

body:
  json: |-
    {
      "mood_code_ids": [1, 3, 5],
      "genre_code_ids": [12, 15]
    }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 저장 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "취향을 저장했습니다.",
            "data": null
          }
  - name: 400 선택할 수 없는 항목
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_ONBOARDING_INVALID_CODE",
            "message": "선택할 수 없는 항목이 있습니다.",
            "error_details": null
          }
  - name: 409 이미 제출함
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_ONBOARDING_ALREADY_SUBMITTED",
            "message": "온보딩 설문은 한 번만 제출할 수 있습니다.",
            "error_details": null
          }
  - name: 400 입력값 오류
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_INVALID_REQUEST_BODY",
            "message": "데이터가 잘못 입력되었습니다.",
            "error_details": {
              "moodCodeIds": "분위기를 하나 이상 선택해주세요."
            }
          }

docs: |-
  # 설문 제출

  `POST /api/v1/onboarding` · **인증 필요** · **계정당 한 번**

  분위기·장르를 **각각 하나 이상** 보내야 합니다. 한쪽만으로는 저장할 수
  없습니다 — `onboarding_survey` 의 두 코드 칼럼이 모두 NOT NULL 입니다.

  | 필드 | 규칙 |
  | --- | --- |
  | `mood_code_ids` | `MOOD` 코드 번호. 1~16개, 중복은 무시 |
  | `genre_code_ids` | `GENRE` 코드 번호. 1~16개, 중복은 무시 |

  분위기 자리에 장르 번호를 넣으면 `MUPID_ONBOARDING_INVALID_CODE` 입니다.

  ## 한 번만 제출할 수 있습니다

  두 번째부터는 **409** (`MUPID_ONBOARDING_ALREADY_SUBMITTED`) 이고 이전
  응답은 그대로 남습니다. 예전에는 다시 제출하면 통째로 갈아 끼웠습니다.

  이력이 없는 사람의 첫 추천을 만드는 콜드스타트 입력이라 고쳐 가며 쓰는 값이
  아니고, 조합으로 깔아 두는 저장 형태라 부분 수정도 성립하지 않습니다.
  제출했는지는 `GET /api/v1/user` 의 `onboarding_submitted` 로 확인합니다.

  ## 계정이 ACTIVE 가 됩니다

  제출이 성공하면 계정 상태가 `PENDING` 에서 `ACTIVE` 로 바뀝니다. 가입 직후는
  `PENDING` 이고 **그 상태를 벗는 길은 이 호출 하나뿐입니다.** 설문 저장과 상태
  전환은 같은 트랜잭션이라 한쪽만 남지 않습니다.

  이미 `ACTIVE` 인 계정(관리자가 만든 계정, `ROLE_SYSTEM` 배치 계정)은 상태가
  그대로입니다. 바뀐 상태는 `GET /api/v1/user` 의 `status` 로 확인합니다.

  ## 닉네임은 받지 않습니다

  회원가입(`POST /api/v1/user`)이 이미 2~10자로 받습니다. 고치는 길은
  `PATCH /api/v1/user` 하나입니다.

  ## 몇 줄이 쌓이나

  분위기 개수 × 장르 개수 만큼입니다. 위 예시(3 × 2)는 6줄입니다.
  이유는 [knowledge/decision/0017](../../knowledge/decision/0017-onboarding-survey-cross-product.md).

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_ONBOARDING_INVALID_CODE` | 400 | 없는 번호 · 용도가 다른 번호 |
  | `MUPID_INVALID_REQUEST_BODY` | 400 | 빈 목록 |
  | `MUPID_UNAUTHORIZED` | 401 | 토큰 없음/만료 |
  | `MUPID_ONBOARDING_ALREADY_SUBMITTED` | 409 | 이미 제출함 |
