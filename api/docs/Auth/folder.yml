  content: |-
    # Auth

    `/api/v1/auth` 하나의 경로를 HTTP 메서드로 구분합니다.

    | 메서드 | 동작 | 인증 |
    | --- | --- | --- |
    | `POST` | 로그인 | 불필요 |
    | `GET` | 액세스 토큰 재발급 | 액세스 토큰 + refresh_token 쿠키 |
    | `DELETE` | 로그아웃 | 액세스 토큰 + refresh_token 쿠키 |

    ## 토큰 흐름

    1. `POST /api/v1/auth` — 응답 본문으로 `access_token`, 응답 헤더
       `Set-Cookie` 로 `refresh_token` 을 받습니다.
    2. 이후 요청은 `Authorization: Bearer {{ACCESS_TOKEN}}` 헤더를 붙입니다.
    3. 액세스 토큰이 만료되면 `GET /api/v1/auth` 로 재발급합니다.
    4. `DELETE /api/v1/auth` 는 액세스/리프레시 토큰을 모두 Redis 블록 목록에 등록합니다.

    > `GET`/`DELETE` 도 `SecurityConfig` 의 `anyRequest().authenticated()` 에
    > 걸리므로 액세스 토큰이 함께 필요합니다. (`POST` 만 `permitAll`)
