info:
  name: 액세스 토큰 재발급
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/auth"
  auth: inherit
  headers:
    - name: Cookie
      value: refresh_token={{REFRESH_TOKEN}}

docs:
  description: |
    쿠키의 리프레시 토큰으로 액세스 토큰을 재발급합니다.
    로그인 시 발급되는 HttpOnly 쿠키(refresh_token)가 필요합니다.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5