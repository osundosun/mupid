info:
  name: 로그인
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/auth"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{USER_EMAIL}}",
        "password": "{{USER_PASSWORD}}"
      }
  auth: inherit

runtime:
  variables:
    - name: USER_EMAIL
      value: admin@ssafy
    - name: USER_PASSWORD
      value: 9o3dmox}.hwB#$qb*gGD
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.access_token
        method: jsonq
      variable:
        name: ACCESS_TOKEN
        scope: runtime
      description: 액세스 토큰을 ACCESS_TOKEN 변수에 저장합니다.
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.user_id
        method: jsonq
      variable:
        name: USER_ID
        scope: runtime
      description: 사용자 ID 를 USER_ID 변수에 저장합니다.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 로그인 성공
    request:
      url: "{{BASE_URL}}/api/v1/auth"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "email": "user@example.com",
            "password": "example123!"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
        - name: Set-Cookie
          value: refresh_token=eyJhbGciOi...; Max-Age=1800; Path=/; Secure; HttpOnly; SameSite=Strict
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "access_token": "eyJhbGciOiJIUzI1NiJ9...",
              "user_id": 1,
              "user_role": "ROLE_USER"
            }
          }
  - name: 401 이메일/비밀번호 불일치
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_WRONG_EMAIL_OR_PASSWORD",
            "message": "이메일 혹은 패스워드가 잘못되었습니다.",
            "error_details": null
          }

docs: |-
  # 로그인

  `POST /api/v1/auth` · 인증 불필요

  ## 요청 본문

  | 필드 | 타입 | 필수 | 설명 |
  | --- | --- | --- | --- |
  | `email` | string | ✅ | 이메일 형식 |
  | `password` | string | ✅ | 비밀번호 |
  | `refresh_token_validity_days` | int | | 리프레시 토큰 만료(일). **`ROLE_SYSTEM` 만**, 1 ~ 180. 비우면 7일 |

  ## 시스템 계정의 장기 토큰 (S15P21A204-454)

  `ROLE_SYSTEM` 은 리프레시 토큰을 **회전하지 않는다**(`액세스 토큰 재발급` 참고). 그래서 만료가
  곧 토큰을 갈아 끼우는 주기라, CI 처럼 토큰을 변수에 두는 곳은 길게 받는다 —
  `{"email": …, "password": …, "refresh_token_validity_days": 180}`. 쿠키 `Max-Age` 도 그 길이를
  따른다. 비밀번호를 꺼내지 않고 관리자 토큰으로 받으려면 `User / 시스템 계정 토큰 발급`.

  다른 역할이 지정하면 범위와 상관없이 거절한다(`MUPID_REFRESH_TOKEN_VALIDITY_NOT_ALLOWED`) —
  비밀번호를 확인한 뒤에 보므로 이 오류로 계정의 역할이 드러나지 않는다.

  ## 응답

  - 본문 `data.access_token` — 액세스 토큰
  - 본문 `data.user_id` — 사용자 ID
  - 본문 `data.user_role` — `ROLE_USER` / `ROLE_SYSTEM` / `ROLE_ADMIN` (`UserRole.name()`)
  - 헤더 `Set-Cookie: refresh_token=...` — HttpOnly + Secure 리프레시 토큰

  응답을 받으면 `ACCESS_TOKEN` 과 `USER_ID` 변수가 자동으로 채워집니다.
  `REFRESH_TOKEN` 은 쿠키가 `Secure` 라 http 환경에서 자동 저장되지 않으므로,
  응답 헤더의 `Set-Cookie` 값을 `Local` 환경의 `REFRESH_TOKEN` 에 직접
  붙여넣어야 재발급/로그아웃 요청이 동작합니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_WRONG_EMAIL_OR_PASSWORD` | 401 | 이메일 혹은 비밀번호 불일치 |
  | `MUPID_REFRESH_TOKEN_VALIDITY_NOT_ALLOWED` | 400 | `ROLE_SYSTEM` 이 아닌데 만료를 지정함 |
  | `MUPID_REFRESH_TOKEN_VALIDITY_OUT_OF_RANGE` | 400 | 만료가 1 ~ 180일 밖 |
  | `MUPID_INVALID_REQUEST_BODY` | 400 | 이메일 형식 오류 등 검증 실패 |
  | `MUPID_USER_NOT_FOUND` | 404 | 가입되지 않았거나 탈퇴한 이메일 |
  | `MUPID_NOT_READABLE_MESSAGE` | 400 | 요청 본문 누락/파싱 실패 |
