info:
  name: 댓글 목록 조회
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/music/{{MUSIC_ID}}/comment?page=0&size=50"
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.items[0].comment_id
        method: jsonq
      variable:
        name: COMMENT_ID
        scope: runtime
      description: 첫 번째 댓글 번호를 COMMENT_ID 변수에 저장합니다.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 조회 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "items": [
                {
                  "comment_id": 2,
                  "music_id": 2,
                  "timestamp_ms": 1000,
                  "content": "인트로부터 좋다",
                  "user_id": 14,
                  "nickname": "cmtb",
                  "mine": false,
                  "created_at": "2026-09-14T11:34:06.321973",
                  "updated_at": "2026-09-14T11:34:06.321973"
                },
                {
                  "comment_id": 3,
                  "music_id": 2,
                  "timestamp_ms": 3000,
                  "content": "여기 파트가 좋아요",
                  "user_id": 13,
                  "nickname": "cmta",
                  "mine": true,
                  "created_at": "2026-09-14T11:40:12.104882",
                  "updated_at": "2026-09-14T11:40:12.104882"
                }
              ],
              "page": 0,
              "size": 50,
              "total_elements": 2,
              "total_pages": 1
            }
          }

docs: |-
  # 댓글 목록 조회

  `GET /api/v1/music/{musicId}/comment` · **인증 필요**

  | 이름 | 기본값 | 설명 |
  | --- | --- | --- |
  | `page` | `0` | **0부터** 셉니다 |
  | `size` | `50` | 최대 100 |

  정렬은 **시점 오름차순**입니다. 화면이 파형 위에 늘어놓기 때문입니다. 같은
  시점이면 작성 순입니다.

  삭제된 댓글은 나오지 않습니다.

  ## 남의 댓글도 함께 옵니다

  `mine` 으로 구분합니다. 수정·삭제 버튼은 이 값만 보고 그리면 됩니다.
