info:
  name: 댓글 작성
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/music/{{MUSIC_ID}}/comment"
  body: json
  auth: inherit

body:
  json: |-
    {
      "timestamp_ms": 5000,
      "content": "여기 신스가 좋아요"
    }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 작성 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "댓글을 남겼습니다.",
            "data": {
              "comment_id": 3,
              "music_id": 2,
              "timestamp_ms": 5000,
              "content": "여기 신스가 좋아요",
              "user_id": 13,
              "nickname": "cmta",
              "mine": true,
              "created_at": "2026-09-14T11:40:12.104882",
              "updated_at": "2026-09-14T11:40:12.104882"
            }
          }
  - name: 400 100자 초과
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_INVALID_REQUEST_BODY",
            "message": "데이터가 잘못 입력되었습니다.",
            "error_details": {
              "content": "댓글은 100자를 넘을 수 없습니다."
            }
          }

docs: |-
  # 댓글 작성

  `POST /api/v1/music/{musicId}/comment` · **인증 필요**

  | 필드 | 규칙 |
  | --- | --- |
  | `timestamp_ms` | 곡 내 시점(ms). 0 이상 |
  | `content` | 1~100자. 앞뒤 공백은 서버가 지웁니다 |

  곡 길이를 넘는 시점도 지금은 받습니다. 곡 길이가 스트림에서 오는 값이라
  (`Music / 곡 목록 조회`) 스트림이 없는 곡에는 검사할 기준이 없기 때문입니다.
  화면이 먼저 막습니다.

  응답은 방금 만든 댓글입니다. 목록을 다시 부르지 않아도 됩니다.
