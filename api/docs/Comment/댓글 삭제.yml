info:
  name: 댓글 삭제
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{BASE_URL}}/api/v1/comment/{{COMMENT_ID}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 삭제 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "댓글을 삭제했습니다.",
            "data": null
          }
  - name: 404 없는 댓글
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_COMMENT_NOT_FOUND",
            "message": "요청한 댓글을 찾을 수 없습니다.",
            "error_details": null
          }

docs: |-
  # 댓글 삭제

  `DELETE /api/v1/comment/{commentId}` · **인증 필요**

  소프트 삭제입니다([decision/0013](../../knowledge/decision/0013-soft-delete-policy.md)).
  행은 남고 `is_deleted = true` 가 됩니다.

  이미 삭제된 댓글을 다시 지우면 404 입니다. 남의 댓글이면 403 입니다.
