info:
  name: AI 선호도 다시 집계
  type: http
  seq: 14

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/admin/ai-preference/aggregate"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit
  params:
    - name: from
      value: ""
      type: query
      enabled: false
    - name: to
      value: ""
      type: query
      enabled: false

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 다시 집계함
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "다시 집계했습니다.",
            "data": {
              "from": "2026-09-17",
              "to": "2026-09-23",
              "written": 810
            }
          }
  - name: 503 ClickHouse 를 읽지 못함
    response:
      status: 503
      statusText: Service Unavailable
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_ANALYTICS_UNAVAILABLE",
            "message": "분석 데이터를 읽지 못했습니다.",
            "error_details": null
          }

docs: |-
  # AI 선호도 다시 집계

  `POST /api/v1/admin/ai-preference/aggregate` · `ROLE_ADMIN`

  창을 청취 원본(`listen_events`)에서 **다시 세어** `ai_preference_hourly` 를 덮어씁니다
  (S15P21A204-427). 배치는 매시 직전 6시간만 세므로, 표를 처음 만든 뒤 지난 기간을
  채우거나 배치가 6시간 넘게 멈췄던 구간을 메울 때 부릅니다.

  - **몇 번을 불러도 같은 값이 됩니다.** 덧셈이 아니라 대입이고, 결과 표가
    ReplacingMergeTree 라 같은 칸은 마지막에 쓴 것 하나만 남습니다.
  - 창 규칙은 조회와 같습니다(둘 다 주거나 둘 다 생략, 31일까지). 하루씩 끊어서 셉니다.
  - 창의 끝이 오늘이면 **직전 정시까지만** 셉니다.
  - `written` 은 쓴 칸 수(시간 × 구분 5)입니다. 재생이 없던 칸도 0 으로 씁니다.
