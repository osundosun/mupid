info:
  name: 레코드 목록 조회
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/admin/resource/{{ADMIN_RESOURCE}}?page=0&size=25&sort=userId&direction=desc"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

runtime:
  variables:
    - name: ADMIN_RESOURCE
      value: user

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 조회 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "content": [
                {
                  "userId": 2,
                  "email": "admin@ssafy",
                  "password": null,
                  "nickname": "관리자",
                  "imageFile": null,
                  "imageFileId": null,
                  "birthYear": 2026,
                  "gender": "ETC",
                  "role": "ROLE_ADMIN",
                  "status": "ACTIVE",
                  "createdAt": "2026-09-14T01:19:28",
                  "updatedAt": "2026-09-14T01:19:28",
                  "_id": "2"
                }
              ],
              "page": 0,
              "size": 25,
              "total": 3,
              "pages": 1
            }
          }
  - name: 400 없는 필드로 정렬/필터
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_UNKNOWN_FIELD",
            "message": "알 수 없는 필드입니다.",
            "error_details": null
          }

docs: |-
  # 레코드 목록 조회

  `GET /api/v1/admin/resource/{resource}` · `ROLE_ADMIN`

  ## 쿼리 파라미터

  | 이름 | 기본값 | 설명 |
  | --- | --- | --- |
  | `page` | `0` | 0부터 셉니다 |
  | `size` | `25` | 1~200 으로 잘립니다 |
  | `sort` | 첫 식별자 필드 | 스키마의 필드 이름 |
  | `direction` | `desc` | `asc` 만 오름차순, 나머지는 전부 내림차순 |
  | `q` | 없음 | 아래 "검색어가 훑는 범위" 참고 |
  | `filter.<필드>` | 없음 | 완전 일치. 값이 `__null__` 이면 `IS NULL` |

  필터는 여러 개를 겹칠 수 있고 전부 `AND` 입니다 —
  `?filter.role=ROLE_ADMIN&filter.status=ACTIVE`.

  ## 검색어(`q`)가 훑는 범위

  - `string` · `text` 컬럼 — 대소문자 구분 없는 부분 일치
  - `enum` 컬럼 — 상수 이름과 완전히 같을 때만
  - `number` · `relation` 컬럼 — 검색어가 숫자로 읽힐 때만, 완전 일치

  훑을 컬럼이 하나도 없으면 빈 결과를 돌려줍니다. 검색어를 무시하고 전체를 주면
  거짓말이 되기 때문입니다.

  민감 필드(`sensitive: true`)는 검색 대상에서 빠집니다.

  ## 응답

  행은 엔티티가 아니라 평평한 `Map` 입니다. 복합키 구성 요소는 펼쳐지고, 연관 필드는
  **대상의 식별자**이며(`"imageFile": 7`), 민감 필드는 언제나 `null` 입니다.
  `_id` 는 이 행을 가리키는 URL 조각입니다.

  ### FK 대표값과 썸네일이 함께 옵니다

  번호만 보면 어느 행을 가리키는지 알 수 없으므로, 연관 필드가 있으면 행에 두 키가 더
  붙습니다. 둘 다 **행을 가져오는 그 질의 안에서** LEFT JOIN 을 타고 오므로 질의 수가
  늘지 않습니다 (목록 1 + `COUNT` 1).

  ```json
  {
    "albumId": 1, "artist": 1, "imageFile": 2,
    "_id": "1",
    "_labels":     { "artist": "J. S. Bach", "imageFile": "1-Prelude-in-C-Major" },
    "_thumbnails": { "imageFile": { "url": "/api/v1/storage/image/2",
                                    "requires_authorization": false } }
  }
  ```

  | 키 | 설명 |
  | --- | --- |
  | `_labels` | `필드 → 대상의 대표 컬럼 값`. 무엇을 대표값으로 쓸지는 **서버가 정합니다** |
  | `_thumbnails` | `필드 → { url, requires_authorization }`. 이미지가 없으면 그 필드만 빠집니다 |

  자세한 규칙(무엇이 대표값인가, 왜 인증 여부를 서버가 주는가, 이미지가 아닌 파일은 왜
  안 나가는가)은 **자원 스키마 조회** 문서를 보세요.

  `_labels`·`_thumbnails` 의 **키는 필드 이름(엔티티 기준 camelCase)이고, 그 안의 키는
  `requires_authorization` 처럼 snake_case** 입니다. 둘을 바꿔 읽으면 오류 없이 값이
  `undefined` 가 되어 화면이 **조용히 빈칸**을 그립니다 — 실제로 화면이 그렇게 만들었다가
  브라우저 확인에서 드러났습니다.

  같은 응답의 `content`·`page`·`total` 같은 record 필드도 `SNAKE_CASE` 전략을 타므로
  snake_case 입니다. `_id`·`_labels` 같은 밑줄 키는 화면용으로 따로 넣은 것입니다.

  연관 컬럼으로 정렬·필터하면 `LEFT JOIN` 이 붙습니다. `INNER` 로 붙이면 FK 가 `null`
  인 행이 조용히 사라집니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_RESOURCE_NOT_FOUND` | 404 | `{resource}` 가 관리 대상에 없음 |
  | `MUPID_UNKNOWN_FIELD` | 400 | `sort`·`filter.` 가 스키마에 없는 필드 |
  | `MUPID_INVALID_FIELD_VALUE` | 400 | 필터 값을 그 필드의 타입으로 바꾸지 못함 |
  | `MUPID_RESOURCE_QUERY_FAILED` | 500 | 조회 자체가 실패. 엔티티 매핑과 실제 테이블이 어긋난 경우 |
  | `MUPID_FORBIDDEN` | 403 | `ROLE_ADMIN` 이 아님 |
