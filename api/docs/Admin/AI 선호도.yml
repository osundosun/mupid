info:
  name: AI 선호도
  type: http
  seq: 13

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/admin/ai-preference"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit
  params:
    - name: from
      value: ""
      type: query
      enabled: false
    - name: to
      value: ""
      type: query
      enabled: false

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

