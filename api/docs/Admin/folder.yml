  type: text/markdown
  content: |-
    # Admin

    관리자 화면(`/api/admin`)이 쓰는 데이터 API 입니다. **전부 `ROLE_ADMIN` 전용**이고
    (`AdminApiController` 의 `@AdminRole`), 아니면 403 `MUPID_FORBIDDEN` 입니다.

    | 엔드포인트 | 동작 |
    | --- | --- |
    | `GET /api/v1/admin/dashboard` | 자원별 행 수 + JVM + 외부 저장소 상태 |
    | `GET /api/v1/admin/resource` | 관리 대상 자원 목록 |
    | `GET /api/v1/admin/resource/{resource}/schema` | 자원 하나의 컬럼 구성 |
    | `GET /api/v1/admin/resource/{resource}` | 목록 조회 (페이징·정렬·검색·필터) |
    | `GET /api/v1/admin/resource/{resource}/{id}` | 단건 조회 |
    | `GET /api/v1/admin/resource/music/{id}/timeline` | 곡의 가사·구간 타임라인 (조회 전용) |
    | `POST /api/v1/admin/resource/{resource}` | 생성 |
    | `PATCH /api/v1/admin/resource/{resource}/{id}` | 수정 |
    | `DELETE /api/v1/admin/resource/{resource}/{id}` | 삭제 |
    | `POST /api/v1/admin/clickhouse/console` | ClickHouse 콘솔 열람권 발급 (쿠키) |
    | `DELETE /api/v1/admin/clickhouse/console` | 열람권 회수 |

    ## ClickHouse 콘솔은 여기 있지 않습니다

    화면 자체(`/play`·`/dashboard`)는 `/api/admin/clickhouse/**` 로 나갑니다. 그쪽은
    쿠키로 지키고 이 컬렉션에 넣지 않습니다 — 응답이 JSON 이 아니라 ClickHouse 가 만든
    HTML 과 쿼리 결과이기 때문입니다. 여기 있는 것은 그 화면을 열 열람권을 주고받는
    두 요청뿐입니다.

    ## 자원 이름과 목록

    **자원 목록은 손으로 관리하지 않습니다.** `AdminResourceRegistry` 가 기동할 때
    JPA 메타모델을 읽어 `@Entity` 전부를 자원으로 만듭니다. 엔티티를 추가하면 관리자
    화면에도 저절로 나타나므로, 이 컬렉션에 자원별 요청을 따로 만들지 않습니다.

    `{resource}` 는 엔티티 이름의 첫 글자를 내린 것입니다 — `MusicComment` →
    `musicComment`. 실제 목록은 `GET /api/v1/admin/resource` 로 확인하세요.

    ## 식별자

    `{id}` 는 행 응답의 `_id` 값입니다. 복합키(`@EmbeddedId`)면 구성 요소를 선언 순서대로
    `,` 로 이은 것입니다 — `MusicReaction` 은 `5,3` (userId=5, musicId=3).

    ## 행의 모양

    행은 엔티티가 아니라 평평한 `Map` 입니다.

    - 복합키 구성 요소는 바깥으로 펼쳐집니다 (`userId`, `musicId`).
    - 연관 필드는 대상 엔티티가 아니라 **대상의 식별자**입니다 (`"album": 1`).
    - 연관 필드가 있으면 **`_labels`**(대표 컬럼 값)와 **`_thumbnails`**(작은 이미지 주소)가
      함께 옵니다. 둘 다 행을 가져오는 같은 질의에서 LEFT JOIN 으로 오므로 질의 수가
      늘지 않습니다 — 목록 1 + `COUNT` 1 입니다.
    - 비밀번호처럼 민감한 필드는 **언제나 `null`** 로 나갑니다. 쓰기만 가능합니다.
    - `_id` 키가 하나 더 붙습니다. 위의 `{id}` 입니다.

    스키마 응답에도 **`child_links`** 가 있습니다 ("이 앨범의 음악들" 처럼 자식 자원으로
    건너가는 링크). 화면은 그 링크를 `filter.<filter_field>=<이 행의 식별자>` 로 열어
    자식 목록을 보여 줍니다 — 새 엔드포인트가 필요 없습니다.

    **`timeline_axes`** 도 있습니다 (S15P21A204-380-B). 곡(`music`) 자원에만 비어 있지
    않고, 화면은 이것이 있으면 행마다 **가사·구간** 버튼을 그립니다. 밴드가 무엇을 시간으로
    보고 무엇으로 정렬하는지가 이 목록에 담겨 있어 **화면에 자원 이름이 없습니다** —
    자원이 늘어도 템플릿을 고칠 필요가 없습니다. 자세한 규칙은 **곡 가사·구간 타임라인**
    문서를 보세요.

    ## 목록 필터의 `IN`

    `filter.<필드>` 는 기본이 **완전 일치 하나**입니다. 값이 `__in__:` 로 시작하면 쉼표로
    이은 **목록 중 하나**(`IN`)로 봅니다 — `filter.lyricId=__in__:91,92`.

    타임라인의 구간-분위기 밴드가 이걸 씁니다. 분위기는 **구간에** 달려서 곡 하나의 분위기를
    고르려면 그 곡의 구간 번호 여러 개를 한 번에 걸어야 하고, 구간마다 부르면 그대로
    N+1 입니다.

    값이 하나도 없으면(`__in__:`) **빈 결과**입니다. 빈 `IN ()` 은 SQL 문법 오류라 질의가
    죽고, 조건을 빼면 전부 나와 화면이 남의 곡 데이터를 그립니다 — 둘 다 거짓말이라
    거짓 조건이 맞습니다.

    밑줄 키(`_id`·`_labels`·`_thumbnails`)는 화면용으로 서버가 따로 넣은 것이고, 그 **안의
    키도 snake_case** 입니다 (`requires_authorization`). 표기가 섞여 있으니 키를 읽을 때
    응답 원문을 기준으로 삼으세요 — camelCase 로 잘못 읽으면 오류 없이 값이 `undefined` 가
    되어 화면이 조용히 빈칸을 그립니다.

    필드 이름은 자바 필드명 그대로(camelCase)입니다. `Map` 의 키는
    `spring.jackson.property-naming-strategy: SNAKE_CASE` 의 적용 대상이 아니기
    때문입니다. 반면 `BaseResponse`·스키마 응답 같은 record 는 snake_case 로 나갑니다 —
    한 응답 안에서 표기가 섞입니다.

    ## 오류

    | 코드 | 상태 | 설명 |
    | --- | --- | --- |
    | `MUPID_RESOURCE_NOT_FOUND` | 404 | `{resource}` 가 관리 대상에 없음 |
    | `MUPID_RECORD_NOT_FOUND` | 404 | `{id}` 행이 없거나, 연관으로 지정한 대상이 없음 |
    | `MUPID_UNKNOWN_FIELD` | 400 | 본문·필터에 스키마에 없는 필드 |
    | `MUPID_INVALID_FIELD_VALUE` | 400 | 값을 그 필드의 타입으로 바꾸지 못함 |
    | `MUPID_INVALID_RECORD_ID` | 400 | `{id}` 의 구성 요소 수가 맞지 않음 |
    | `MUPID_RECORD_WRITE_FAILED` | 400 | DB 가 쓰기를 거부 (제약 위반 등). 사유는 서버 로그 |
    | `MUPID_RESOURCE_QUERY_FAILED` | 500 | 조회 자체가 실패. 엔티티 매핑과 실제 테이블이 어긋난 경우. 사유는 서버 로그 |
    | `MUPID_SELF_MODIFICATION_NOT_ALLOWED` | 400 | 자기 계정의 권한·상태 변경, 자기 계정 삭제 |
    | `MUPID_LAST_ADMIN_PROTECTED` | 400 | 마지막 관리자의 권한 강등·탈퇴·삭제 |
    | `MUPID_CONSOLE_NOT_CONFIGURED` | 503 | ClickHouse HTTP 주소를 만들 수 없음 |
    | `MUPID_FORBIDDEN` | 403 | `ROLE_ADMIN` 이 아님 |
