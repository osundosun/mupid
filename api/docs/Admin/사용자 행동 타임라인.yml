info:
  name: 사용자 행동 타임라인
  type: http
  seq: 12

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/admin/resource/user/{{USER_ID}}/timeline"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit
  params:
    - name: from
      value: ""
      type: query
      enabled: false
    - name: to
      value: ""
      type: query
      enabled: false
    - name: date
      value: ""
      type: query
      enabled: false

runtime:
  variables:
    - name: USER_ID
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

