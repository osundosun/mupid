info:
  name: ClickHouse 콘솔 열기
  type: http
  seq: 9

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/admin/clickhouse/console"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 콘솔 열림
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
        - name: Set-Cookie
          value: mupid_ch_console=GpQpNf2ke8MHjGvbmW95yF8xq2osp7Bv5J1g_4MLnLE; Path=/api/admin/clickhouse; Max-Age=1800; HttpOnly; SameSite=Strict
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "play_path": "/api/admin/clickhouse/play",
              "dashboard_path": "/api/admin/clickhouse/dashboard",
              "expires_in": 1800
            }
          }
  - name: 503 콘솔 주소 없음
    response:
      status: 503
      statusText: Service Unavailable
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_CONSOLE_NOT_CONFIGURED",
            "message": "ClickHouse 콘솔 주소가 설정되어 있지 않습니다.",
            "errorDetails": null
          }

docs: |-
  # ClickHouse 콘솔 열기

  `POST /api/v1/admin/clickhouse/console` · `ROLE_ADMIN`

  ClickHouse 가 스스로 서빙하는 화면(`/play` · `/dashboard`)을 볼 수 있는 **열람권**을
  발급합니다. 관리자 화면이 iframe 을 띄우기 직전에 한 번 부릅니다.

  ## ClickHouse 포트는 열지 않습니다

  8123 을 밖으로 열면 그 화면에는 우리 로그인이 없고, 지키는 것이 ClickHouse 계정
  하나뿐인데 그 계정은 분석 DB 를 통째로 읽고 씁니다. 대신 스프링이 중간에 서서
  (`/api/admin/clickhouse/**`) 관리자 로그인 하나로 통과시킵니다.

  ClickHouse 자격증명은 **브라우저로 내려가지 않습니다.** 두 화면이 보내는 `user` ·
  `password` · `quota_key` 는 프록시가 버리고, `X-ClickHouse-User` ·
  `X-ClickHouse-Key` 헤더를 서버가 붙입니다.

  ## 열람권이 본문이 아니라 쿠키인 이유

  iframe 의 문서 요청, 그 안의 `<script src>`, ClickHouse 화면이 스스로 던지는
  `fetch` — 셋 다 `Authorization` 헤더를 붙일 수 없습니다. 이 프로젝트의 인증은
  헤더의 Bearer 뿐이라(`AuthFilter`) 셋을 한 번에 통과시킬 수 있는 것은 쿠키뿐입니다.

  | 쿠키 속성 | 값 | 왜 |
  | --- | --- | --- |
  | 이름 | `mupid_ch_console` | |
  | `Path` | `/api/admin/clickhouse` | 다른 API 요청에는 실리지 않습니다 |
  | `Max-Age` | 1800 (30분) | Redis TTL 과 같습니다 |
  | `HttpOnly` | 예 | 화면 스크립트가 읽지 못합니다 |
  | `Secure` | 요청이 https 일 때만 | 늘 붙이면 http 로 띄우는 로컬에서 콘솔이 열리지 않습니다 |

  화면은 만료 1분 전에 이 요청을 다시 보내 열람권만 갈아 끼웁니다. iframe 은 다시
  그리지 않습니다 — 쓰던 쿼리가 사라지면 콘솔을 쓸 수 없습니다.

  ## 응답

  | 필드 | 설명 |
  | --- | --- |
  | `play_path` | 쿼리 콘솔. iframe 의 `src` 로 그대로 씁니다 |
  | `dashboard_path` | 차트 대시보드 |
  | `expires_in` | 열람권이 살아 있는 시간(초) |

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰 없음/만료 |
  | `MUPID_FORBIDDEN` | 403 | `ROLE_ADMIN` 이 아님 |
  | `MUPID_CONSOLE_NOT_CONFIGURED` | 503 | `MUPID_CLICKHOUSE_URL` 에서 HTTP 주소를 만들 수 없음 |
