  type: http
  seq: 11

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/admin/resource/music/{{MUSIC_ID}}/timeline"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

runtime:
  variables:
    - name: MUSIC_ID
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

