info:
  name: 자원 스키마 조회
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/admin/resource/{{ADMIN_RESOURCE}}/schema"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

runtime:
  variables:
    - name: ADMIN_RESOURCE
      value: user

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 조회 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "name": "user",
              "label": "회원",
              "table": "users",
              "category": "회원",
              "composite": false,
              "ids": ["userId"],
              "fields": [
                {
                  "name": "userId",
                  "label": "userId",
                  "type": "number",
                  "id": true,
                  "nullable": false,
                  "insertable": false,
                  "updatable": false,
                  "generated": true,
                  "sensitive": false,
                  "options": null,
                  "relation": null
                },
                {
                  "name": "password",
                  "label": "password",
                  "type": "string",
                  "id": false,
                  "nullable": false,
                  "insertable": true,
                  "updatable": true,
                  "generated": false,
                  "sensitive": true,
                  "options": null,
                  "relation": null
                },
                {
                  "name": "imageFile",
                  "label": "imageFile",
                  "type": "relation",
                  "id": false,
                  "nullable": true,
                  "insertable": true,
                  "updatable": true,
                  "generated": false,
                  "sensitive": false,
                  "options": null,
                  "relation": "objectStorageFile",
                  "representative_field": "originalFileName",
                  "thumbnailable": true
                },
                {
                  "name": "role",
                  "label": "role",
                  "type": "enum",
                  "id": false,
                  "nullable": false,
                  "insertable": true,
                  "updatable": true,
                  "generated": false,
                  "sensitive": false,
                  "options": ["ROLE_USER", "ROLE_SYSTEM", "ROLE_ADMIN"],
                  "relation": null,
                  "representative_field": null,
                  "thumbnailable": false
                }
              ],
              "child_links": []
            }
          }
  - name: 404 없는 자원
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_RESOURCE_NOT_FOUND",
            "message": "관리 대상 자원을 찾을 수 없습니다.",
            "error_details": null
          }

docs: |-
  # 자원 스키마 조회

  `GET /api/v1/admin/resource/{resource}/schema` · `ROLE_ADMIN`

  자원 하나의 컬럼 구성입니다. 관리자 화면은 **이것만 보고** 표와 입력 폼을 그립니다.
  화면에 하드코딩된 컬럼 목록이 없습니다.

  ## 필드 하나의 모양

  | 필드 | 설명 |
  | --- | --- |
  | `name` | 행 `Map` 의 키. 정렬·필터 파라미터에도 이 이름을 씁니다 |
  | `type` | `string` `text` `number` `boolean` `datetime` `date` `time` `enum` `relation` `other` |
  | `id` | 식별자를 이루는 필드인가 |
  | `nullable` | `null` 허용 여부 |
  | `insertable` | 생성(`POST`) 때 넣을 수 있는가 |
  | `updatable` | 수정(`PATCH`) 때 고칠 수 있는가 |
  | `generated` | DB 가 만들어 주는 값인가 (`@GeneratedValue`) |
  | `sensitive` | 조회 응답에서 언제나 `null`. 쓰기만 가능 |
  | `options` | `enum` 이면 고를 수 있는 값 전부 |
  | `relation` | 연관 필드면 가리키는 자원 이름 |
  | `representative_field` | 연관 필드면, **대상 자원에서 그 개체를 알아보게 하는 컬럼** 이름. 아니면 `null` |
  | `thumbnailable` | 연관 필드면, 대상이 **작은 이미지를 가질 수 있는가**. 아니면 `false` |

  쓸 수 없는 필드에 값을 보내면 **오류가 아니라 조용히 무시**됩니다. 화면이 행을
  통째로 되돌려 보내는 흐름을 허용하기 위해서입니다.

  ## FK 는 대표값과 번호를 함께 보여 줍니다

  연관 필드(=`type: relation`)의 값은 **대상의 식별자**입니다 — 프록시를 깨우지 않으려고
  목록 조회가 식별자만 꺼내기 때문입니다. 번호만 보면 어느 행을 가리키는지 알 수 없어서,
  목록·단건 응답의 행에 **`_labels`** 가 함께 실립니다.

  ```json
  { "artist": 353, "_labels": { "artist": "J. S. Bach" } }
  ```

  무엇을 대표값으로 쓸지는 **서버가 정합니다**(`AdminResourceRegistry.REPRESENTATIVE_FIELDS`).
  자원마다 다르고(회원=이메일, 아티스트=이름, 앨범=제목) 메타모델에서 유도할 수 없는
  도메인 판단이라 표로 손수 관리합니다. 표에 없는 자원은 `representative_field: null` 이고
  `_labels` 에 그 필드가 안 실립니다 — 화면은 번호만 그립니다.

  ## 이미지는 `_thumbnails` 로 나갑니다

  `thumbnailable: true` 인 연관 필드에 이미지가 있으면 행에 **`_thumbnails`** 가 실립니다.

  ```json
  { "imageFile": 2,
    "_thumbnails": { "imageFile": { "url": "/api/v1/storage/image/2",
                                    "requires_authorization": false } } }
  ```

  | 키 | 설명 |
  | --- | --- |
  | `url` | 파일 **번호**로 만든 조회 주소. 저장 키를 되짚지 않습니다 |
  | `requires_authorization` | `true` 면 토큰을 붙여야 받아집니다 |

  **`requires_authorization` 을 서버가 주는 이유**: 같은 `/api/v1/storage/image/{fileId}` 라도
  앨범·아티스트·곡 커버·MuBTI 는 공개(`ImageAccessPolicy.CATALOG`)고 **프로필은 비공개**
  (`OWNER`)입니다. 화면은 `<img src>` 에 `Authorization` 헤더를 붙일 수 없으므로, 참일
  때만 `fetch` 로 받아 blob 주소로 그립니다. 이 판단을 화면에 맡기면 카테고리 이름을 화면이
  알아야 하고 서버가 정책을 바꿀 때 조용히 깨집니다.

  `FileType.IMG` 가 아니거나 지워진 파일은 **아예 안 실립니다** — 음원 청크가 표지 자리로
  나가면 화면이 깨진 그림 자리를 그리게 됩니다.

  ## 자식 자원으로 건너가는 링크는 `child_links`

  이 자원의 행에서 자식 자원을 볼 수 있는 링크 목록입니다. 없으면 빈 배열입니다.

  ```json
  "child_links": [ { "label": "음악", "child_resource": "music", "filter_field": "album" } ]
  ```

  화면은 행마다 링크를 그립니다. 자식 목록을 **부모를 가리키는 필터로 걸어서** 열므로
  (`filter.album=<이 행의 albumId>`) 새 엔드포인트가 필요 없습니다. 지금 선언된 것은
  앨범 → 음악 하나입니다. 자식 관계를 메타모델에서 유도해 다 그리지 않는 것은, `user` 를
  가리키는 자식이 열 개가 넘어 회원 행마다 링크가 열 줄씩 붙기 때문입니다.

  ## N+1 을 내지 않습니다

  `_labels`·`_thumbnails` 는 **행을 가져오는 그 질의 안에서** LEFT JOIN 을 타고 같이
  옵니다. 행마다 따로 물어보면 목록이 수백 행일 때 그대로 N+1 이 됩니다. 실측 —
  앨범 목록에서 3행과 12행 모두 준비된 statement 가 **2개**(목록 1 + `COUNT` 1)입니다
  (`AdminRowProjectionTest`).

  ## 읽기 전용이 되는 경우

  - 식별자 (`id: true`)
  - `@Column(insertable = false)` · `@Column(updatable = false)`
  - `@CreatedDate` · `@LastModifiedDate` — `AuditingEntityListener` 가 저장 직전에
    덮어쓰므로 입력칸을 내주면 적어 넣은 값이 조용히 사라집니다

  ## 복합키

  `composite: true` 면 `@EmbeddedId` 의 구성 요소가 바깥으로 펼쳐져 각자 `id: true`
  필드가 됩니다. `ids` 가 그 순서이고, 레코드 URL 의 `{id}` 는 이 순서대로 `,` 로
  이은 것입니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_RESOURCE_NOT_FOUND` | 404 | `{resource}` 가 관리 대상에 없음 |
  | `MUPID_FORBIDDEN` | 403 | `ROLE_ADMIN` 이 아님 |
