info:
  name: 벡터 미반영 목록
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/system/vectors/pending?after=0&limit=500"
  params:
    - name: after
      value: "0"
      type: query
    - name: limit
      value: "500"
      type: query
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 목록
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "items": [
                { "music_id": 1001, "analysis_version": "v1", "attempts": 0, "last_error": null,
                  "created_at": "2026-09-25T22:25:40" },
                { "music_id": 1002, "analysis_version": "v1", "attempts": 2,
                  "last_error": "MUPID_VECTOR_STORE_UNAVAILABLE", "created_at": "2026-09-25T22:25:41" }
              ],
              "next": null
            }
          }

docs: |-
  # 벡터 미반영 목록

  `GET /api/v1/system/vectors/pending?after={musicId}&limit={n}` · `ROLE_SYSTEM` / `ROLE_ADMIN` 필요

  벡터가 **아직(또는 실패로) 없는 곡**입니다 — 미반영 기록 `analytics_sync_pending(kind = 'VECTOR')`.
  Spring 은 벡터를 보관하지 않아 스스로 고치지 못합니다(설계 §6.6). 배치가 이 목록을 읽어 곡마다
  `곡 벡터 등록` 을 다시 보냅니다: `music-preprocessing vectors-send --pending`.

  - 곡 번호 순입니다. `next` 가 있으면 그 값을 `after` 로 다음 쪽을 읽습니다. `limit` 은 최대 1,000.
  - `analysis_version` 은 MySQL 이 기다리는 버전입니다 — 그 버전의 벡터를 보내야 지워집니다.
  - 행이 생기는 때: 구간 등록(`PUT …/section`)·관리자 화면의 구간 수정이 커밋될 때, 매일 04:50 대조가
    Qdrant 와 어긋난 곡(없음·모자람·남음·지문 다름)을 찾았을 때.
