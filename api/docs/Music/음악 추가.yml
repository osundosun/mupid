info:
  name: 음악 추가
  type: http
  seq: 9

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/music"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "album_id": {{ALBUM_ID}},
        "artist_id": {{ARTIST_ID}},
        "title": "{{MUSIC_TITLE}}",
        "release_date": "{{MUSIC_RELEASE_DATE}}"
      }
  auth: inherit

runtime:
  variables:
    - name: ALBUM_ID
      value: "1"
    - name: ARTIST_ID
      value: "1"
    - name: MUSIC_TITLE
      value: 봄날의 노래
    - name: MUSIC_RELEASE_DATE
      value: "2026-09-11T00:00:00"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.music_id
        method: jsonq
      variable:
        name: MUSIC_ID
        scope: runtime
      description: 생성된 음악 번호를 MUSIC_ID 변수에 저장합니다.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 추가 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "음악이 추가되었습니다.",
            "data": {
              "music_id": 1
            }
          }
  - name: 403 권한 없음
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_FORBIDDEN",
            "message": "접근 권한이 없습니다.",
            "errorDetails": null
          }
  - name: 404 앨범 없음
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_ALBUM_NOT_FOUND",
            "message": "요청한 앨범을 찾을 수 없습니다.",
            "error_details": null
          }
  - name: 404 아티스트 없음
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_ARTIST_NOT_FOUND",
            "message": "요청한 아티스트를 찾을 수 없습니다.",
            "error_details": null
          }
  - name: 400 검증 실패
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_INVALID_REQUEST_BODY",
            "message": "데이터가 잘못 입력되었습니다.",
            "error_details": {
              "albumId": "앨범 정보가 입력되지 않았습니다.",
              "title": "타이틀이 입력되지 않았습니다."
            }
          }

docs: |-
  # 음악 추가

  `POST /api/v1/music` · `ROLE_SYSTEM` / `ROLE_ADMIN` 필요

  ## 요청 본문

  | 필드 | 타입 | 필수 | 설명 |
  | --- | --- | --- | --- |
  | `album_id` | int | ✅ | 앨범 번호 (`앨범 생성` 에서 획득) |
  | `artist_id` | int | ✅ | 아티스트 번호 (`아티스트 생성` 에서 획득) |
  | `title` | string | ✅ | 곡명 |
  | `release_date` | datetime | ✅ | 발매일 (ISO-8601, 예: `2026-09-11T00:00:00`) |

  ## 응답

  `data.music_id` 로 생성된 음악 번호가 반환되고 `MUSIC_ID` 변수에 자동
  저장됩니다. 이 번호를 `Stream / 스트림 정보 조회` 등에 그대로 쓸 수 있습니다.

  음악 추가 직후에는 스트림이 없으므로 `Stream` 조회 시
  `MUPID_STREAM_NOT_FOUND` 가 반환됩니다. 스트림/청크는 별도 파이프라인이
  생성합니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
  | `MUPID_FORBIDDEN` | 403 | SYSTEM/ADMIN 이 아닌 토큰 |
  | `MUPID_INVALID_REQUEST_BODY` | 400 | 검증 규칙 위반 |
  | `MUPID_ALBUM_NOT_FOUND` | 404 | 앨범 없음 또는 삭제됨 |
  | `MUPID_ARTIST_NOT_FOUND` | 404 | 아티스트 없음 또는 삭제됨 |