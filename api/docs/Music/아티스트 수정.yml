info:
  name: 아티스트 수정
  type: http
  seq: 10

http:
  method: PATCH
  url: "{{BASE_URL}}/api/v1/artist/{{ARTIST_ID}}"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "{{ARTIST_NAME}}"
      }
  auth: inherit

runtime:
  variables:
    - name: ARTIST_ID
      value: "1"
    - name: ARTIST_NAME
      value: 바뀐 이름

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 수정 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "아티스트 정보가 수정되었습니다.",
            "data": null
          }
  - name: 400 이름 누락
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_INVALID_REQUEST_BODY",
            "message": "데이터가 잘못 입력되었습니다.",
            "error_details": null
          }
  - name: 404 아티스트 없음
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_ARTIST_NOT_FOUND",
            "message": "요청한 아티스트를 찾을 수 없습니다.",
            "error_details": null
          }

docs: |-
  # 아티스트 수정

  `PATCH /api/v1/artist/{artistId}` · `ROLE_SYSTEM` / `ROLE_ADMIN` 필요

  ## 요청 본문

  | 필드 | 타입 | 필수 | 설명 |
  | --- | --- | --- | --- |
  | `name` | string | - | 새 아티스트명. `null` 또는 공백이면 아무것도 바뀌지 않습니다 |

  `name` 을 보냈는데 `null` 이거나 공백뿐인 값이면 400
  (`MUPID_INVALID_REQUEST_BODY`) 이 반환됩니다. 이름을 바꾸지 않을
  거라면 `{}` 처럼 본문을 비워 보내도 됩니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
  | `MUPID_FORBIDDEN` | 403 | SYSTEM/ADMIN 이 아닌 토큰 |
  | `MUPID_INVALID_REQUEST_BODY` | 400 | 이름이 공백/null |
  | `MUPID_ARTIST_NOT_FOUND` | 404 | 아티스트 없음 또는 삭제됨 |