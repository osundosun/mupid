info:
  name: 앨범 목록 조회
  type: http
  seq: 5

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/album?q=&artist_id=&page=0&size=20"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.items[0].album_id
        method: jsonq
      variable:
        name: ALBUM_ID
        scope: runtime
      description: 첫 번째 앨범 번호를 ALBUM_ID 변수에 저장합니다.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 조회 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "items": [
                {
                  "album_id": 1,
                  "title": "무피드 테스트 앨범",
                  "image_url": "/api/v1/storage/image/12",
                  "release_date": "2026-09-14T00:00:00",
                  "artist": {
                    "artist_id": 1,
                    "name": "무피드 테스트 아티스트",
                    "image_url": "/api/v1/storage/image/13"
                  }
                }
              ],
              "page": 0,
              "size": 20,
              "total_elements": 1,
              "total_pages": 1
            }
          }

docs: |-
  # 앨범 목록 조회

  `GET /api/v1/album` · **액세스 토큰 필요**

  | 이름 | 기본값 | 설명 |
  | --- | --- | --- |
  | `q` | 없음 | 앨범명·**아티스트명** 부분 일치 |
  | `artist_id` | 없음 | 주면 그 아티스트의 앨범만 |
  | `page` | `0` | **0부터** 셉니다 |
  | `size` | `20` | 최대 100 |

  정렬은 **발매일 내림차순**입니다.

  쿼리 이름이 `artist_id` 로 snake_case 인 데 주의하세요. `spring.jackson`
  의 SNAKE_CASE 설정은 JSON 본문에만 걸려서 쿼리 파라미터는 컨트롤러가 직접
  이름을 적어 줍니다. 숫자가 아닌 값을 주면 400 입니다.
