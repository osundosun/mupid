info:
  name: 가사 일괄 교체
  type: http
  seq: 21

http:
  method: PUT
  url: "{{BASE_URL}}/api/v1/music/{{MUSIC_ID}}/lyric"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "lines": [
          { "text": "첫 번째 소절", "time_ms": 0 },
          { "text": "두 번째 소절", "time_ms": 4200 },
          { "text": "(따라 부르기)", "time_ms": 4200 }
        ]
      }
  auth: inherit

runtime:
  variables:
    - name: MUSIC_ID
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 교체 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "가사가 등록되었습니다.",
            "data": {
              "music_id": 1,
              "deleted": 47,
              "created": 3
            }
          }
  - name: 404 음악 없음
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_MUSIC_NOT_FOUND",
            "message": "요청한 음악을 찾을 수 없습니다.",
            "error_details": null
          }
  - name: 400 빈 목록
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_INVALID_REQUEST_BODY",
            "message": "데이터가 잘못 입력되었습니다.",
            "error_details": {
              "lines": "가사가 입력되지 않았습니다."
            }
          }
  - name: 400 줄 검증 실패
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_INVALID_REQUEST_BODY",
            "message": "데이터가 잘못 입력되었습니다.",
            "error_details": {
              "lines[2].timeMs": "올바르지 않은 가사 시간이 입력되었습니다."
            }
          }
  - name: 400 상한 초과
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_LYRIC_BULK_TOO_MANY",
            "message": "한 번에 올릴 수 있는 가사 줄 수를 넘었습니다.",
            "error_details": null
          }
  - name: 403 권한 없음
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_FORBIDDEN",
            "message": "접근 권한이 없습니다.",
            "errorDetails": null
          }

docs: |-
  # 가사 일괄 교체

  `PUT /api/v1/music/{musicId}/lyric` · `ROLE_SYSTEM` / `ROLE_ADMIN` 필요

  한 곡의 가사를 **통째로 갈아 끼웁니다. 기존 가사는 지워집니다.**

  `가사 추가`(`POST /api/v1/lyric`)가 줄 하나를 붙이는 것과 달리, 이쪽은 곡
  하나의 가사 전체를 한 번에 대신합니다. 같은 본문을 두 번 보내면 결과가 같아서
  `PUT` 입니다.

  ## 요청 본문

  | 필드 | 타입 | 필수 | 설명 |
  | --- | --- | --- | --- |
  | `lines` | array | ✅ | 가사 줄 배열. **1~500개** |
  | `lines[].text` | string | ✅ | 가사 한 줄. 1~500자. 앞뒤 공백은 잘려 저장됩니다 |
  | `lines[].time_ms` | int | ✅ | 곡 내 시점(ms). 0 이상 |

  **빈 배열은 400 입니다.** 교체 의미로는 "전부 지워라" 가 맞지만, 배치의 실수
  하나가 곡 가사를 통째로 날립니다. 가사를 비우는 길은 따로 두지 않았습니다.

  ## 순서

  **보낸 순서대로 저장되고, 서버는 정렬하지 않습니다.**

  `time_ms` 가 같은 줄이 여럿일 수 있습니다 — 후렴에 겹쳐 나오는 줄이 그렇습니다
  (지금 카탈로그에 164줄). 조회(`가사 조회`)가 `time_ms`, `lyric_id` 순으로
  주므로, 같은 시각인 줄들은 **보낸 순서가 곧 보이는 순서**입니다.

  ## 응답

  | 필드 | 설명 |
  | --- | --- |
  | `deleted` | 이 요청이 지운 기존 가사 줄 수 |
  | `created` | 새로 넣은 줄 수 |

  만들어진 `lyric_id` 목록은 돌려주지 않습니다. 교체 의미라 부르는 쪽이 번호를
  기억할 이유가 없고, 곡 하나에 수십 줄이라 목록이 응답을 채우기만 합니다.
  번호가 필요하면 `가사 조회`가 줍니다.

  ## 원자성

  곡 하나가 한 트랜잭션입니다. 중간에 끊겨도 반쯤 올라간 가사가 남지 않습니다 —
  줄마다 `POST` 를 부를 때는 이것이 보장되지 않았습니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
  | `MUPID_FORBIDDEN` | 403 | SYSTEM/ADMIN 이 아닌 토큰 |
  | `MUPID_INVALID_REQUEST_BODY` | 400 | 빈 배열, 501줄 이상, 줄 검증 실패 |
  | `MUPID_LYRIC_BULK_TOO_MANY` | 400 | 서비스를 직접 부르는 경로에서 상한 초과 |
  | `MUPID_MUSIC_NOT_FOUND` | 404 | 곡 없음 또는 삭제됨 |
