info:
  name: 앨범 수정
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{BASE_URL}}/api/v1/album/{{ALBUM_ID}}"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "{{ALBUM_TITLE}}"
      }
  auth: inherit

runtime:
  variables:
    - name: ALBUM_ID
      value: "1"
    - name: ALBUM_TITLE
      value: 수정된 앨범명

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 수정 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "앨범 정보가 수정되었습니다.",
            "data": null
          }
  - name: 404 앨범 없음
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_ALBUM_NOT_FOUND",
            "message": "요청한 앨범을 찾을 수 없습니다.",
            "error_details": null
          }

docs: |-
  # 앨범 수정

  `PATCH /api/v1/album/{albumId}` · `ROLE_SYSTEM` / `ROLE_ADMIN` 필요

  ## 요청 본문 (모두 선택)

  | 필드 | 타입 | 설명 |
  | --- | --- | --- |
  | `artist_id` | int | 이동할 아티스트 번호 |
  | `title` | string | 새 앨범명 (공백만 있는 값은 무시) |
  | `release_date` | datetime | 새 발매일 (ISO-8601) |

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
  | `MUPID_FORBIDDEN` | 403 | SYSTEM/ADMIN 이 아닌 토큰 |
  | `MUPID_ALBUM_NOT_FOUND` | 404 | 앨범 없음 또는 삭제됨 |
  | `MUPID_ARTIST_NOT_FOUND` | 404 | 아티스트 없음 또는 삭제됨 |