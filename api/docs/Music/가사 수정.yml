info:
  name: 가사 수정
  type: http
  seq: 13

http:
  method: PATCH
  url: "{{BASE_URL}}/api/v1/lyric/{{LYRIC_ID}}"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "text": "{{LYRIC_TEXT}}",
        "time_ms": {{LYRIC_TIME_MS}}
      }
  auth: inherit

runtime:
  variables:
    - name: LYRIC_ID
      value: "1"
    - name: LYRIC_TEXT
      value: 수정된 가사
    - name: LYRIC_TIME_MS
      value: "1000"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 수정 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "가사 정보가 수정되었습니다.",
            "data": null
          }
  - name: 400 시간 오류
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_LYRIC_INVALID_TIME_MS",
            "message": "올바르지 않은 가사 시간이 입력되었습니다.",
            "error_details": null
          }
  - name: 404 가사 없음
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_LYRIC_NOT_FOUND",
            "message": "요청한 가사를 찾을 수 없습니다.",
            "error_details": null
          }

docs: |-
  # 가사 수정

  `PATCH /api/v1/lyric/{lyricId}` · `ROLE_SYSTEM` / `ROLE_ADMIN` 필요

  ## 요청 본문 (모두 선택)

  | 필드 | 타입 | 설명 |
  | --- | --- | --- |
  | `music_id` | int | 다른 음악으로 이동 |
  | `text` | string | 새 가사 내용 (공백만 있는 값은 무시) |
  | `time_ms` | int | 새 표시 타이밍 (ms). **음수면 400** |

  이동 대상 음악이 존재하지 않으면 `MUPID_MUSIC_NOT_FOUND` 가 반환됩니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
  | `MUPID_FORBIDDEN` | 403 | SYSTEM/ADMIN 이 아닌 토큰 |
  | `MUPID_LYRIC_INVALID_TIME_MS` | 400 | `time_ms` 가 음수 |
  | `MUPID_MUSIC_NOT_FOUND` | 404 | 이동 대상 음악 없음 또는 삭제됨 |
  | `MUPID_LYRIC_NOT_FOUND` | 404 | 가사 없음 |