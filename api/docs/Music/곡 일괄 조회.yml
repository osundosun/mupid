info:
  name: 곡 일괄 조회
  type: http
  seq: 24

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/music/bulk?ids={{MUSIC_IDS}}"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

runtime:
  variables:
    - name: MUSIC_IDS
      value: "3,1,2"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 조회 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "items": [
                {
                  "music_id": 3,
                  "title": "세 번째 곡",
                  "release_date": "2026-09-14T00:00:00",
                  "duration_ms": 7020,
                  "playable": true,
                  "play_count": 0,
                  "like_count": 0,
                  "image_url": "/api/v1/storage/image/14",
                  "artist": {
                    "artist_id": 1,
                    "name": "무피드 테스트 아티스트",
                    "image_url": "/api/v1/storage/image/13"
                  },
                  "album": {
                    "album_id": 1,
                    "title": "무피드 테스트 앨범",
                    "image_url": "/api/v1/storage/image/12",
                    "release_date": "2026-09-14T00:00:00"
                  },
                  "genres": [],
                  "moods": []
                }
              ]
            }
          }
  - name: 400 잘못된 번호 또는 상한 초과
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_INVALID_REQUEST_BODY",
            "message": "데이터가 잘못 입력되었습니다.",
            "error_details": null
          }

docs: |-
  # 곡 일괄 조회

  `GET /api/v1/music/bulk?ids=3,1,2` · **액세스 토큰 필요**

  곡 번호 여러 개를 한 번에 곡 정보로 바꿉니다. 화면이 곡 번호만 들고 있는 목록
  (좋아요·재생 목록·플레이리스트)을 그릴 때 씁니다 (S15P21A204-445). 항목 모양은
  `곡 목록 조회` 의 항목과 같습니다.

  - `ids` 는 쉼표 목록(`ids=3,1,2`)과 반복(`ids=3&ids=1`) 모두 됩니다.
  - **보낸 순서를 지킵니다.** 중복은 처음 자리만 남습니다.
  - **없거나 삭제된 곡은 404·410 이 아니라 결과에서 빠집니다.** 그래서 `items` 가
    보낸 것보다 짧을 수 있습니다. `곡 상세 조회` 와 다른 점입니다.
  - `ids` 가 비면 빈 목록입니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_INVALID_REQUEST_BODY` | 400 | 숫자가 아니거나 1 보다 작은 번호, 또는 100개 초과 |
