info:
  name: 앨범 상세 조회
  type: http
  seq: 6

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/album/{{ALBUM_ID}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 조회 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "album": {
                "album_id": 1,
                "title": "무피드 테스트 앨범",
                "image_url": "/api/v1/storage/image/ALBUM/...",
                "release_date": "2026-09-14T00:00:00",
                "artist": {
                  "artist_id": 1,
                  "name": "무피드 테스트 아티스트",
                  "image_url": "/api/v1/storage/image/ARTIST/..."
                }
              },
              "tracks": [
                {
                  "music_id": 1,
                  "title": "두 번째 곡",
                  "release_date": "2026-09-14T00:00:00",
                  "duration_ms": 7020,
                  "playable": true,
                  "play_count": 0,
                  "like_count": 0,
                  "artist": { "artist_id": 1, "name": "무피드 테스트 아티스트", "image_url": "/api/v1/storage/image/ARTIST/..." },
                  "album": { "album_id": 1, "title": "무피드 테스트 앨범", "image_url": "/api/v1/storage/image/ALBUM/...", "release_date": "2026-09-14T00:00:00" },
                  "genres": [],
                  "moods": []
                }
              ]
            }
          }
  - name: 404 앨범 없음
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_ALBUM_NOT_FOUND",
            "message": "요청한 앨범을 찾을 수 없습니다.",
            "error_details": null
          }

docs: |-
  # 앨범 상세 조회

  `GET /api/v1/album/{albumId}` · **인증 불필요**

  수록곡이 함께 옵니다. 곡 표현은 `곡 목록 조회` 의 항목과 **완전히 같습니다** —
  화면이 목록에서 쓰던 코드를 그대로 쓸 수 있습니다.

  수록곡 순서는 **등록 순**(`music_id` 오름차순)입니다. 앨범 내 트랙 번호를
  따로 들고 있지 않아서입니다.

  삭제된 곡은 빠지고, 삭제된 앨범은 404 입니다.
