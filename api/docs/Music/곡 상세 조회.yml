info:
  name: 곡 상세 조회
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/music/{{MUSIC_ID}}"
  auth: inherit

runtime:
  variables:
    - name: MUSIC_ID
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 조회 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "music_id": 1,
              "title": "두 번째 곡",
              "release_date": "2026-09-14T00:00:00",
              "duration_ms": 7020,
              "playable": true,
              "play_count": 0,
              "like_count": 0,
              "artist": {
                "artist_id": 1,
                "name": "무피드 테스트 아티스트",
                "image_url": "/api/v1/storage/image/ARTIST/..."
              },
              "album": {
                "album_id": 1,
                "title": "무피드 테스트 앨범",
                "image_url": "/api/v1/storage/image/ALBUM/...",
                "release_date": "2026-09-14T00:00:00"
              },
              "genres": [],
              "moods": []
            }
          }
  - name: 404 음악 없음
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_MUSIC_NOT_FOUND",
            "message": "요청한 음악을 찾을 수 없습니다.",
            "error_details": null
          }

docs: |-
  # 곡 상세 조회

  `GET /api/v1/music/{musicId}` · **액세스 토큰 필요**

  응답 모양은 `곡 목록 조회` 의 항목 하나와 같습니다. 목록에서 받은 값을 그대로
  쓸 수 있으면 다시 부르지 않아도 됩니다.

  삭제된 곡(`is_deleted = true`)은 404 입니다.

  ## 아직 없는 것

  가사·구간 분석·추천 이유는 이 응답에 없습니다. 별도 API 가 필요합니다 —
  [api-todo.md](../../knowledge/api-todo.md) P2-10 · P2-11 참고.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_MUSIC_NOT_FOUND` | 404 | 곡 없음 또는 삭제됨 |
