info:
  name: 가사 추가
  type: http
  seq: 9

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/lyric"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "music_id": {{MUSIC_ID}},
        "text": "{{LYRIC_TEXT}}",
        "time_ms": {{LYRIC_TIME_MS}}
      }
  auth: inherit

runtime:
  variables:
    - name: MUSIC_ID
      value: "1"
    - name: LYRIC_TEXT
      value: 첫 번째 소절
    - name: LYRIC_TIME_MS
      value: "0"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.lyric_id
        method: jsonq
      variable:
        name: LYRIC_ID
        scope: runtime
      description: 생성된 가사 번호를 LYRIC_ID 변수에 저장합니다.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 추가 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "가사가 추가되었습니다.",
            "data": {
              "lyric_id": 1
            }
          }
  - name: 404 음악 없음
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_MUSIC_NOT_FOUND",
            "message": "요청한 음악을 찾을 수 없습니다.",
            "error_details": null
          }
  - name: 400 검증 실패
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_INVALID_REQUEST_BODY",
            "message": "데이터가 잘못 입력되었습니다.",
            "error_details": {
              "musicId": "대상 음악이 지정되지 않았습니다.",
              "text": "가사 내용이 입력되지 않았습니다."
            }
          }

docs: |-
  # 가사 추가

  `POST /api/v1/lyric` · `ROLE_SYSTEM` / `ROLE_ADMIN` 필요

  가사는 음악 한 곡에 여러 줄을 추가할 수 있으며, `time_ms` 로 표시
  타이밍을 지정합니다.

  ## 요청 본문

  | 필드 | 타입 | 필수 | 설명 |
  | --- | --- | --- | --- |
  | `music_id` | int | ✅ | 대상 음악 번호 |
  | `text` | string | ✅ | 가사 내용 |
  | `time_ms` | int | ✅ | 가사 표시 타이밍 (ms) |

  ## 응답

  `data.lyric_id` 로 생성된 가사 번호가 반환되고 `LYRIC_ID` 변수에 자동
  저장됩니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
  | `MUPID_FORBIDDEN` | 403 | SYSTEM/ADMIN 이 아닌 토큰 |
  | `MUPID_INVALID_REQUEST_BODY` | 400 | 검증 규칙 위반 |
  | `MUPID_MUSIC_NOT_FOUND` | 404 | 음악 없음 또는 삭제됨 |