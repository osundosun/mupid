info:
  name: 아티스트 목록 조회
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/artist?q=&page=0&size=20"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.items[0].artist_id
        method: jsonq
      variable:
        name: ARTIST_ID
        scope: runtime
      description: 첫 번째 아티스트 번호를 ARTIST_ID 변수에 저장합니다.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 조회 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "items": [
                {
                  "artist_id": 1,
                  "name": "무피드 테스트 아티스트",
                  "image_url": "/api/v1/storage/image/13"
                }
              ],
              "page": 0,
              "size": 20,
              "total_elements": 1,
              "total_pages": 1
            }
          }

docs: |-
  # 아티스트 목록 조회

  `GET /api/v1/artist` · **액세스 토큰 필요**

  | 이름 | 기본값 | 설명 |
  | --- | --- | --- |
  | `q` | 없음 | 이름 부분 일치 (대소문자 무시) |
  | `page` | `0` | **0부터** 셉니다 |
  | `size` | `20` | 최대 100 |

  정렬은 **이름 오름차순**입니다. 삭제된 아티스트는 나오지 않습니다.

  `image_url` 은 바로 부를 수 있는 조회 경로입니다. 앨범·아티스트 이미지는
  공개라 `<img src>` 에 그대로 넣어도 됩니다.
