info:
  name: 앨범 삭제
  type: http
  seq: 17

http:
  method: DELETE
  url: "{{BASE_URL}}/api/v1/album/{{ALBUM_ID}}"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

runtime:
  variables:
    - name: ALBUM_ID
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 삭제 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "앨범이 삭제되었습니다.",
            "data": null
          }
  - name: 404 앨범 없음
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_ALBUM_NOT_FOUND",
            "message": "요청한 앨범을 찾을 수 없습니다.",
            "error_details": null
          }

docs: |-
  # 앨범 삭제

  `DELETE /api/v1/album/{albumId}` · `ROLE_SYSTEM` / `ROLE_ADMIN` 필요

  앨범을 소프트 삭제합니다. 삭제된 앨범에 속한 음악들은 그대로 남아
  있지만, 이후 `음악 수정` 으로 다른 앨범으로 이동시켜야 합니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
  | `MUPID_FORBIDDEN` | 403 | SYSTEM/ADMIN 이 아닌 토큰 |
  | `MUPID_ALBUM_NOT_FOUND` | 404 | 앨범 없음 또는 이미 삭제됨 |