info:
  name: 곡 목록 조회
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/music?q={{MUSIC_QUERY}}&vocal={{MUSIC_VOCAL}}&page=0&size=20"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

runtime:
  variables:
    - name: MUSIC_QUERY
      value: pre
    - name: MUSIC_VOCAL
      value: female
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.items[0].music_id
        method: jsonq
      variable:
        name: MUSIC_ID
        scope: runtime
      description: 첫 번째 곡 번호를 MUSIC_ID 변수에 저장합니다.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 조회 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "items": [
                {
                  "music_id": 2,
                  "title": "첫 번째 곡",
                  "release_date": "2026-09-14T00:00:00",
                  "duration_ms": 13020,
                  "playable": true,
                  "play_count": 0,
                  "like_count": 0,
                  "image_url": "/api/v1/storage/image/14",
                  "artist": {
                    "artist_id": 1,
                    "name": "무피드 테스트 아티스트",
                    "image_url": "/api/v1/storage/image/13"
                  },
                  "album": {
                    "album_id": 1,
                    "title": "무피드 테스트 앨범",
                    "image_url": "/api/v1/storage/image/12",
                    "release_date": "2026-09-14T00:00:00"
                  },
                  "genres": [],
                  "moods": []
                }
              ],
              "page": 0,
              "size": 20,
              "total_elements": 3,
              "total_pages": 1
            }
          }
  - name: 200 결과 없음
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "items": [],
              "page": 0,
              "size": 20,
              "total_elements": 0,
              "total_pages": 0
            }
          }
  - name: 400 모르는 보컬 값
    request:
      url: "{{BASE_URL}}/api/v1/music?vocal=banana"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{ACCESS_TOKEN}}
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
        - name: X-Mupid-Error
          value: MUPID_INVALID_REQUEST_BODY
      body:
        type: json
        data: |-
          {
            "code": "MUPID_INVALID_REQUEST_BODY",
            "message": "데이터가 잘못 입력되었습니다.",
            "error_details": null
          }
  - name: 200 제목순 정렬 (S15P21A204-396)
    request:
      url: "{{BASE_URL}}/api/v1/music?sort=title&page=0&size=20"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{ACCESS_TOKEN}}
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "items": [
                {
                  "music_id": 907,
                  "title": "1. Intermezzo No.1 / Modern Piano",
                  "release_date": "2026-01-01T00:00:00",
                  "duration_ms": null,
                  "playable": false,
                  "play_count": 0,
                  "like_count": 0,
                  "image_url": null,
                  "artist": {
                    "artist_id": 353,
                    "name": "AI 색인 시드",
                    "image_url": null
                  },
                  "album": {
                    "album_id": 353,
                    "title": "AI 색인 시드",
                    "image_url": null,
                    "release_date": "2026-01-01T00:00:00"
                  },
                  "genres": [],
                  "moods": []
                }
              ],
              "page": 0,
              "size": 20,
              "total_elements": 1085,
              "total_pages": 55
            }
          }
  - name: 400 q 와 sort 를 함께 보냄
    request:
      url: "{{BASE_URL}}/api/v1/music?q=love&sort=recent"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{ACCESS_TOKEN}}
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
        - name: X-Mupid-Error
          value: MUPID_INVALID_REQUEST_BODY
      body:
        type: json
        data: |-
          {
            "code": "MUPID_INVALID_REQUEST_BODY",
            "message": "데이터가 잘못 입력되었습니다.",
            "error_details": null
          }

docs: |-
  # 곡 목록 조회

  `GET /api/v1/music` · **액세스 토큰 필요**

  한때 공개였습니다 — 첫 방문자가 로그인 전에 곡을 둘러본다고 보았기
  때문입니다. 지금은 로그인하지 않으면 서비스를 쓸 수 없어(비로그인이 갈 수
  있는 화면은 `/`·`/login`·`/signup` 뿐) 열어 둘 이유가 없어졌고, 열어 두면
  곡 목록이 통째로 공개됩니다. 같은 경로의 `POST`(곡 추가)는 여전히
  SYSTEM/ADMIN 전용입니다.

  ## 쿼리 파라미터

  | 이름 | 기본값 | 설명 |
  | --- | --- | --- |
  | `q` | 없음 | 제목·아티스트명·앨범명 통합 검색 (대소문자 무시). 비우면 전체 |
  | `vocal` | 없음 | 보컬 필터. `female`·`male`·`mixed`·`instrumental` |
  | `mood` | 없음 | 분위기 `code_name`. 여러 개는 쉼표 또는 반복 |
  | `genre` | 없음 | 장르 `code_name`. 여러 개는 쉼표 또는 반복 |
  | `sort` | **`plays`(조회순)** | 정렬 기준. `plays`·`recent`·`likes`·`title`. **비우면 조회순**입니다. 빈 값을 주면 정렬하지 않습니다(등록순) |
  | `page` | `0` | **0부터** 셉니다 |
  | `size` | `20` | 최대 100. 넘겨도 100으로 잘립니다 |

  검색어가 있으면 곡 제목 → 아티스트명 → 앨범명 순으로 가중한 관련도순이고,
  검색어가 없으면 **기본 정렬인 조회순**(`play_count DESC`)입니다. 두 글자 이상은 ngram
  FULLTEXT 인덱스를, 한 글자는 B-Tree prefix 인덱스를 사용합니다.

  ## 정렬 (`sort`) — S15P21A204-396 (+ 후속)

  **기본 정렬은 '조회순' 입니다.** `sort` 를 보내지 않으면 `play_count` 내림차순
  (곡 번호 내림차순이 두 번째 키)으로 나옵니다. 값을 준 호출은 그 축을 그대로 탑니다.

  > **⚠️ 공개 계약이 바뀌었습니다.** 396 본편까지는 파라미터가 없으면 **등록순**
  > 이었습니다. 지금은 **조회순**이라, `sort` 를 보내지 않던 호출은 **전부 다른 순서**를
  > 받습니다. 프론트엔드는 `sort` 를 보내지 않으므로(확인: `frontend/lib/api/endpoints.ts`
  > 의 `music.search`) 홈·탐색·아티스트 곡 목록이 모두 영향을 받습니다.

  예전 순서(등록순)를 그대로 쓰고 싶으면 **`sort=` 를 빈 값으로** 보내세요.
  '고르지 않음' 이라는 뜻이라 정렬 절을 붙이지 않습니다.

  | 값 | 뜻 | 실제 순서 |
  | --- | --- | --- |
  | `plays` | 조회순 (**기본값**) | `play_count DESC` |
  | `recent` | 최신순 | `created_at DESC` |
  | `likes` | 좋아요순 | `like_count DESC` |
  | `title` | 제목순 | `title ASC` |
  | (빈 값) | 고르지 않음 | `ORDER BY` 없음 → 등록순 |

  대소문자는 가리지 않습니다(`recent`·`RECENT` 둘 다). 모든 정렬에 **곡 번호가
  두 번째 키로 붙습니다** — `created_at` 은 초 단위라 같은 초에 여러 곡이 들어오고
  `title` 도 중복이 있기 때문입니다. `play_count` 는 더합니다 — 한 번도 재생되지 않은
  곡이 대부분이라 **사실상 전부 동점**이고, 배치를 아직 안 돌린 환경에서는 전부 0 입니다.
  두 번째 키가 없으면 오프셋 페이지네이션(무한 스크롤)에서 곡이 중복되거나 사라집니다.

  > **함정**: 기본값이 '최신순' 이라고 적힌 문서를 믿지 마세요. `recent` 는
  > `created_at` **내림차순**이라, 예전 무정렬 기본(등록순 오름차순)과 **방향이
  > 반대**입니다.

  ### `sort` 는 검색어(`q`)와 함께 쓸 수 없습니다

  관련도순은 그 경로의 **결과 자체를 만드는** 규칙이라 정렬로 덮을 수 없습니다.
  `q` 와 `sort` 를 함께 보내면 조용히 무시되지 않고 **400** 입니다
  (`vocal=banana` 와 같은 판단 — 고른 기준이 무시된 것을 사용자가 알 수 있어야
  합니다). 검색 화면과 목록 화면은 정렬 기준을 각각 따로 씁니다.

  > **함정**: 여기서 걸리는 것은 **기준을 이름으로 준** 경우뿐입니다. `sort` 를 아예
  > 안 보낸 호출과 빈 값(`sort=`)은 400 이 아닙니다 — 전자는 기본 정렬을, 후자는
  > 예전 동작을 뜻할 뿐이고 관련도순과 충돌하지 않습니다.

  ### '조회순' 이 열리기까지 — 왜 그때는 없었고, 무엇이 바뀌었나

  **이 절은 원래 "'재생수순' 이 없는 이유" 였고, 축을 만들지 않는다고 적혀 있었습니다.**
  지금은 만듭니다. 판단이 뒤집힌 이유를 남겨 둡니다 — 안 남기면 다음 사람이 같은
  결론에 다시 도달하거나, 반대로 왜 조심해야 하는지를 모른 채 건드립니다.

  **그때(396 본편)의 판단은 옳았습니다.** `music.play_count` 컬럼은 ERD 에 처음부터
  있었지만 **그것을 올리는 코드가 저장소 어디에도 없었습니다.** 카탈로그가 전부 0 이라
  이 축으로 정렬하면 '조회순' 이라고 적어 놓고 실제로는 순서를 가르지 못합니다 —
  사용자에게는 고른 기준이 조용히 무시된 것처럼 보입니다. 그리고 재생수의 실제 원천은
  ClickHouse `listen_events` 라, 목록 조회가 그걸 함께 보면 **요청마다 도는 경로에 두
  번째 저장소가 붙습니다.** ClickHouse 가 죽을 때 곡 목록까지 함께 죽는 경로는
  `knowledge/architecture/analytics-clickhouse.md` 에 이미 문서화돼 있습니다.

  **2026-09-20 에 전제가 없어졌습니다.** `PlayCountBatch` 가 매일 ClickHouse 의 곡별
  `PLAY_START` 집계를 `music.play_count` 로 옮깁니다. 값이 카탈로그에 흩어지므로 축이
  성립하고, **정렬은 여전히 MySQL 목록 조회 안에서만 끝납니다** — 원천을 미리 옮겨 두는
  방식이라 "조회 경로에 두 번째 저장소가 붙지 않는다" 는 원래 성질이 그대로입니다.

  **그래서 남은 함정이 하나 있습니다.** 새 환경처럼 배치가 아직 한 번도 돌지 않아
  `play_count` 가 다시 0 뿐이면, 조회순은 **두 번째 키(곡 번호)가 순서를 정합니다.**
  결과는 결정적이지만 재생수와 무관합니다. 그리고 배치가 값을 채운 **뒤에는 목록 순서가
  또 한 번 바뀝니다** — 이건 정상이고, 배치를 돌리지 않은 환경에서는 어차피 그렇습니다.

  > **함정**: `likes` 도 같은 성질을 갖습니다 — 개발 DB 의 `like_count` 가 전 곡 0 이라
  > 두 번째 키가 순서를 정합니다. 좋아요가 쌓이면 그대로 살아납니다.

  ## 보컬 필터 (`vocal`)

  '탐색' 화면의 **보컬** 탭에서 고른 값입니다. 네 값은 `music_analysis` 의
  두 컬럼에 이렇게 대응합니다.

  | 값 | 뜻 | 실제 조건 |
  | --- | --- | --- |
  | `female` | 여성 보컬 | `has_vocal = true AND vocal_gender = 'F'` |
  | `male` | 남성 보컬 | `has_vocal = true AND vocal_gender = 'M'` |
  | `mixed` | 혼성 보컬 | `has_vocal = true AND vocal_gender = 'MIX'` |
  | `instrumental` | 인스트루멘탈 | `has_vocal = false` |

  화면에서는 네 값 중 하나만 선택할 수 있습니다.

  ### 인스트루멘탈에 성별 값이 없는 이유

  `vocal_gender` 는 `M`·`F`·`MIX` 뿐이고 **'보컬 없음' 을 나타내는 값이 없습니다.**
  보컬 유무는 성별이 아니라 `has_vocal` 이 들고 있으므로, 인스트루멘탈은 그 컬럼으로
  표현합니다. `vocal_gender` 에 값을 늘리면 이미 저장된 값과 어긋나므로 하지 않습니다.

  ### 필터가 없으면 예전과 완전히 같습니다

  `vocal` 을 보내지 않거나 빈 값(`vocal=`)이면 **필터를 걸지 않은 것**으로 보아
  이전과 같은 결과가 나옵니다. 분석 행(`music_analysis`)이 없는 곡도 그대로
  나옵니다 — 필터가 걸릴 때만 분석 정보를 봅니다.

  > **함정**: 필터를 아예 모르는 값(`vocal=banana`)으로 보내면 조용히 무시되지 않고
  > **400** 입니다. 무시하면 '고르지 않음' 이 되어 사용자가 고른 것과 다른 결과를
  > 보게 되기 때문입니다.

  ## 응답 필드

  | 필드 | 설명 |
  | --- | --- |
  | `duration_ms` | 재생 길이. **완료된 스트림이 없으면 `null`** |
  | `playable` | 재생 가능한(`DONE`) 스트림이 있는가 |
  | `artist.image_url` `album.image_url` | 바로 부를 수 있는 조회 경로. 파일이 없으면 `null` |
  | `image_url` | 곡 커버 조회 경로. 곡에 표지가 없으면 `null` 이고, 그때는 앨범 커버를 쓴다 |
  | `genres` `moods` | 아직 데이터가 없어 대부분 빈 배열입니다 |

  ### 곡 길이는 스트림에서 온다

  `music` 테이블에 길이 컬럼이 없어 완료된 스트림에서 끌어옵니다. 같은 곡에
  여러 스트림이 있으면 **비트레이트가 가장 높은 것**이 기준입니다.

  ## 페이지네이션 규약

  이 프로젝트의 첫 목록 API 입니다. 이후 목록 API 도 같은 모양을 씁니다 —
  `{ items, page, size, total_elements, total_pages }`, `page` 는 0부터.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_INVALID_REQUEST_BODY` | 400 | `page`·`size` 가 숫자가 아님 |
  | `MUPID_INVALID_REQUEST_BODY` | 400 | `vocal` 이 `female`·`male`·`mixed`·`instrumental` 중 어느 것도 아님 |
  | `MUPID_INVALID_REQUEST_BODY` | 400 | `sort` 가 `plays`·`recent`·`likes`·`title` 중 어느 것도 아님 |
  | `MUPID_INVALID_REQUEST_BODY` | 400 | `q` 와 `sort` 를 함께 보냄 (관련도순과 정렬은 같이 못 씀) |
