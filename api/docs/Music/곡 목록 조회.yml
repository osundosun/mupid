info:
  name: 곡 목록 조회
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/music?q={{MUSIC_QUERY}}&page=0&size=20"
  auth: inherit

runtime:
  variables:
    - name: MUSIC_QUERY
      value: ""
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.items[0].music_id
        method: jsonq
      variable:
        name: MUSIC_ID
        scope: runtime
      description: 첫 번째 곡 번호를 MUSIC_ID 변수에 저장합니다.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 조회 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "items": [
                {
                  "music_id": 2,
                  "title": "첫 번째 곡",
                  "release_date": "2026-09-14T00:00:00",
                  "duration_ms": 13020,
                  "playable": true,
                  "play_count": 0,
                  "like_count": 0,
                  "artist": {
                    "artist_id": 1,
                    "name": "무피드 테스트 아티스트",
                    "image_url": "/api/v1/storage/image/ARTIST/..."
                  },
                  "album": {
                    "album_id": 1,
                    "title": "무피드 테스트 앨범",
                    "image_url": "/api/v1/storage/image/ALBUM/...",
                    "release_date": "2026-09-14T00:00:00"
                  },
                  "genres": [],
                  "moods": []
                }
              ],
              "page": 0,
              "size": 20,
              "total_elements": 3,
              "total_pages": 1
            }
          }
  - name: 200 결과 없음
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "items": [],
              "page": 0,
              "size": 20,
              "total_elements": 0,
              "total_pages": 0
            }
          }

docs: |-
  # 곡 목록 조회

  `GET /api/v1/music` · **액세스 토큰 필요**

  한때 공개였습니다 — 첫 방문자가 로그인 전에 곡을 둘러본다고 보았기
  때문입니다. 지금은 로그인하지 않으면 서비스를 쓸 수 없어(비로그인이 갈 수
  있는 화면은 `/`·`/login`·`/signup` 뿐) 열어 둘 이유가 없어졌고, 열어 두면
  곡 목록이 통째로 공개됩니다. 같은 경로의 `POST`(곡 추가)는 여전히
  SYSTEM/ADMIN 전용입니다.

  ## 쿼리 파라미터

  | 이름 | 기본값 | 설명 |
  | --- | --- | --- |
  | `q` | 없음 | 제목·아티스트명·앨범명 부분 일치 (대소문자 무시). 비우면 전체 |
  | `page` | `0` | **0부터** 셉니다 |
  | `size` | `20` | 최대 100. 넘겨도 100으로 잘립니다 |

  정렬은 `music_id` 내림차순(최신 등록 순)입니다.

  ## 응답 필드

  | 필드 | 설명 |
  | --- | --- |
  | `duration_ms` | 재생 길이. **완료된 스트림이 없으면 `null`** |
  | `playable` | 재생 가능한(`DONE`) 스트림이 있는가 |
  | `artist.image_url` `album.image_url` | 바로 부를 수 있는 조회 경로. 파일이 없으면 `null` |
  | `genres` `moods` | 아직 데이터가 없어 대부분 빈 배열입니다 |

  ### 곡 길이는 스트림에서 온다

  `music` 테이블에 길이 컬럼이 없어 완료된 스트림에서 끌어옵니다. 같은 곡에
  여러 스트림이 있으면 **비트레이트가 가장 높은 것**이 기준입니다.

  ## 페이지네이션 규약

  이 프로젝트의 첫 목록 API 입니다. 이후 목록 API 도 같은 모양을 씁니다 —
  `{ items, page, size, total_elements, total_pages }`, `page` 는 0부터.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_INVALID_REQUEST_BODY` | 400 | `page`·`size` 가 숫자가 아님 |
