info:
  name: 비밀번호 재설정 코드 제출
  type: http
  seq: 8

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/user/reset"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    content: |
      {
        "verificationId": 1,
        "token": "이메일로 받은 인증 코드",
        "password": "newpassword123!"
      }

docs:
  description: |
    인증 코드 검증 후 즉시 새 비밀번호로 변경합니다.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5