info:
  name: 회원탈퇴
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{BASE_URL}}/api/v1/user"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 탈퇴 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "회원탈퇴 처리 되었습니다.",
            "data": null
          }

docs: |-
  # 회원탈퇴

  `DELETE /api/v1/user` · 인증 필요

  액세스 토큰의 사용자를 삭제합니다. 요청 본문은 없습니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
  | `MUPID_USER_NOT_FOUND` | 404 | 사용자 없음 또는 이미 탈퇴 |
