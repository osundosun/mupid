info:
  name: 프로필 사진 수정
  type: http
  seq: 5

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/user/image"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - C:\Users\SSAFY\Downloads\jaclou-dl-cat-8451431_640.jpg
        contentType: image/jpeg
        description: 업로드할 프로필 이미지 파일
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 수정 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "사용자 프로필 사진이 수정되었습니다.",
            "error_details": null
          }
  - name: 400 이미지 형식 오류
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_INVALID_USER_IMAGE_FILE_FORMAT",
            "message": "프로필 사진 포맷이 사진 형식이 아니거나 올바르지 않습니다.",
            "error_details": null
          }

docs: |-
  # 프로필 사진 수정

  `POST /api/v1/user/image` · 인증 필요 · `multipart/form-data`

  ## 사용법

  Body 탭이 **Multipart Form** 으로 열립니다. `file` 항목의 값이 비어 있으니
  파일 선택 버튼으로 이미지를 지정한 뒤 전송하세요.

  `Content-Type` 헤더는 직접 넣지 마세요. Bruno 가 boundary 를 포함해 자동으로
  붙입니다.

  ## 폼 필드

  | 필드 | 타입 | 필수 | 설명 |
  | --- | --- | --- | --- |
  | `file` | file | ✅ | 프로필 이미지 (`@RequestParam("file") MultipartFile`) |

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_INVALID_USER_IMAGE_FILE_FORMAT` | 400 | 이미지가 아니거나 포맷이 잘못됨 |
  | `MUPID_USER_IMAGE_FILE_SIZE_EXCEEDED` | 413 | 용량 초과 |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
