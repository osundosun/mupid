info:
  name: 회원가입
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/user"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    content: |
      {
        "email": "user@example.com",
        "emailVerificationId": 1,
        "password": "example123!",
        "nickname": "mupid",
        "birthYear": 2000,
        "gender": "M"
      }

docs:
  description: |
    비밀번호는 영문/숫자/특수문자 중 2가지 이상 조합, 8~20자.
    닉네임은 2~10자, 출생 연도는 1900 이상.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5