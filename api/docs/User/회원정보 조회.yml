info:
  name: 회원정보 조회
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/user"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 조회 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "user_id": 1,
              "email": "user@example.com",
              "nickname": "mupid",
              "image_url": "/api/v1/user/image/1",
              "birth_year": 2000,
              "gender": "M",
              "role": "ROLE_USER",
              "status": "PENDING"
            }
          }
  - name: 401 토큰 없음/만료
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json;charset=UTF-8
      body:
        type: json
        data: |-
          {
            "code": "MUPID_UNAUTHORIZED",
            "message": "인증 정보가 유효하지 않거나 존재하지 않습니다.",
            "errorDetails": null
          }

docs: |-
  # 회원정보 조회

  `GET /api/v1/user` · 인증 필요

  액세스 토큰의 사용자 본인 정보를 조회합니다. 요청 본문과 경로 변수는 없습니다.

  ## 응답 필드

  | 필드 | 타입 | 설명 |
  | --- | --- | --- |
  | `data.user_id` | int | 유저 번호 |
  | `data.email` | string | 이메일 (변경 불가) |
  | `data.nickname` | string | 닉네임 |
  | `data.image_url` | string | 프로필 사진 경로. 항상 `/api/v1/user/image/{user_id}` 형태로 만들어 반환하며, 사진 등록 여부와 무관합니다 |
  | `data.birth_year` | int | 출생 연도 |
  | `data.gender` | string | `M` / `F` / `ETC` |
  | `data.role` | string | `ROLE_USER` / `ROLE_SYSTEM` / `ROLE_ADMIN` |
  | `data.status` | string | `PENDING` / `ACTIVE` / `WITHDRAW` |

  `image_url` 은 실제 파일 존재 여부를 확인하지 않고 조합만 하므로,
  사진을 등록하지 않은 사용자도 값이 채워집니다. 그 경로로 조회하면
  `MUPID_FILE_NOT_FOUND` 가 반환됩니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
