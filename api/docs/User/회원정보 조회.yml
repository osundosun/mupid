info:
  name: 회원정보 조회
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/user"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 조회 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "user_id": 1,
              "email": "user@example.com",
              "nickname": "mupid",
              "image_url": "/api/v1/storage/image/12",
              "birth_year": 2000,
              "gender": "M",
              "role": "ROLE_USER",
              "status": "ACTIVE",
              "onboarding_submitted": true
            }
          }
  - name: 401 토큰 없음/만료
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json;charset=UTF-8
      body:
        type: json
        data: |-
          {
            "code": "MUPID_UNAUTHORIZED",
            "message": "인증 정보가 유효하지 않거나 존재하지 않습니다.",
            "errorDetails": null
          }

docs: |-
  # 회원정보 조회

  `GET /api/v1/user` · 인증 필요

  액세스 토큰의 사용자 본인 정보를 조회합니다. 요청 본문과 경로 변수는 없습니다.

  ## 응답 필드

  | 필드 | 타입 | 설명 |
  | --- | --- | --- |
  | `data.user_id` | int | 유저 번호 |
  | `data.email` | string | 이메일 (변경 불가) |
  | `data.nickname` | string | 닉네임 |
  | `data.image_url` | string | 프로필 사진 조회 경로. 올린 사진은 파일 번호 주소(`/api/v1/storage/image/{fileId}`), 사진이 없으면 기본 프로필 주소(`/api/v1/storage/image/PROFILE/default`) 입니다. **`null` 이 아닙니다** — 화면은 그 주소를 그대로 부르면 됩니다 |
  | `data.birth_year` | int | 출생 연도 |
  | `data.gender` | string | `M` / `F` / `ETC` |
  | `data.role` | string | `ROLE_USER` / `ROLE_SYSTEM` / `ROLE_ADMIN` |
  | `data.status` | string | `PENDING` / `ACTIVE` / `WITHDRAW` (아래) |
  | `data.onboarding_submitted` | boolean | 온보딩 설문을 마쳤는가 |

  `image_url` 은 `UserImageService.getProfileImageUrl` 이 조합한 값입니다.
  저장된 프로필 사진이 없는 사용자는 `null` 을 받습니다.

  ## status

  | 값 | 뜻 |
  | --- | --- |
  | `PENDING` | 가입은 했고 온보딩 설문을 아직 마치지 않음 |
  | `ACTIVE` | 온보딩을 마쳤거나 애초에 대상이 아님(관리자·`ROLE_SYSTEM`) |
  | `WITHDRAW` | 탈퇴 |

  `PENDING` 을 벗는 길은 `POST /api/v1/onboarding` 하나뿐입니다. 탈퇴한 계정은
  이 API 로 조회되지 않으므로 `WITHDRAW` 를 받을 일은 없습니다.

  온보딩 여부만 보려면 아래 `onboarding_submitted` 를 쓰는 편이 낫습니다 —
  설문 테이블을 직접 보는 값이라 상태가 어긋난 계정에서도 정확합니다.

  ## onboarding_submitted

  거짓이면 화면이 온보딩 설문으로 보냅니다. 화면 진입 분기에 필요한 것이
  **불리언 하나**라 여기에 실었습니다 — 제출한 내용을 본인이 되돌려 받는 API 는
  없앴습니다. 내용을 읽는 것은 추천 서버뿐이고 `ROLE_SYSTEM` 전용
  `GET /api/v1/user/{userId}/onboarding` 을 씁니다.

  설문은 계정당 한 번이라 이 값은 한 번 참이 되면 거짓으로 돌아가지 않습니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
