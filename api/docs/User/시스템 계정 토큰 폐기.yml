info:
  name: 시스템 계정 토큰 폐기
  type: http
  seq: 11

http:
  method: DELETE
  url: "{{BASE_URL}}/api/v1/user/system/{{SYSTEM_USER_ID}}/token"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 폐기
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "시스템 계정의 토큰을 모두 폐기했습니다.",
            "data": null
          }

docs: |-
  # 시스템 계정 토큰 폐기

  `DELETE /api/v1/user/system/{userId}/token` · **`ROLE_ADMIN` 전용** (S15P21A204-454)

  `ROLE_SYSTEM` 계정의 **토큰을 모두** 무효로 합니다 — 일괄 로그아웃. 회전하지 않는 180일짜리
  토큰이 새었을 때 끊는 길입니다. 관리자는 새어 나간 토큰의 문자열을 모르므로 토큰 하나를 막는
  `Auth / 로그아웃` 으로는 끊을 수 없습니다.

  - 이 시각 **이전(같은 초 포함)** 에 발급된 그 계정의 리프레시 토큰으로 재발급하면 **401**
  - 이미 받아 둔 그 계정의 액세스 토큰도 **401** (1시간 안에 남은 것까지)
  - 다른 시스템 계정·사람 계정은 그대로
  - 폐기 뒤 1초 이상 지나 `시스템 계정 토큰 발급` 으로 받은 토큰은 통합니다

  서버는 사용자별로 "이 시각 이전 발급분은 무효" 라는 경계 하나를 Redis 에 적습니다
  (`auth:revoked-before:{userId}`, 180일 + 1일 동안). 운영 Redis 는 AOF 라 재시작으로 폐기가
  풀리지 않습니다. 다시 부르면 경계가 지금으로 옮겨집니다.

  ## 토큰 교체 순서

  1. 이 요청으로 폐기한다
  2. 1초 뒤 `시스템 계정 토큰 발급` 으로 새 토큰을 받는다
  3. 쓰는 곳(CI 변수 `MUPID_SYSTEM_CI_REFRESH_TOKEN`, JupyterHub `refresh_token.txt`)에 넣는다

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_FORBIDDEN` | 403 | 관리자 토큰이 아님 |
  | `MUPID_USER_NOT_FOUND` | 404 | 없거나 탈퇴한 계정 |
  | `MUPID_NOT_SYSTEM_USER` | 400 | `ROLE_SYSTEM` 이 아닌 계정 — 사람 계정은 대상이 아니다 |
