info:
  name: 시스템 계정 토큰 발급
  type: http
  seq: 10

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/user/system/{{SYSTEM_USER_ID}}/token"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "refresh_token_validity_days": 180
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.refresh_token
        method: jsonq
      variable:
        name: SYSTEM_REFRESH_TOKEN
        scope: runtime
      description: 새 리프레시 토큰을 SYSTEM_REFRESH_TOKEN 변수에 저장합니다.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 발급
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "리프레시 토큰이 발급되었습니다. 다시 확인할 수 없습니다.",
            "data": {
              "user_id": 12,
              "email": "system-ci@mupid.local",
              "refresh_token": "eyJhbGciOiJIUzI1NiJ9…",
              "refresh_token_expires_at": "2027-03-24T11:02:15.123Z"
            }
          }
  - name: 400 사람 계정
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_NOT_SYSTEM_USER",
            "message": "시스템 계정이 아닙니다.",
            "error_details": null
          }

docs: |-
  # 시스템 계정 토큰 발급

  `POST /api/v1/user/system/{userId}/token` · **`ROLE_ADMIN` 전용** (S15P21A204-454)

  `ROLE_SYSTEM` 계정의 리프레시 토큰을 새로 발급합니다. ROLE_SYSTEM 토큰은 **회전하지 않아**
  만료가 밀리지 않으므로, 만료 전에 여기서 새 토큰을 받아 쓰는 곳(CI 변수·JupyterHub 토큰
  파일)에 갈아 끼웁니다. 비밀번호로 `Auth / 로그인` 해도 되지만 비밀번호는 금고에서 꺼내지 않는
  편이 낫습니다.

  ## 요청 본문 (선택)

  | 필드 | 타입 | 필수 | 설명 |
  | --- | --- | --- | --- |
  | `refresh_token_validity_days` | int | | 만료(일). 1 ~ 180, 비우면 7일 |

  ## 응답

  | 필드 | 설명 |
  | --- | --- |
  | `data.refresh_token` | 새 리프레시 토큰. **이 응답에서만** 평문으로 나온다 |
  | `data.refresh_token_expires_at` | 만료 시각 (UTC) |

  **옛 토큰은 그대로 살아 있습니다.** 끊으려면 `시스템 계정 토큰 폐기` 를 **먼저** 부르고 그 뒤에
  발급받습니다 — 폐기는 "그 시각 이전(같은 초 포함)에 발급된 것 전부" 를 막으므로, 발급 뒤에
  부르면 새 토큰도 막힙니다.

  `SYSTEM_USER_ID` 는 `시스템 계정 생성` 응답의 `user_id` 입니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_FORBIDDEN` | 403 | 관리자 토큰이 아님 |
  | `MUPID_USER_NOT_FOUND` | 404 | 없거나 탈퇴한 계정 |
  | `MUPID_NOT_SYSTEM_USER` | 400 | `ROLE_SYSTEM` 이 아닌 계정 |
  | `MUPID_INVALID_REQUEST_BODY` | 400 | 만료가 1 ~ 180일 밖 |
