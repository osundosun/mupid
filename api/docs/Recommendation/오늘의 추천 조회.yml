info:
  name: 오늘의 추천 조회
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/recommendation/daily"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 추천 있음
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "date": "2026-09-12",
              "groups": [
                {
                  "recommendation_id": 1,
                  "title": "오늘의 잔잔한 믹스",
                  "reason": "요즘 자주 들은 분위기",
                  "mood": "잔잔한",
                  "music_count": 2,
                  "tracks": [
                    {
                      "rank": 1,
                      "reason": "비슷한 신스 전개",
                      "music": {
                        "music_id": 2,
                        "title": "첫 번째 곡",
                        "release_date": "2026-09-14T00:00:00",
                        "duration_ms": 13020,
                        "playable": true,
                        "play_count": 0,
                        "like_count": 0,
                        "image_url": "/api/v1/storage/image/TRACK/...",
                        "artist": { "artist_id": 1, "name": "무피드 테스트 아티스트", "image_url": "/api/v1/storage/image/ARTIST/..." },
                        "album": { "album_id": 1, "title": "무피드 테스트 앨범", "image_url": "/api/v1/storage/image/ALBUM/...", "release_date": "2026-09-14T00:00:00" },
                        "genres": [],
                        "moods": []
                      }
                    }
                  ]
                }
              ]
            }
          }
  - name: 200 아직 추천 없음
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "date": "2026-09-14",
              "groups": []
            }
          }

docs: |-
  # 오늘의 추천 조회

  `GET /api/v1/recommendation/daily` · **인증 필요**

  | 이름 | 기본값 | 설명 |
  | --- | --- | --- |
  | `date` | 오늘 | 기준일 `YYYY-MM-DD` |

  숫자·형식이 맞지 않으면 400 입니다.

  ## 응답의 `date` 를 보세요

  요청한 날짜에 추천이 없으면 **가장 최근 추천이 있는 날**을 돌려줍니다.
  그래서 `date` 는 요청한 값과 다를 수 있습니다. 아예 추천이 하나도 없으면
  요청한 날짜를 그대로 돌려주고 `groups` 는 빈 배열입니다.

  ## 아직 비어 있습니다

  추천 파이프라인이 없어 `daily_recommendations` 가 비어 있습니다. 계약은
  정해져 있으니 화면은 미리 붙여도 됩니다.
