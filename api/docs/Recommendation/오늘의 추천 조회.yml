docs: |-
  # 오늘의 추천 조회

  `GET /api/v1/recommendation/daily` · **인증 필요**

  | 이름 | 기본값 | 설명 |
  | --- | --- | --- |
  | `date` | 오늘 | 기준일 `YYYY-MM-DD` |

  숫자·형식이 맞지 않으면 400 입니다.

  ## 응답의 `date` 를 보세요

  요청한 날짜에 추천이 없으면 **가장 최근 추천이 있는 날**을 돌려줍니다.
  그래서 `date` 는 요청한 값과 다를 수 있습니다.

  ## 저장된 추천이 하나도 없으면 그 자리에서 골라 줍니다

  방금 가입해 배치를 한 번도 타지 않은 사용자에게는 되돌아갈 날짜가 없습니다.
  예전에는 그대로 빈 배열이 나가 홈이 비었습니다. 지금은 **온보딩에서 고른
  장르·분위기에 해당하는 곡 중 조회수 상위 4곡**을 그 자리에서 골라 내려줍니다.
  요청한 날짜를 그대로 돌려줍니다.

  구분하는 방법은 둘입니다.

  | | 배치가 만든 것 | 폴백 |
  | --- | --- | --- |
  | `recommendation_id` | 1 이상 (저장된 묶음 번호) | **0** (저장하지 않음) |
  | `title` | `오늘의 모먼트` | `첫 모먼트` |

  `reason` 은 취향으로 좁혔으면 "처음 고른 취향에 맞는 곡들이에요.",
  카탈로그 인기순으로 넓혔으면 "많이 듣는 곡부터 골랐어요." 입니다.

  넓히는 순서는 (1) 장르 ∧ 분위기 → (2) 장르 ∨ 분위기 → (3) 카탈로그 전체
  조회수 상위입니다. **한 곡이라도 나오면 거기서 멈춥니다** — 네 곡이 안 되어도
  모자란 대로 내려갑니다. 온보딩을 아직 하지 않았으면 바로 (3) 입니다.

  `mood` 는 정하지 못하면 빈 문자열입니다.

  ## `groups` 가 비는 경우

  카탈로그에 살아 있는 곡이 하나도 없을 때뿐입니다. 이때도 **404 가 아닙니다.**
