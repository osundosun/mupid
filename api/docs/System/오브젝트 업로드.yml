info:
  name: 오브젝트 업로드
  type: http
  seq: 2

http:
  method: PUT
  url: "{{BASE_URL}}/upload/system/{{SYSTEM_OBJECT_ID}}"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
    - name: Content-Type
      value: application/octet-stream
  body:
    type: file
    data:
      - filePath: []
        contentType: application/octet-stream
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 업로드 성공 (스토리지 응답)
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "user_encoder.npz",
            "size": 12582912
          }
  - name: 500 스프링이 거절 (사유는 헤더)
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: X-Mupid-Error
          value: MUPID_OBJECT_ALREADY_COMPLETED
      body:
        type: text
        data: (nginx 기본 500 페이지 — 본문은 사라진다)

docs: |-
  # 오브젝트 업로드

  `PUT /upload/system/{objectId}` · `ROLE_SYSTEM` / `ROLE_ADMIN` 필요

  배치용 Object Storage API **② 단계**. `/api/` 아래가 아닙니다 — `Stream / 청크 업로드`
  와 같은 길입니다.

  ```
  PUT /upload/system/16
    │
    ├─ (1) auth_request → GET /api/v1/system/objects/16/upload-auth   ← 본문 없음
    │       스프링: 권한·상태·Content-Length(= 신고한 크기) 검사
    │       응답: 200 + X-Storage-Path: /buckets/mupid/system/model/stage1/v3/user_encoder.npz
    │
    └─ (2) nginx → Filer 로 본문 스트리밍 (JVM 을 거치지 않음, Authorization 은 지운다)
  ```

  성공하면 SeaweedFS 의 응답(`201`, `{"name":…,"size":…}`)이 그대로 옵니다. 업로드만으로는
  완료가 아닙니다 — `오브젝트 완료` 를 불러야 서버가 sha256 을 확인합니다.

  **`PUT` 만 받습니다.** 같은 주소로 다른 방식은 nginx 가 403 으로 끊습니다
  (받기는 `오브젝트 받기` 로만).

  ## 오류 — `X-Mupid-Error` 헤더로 판단

  | X-Mupid-Error | 원래 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_SYSTEM_OBJECT_NOT_FOUND` | 404 | 그런 오브젝트가 없음 |
  | `MUPID_OBJECT_ALREADY_COMPLETED` | 409 | 완료된 오브젝트는 덮어쓸 수 없음 |
  | `MUPID_UPLOAD_LENGTH_REQUIRED` | 411 | `Content-Length` 없음 (chunked 전송은 받지 않는다) |
  | `MUPID_UPLOAD_SIZE_MISMATCH` | 409 | `Content-Length` 가 ① 에서 신고한 크기와 다름 |
  | `MUPID_OBJECT_FILE_SIZE_EXCEEDED` | 413 | 512 MB 초과 |

  헤더가 없는 401/403 은 인증·권한 문제입니다.
