  content: |-
    # System

    배치용 Object Storage API — **모델 가중치 파일**과 `model_versions`
    (S15P21A204-453, 저장소 재설계 `infra/VECTOR-STORE-DESIGN.md` §6.3·§6.5).
    전부 `@SystemRole` (`ROLE_SYSTEM` / `ROLE_ADMIN`) 입니다.

    | 엔드포인트 | 동작 | 누가 |
    | --- | --- | --- |
    | `POST /api/v1/system/objects` | ① 업로드 요청 — 자리 잡기 | CI (`system-ci`) |
    | `PUT /upload/system/{objectId}` | ② 업로드 (**Filer 직행**, nginx) | CI |
    | `POST /api/v1/system/objects/{objectId}/complete` | ③ 완료 — sha256 확인 | CI |
    | `GET /api/v1/system/objects/{objectId}` | 받기 (`X-Accel-Redirect`) | CI · 분석 배치 |
    | `GET /api/v1/system/models/{name}/{version}/files/{fileName}` | 받기 — 이름·버전·파일명으로 | CI · 분석 배치 |
    | `GET /api/v1/system/models/{name}` | 버전 목록·상태·파일, 지금 쓰는 버전 | 누구든 (SYSTEM/ADMIN) |
    | `POST /api/v1/system/models/{name}/{version}/adopt` | 채택 — 배포 성공 뒤 | CI |
    | `POST /api/v1/system/models/{name}/{version}/retire` | 폐기 — 운영 절차 | 사람 (ADMIN 또는 SYSTEM) |

    **ai_server 는 이 API 를 부르지 않습니다.** 서빙 가중치는 CI 가 받아 이미지에
    굽습니다(§6.3 ④-e). 올리는 쪽은 CI 뿐입니다(§6.3 ④-d).

    ## 올리는 순서 — 음악 청크와 같은 길

    [decision/0016](../../knowledge/decision/0016-audio-upload-three-step.md) 의 3단계를
    그대로 따릅니다. **바이트는 스프링 요청 본문으로 들어오지 않습니다.**

    1. `① 업로드 요청` — 파일마다. 신고한 크기·sha256 과 **버전의 파일 목록**
       (`version_files` = `models.lock` 의 `files` 키)을 싣는다 → `object_id`
       - 응답 `status` 가 이미 `COMPLETED` 면 같은 파일이 전에 올라가 확인까지 끝났다.
         ②·③ 을 건너뛴다(멱등)
    2. `② 업로드` — `PUT /upload/system/{objectId}` 에 파일 바이트 그대로.
       nginx 가 스프링에 허가만 묻고 Filer 로 흘린다
    3. `③ 완료` — 스프링이 Filer 에서 **흘려 읽어** sha256 을 잰다. 맞으면 `COMPLETED`
    4. 버전의 파일이 **모두** `COMPLETED` 가 되면 버전이 `CANDIDATE` 가 된다
       (③ 응답의 `model_status`)

    ## 버전 상태

    ```
    UPLOADING ──(선언한 파일이 모두 완료)──▶ CANDIDATE ──(adopt, CI)──▶ ADOPTED
                                                │                         │
                                                └───────(retire, 사람)─────┴──▶ RETIRED
    ```

    - **지금 쓰는 버전** = `ADOPTED` 중 가장 늦게 채택된 것 (`current_version`).
      채택해도 이전 채택 버전은 그대로 `ADOPTED` 로 남습니다 — 폐기는 사람이 합니다.
    - 이미 `ADOPTED` 인 버전을 다시 채택하면 채택 시각만 새로 찍힙니다 (`models.lock`
      을 되돌린 배포).
    - `RETIRED` 는 다시 채택할 수 없습니다(Qdrant 의 그 버전 벡터가 지워진 뒤라서).
      파일은 되돌리기를 위해 남고 **받기는 계속 됩니다.**
    - 지금 쓰는 버전은 폐기할 수 없습니다 (`MUPID_MODEL_VERSION_IN_SERVICE`).

    ## 불변

    - **같은 이름·버전·파일명으로 다른 sha256(또는 크기)은 거절합니다**
      (`MUPID_OBJECT_IMMUTABLE`, 409). 완료 전이어도 같습니다.
    - 버전의 파일 목록은 **첫 요청이 정합니다.** 뒤에 다른 목록을 실으면
      `MUPID_MODEL_VERSION_FILES_MISMATCH` (409). 순서는 상관없습니다.
    - 완료된 오브젝트에는 ② 가 거절됩니다(`MUPID_OBJECT_ALREADY_COMPLETED`) — Filer 는
      같은 경로 PUT 을 그냥 덮어쓰므로 스프링이 막습니다.

    ## 규칙

    | 항목 | 규칙 |
    | --- | --- |
    | `kind` | `MODEL` 만 |
    | `name` | `^[a-z0-9][a-z0-9_-]{0,31}$` (예: `stage1`) |
    | `version` | `^v[0-9]{1,6}$` (예: `v3`) |
    | `file_name` | `^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$`, 확장자 `npz`·`npy`·`json`·`onnx` (`.pt` 는 싣지 않는다) |
    | `version_files` | 32개까지, `manifest.json` 이 반드시 있어야 한다 |
    | 크기 | 파일 하나 512 MB 까지. nginx `client_max_body_size 600m` 은 최후의 방어선 |
    | 저장 키 | `system/model/{name}/{version}/{file_name}` |

    ## 업로드 오류는 헤더로 옵니다

    ② 는 nginx `auth_request` 라 401·403 밖의 거절은 **500** 으로 접히고 본문이
    사라집니다. 사유는 `X-Mupid-Error` 응답 헤더에 있습니다 (`Stream / 청크 업로드` 와 같다).

    ## 계정

    ROLE_SYSTEM 계정은 **쓰는 곳마다 따로** 둡니다 (설계 원칙 6). ROLE_SYSTEM 의 리프레시
    토큰은 **회전하지 않고** 만료를 180일까지 지정할 수 있으며, 관리자가 계정 단위로 일괄
    폐기합니다(S15P21A204-454). 폐기가 계정 단위라 한 곳의 토큰이 새면 그곳만 끊도록 나눕니다.
    만드는 방법은 `User / 시스템 계정 생성`, 갈아 끼우기는 `시스템 계정 토큰 발급`·`폐기` 를 보세요.

    | 계정 이메일 | 쓰는 곳 | 이 폴더에서 하는 일 |
    | --- | --- | --- |
    | `system-preprocessing@…` | music_preprocessing (JupyterHub) | 분석용 가중치 받기 |
    | `system-ci@…` | GitLab CI | 올리기(①②③), 서빙 가중치 받기, 채택 |
