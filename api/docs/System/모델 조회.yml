info:
  name: 모델 조회
  type: http
  seq: 6

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/system/models/{{MODEL_NAME}}"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

runtime:
  variables:
    - name: MODEL_NAME
      value: stage1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 버전 목록
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
