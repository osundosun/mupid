docs: |-
  # 모델 조회

  `GET /api/v1/system/models/{name}` · `ROLE_SYSTEM` / `ROLE_ADMIN` 필요

  모델 하나의 버전 목록(최근에 만든 것부터)·상태·파일과 **지금 쓰는 버전**을 줍니다.

  - `current_version` — `ADOPTED` 중 **가장 늦게 채택된** 버전. 없으면 null.
    채택해도 이전 채택 버전은 `ADOPTED` 로 남으므로 여럿일 수 있습니다.
  - `declared_file_count` — 첫 요청의 `version_files` 개수. `files` 에는 **요청된** 파일만
    나옵니다 — 둘이 다르면 아직 요청하지 않은 파일이 있습니다.
  - `manifest_sha256` — 후보가 된 때 채워집니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_MODEL_NOT_FOUND` | 404 | 그런 이름의 버전이 하나도 없음 |
