info:
  name: 내 반응 번호 조회
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/user/reaction"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 조회 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "like": [2, 1],
              "dislike": [3]
            }
          }

docs: |-
  # 내 반응 번호 조회

  `GET /api/v1/user/reaction` · **인증 필요**

  반응한 곡 번호만 돌려줍니다. **페이징이 없습니다** — 화면이 어느 목록에서든
  하트를 칠하려면 전부 필요한데, `int` 배열이라 곡을 수천 개 좋아해도 응답이
  가볍습니다.

  곡 정보까지 필요하면 `내 반응 곡 조회` 를 쓰세요.

  정렬은 곡 번호 내림차순입니다.
