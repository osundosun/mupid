info:
  name: 반응 설정
  type: http
  seq: 1

http:
  method: PUT
  url: "{{BASE_URL}}/api/v1/music/{{MUSIC_ID}}/reaction"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
    - name: Content-Type
      value: application/json
  body: json
  auth: inherit

body:
  json: |-
    {
      "reaction_type": "LIKE"
    }

runtime:
  variables:
    - name: MUSIC_ID
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 저장 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "반응을 저장했습니다.",
            "data": null
          }
  - name: 404 곡 없음
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_MUSIC_NOT_FOUND",
            "message": "요청한 음악을 찾을 수 없습니다.",
            "error_details": null
          }

docs: |-
  # 반응 설정

  `PUT /api/v1/music/{musicId}/reaction` · **인증 필요**

  `reaction_type` 은 `LIKE` 또는 `DISLIKE` 입니다.

  이미 같은 값이면 아무것도 바꾸지 않습니다. 반대 값이면 갈아 끼우고
  `music.like_count` 를 함께 맞춥니다.

  해제는 이 요청이 아니라 `반응 해제`(`DELETE`) 입니다. 반응 없음을 `null` 로
  표현하면 값을 빠뜨린 요청과 구분되지 않기 때문입니다.
