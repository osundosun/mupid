info:
  name: 내 반응 곡 조회
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/user/reaction/music?type=LIKE&page=0&size=20"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 조회 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "items": [
                {
                  "music_id": 1,
                  "title": "두 번째 곡",
                  "release_date": "2026-09-14T00:00:00",
                  "duration_ms": 7020,
                  "playable": true,
                  "play_count": 0,
                  "like_count": 1,
                  "image_url": "/api/v1/storage/image/14",
                  "artist": { "artist_id": 1, "name": "무피드 테스트 아티스트", "image_url": "/api/v1/storage/image/13" },
                  "album": { "album_id": 1, "title": "무피드 테스트 앨범", "image_url": "/api/v1/storage/image/12", "release_date": "2026-09-14T00:00:00" },
                  "genres": [],
                  "moods": []
                }
              ],
              "page": 0,
              "size": 20,
              "total_elements": 2,
              "total_pages": 1
            }
          }
  - name: 400 type 오값
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_INVALID_REQUEST_BODY",
            "message": "데이터가 잘못 입력되었습니다.",
            "error_details": {
              "type": "LIKE, DISLIKE 중 하나여야 합니다."
            }
          }

docs: |-
  # 내 반응 곡 조회

  `GET /api/v1/user/reaction/music` · **인증 필요**

  응답은 `Music / 곡 목록 조회` 와 같은 페이지 모양입니다.

  | 이름 | 기본값 | 설명 |
  | --- | --- | --- |
  | `type` | `LIKE` | `LIKE` 또는 `DISLIKE` |
  | `page` | `0` | **0부터** 셉니다 |
  | `size` | `20` | 최대 100. 넘겨도 100으로 잘립니다 |

  정렬은 **최근에 누른 순**(`updated_at` 내림차순)입니다.

  삭제된 곡은 빠지므로 `items` 길이가 `size` 보다 짧을 수 있습니다.
  `total_elements` 는 반응 행 기준이라 그런 경우 조금 큽니다.
