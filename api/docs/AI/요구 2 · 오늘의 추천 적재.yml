info:
  name: 요구 2 · 오늘의 추천 적재
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/internal/recommendation/daily"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Internal-Token
      value: "{{AI_INTERNAL_TOKEN}}"
  auth: none
  body:
    type: json
    data: |-
      {
        "user_id": {{USER_ID}},
        "recommendation_date": "2026-09-16",
        "title": "잔잔하게 시작하는 아침",
        "reason": "저장하신 새벽 구간과 결이 닿아 있어요.",
        "mood_code_name": "잔잔한",
        "model_version": "mupid-stage1-v1",
        "tracks": [
          {
            "rank_order": 1,
            "music_id": 2,
            "music_section_id": 118,
            "reason": "저장하신 순간과 닮은 후렴이에요."
          },
          {
            "rank_order": 2,
            "music_id": 31,
            "music_section_id": 802,
            "reason": "비슷한 온도의 도입부예요."
          }
        ]
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 적재 완료
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "daily_recommendation_id": 5120,
              "user_id": 42,
              "recommendation_date": "2026-09-16",
              "music_count": 2,
              "replaced": false
            }
          }

  - name: 200 같은 날짜를 다시 넣음
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "daily_recommendation_id": 5120,
              "user_id": 42,
              "recommendation_date": "2026-09-16",
              "music_count": 2,
              "replaced": true
            }
          }

  - name: 400 순위가 중복
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "code": "MUPID_INVALID_REQUEST",
            "message": "rank_order 가 중복되었습니다.",
            "error_details": null
          }

  - name: 401 내부 토큰 불일치
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: json
        data: |-
          {
            "code": "MUPID_UNAUTHORIZED",
            "message": "내부 호출 토큰이 올바르지 않습니다.",
            "error_details": null
          }

  - name: 404 없는 사용자 또는 곡
    response:
      status: 404
      statusText: Not Found
      body:
        type: json
        data: |-
          {
            "code": "MUPID_USER_NOT_FOUND",
            "message": "사용자를 찾을 수 없습니다.",
            "error_details": null
          }

docs:
  type: text/markdown
  content: |-
    # 오늘의 추천 적재 — **미구현**

    > **이 API 는 아직 없습니다.** 계약 제안만 적어 둔 것이고 Spring 컨트롤러가
    > 필요합니다. 차단 사유는 `infra/AI-API-BLOCKERS.md` 에 있습니다.
    > **임의로 구현하지 않았습니다.**

    AI 배치가 하루치 추천을 만들어 Spring 의 `daily_recommendations` ·
    `daily_recommendation_tracks` 에 넣습니다. 사용자는 기존
    `GET /api/v1/recommendation/daily` 로 읽습니다.

    ## AI 가 DB 에 직접 쓰지 않습니다

    스키마는 Spring 이 관리합니다(`decision/0011`). AI 가 MySQL 에 직접 쓰면
    엔티티와 어긋나도 아무도 모르게 됩니다. 그래서 적재도 API 를 거칩니다.

    ## 같은 날짜를 다시 넣으면 갈아 끼웁니다

    `daily_recommendations` 에 `UNIQUE(user_id, recommendation_date)` 가 있습니다.
    같은 날짜로 다시 넣으면 **덮어쓰고** `replaced: true` 로 알려줍니다. 배치가
    중간에 죽어 다시 돌 때 하루에 두 벌이 생기지 않게 하려는 것입니다.

    처음 만들면 201, 갈아 끼우면 200 입니다.

    ## 요청

    | 필드 | 타입 | 필수 | 설명 |
    | --- | --- | --- | --- |
    | `user_id` | int | ✅ | |
    | `recommendation_date` | date | ✅ | `YYYY-MM-DD`, Asia/Seoul 기준 |
    | `title` | string | ✅ | 모먼트 제목. 최대 100자 |
    | `reason` | string | ✅ | 묶음 전체 사유. 최대 100자 |
    | `mood_code_name` | string | ✅ | `codes.code_name` (`code_type=MOOD`). Spring 이 숫자 ID 로 변환 |
    | `model_version` | string | | 어느 모델이 만들었는지 |
    | `tracks[].rank_order` | int | ✅ | 1 부터. **중복 불가** |
    | `tracks[].music_id` | int | ✅ | |
    | `tracks[].music_section_id` | int | | 추천 구간. 없으면 `null` |
    | `tracks[].reason` | string | ✅ | 곡별 사유. 최대 100자 |

    `music_count` 는 AI 가 보내지 않습니다. Spring 이 `tracks` 길이로 채웁니다 —
    두 값이 어긋날 여지를 만들지 않습니다.

    ## 막고 있는 것

    | 항목 | 현재 |
    | --- | --- |
    | `daily_recommendation_tracks.music_section_id` | **컬럼이 없습니다.** 구간을 가리킬 자리가 없어 "오늘의 추천" 이 곡 단위로만 남습니다 |
    | `daily_recommendations.mood_code_id` | `NOT NULL` 이므로 요청의 `mood_code_name` 은 필수입니다. AI 는 DB 숫자 ID 를 만들지 않습니다 |
