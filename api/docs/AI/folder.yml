    # AI

    Mupid AI 대화입니다. 화면 오른쪽의 `Mupid AI` 패널
    (`frontend/components/mupid/chat.tsx`)이 씁니다. **인증이 필요**합니다.

    | 파일 | 상태 | 동작 |
    | --- | --- | --- |
    | `AI 대화` | **구현됨** | `POST /api/v1/ai/chat` — 한 번의 문답 (추천은 아직 목업) |
    | `요구 1 · 구간 분석 결과 적재` | **BE 구현 필요** | AI → Spring. `music_section_analysis` 채우기 |
    | `요구 2 · 오늘의 추천 적재` | **BE 구현 필요** | AI → Spring. `daily_recommendations` 채우기 |
    | `요구 3 · 자동재생 다음 곡` | **BE 구현 필요** | 사용자 → Spring → AI |
    | `요구 4 · 선택 구간 유사 추천` | **BE 구현 필요** | 사용자 → Spring → AI |
    | `참고 · AI 서버 다음 곡 (내부)` | **AI 구현됨** | Spring 이 부를 AI 쪽 계약 |
    | `참고 · AI 서버 닮은 구간 (내부)` | **AI 구현됨** | Spring 이 부를 AI 쪽 계약 |

    ## 요구 · 참고

    `요구` 는 **BE 에 만들어 달라고 요청하는 API** 입니다. 아직 구현되어 있지 않고,
    필요한 ERD 변경·담당·차단 사유는 `infra/AI-API-BLOCKERS.md` 에 있습니다.
    **임의로 구현하지 않았습니다.**

    `참고` 는 **AI 서버에 이미 있는 내부 API** 입니다. 그대로 부를 수 있습니다.
    Spring 이 `요구 3·4` 를 만들 때 이 계약대로 호출하면 됩니다.

    ## 인증이 둘입니다

    | 방향 | 헤더 |
    | --- | --- |
    | 사용자 → Spring | `Authorization: Bearer {{ACCESS_TOKEN}}` |
    | Spring ↔ AI | `X-Internal-Token: {{AI_INTERNAL_TOKEN}}` |

    AI 는 `MUPID_AI_INTERNAL_TOKEN`, Spring 은 `MUPID_RECOMMENDER_INTERNAL_TOKEN`
    을 읽습니다. **같은 값이어야 하고**, 한쪽만 설정하면 추천이 통째로 401 입니다.
    기본은 꺼져 있고 값을 넣는 쪽이 켜는 쪽입니다.

    `/internal/*` 은 내부망 전용입니다. nginx·Ingress 에 열지 않습니다.

    ## 어디로 흘러가는가

    ```
    POST /api/v1/ai/chat
      → OpenAI 호환 게이트웨이 (gms.ssafy.io) chat/completions
      → 모델이 recommend_music 툴을 부르면 서버가 실행하고 결과를 넣어 다시 질의
      → 최종 답변(reply) + 추천 곡(tracks)
    ```

    대화는 LLM 이 하고 **곡 선정은 LLM 이 하지 않습니다.** 모델은 사용자가 원한
    느낌을 한 문장으로 정리해 `recommend_music` 툴에 넘기고, 어떤 곡이 나올지는
    추천 파이프라인이 정합니다. 없는 곡을 지어내지 않게 하려는 구조입니다.

    ## ⚠ 추천은 아직 목업입니다

    `recommend_music` 은 질의를 보지 않습니다. 카탈로그 앞쪽에서 몇 곡을 집어 정해진
    사유를 붙일 뿐입니다 (`ai/tool/AiRecommendToolImpl.java`). **점수·취향·구간은
    가짜입니다.** 다만 곡 번호는 실제 카탈로그의 것이라 화면에서 재생됩니다 — 카탈로그가
    비어 있을 때만 재생되지 않는 고정 예시로 돌아갑니다.

    지금 확인할 수 있는 것은 "모델이 툴을 부르고, 결과를 받아 한국어로 풀어 말하는가"
    까지입니다. 진짜 추천은 `ai_server/` 의 `POST /internal/recommendations/search` 가
    하게 됩니다. **다만 그 경로는 자연어 해석기(`MUPID_AI_NLP_URL`)가 없으면 501 입니다** —
    지금은 `/internal/recommendations/next` 만 실제로 답합니다 (S15P21A204-219).
    응답 필드를 그쪽 계약(`RecommendationItem`)에 맞춰 두었습니다.

    ## 대화를 저장하지 않습니다

    `ai_chat_sessions` · `ai_chat_messages` 표는 있지만 아직 쓰지 않습니다.
    이전 대화는 클라이언트가 `history` 로 함께 보냅니다.

    ## 설정

    | 키 | 기본값 |
    | --- | --- |
    | `MUPID_AI_GMS_KEY` (또는 `MUPID_AI_GMS`) | 없음 — **비어 있으면 503** |
    | `MUPID_AI_BASE_URL` | `https://gms.ssafy.io/gmsapi/api.openai.com/v1` |
    | `MUPID_AI_MODEL` | `gpt-5-mini` |
