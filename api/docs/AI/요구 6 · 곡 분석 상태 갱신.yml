info:
  name: 요구 6 · 곡 분석 상태 갱신
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{BASE_URL}}/api/v1/internal/music/{{MUSIC_ID}}/analysis-status"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Internal-Token
      value: "{{AI_INTERNAL_TOKEN}}"
  auth: none
  body:
    type: json
    data: |-
      {
        "analysis_version": "v1",
        "audio_sha256": "9f2c…",
        "status": "PROCESSING",
        "error_code": null,
        "error_message": null
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 처리 시작
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "music_id": 1001,
              "analysis_version": "v1",
              "analysis_status": "PROCESSING"
            }
          }

  - name: 200 분석 실패 기록
    request:
      body:
        type: json
        data: |-
          {
            "analysis_version": "v1",
            "audio_sha256": "9f2c…",
            "status": "FAILED",
            "error_code": "MERT_INFERENCE_FAILED",
            "error_message": "MERT 추론에 실패했습니다."
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "music_id": 1001,
              "analysis_version": "v1",
              "analysis_status": "FAILED"
            }
          }

  - name: 409 음원 변경
    response:
      status: 409
      statusText: Conflict
      body:
        type: json
        data: |-
          {
            "code": "MUPID_AUDIO_CHANGED",
            "message": "조회 뒤 음원이 변경되었습니다.",
            "error_details": null
          }

  - name: 401 내부 토큰 불일치
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: json
        data: |-
          {
            "code": "MUPID_UNAUTHORIZED",
            "message": "내부 호출 토큰이 올바르지 않습니다.",
            "error_details": null
          }

docs:
  type: text/markdown
  content: |-
    # 곡 분석 상태 갱신 — **미구현 · BE 대기**

    하루 1회 배치가 분석 시작과 실패를 Spring 에 기록합니다. 상태가 없으면 같은 곡을
    두 배치가 동시에 처리하고, 실패 이유도 다음 실행에 남지 않습니다.

    ## 상태 전이

    ```
    PENDING 또는 FAILED → PROCESSING
    PROCESSING → FAILED
    PROCESSING → DONE  (요구 1 구간 적재 성공 트랜잭션에서만)
    ```

    이 API 는 `PROCESSING`·`FAILED` 만 받습니다. `DONE` 을 여기서 받으면 구간 저장 없이
    완료로 표시될 수 있습니다. 요구 1이 구간 upsert와 `DONE` 전이를 한 트랜잭션으로
    처리합니다.

    ## 요청

    | 필드 | 타입 | 필수 | 설명 |
    | --- | --- | --- | --- |
    | `analysis_version` | string | ✅ | 요구 5에서 받은 판 |
    | `audio_sha256` | string | ✅ | 요구 5에서 받은 값. 현재 값과 다르면 409 |
    | `status` | enum | ✅ | `PROCESSING` 또는 `FAILED` |
    | `error_code` | string | `FAILED`일 때 | 기계가 읽는 짧은 코드 |
    | `error_message` | string | `FAILED`일 때 | 운영 확인용. 최대 500자, 비밀값 금지 |

    같은 상태 요청은 성공으로 처리합니다. 배치 재시도 때문에 같은 호출이 와도 안전해야
    합니다. DB·ERD·Spring 구현은 BE 소관이고 이 문서는 계약만 정의합니다.
