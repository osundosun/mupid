info:
  name: 요구 1 · 구간 분석 결과 적재
  type: http
  seq: 2

http:
  method: PUT
  url: "{{BASE_URL}}/api/v1/internal/music/{{MUSIC_ID}}/section"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Internal-Token
      value: "{{AI_INTERNAL_TOKEN}}"
  auth: none
  body:
    type: json
    data: |-
      {
        "analysis_version": "v1",
        "sections": [
          {
            "section_index": 0,
            "external_id": "T001001#0",
            "section_label": "INTRO",
            "start_time_ms": 0,
            "end_time_ms": 15500
          },
          {
            "section_index": 1,
            "external_id": "T001001#1",
            "section_label": "VERSE",
            "start_time_ms": 15500,
            "end_time_ms": 45000
          },
          {
            "section_index": 2,
            "external_id": "T001001#2",
            "section_label": "CHORUS",
            "start_time_ms": 45000,
            "end_time_ms": 78000
          }
        ]
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 적재 완료
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "music_id": 1001,
              "analysis_version": "v1",
              "replaced": 3,
              "sections": [
                { "music_section_analysis_id": 4101, "section_index": 0, "external_id": "T001001#0" },
                { "music_section_analysis_id": 4102, "section_index": 1, "external_id": "T001001#1" },
                { "music_section_analysis_id": 4103, "section_index": 2, "external_id": "T001001#2" }
              ]
            }
          }

  - name: 400 경계가 뒤집힘
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "message": "end_time_ms 는 start_time_ms 보다 커야 합니다.",
            "errorCode": "MUPID_INVALID_TIME_RANGE",
            "errorDetails": null
          }

  - name: 401 내부 토큰 불일치
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: json
        data: |-
          {
            "message": "내부 호출 토큰이 올바르지 않습니다.",
            "errorCode": "MUPID_UNAUTHORIZED",
            "errorDetails": null
          }

  - name: 404 없는 곡
    response:
      status: 404
      statusText: Not Found
      body:
        type: json
        data: |-
          {
            "message": "음악을 찾을 수 없습니다.",
            "errorCode": "MUPID_MUSIC_NOT_FOUND",
            "errorDetails": null
          }

  - name: 409 external_id 중복
    response:
      status: 409
      statusText: Conflict
      body:
        type: json
        data: |-
          {
            "message": "이미 다른 곡에 쓰인 external_id 입니다.",
            "errorCode": "MUPID_SECTION_EXTERNAL_ID_DUPLICATED",
            "errorDetails": null
          }

docs:
  type: text/markdown
  content: |-
    # 구간 분석 결과 적재 — **미구현**

    > **이 API 는 아직 없습니다.** 계약 제안만 적어 둔 것이고, Spring 컨트롤러와
    > ERD 변경이 함께 필요합니다. 필요한 변경점·담당·차단 사유는
    > `infra/AI-API-BLOCKERS.md` 에 있습니다. **임의로 구현하지 않았습니다.**

    AI 가 곡을 분석해 만든 구간을 Spring 의 `music_section_analysis` 에 넣습니다.
    이 표가 채워져야 숫자 `music_section_id` 가 생기고, 그래야 추천 응답이 구간을
    가리킬 수 있습니다.

    ## 왜 곡 단위로 통째로 바꾸는가

    `PUT` 입니다. 한 곡의 구간은 **분석 한 번의 결과로 함께 정해집니다.** 개별로
    넣으면 재분석 중간에 옛 구간과 새 구간이 섞이고, 그 상태로도 조회가 정상으로
    보입니다. 가사(`PUT /api/v1/music/{musicId}/lyric`)가 같은 이유로 통째 교체입니다.

    `replaced` 는 지워지고 다시 만들어진 개수입니다.

    ## 요청

    | 필드 | 타입 | 필수 | 설명 |
    | --- | --- | --- | --- |
    | `analysis_version` | string | ✅ | 분석 버전. 현재 `v1` |
    | `sections[].section_index` | int | ✅ | 곡 안 순번. 0 부터 |
    | `sections[].external_id` | string | ✅ | AI 문자열 구간 ID(`T001001#2`). **최대 64자** |
    | `sections[].section_label` | enum | ✅ | ERD `section_label` ENUM |
    | `sections[].start_time_ms` · `end_time_ms` | int | ✅ | `end > start` |

    `external_id` 는 AI 색인과 DB 를 잇는 **유일한 근거**입니다. 곡 전체에서
    고유해야 하고, 길이가 넘치면 MySQL 이 조용히 잘라 저장하는데 잘린 값끼리는
    1:1 검사까지 통과해 매핑이 어긋난 채 서비스가 올라옵니다.

    ## 응답

    발급된 `music_section_analysis_id` 를 `external_id` 와 짝지어 돌려줍니다.
    AI 는 이 짝으로 `id_map` 을 만듭니다. **숫자 ID 를 AI 가 만들지 않습니다.**

    ## 필요한 ERD 변경

    | 항목 | 현재 | 필요 |
    | --- | --- | --- |
    | 외부 ID 컬럼 | `embedding_id VARCHAR(50)` | `external_id VARCHAR(64)` + UNIQUE |
    | 구간 PK | ERD `music_section_id` / JPA `music_section_analysis_id` | 한 벌로 통일 |
    | `mood_id` | `NOT NULL` | 엔티티에 필드가 없어 INSERT 가 실패 |

    저장소의 `api/knowledge/domain/erd.sql` 은 JPA 기준으로 맞춰 두었지만
    **실제 DB 에는 적용되지 않았습니다.**
