info:
  name: 요구 3 · 자동재생 다음 곡
  type: http
  seq: 4

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/recommendation/next"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit
  body:
    type: json
    data: |-
      {
        "current_music_id": {{MUSIC_ID}},
        "current_music_section_id": {{MUSIC_SECTION_ID}},
        "position_ms": 95000,
        "limit": 5,
        "exclude_music_ids": []
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 다음 곡
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "recommendation_id": 1024,
              "shortfall": 0,
              "tracks": [
                {
                  "rank_order": 1,
                  "reason": "저장하신 순간과 닮은 후렴이에요.",
                  "reason_code": "SIMILAR_PREFERRED_MOMENT",
                  "section": {
                    "music_section_id": 118,
                    "section_label": "CHORUS",
                    "start_time_ms": 90000,
                    "end_time_ms": 120000
                  },
                  "music": {
                    "music_id": 2,
                    "title": "첫 번째 곡",
                    "duration_ms": 213020,
                    "playable": true,
                    "image_url": "/api/v1/storage/image/14",
                    "artist": { "artist_id": 1, "name": "무피드 테스트 아티스트" },
                    "album": { "album_id": 1, "title": "무피드 테스트 앨범" }
                  }
                }
              ]
            }
          }

  - name: 200 후보가 없음
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "message": null,
            "data": {
              "recommendation_id": 1025,
              "shortfall": 5,
              "tracks": []
            }
          }

  - name: 400 잘못된 요청
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "code": "MUPID_INVALID_REQUEST",
            "message": "limit 은 1 이상 50 이하여야 합니다.",
            "error_details": null
          }

  - name: 401 인증 없음
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: json
        data: |-
          {
            "code": "MUPID_UNAUTHORIZED",
            "message": "인증이 필요합니다.",
            "error_details": null
          }

  - name: 404 없는 곡·구간
    response:
      status: 404
      statusText: Not Found
      body:
        type: json
        data: |-
          {
            "code": "MUPID_MUSIC_NOT_FOUND",
            "message": "음악을 찾을 수 없습니다.",
            "error_details": null
          }

  - name: 503 추천 서버 미준비
    response:
      status: 503
      statusText: Service Unavailable
      body:
        type: json
        data: |-
          {
            "code": "MUPID_RECOMMENDER_UNAVAILABLE",
            "message": "추천 서버가 준비되지 않았습니다.",
            "error_details": null
          }

docs:
  type: text/markdown
  content: |-
    # 요구 3 · 자동재생 다음 곡 — **BE 구현 필요**

    > **아직 없는 API 입니다.** AI 쪽(`POST /internal/recommendations/next`)은 이미
    > 동작하고, 이 요청은 **그 앞에 놓일 사용자용 엔드포인트**입니다.
    > 차단 사유는 `infra/AI-API-BLOCKERS.md` 를 보세요.

    지금 듣던 곡이 끝날 때 다음 곡을 받습니다. 화면이 부르는 유일한 경로입니다 —
    브라우저가 AI 서버를 직접 부르지 않습니다.

    ## 흐름

    ```
    프런트 ── Authorization ──▶ Spring
                                 │  recommendation_id 발급
                                 │  X-Internal-Token
                                 ▼
                              AI 서버  POST /internal/recommendations/next
    ```

    ## Spring 이 해야 하는 것

    | | |
    | --- | --- |
    | `user_id` | 토큰에서 꺼낸다. **본문으로 받지 않는다** |
    | `recommendation_id` | **Spring 이 발급한다.** AI 는 만들지 않고 받은 값을 그대로 돌려준다 |
    | 곡 메타 | AI 는 `music_id` 만 준다. 제목·아티스트·이미지는 Spring 이 붙인다 |
    | 타임아웃 | 연결 2초 · 읽기 5초, 500·503·타임아웃만 1회 재시도 |

    `recommendation_id` 를 어디서 채번할지는 아직 정해지지 않았습니다. 자동재생은
    「오늘의 추천」과 무관하게 수시로 불리므로 `daily_recommendations` 행을 만드는
    방식은 맞지 않아 보입니다.

    ## 요청

    | 필드 | 타입 | 필수 | 설명 |
    | --- | --- | --- | --- |
    | `current_music_id` | int | | 지금 듣던 곡. 흐름 보정에 씁니다 |
    | `current_music_section_id` | int | | 지금 듣던 구간 |
    | `position_ms` | int | | 재생 위치. **현재 로직은 쓰지 않습니다** |
    | `limit` | int | | 기본 5, 최대 50 |
    | `exclude_music_ids` | int[] | | 이번 목록에서 뺄 곡 |

    ## 빈 결과는 오류가 아닙니다

    조건에 맞는 곡이 없으면 `tracks: []` 에 `shortfall` 을 채워 **200** 입니다.
    억지로 채우면 조건과 무관한 곡이 나가고, 그게 더 나쁩니다.

    ## 503 은 빈 결과로 감추지 않습니다

    AI 서버는 색인이 준비되지 않으면 503 입니다. Spring 은 한 번 재시도한 뒤
    `MUPID_RECOMMENDER_UNAVAILABLE` 503 으로 응답합니다. 빈 목록은 정상적으로 후보가
    없는 경우만 뜻합니다. 플레이어는 기존 목록을 유지하고 다음 시점에 재시도합니다.
