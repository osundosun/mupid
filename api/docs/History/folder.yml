    # History

    최근 감상과 최근 검색어입니다. **인증이 필요**합니다.

    | 엔드포인트 | 동작 |
    | --- | --- |
    | `GET /api/v1/user/history` | 최근 들은 곡 |
    | `GET /api/v1/user/history/search` | 최근 검색어 |

    ## 적재 API 가 없습니다

    기록은 청취 이벤트가 남깁니다. `Event / 청취 이벤트 수집` 으로
    `PLAY_START` 를 보내면 서버가 ClickHouse 와 **함께** MySQL
    `play_histories` 에도 남깁니다. `SEARCH` 는 `search_histories` 로 갑니다.

    화면이 같은 사실을 두 번 보내지 않게 하려는 구조입니다. 배경은
    [knowledge/decision/0018](../../knowledge/decision/0018-history-from-event-stream.md).

    MySQL 은 서비스용(지금 이 사람의 최근 감상), ClickHouse 는 분석용입니다.

    ## 기록되지 않는 경우

    - 이벤트의 `track_id` 가 없는 곡이거나 삭제된 곡일 때 — 조용히 넘어갑니다.
      이벤트 수집 자체는 성공(202)입니다.
    - 같은 `event_id` 를 다시 보냈을 때 — 멱등 처리에 걸려 기록도 두 번
      쌓이지 않습니다.
    - `PLAY_START` · `SEARCH` 외의 20종 — 분석용이라 ClickHouse 에만 갑니다.
