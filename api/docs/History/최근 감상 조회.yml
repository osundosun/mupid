docs: |-
  # 최근 감상 조회

  `GET /api/v1/user/history` · **인증 필요**

  응답은 `Music / 곡 목록 조회` 와 같은 페이지 모양입니다.

  | 이름 | 기본값 | 설명 |
  | --- | --- | --- |
  | `page` | `0` | **0부터** 셉니다 |
  | `size` | `20` | 최대 100. 넘겨도 100으로 잘립니다 |

  ## 같은 곡은 한 번만

  기록은 들을 때마다 쌓이지만 이 응답에서는 곡별로 묶입니다. 정렬은 **그 곡을
  마지막으로 들은 시각** 내림차순입니다. `total_elements` 도 곡 수입니다.

  삭제된 곡은 빠집니다.

  ## 곡을 튼 순간이 기준입니다

  `PLAY_START` 로 기록하므로 3초 만에 넘긴 곡도 남습니다. 방금 튼 곡이 바로
  보여야 해서 택한 쪽입니다.
