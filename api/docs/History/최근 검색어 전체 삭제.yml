docs: |-
  # 최근 검색어 전체 삭제

  `DELETE /api/v1/user/history/search/all` · **인증 필요**

  그 사람의 검색 기록을 모두 지웁니다. 검색한 적이 없어도 성공입니다.

  ## 왜 경로가 따로 있습니까

  파라미터 없는 `DELETE /api/v1/user/history/search` 를 전체 삭제로 쓰지 않습니다.
  그러면 화면이 `keyword` 를 빠뜨린 것과 전부 지우려는 것이 서버에서 똑같아
  보입니다. 되돌릴 수 없는 쪽은 길을 따로 냅니다.

  화면도 이 버튼만 한 번 더 묻습니다 (`전체 삭제` → `모두 지울까요?`).
