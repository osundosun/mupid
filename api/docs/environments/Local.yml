name: Local

variables:
  - name: BASE_URL
    value: http://localhost:8800
    description: API 서버 주소
  - name: ACCESS_TOKEN
    value: ""
    description: 로그인 / 액세스 토큰 재발급 응답에서 자동 저장됩니다.
  - name: REFRESH_TOKEN
    value: ""
    description: 로그인 응답의 Set-Cookie(refresh_token) 값을 직접 붙여넣으세요.
  - name: VERIFICATION_ID
    value: ""
    description: 인증 메일 발송 응답에서 자동 저장됩니다.
  - name: USER_ID
    value: ""
    description: 로그인 응답에서 자동 저장됩니다.
  - name: MUSIC_ID
    value: "1"
    description: 스트리밍 테스트에 쓸 음악 번호를 직접 넣으세요.
  - name: ARTIST_ID
    value: "1"
    description: 아티스트 번호입니다. Music / 아티스트 생성 응답에서 자동 저장됩니다.
  - name: ALBUM_ID
    value: "1"
    description: 앨범 번호입니다. Music / 앨범 생성 응답에서 자동 저장됩니다.
  - name: LYRIC_ID
    value: "1"
    description: 가사 번호입니다. Music / 가사 추가 응답에서 자동 저장됩니다.
  - name: AI_BASE_URL
    value: http://localhost:8100
    description: AI 추천 서버 주소입니다. `/internal` 앞까지 넣으세요.
  - name: AI_INTERNAL_TOKEN
    value: ""
    description: Spring↔AI 공유 비밀입니다. 양쪽 환경변수에 같은 값을 넣으세요. 비우면 AI 서버도 검사하지 않습니다.
  - name: MUSIC_SECTION_ID
    value: "1"
    description: 구간 번호입니다. 추천 응답의 music_section_id 를 넣으세요.
  - name: RECOMMENDATION_ID
    value: "1"
    description: Spring 이 발급하는 추천 요청 번호입니다. AI 는 만들지 않고 그대로 돌려줍니다.
