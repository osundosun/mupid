  content: |-
    # Storage

    범용 이미지 스토리지 API 입니다. 프로필 사진 등 카테고리별 이미지를
    업로드/조회/삭제합니다. 파일 실체는 S3 호환 오브젝트 스토리지에
    저장되고, 메타데이터는 `object_storage_files` 테이블로 관리됩니다.

    `PROFILE` 카테고리는 유저 프로필 사진에 연결되어 있어, 업로드 시
    인증 사용자의 `image_file` 이 해당 파일로 설정됩니다. `ARTIST` · `ALBUM` ·
    `TRACK` · `MUBTI`
    는 콜백 없이 저장만 하고, 응답의 `file_id` 를 아티스트·앨범 생성 요청의
    `image_file_id` 로 넘겨 연결합니다.

    카테고리는 enum 이름 그대로 **대문자**로 보냅니다 (`PROFILE`, `ARTIST`,
    `ALBUM`, `TRACK`, `MUBTI`, `STREAMING`). 소문자로 보내면 변환에 실패합니다.

    | 엔드포인트 | 동작 | 인증 |
    | --- | --- | --- |
    | `POST /api/v1/storage/image/{category}/{storageKey}` | 이미지 업로드 | 필요 · `ROLE_SYSTEM` 이상 (카탈로그) / 본인 (프로필) |
    | `GET /api/v1/storage/image/{fileId}` | 이미지 조회 | 카테고리에 따라 다름 (공개 / 필요) |
    | `GET /api/v1/storage/image/PROFILE/default` | 기본 프로필 이미지 | 불필요 |
    | `DELETE /api/v1/storage/image/{category}/{storageKey}` | 이미지 삭제 | 업로드와 같은 규칙 |

    ## 조회는 파일 번호로 한다

    쓰기(업로드·삭제)는 **자리를 지정**하는 일이라 카테고리와 키가 필요하지만,
    읽기는 **이미 있는 파일**을 가리키는 일이라 번호 하나로 충분합니다. 그래서
    조회만 경로 모양이 다릅니다 — `/{category}/{storageKey}` 가 아니라 `/{fileId}`.

    예전에는 조회도 키로 했습니다. 그때는 조회 URL 이 저장 키를 되짚어 만들어져서
    키 모양이 곧 조회 계약이었고, 키를 손으로 만든 코드 하나 때문에 `/report` 의
    MuBTI 캐릭터가 예외도 로그도 없이 뜨지 않았습니다.

    경로 파라미터

    | 필드 | 값 | 설명 |
    | --- | --- | --- |
    | `category` | `PROFILE` | 프로필 이미지 (유저 콜백 연결됨) |
    | | `ARTIST` | 아티스트 이미지 |
    | | `ALBUM` | 앨범 이미지 |
    | | `TRACK` | 곡 커버 이미지 |
    | | `MUBTI` | MuBTI 캐릭터 이미지 |
    | | `STREAMING` | 스트리밍용 오디오 청크 |
    | `storageKey` | string | 대상 식별자. 유저 번호처럼 숫자여도 되고 아티스트명처럼 문자열이어도 된다 |
    | `fileId` | int | 업로드 응답의 `file_id`. 조회에만 쓴다 |

    실제 저장 키는 `image/{category 소문자}/{storageKey}` 형태입니다.
    예: `image/profile/1`

    ## 권한 — 카테고리가 정책을 들고 있다

    권한 판단은 카테고리의 정책(`ImageAccessPolicy`) 하나가 하고, **업로드와 삭제가
    같은 검사**를 지납니다.

    | 정책 | 카테고리 | 쓰기·삭제 | 읽기 |
    | --- | --- | --- | --- |
    | `OWNER` | `PROFILE` | 본인만 (키가 본인 번호) | 비공개 (401) |
    | `CATALOG` | `ARTIST` `ALBUM` `TRACK` `MUBTI` | `ROLE_SYSTEM` 이상 | **공개** |
    | `MACHINE` | `STREAMING` | `ROLE_SYSTEM` 이상 | 비공개 (401) |

    읽기가 공개인 카테고리만 토큰 없이 열립니다 — `<img src>` 에는 `Authorization`
    헤더를 붙일 수 없어서 닫으면 목록의 표지가 전부 깨집니다.

    ## 제한

    - 허용 확장자: `jpg`, `jpeg`, `png`, `gif`, `webp`
    - 최대 용량: 5 MB
    - 파일 종류(`file_type`)가 `IMG` 여야 합니다. 음원 청크(`FileType.MUSIC`)를
      이미지 API 로 달라고 하면 `MUPID_INVALID_FILE_TYPE`(400) 입니다

    ## 기본 이미지

    `PROFILE` 카테고리에서 저장된 사진이 없으면 기본 프로필 이미지
    (`default-user-profile.webp`) 가 반환됩니다. 404 가 아닙니다.
    파일이 아니라 classpath 자산이라 파일 번호가 없고, 그래서 이 자리만
    `/api/v1/storage/image/PROFILE/default` 라는 경로로 남았습니다.

    ## 엔드포인트 구분

    유저 프로필 사진은 전용 엔드포인트 없이 이 폴더의 API 를 그대로 사용합니다
    (`category = PROFILE`, `storageKey = 유저 번호`). 자세한 내용은
    `User` 폴더 문서의 "프로필 사진" 섹션을 참고하세요.