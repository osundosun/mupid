info:
  name: 이미지 삭제
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{BASE_URL}}/api/v1/storage/image/PROFILE/{{USER_ID}}"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 삭제 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "이미지가 삭제 되었습니다.",
            "data": null
          }
  - name: 404 파일 없음
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_FILE_NOT_FOUND",
            "message": "요청한 파일을 찾을 수 없습니다.",
            "error_details": null
          }

docs: |-
  # 이미지 삭제

  `DELETE /api/v1/storage/image/{category}/{storageKey}` · 인증 필요

  저장된 이미지를 삭제합니다. 오브젝트 스토리지의 실제 파일과
  메타데이터 모두 삭제되며, 메타데이터는 `is_deleted = true` 로
  표시됩니다.

  `PROFILE` 카테고리는 삭제 전에 해당 파일을 프로필로 쓰던 유저의 연결을
  끊습니다. 파일 자체는 호출부가 한 번만 지웁니다 — 콜백이 같이 지우면 두 번
  지우게 되어 `MUPID_FILE_NOT_FOUND` 로 롤백됩니다.

  삭제하면 `GET /api/v1/user` 의 `image_url` 이 다시
  `/api/v1/storage/image/PROFILE/default` 를 가리킵니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
  | `MUPID_FILE_NOT_FOUND` | 404 | 저장된 파일이 없음 |