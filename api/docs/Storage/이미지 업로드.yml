info:
  name: 이미지 업로드
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/storage/image/profile/{{USER_ID}}"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  body:
    type: multipart-form
    data:
      - name: imageFile
        type: file
        value: []
        contentType: image/png
        description: 업로드할 이미지 파일
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 업로드 성공
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "이미지가 업로드 되었습니다.",
            "data": null
          }
  - name: 400 이미지 형식 오류
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_INVALID_IMAGE_FILE_FORMAT",
            "message": "포맷이 사진 형식이 아니거나 올바르지 않습니다.",
            "error_details": null
          }
  - name: 413 용량 초과
    response:
      status: 413
      statusText: Content Too Large
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "MUPID_IMAGE_FILE_SIZE_EXCEEDED",
            "message": "이미지 용량이 너무 큽니다.",
            "error_details": null
          }

docs: |-
  # 이미지 업로드

  `POST /api/v1/storage/image/{category}/{storageKey}` · 인증 필요 ·
  `multipart/form-data`

  ## 경로 파라미터

  | 필드 | 설명 |
  | --- | --- |
  | `category` | `PROFILE` / `ARTIST` / `ALBUM` / `STREAMING` |
  | `storageKey` | 대상 번호 (예: 유저 번호). `image/{category}/{key}` 키로 저장됨 |

  같은 키로 다시 업로드하면 기존 파일이 **덮어써지고** 메타데이터
  (원본 파일명·MIME·용량) 만 갱신됩니다.

  ## 폼 필드

  | 필드 | 타입 | 필수 | 설명 |
  | --- | --- | --- | --- |
  | `imageFile` | file | ✅ | 이미지 파일 (`@RequestParam MultipartFile`) |

  ## PROFILE 카테고리 동작

  `PROFILE` 로 업로드하면 인증 토큰 사용자의 `image_file` 이 이 파일로
  설정됩니다. 다른 카테고리는 아직 콜백이 연결되어 있지 않아 파일
  저장만 수행됩니다.

  ## 오류

  | 코드 | 상태 | 설명 |
  | --- | --- | --- |
  | `MUPID_UNAUTHORIZED` | 401 | 액세스 토큰이 없거나 유효하지 않음 |
  | `MUPID_INVALID_IMAGE_FILE_FORMAT` | 400 | 허용 확장자가 아님 |
  | `MUPID_IMAGE_FILE_SIZE_EXCEEDED` | 413 | 5 MB 초과 |