info:
  name: 일간 취향 리포트 조회
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/report"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

