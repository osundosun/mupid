server:
  port: ${MUPID_PORT:8800}

spring:
  application:
    name: api
  config:
    import:
      - optional:file:.env[.properties]
  datasource:
    url: ${MUPID_MYSQL_URL}
    username: ${MUPID_MYSQL_USER}
    password: ${MUPID_MYSQL_PASSWORD}
  data:
    redis:
      host: ${MUPID_REDIS_HOST}
      port: ${MUPID_REDIS_PORT}
      timeout: 3000ms
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      # 기본값(파일 1MB)으로는 이미지 5MB 제한도, 오디오 청크 업로드도 통과하지 못한다.
      # 실제 상한은 각 서비스가 따로 검사한다 (이미지 5MB / 청크 10MB).
      max-file-size: ${MUPID_MAX_UPLOAD_FILE_SIZE:20MB}
      max-request-size: ${MUPID_MAX_UPLOAD_REQUEST_SIZE:20MB}

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

jwt:
  secret: ${MUPID_JWT_SECRET}

gmail:
  client-id: ${MUPID_GMAIL_CLIENT_ID}
  client-secret: ${MUPID_GMAIL_CLIENT_SECRET}
  token: ${MUPID_GMAIL_TOKEN}
  send-address: ${MUPID_GMAIL_SEND_ADDRESS}

aws:
  s3:
    endpoint: ${MUPID_S3_ENDPOINT}
    region: "SeaweedFS"
    access-key: ${MUPID_S3_ACCESS_KEY}
    secret-key: ${MUPID_S3_SECRET}
    bucket-name: ${MUPID_S3_BUCKET}

clickhouse:
  url: ${MUPID_CLICKHOUSE_URL}
  username: ${MUPID_CLICKHOUSE_USER}
  password: ${MUPID_CLICKHOUSE_PASSWORD}
  # 분석 쿼리는 MySQL 트랜잭션 경로와 무관하므로 풀을 작게 잡는다.
  max-pool-size: 8
  min-idle: 1
  connection-timeout: 3s
  # ClickHouse 집계 쿼리는 오래 걸릴 수 있어 검증 쿼리 타임아웃을 넉넉히 둔다.
  validation-timeout: 3s

event:
  kafka-bootstrap-servers: ${MUPID_KAFKA_BOOTSTRAP}
  kafka-topic: ${MUPID_KAFKA_TOPIC:mupid.listen.events}
  # 프론트 SDK 는 20건씩 보낸다. 여유를 두되 한 요청이 너무 커지지 않게 막는다.
  max-batch-size: 50
  # event_id 를 기억해 두는 기간. 네트워크 재시도 간격보다 넉넉하면 된다.
  dedup-ttl: 10m
  # 오프라인 뒤 일괄 전송은 살리되 조작된 시각은 잘라낸다.
  occurred-at-max-past: 72h
  occurred-at-max-future: 5m
  # 브로커가 죽었을 때 send 가 요청 스레드를 오래 잡지 않도록 짧게 잡는다.
  kafka-max-block: 3s

ai:
  # OpenAI 호환 게이트웨이. `/chat/completions` 앞까지의 주소다.
  base-url: ${MUPID_AI_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1}
  # 팀 .env 에 먼저 자리 잡은 이름이 MUPID_AI_GMS 라 둘 다 받는다. 앞의 것이 우선이다.
  api-key: ${MUPID_AI_GMS_KEY:${MUPID_AI_GMS:}}
  model: ${MUPID_AI_MODEL:gpt-5-mini}
  connect-timeout: 5s
  # 추론 모델은 첫 응답까지 수십 초가 걸린다. 그동안 요청 스레드가 묶이므로 더 늘리지 않는다.
  read-timeout: 60s
  # 툴 호출 -> 결과 주입 -> 재질의 반복 상한. 넘으면 502 로 끊는다.
  max-tool-rounds: 3
  # 클라이언트가 함께 보낸 이전 대화를 몇 마디까지 프롬프트에 넣을 것인가.
  max-history: 20

redis:
  key-prefix: ${MUPID_REDIS_KEY_PREFIX}

mupid-client:
  website: ${MUPID_CLIENT_WEBSITE:}
