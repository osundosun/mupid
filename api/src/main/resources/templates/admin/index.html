<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Mupid 관리자</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f1115;
            --panel: #171a21;
            --panel-2: #1d212a;
            --line: #272b35;
            --text: #e6e8ee;
            --muted: #8b93a7;
            --accent: #7aa2ff;
            --ok: #56d364;
            --warn: #e3b341;
            --danger: #ff6b6b;
            --sidebar: 260px;
            --topbar: 52px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 13px/1.6 "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI",
                  "Malgun Gothic", sans-serif;
        }

        button, input, select, textarea { font: inherit; color: inherit; }

        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* ------------------------------------------------------------------ 뼈대 */

        .topbar {
            position: fixed;
            inset: 0 0 auto 0;
            height: var(--topbar);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            z-index: 20;
        }

        .brand { font-weight: 700; letter-spacing: -0.01em; }
        .brand span { color: var(--muted); font-weight: 500; }
        .spacer { flex: 1; }
        .who { color: var(--muted); font-size: 12px; }

        .sidebar {
            position: fixed;
            top: var(--topbar);
            bottom: 0;
            left: 0;
            width: var(--sidebar);
            padding: 12px;
            overflow-y: auto;
            background: var(--panel);
            border-right: 1px solid var(--line);
        }

        .content {
            margin: var(--topbar) 0 0 var(--sidebar);
            padding: 20px;
            min-height: calc(100vh - var(--topbar));
        }

        @media (max-width: 860px) {
            .sidebar {
                position: static;
                width: auto;
                border-right: 0;
                border-bottom: 1px solid var(--line);
                max-height: 40vh;
            }
            .content { margin: 0; padding: 16px; }
            body { padding-top: var(--topbar); }
        }

        /* ------------------------------------------------------------ 왼쪽 자원 목록 */

        /* 검색칸과 첫 항목(대시보드)이 붙어 버리지 않게 띄운다. 분류 묶음은 제
           여백(.nav-group)을 갖지만 맨 위 항목 앞에는 묶음이 없다. */
        #nav { margin-top: 10px; }

        .nav-group { margin: 14px 0 4px; padding: 0 8px; color: var(--muted);
                     font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 7px 8px;
            background: none;
            border: 0;
            border-radius: 7px;
            color: var(--text);
            text-align: left;
            cursor: pointer;
        }

        .nav-item:hover { background: var(--panel-2); }
        .nav-item[aria-current="true"] { background: rgba(122, 162, 255, 0.16); color: var(--accent); }
        .nav-item .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }
        .nav-item .table-name { display: block; color: var(--muted); font-size: 11px; }

        /* ---------------------------------------------------------------- 공통 부품 */

        .btn {
            padding: 7px 12px;
            background: var(--accent);
            border: 0;
            border-radius: 7px;
            color: #0b0d12;
            font-weight: 600;
            cursor: pointer;
        }

        .btn.ghost { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); font-weight: 500; }
        .btn.danger { background: var(--danger); color: #170a0a; }
        .btn.small { padding: 4px 9px; font-size: 12px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .field {
            padding: 7px 10px;
            background: #0f1218;
            border: 1px solid var(--line);
            border-radius: 7px;
        }

        .field:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
        .field:disabled { opacity: 0.55; }

        .card {
            padding: 16px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
        }

        .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }

        .stat .k { color: var(--muted); font-size: 12px; }
        .stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

        .pill { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .pill.up { background: rgba(86, 211, 100, 0.16); color: var(--ok); }
        .pill.down { background: rgba(255, 107, 107, 0.16); color: var(--danger); }

        h2 { margin: 0 0 4px; font-size: 17px; letter-spacing: -0.01em; }
        h3 { margin: 24px 0 10px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
        .sub { margin: 0 0 16px; color: var(--muted); font-size: 12px; }

        /* -------------------------------------------------------------------- 표 */

        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0; }
        .toolbar .grow { flex: 1; min-width: 180px; }

        .table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }

        table { width: 100%; border-collapse: collapse; white-space: nowrap; }

        th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; }
        thead th { position: sticky; top: 0; background: var(--panel-2); color: var(--muted); font-weight: 600; font-size: 12px; }
        thead th.sortable { cursor: pointer; user-select: none; }
        thead th.sortable:hover { color: var(--text); }
        tbody tr:hover { background: rgba(255, 255, 255, 0.03); }
        tbody td { font-variant-numeric: tabular-nums; }
        td .cell { display: inline-block; max-width: 340px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
        td.actions { white-space: nowrap; }
        .muted { color: var(--muted); }
        .filter-row th { position: static; padding: 6px 8px; background: var(--panel); }
        .filter-row .field { width: 100%; padding: 4px 7px; font-size: 12px; }

        /* ------------------------------------------------------- FK 표시 · 썸네일 */

        /* FK 한 칸은 "대표값 + 번호" 다. 대표값이 링크(그 자원으로 건너가기)이고
           번호는 작게 곁들인다 — 번호를 지우면 요구가 사라지고, 크게 그리면 대표값이
           안 읽힌다. */
        .fk { display: inline-flex; align-items: center; gap: 6px; }
        .fk .primary { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fk .id { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

        /* 작은 이미지. 없는 자리도 같은 크기를 차지해야 표의 줄이 흔들리지 않는다. */
        .thumb {
            width: 28px;
            height: 28px;
            flex: 0 0 28px;
            border-radius: 6px;
            border: 1px solid var(--line);
            object-fit: cover;
            background: var(--panel-2);
        }

        /* 이미지가 없거나 못 받아왔을 때. 빈 자리를 남기면 "아직 안 불러왔다" 와
           구분되지 않아 화면이 거짓말을 한다. */
        .thumb.empty {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 15px;
        }

        .child-links { display: inline-flex; gap: 6px; flex-wrap: wrap; }

        /* ------------------------------------------------- 가사·구간 타임라인 */

        /* 시간축 위에 **가로로** 늘어놓는 자리. 표로만 나열하면 요구가 아니다 —
           시간 위치가 눈에 보여야 한다(S15P21A204-380-B). 각 항목은 트랙 안에서
           `left` 로 위치가 정해지고, 그 값을 `data-time-ms` 등에 그대로 남긴다.
           380-C 의 드래그가 그 자리를 읽는다. */
        .timeline { display: flex; flex-direction: column; gap: 14px; }

        .band { padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
        .band-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .band-head strong { font-size: 13px; }
        .band-head .muted { font-size: 11px; }

        /* 트랙은 시간축 그 자체다. 눈금을 배경으로 깔아 항목 위치가 읽히게 한다. */
        .track {
            position: relative;
            height: 54px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
        }

        /* 눈금은 10% 마다. 값이 아니라 **비율**이라 축 최대값이 바뀌어도 그대로다. */
        .track .grid-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(255, 255, 255, 0.06);
        }

        /* 항목 하나. `left`·`width` 가 시간에서 나온다. */
        .item {
            position: absolute;
            top: 5px;
            bottom: 5px;
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 11px;
            line-height: 1.35;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            cursor: pointer;
            border: 1px solid transparent;
            color: var(--text);
            background: rgba(122, 162, 255, 0.18);
            z-index: 1;
        }

        /* 구간은 폭을 가진 막대다. */
        .item.range { background: rgba(122, 162, 255, 0.16); border-color: rgba(122, 162, 255, 0.45); }

        /* 가사 한 줄은 시점(점)이다. 세로 눈금으로 그리고 글자는 옆에 붙인다 —
           폭을 시간 차이로 잡을 수 없기 때문이다(점에는 길이가 없다). */
        .item.point {
            top: 3px;
            bottom: 3px;
            width: auto;
            padding: 3px 6px 3px 8px;
            background: rgba(86, 211, 100, 0.14);
            border-left: 2px solid var(--ok);
        }

        /* 겹쳐도 읽히게 — 마우스를 올린 항목이 앞으로 나온다. */
        .item:hover, .item:focus-visible {
            z-index: 5;
            background: var(--panel);
            border-color: var(--accent);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        .item .at { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 5px; }
        .item.missing { background: rgba(227, 179, 65, 0.14); border-color: rgba(227, 179, 65, 0.4); }

        /* 부모의 시간을 빌린 항목(구간-분위기). 자기 시간이 없다는 사실을 색으로 말한다. */
        .item .borrowed { color: var(--warn); font-size: 10px; margin-left: 4px; }

        .axis-label {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            color: var(--muted);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }

        /* 시간 정보가 하나도 없을 때. 트랙을 그대로 두면 모든 항목이 0 위치에 겹쳐
           "시간이 있다" 는 거짓말이 된다. 눈금 없이 세로로 나열한다. */
        .track.no-axis { height: auto; padding: 8px; }
        .track.no-axis .item { position: static; display: block; margin-bottom: 4px; }

        /* ------------------------------------------- 드래그로 시각 옮기기 (380-C) */

        /* 끌 수 있는 항목. **커서 모양이 유일한 단서다** — 이게 없으면 사용자는 무엇을
           끌 수 있는지 알 방법이 없다. 무엇이 끌리는지는 `itemHtml` 이 축 선언을 보고
           정한다(시간이 없는 `missing` 항목은 여기 붙지 않는다). */
        .item.draggable { cursor: grab; }

        /* 끌고 있는 동안. 항목이 손끝을 따라가야 "어디로 옮기는지" 가 보인다. */
        .item.dragging {
            z-index: 6;
            cursor: grabbing;
            background: var(--panel);
            border-color: var(--accent);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
        }

        /* 드래그 중에는 글자가 잡히면 안 된다. 잡히면 놓을 때 파란 선택 영역이 남고,
           항목 밖으로 나갔을 때 브라우저가 선택을 늘리느라 움직임이 끊긴다. */
        body.timeline-dragging { user-select: none; -webkit-user-select: none; }

        /* 놓을 자리를 트랙에 세로줄로 보여 준다. 항목의 왼쪽 끝이 곧 위치지만, 항목이
           길면 어느 쪽 끝이 위치인지 헷갈린다. */
        .track .drop-guide {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--accent);
            z-index: 4;
        }

        /* 드래그 중 따라다니는 시각. **이것이 없으면 조절이 아니다** — 사용자가 어디로
           옮기는지 모르는 채로 손을 떼게 된다. 마우스를 따라오므로 `fixed` 다. */
        .drag-readout {
            position: fixed;
            z-index: 70;
            padding: 4px 8px;
            background: var(--panel-2);
            border: 1px solid var(--accent);
            border-radius: 8px;
            font-size: 11px;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            white-space: nowrap;
            pointer-events: none;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        }

        .drag-readout .was { color: var(--muted); }

        /* 저장이 실패해 원위치로 되돌린 항목. 왜 돌아왔는지는 토스트가 말한다. */
        .item.reverted { border-color: var(--danger); }

        .pager { display: flex; align-items: center; gap: 10px; justify-content: flex-end; margin-top: 12px; color: var(--muted); }

        /* ------------------------------------------------------------------ 모달 */

        .backdrop {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            z-index: 40;
        }

        .modal {
            width: min(100%, 620px);
            max-height: 86vh;
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
        }

        .modal header, .modal footer { padding: 14px 18px; }
        .modal header { border-bottom: 1px solid var(--line); font-weight: 600; }
        .modal .body { padding: 18px; overflow-y: auto; }
        .modal footer { border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }

        .form-row { margin-bottom: 14px; }
        .form-row label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; }
        .form-row .field { width: 100%; }
        .form-row textarea.field { min-height: 90px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; }
        .form-row .note { margin-top: 4px; color: var(--muted); font-size: 11px; }
        .req { color: var(--warn); }

        /* ------------------------------------------------------------------ 알림 */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            padding: 10px 16px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 10px;
            z-index: 60;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
        }

        .toast.bad { border-color: rgba(255, 107, 107, 0.5); color: var(--danger); }

        .empty { padding: 40px; color: var(--muted); text-align: center; }

        /* -------------------------------------------------- ClickHouse 콘솔 */

        /* 콘솔은 ClickHouse 가 만든 화면을 그대로 띄우는 자리다. 내용 높이를 우리가
           알 수 없으므로 iframe 이 남은 세로를 전부 먹게 한다 (content 의 상하 여백
           20px 씩을 빼 준다). */
        .console {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: calc(100vh - var(--topbar) - 40px);
        }

        .console-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .console-bar .grow { flex: 1; }

        .console-frame {
            flex: 1;
            width: 100%;
            min-height: 420px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
        }

        @media (max-width: 860px) {
            .console { height: calc(100vh - var(--topbar) - 32px); }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="brand">Mupid <span>관리자</span></div>
    <div class="spacer"></div>
    <span class="who" id="who"></span>
    <button class="btn ghost small" id="reload">새로고침</button>
    <button class="btn ghost small" id="logout">로그아웃</button>
</header>

<aside class="sidebar">
    <input id="nav-filter" class="field" style="width:100%" placeholder="자원 이름 검색" autocomplete="off">
    <nav id="nav"></nav>
</aside>

<main class="content" id="content">
    <div class="empty">불러오는 중…</div>
</main>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
(function () {
    'use strict';

    var TOKEN_KEY = 'mupid.admin.token';
    var USER_KEY = 'mupid.admin.user';
    var LOGIN_URL = '/api/admin/login';
    var API = '/api/v1/admin';

    var state = {
        resources: [],
        dashboard: null,
        view: 'dashboard',
        console: null,
        consoleTab: 'play',
        consoleTimer: null,
        resource: null,
        schema: null,
        /**
         * 자원 이름 → 스키마. 타임라인이 **자기 밴드들의 스키마**를 미리 받아 둔다
         * (S15P21A204-380-C).
         *
         * <p>왜 미리 받는가. 드래그를 시작할 때 받으러 가면 첫 드래그가 눈에 띄게 느려지고,
         * 그 사이에 손을 떼면 **어느 컬럼에 저장할지 모른 채** 끝난다. 스키마는
         * `updatable` 여부를 알려 주므로 "끌 수 있는 항목인가" 의 판단 근거이기도 하다.
         *
         * <p>이미 받은 자원은 다시 받지 않는다 — 밴드 셋이 다 다른 자원이라 타임라인을
         * 열 때마다 세 번씩 더 부르면 낭비다. 자원 이름을 키로 둔다.
         */
        schemas: {},
        /** 가사·구간 타임라인 응답과 그 곡 번호 (S15P21A204-380-B). */
        timeline: null,
        timelineMusicId: null,
        page: 0,
        size: 25,
        sort: null,
        direction: 'desc',
        keyword: '',
        filters: {},
        rows: null
    };

    /**
     * 토큰이 필요한 이미지를 받아 둔 blob 주소. 주소 → blob URL.
     *
     * 표를 다시 그릴 때마다 같은 이미지를 새로 받으면 목록이 느려진다. 탭이 닫히면
     * 함께 사라지므로 회수(`revokeObjectURL`)는 하지 않는다 — 회수하면 같은 주소를
     * 쓰는 다음 표가 깨진 그림을 그린다.
     */
    var thumbCache = {};

    // ------------------------------------------------------------------ 인증

    function token() {
        return sessionStorage.getItem(TOKEN_KEY);
    }

    function toLogin() {
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(USER_KEY);
        location.replace(LOGIN_URL);
    }

    /**
     * 액세스 토큰은 한 시간짜리다. 만료되면 리프레시 토큰 쿠키로 한 번 되살려 보고,
     * 그것도 안 되면 로그인으로 돌려보낸다.
     *
     * 쿠키가 Secure 라 https 가 아닌 환경에서는 저장되지 않는다. 그때는 되살리기가
     * 실패하고 그냥 다시 로그인하게 된다 — 조용히 실패하는 것보다 낫다.
     */
    var refreshing = null;

    function refresh() {
        if (!refreshing) {
            refreshing = fetch('/api/v1/auth', { credentials: 'include' })
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('만료');
                    }
                    return response.json();
                })
                .then(function (body) {
                    sessionStorage.setItem(TOKEN_KEY, body.data.access_token);
                    return body.data.access_token;
                })
                .finally(function () {
                    refreshing = null;
                });
        }
        return refreshing;
    }

    function request(path, options, retried) {
        var config = Object.assign({ headers: {} }, options || {});
        config.headers = Object.assign({}, config.headers, {
            'Authorization': 'Bearer ' + token()
        });
        if (config.body) {
            config.headers['Content-Type'] = 'application/json';
        }

        return fetch(API + path, config).then(function (response) {
            if (response.status === 401 && !retried) {
                return refresh().then(function () {
                    return request(path, options, true);
                }, function () {
                    toLogin();
                    throw new Error('로그인이 필요합니다.');
                });
            }
            if (response.status === 204) {
                return null;
            }
            return response.json().catch(function () {
                return null;
            }).then(function (body) {
                if (!response.ok) {
                    throw new Error((body && body.message) || ('요청이 실패했습니다 (' + response.status + ')'));
                }
                return body ? body.data : null;
            });
        });
    }

    // -------------------------------------------------------------------- 유틸

    function el(id) {
        return document.getElementById(id);
    }

    function escape(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function number(value) {
        return Number(value).toLocaleString('ko-KR');
    }

    /**
     * 행 수. 서버가 세지 못했으면 -1 로 온다 — 0 으로 그리면 "비었다" 는 거짓말이 된다.
     */
    function count(value) {
        return Number(value) < 0 ? '?' : number(value);
    }

    function bytes(value) {
        var units = ['B', 'KB', 'MB', 'GB'];
        var size = Number(value);
        var unit = 0;
        while (size >= 1024 && unit + 1 < units.length) {
            size = size / 1024;
            unit = unit + 1;
        }
        return size.toFixed(unit === 0 ? 0 : 1) + ' ' + units[unit];
    }

    function duration(seconds) {
        var total = Number(seconds);
        var days = Math.floor(total / 86400);
        var hours = Math.floor((total % 86400) / 3600);
        var minutes = Math.floor((total % 3600) / 60);
        if (days > 0) {
            return days + '일 ' + hours + '시간';
        }
        if (hours > 0) {
            return hours + '시간 ' + minutes + '분';
        }
        return minutes + '분';
    }

    /**
     * 곡 내 시점(ms)을 사람이 읽는 표기로. `m:ss.t`.
     *
     * 타임라인의 항목과 축 눈금에 쓴다. 380-C 가 드래그로 값을 바꾸면 이 표기도 함께
     * 움직여야 하므로 한 곳에 둔다.
     */
    function formatMs(value) {
        var total = Number(value);
        if (!isFinite(total) || total < 0) {
            return '';
        }
        var minutes = Math.floor(total / 60000);
        var seconds = Math.floor((total % 60000) / 1000);
        var tenths = Math.floor((total % 1000) / 100);
        return minutes + ':' + (seconds < 10 ? '0' : '') + seconds + '.' + tenths;
    }

    function toast(message, bad) {
        var root = el('toast-root');
        root.innerHTML = '<div class="toast' + (bad ? ' bad' : '') + '">' + escape(message) + '</div>';
        setTimeout(function () {
            root.innerHTML = '';
        }, bad ? 5000 : 2400);
    }

    function fail(error) {
        toast(error && error.message ? error.message : '알 수 없는 오류입니다.', true);
    }

    // ---------------------------------------------------------------- 왼쪽 목록

    function renderNav() {
        var keyword = el('nav-filter').value.trim().toLowerCase();
        var html = '<button class="nav-item" data-view="dashboard" aria-current="'
            + (state.view === 'dashboard') + '"><strong>대시보드</strong></button>'
            + '<button class="nav-item" data-view="clickhouse" aria-current="'
            + (state.view === 'clickhouse') + '">'
            + '<span><strong>ClickHouse 콘솔</strong>'
            + '<span class="table-name">쿼리 · 차트</span></span></button>';

        var category = null;
        state.resources.forEach(function (resource) {
            var hit = !keyword
                || resource.label.toLowerCase().indexOf(keyword) >= 0
                || resource.name.toLowerCase().indexOf(keyword) >= 0
                || resource.table.toLowerCase().indexOf(keyword) >= 0;
            if (!hit) {
                return;
            }
            if (resource.category !== category) {
                category = resource.category;
                html += '<div class="nav-group">' + escape(category) + '</div>';
            }
            var current = state.view === 'resource' && state.resource === resource.name;
            html += '<button class="nav-item" data-resource="' + escape(resource.name) + '"'

                + '<span><strong>' + escape(resource.label) + '</strong>'
                + '<span class="table-name">' + escape(resource.table) + '</span></span>'
                + '<span class="count">' + count(resource.count) + '</span>'
                + '</button>';
        });

    // ---------------------------------------------------------------- 대시보드

    function renderDashboard() {

                + '</td>'

                + '<td>' + (item.latency >= 0 ? item.latency + 'ms' : '-') + '</td>'
                + '<td class="muted"><span class="cell">' + escape(item.detail || '') + '</span></td></tr>';
        });
        html += '</tbody></table></div>';

        html += '<h3>회원 구성</h3><div class="grid">';
        Object.keys(data.users.byRole).forEach(function (role) {

    function stat(key, value) {
        return '<div class="card stat"><div class="k">' + escape(key) + '</div>'
            + '<div class="v">' + value + '</div></div>';
