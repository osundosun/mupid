<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Mupid 관리자</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f1115;
            --panel: #171a21;
            --panel-2: #1d212a;
            --line: #272b35;
            --text: #e6e8ee;
            --muted: #8b93a7;
            --accent: #7aa2ff;
            --ok: #56d364;
            --warn: #e3b341;
            --danger: #ff6b6b;
            --sidebar: 260px;
            --topbar: 52px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 13px/1.6 "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI",
                  "Malgun Gothic", sans-serif;
        }

        button, input, select, textarea { font: inherit; color: inherit; }

        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* ------------------------------------------------------------------ 뼈대 */

        .topbar {
            position: fixed;
            inset: 0 0 auto 0;
            height: var(--topbar);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            z-index: 20;
        }

        .brand { font-weight: 700; letter-spacing: -0.01em; }
        .brand span { color: var(--muted); font-weight: 500; }
        .spacer { flex: 1; }
        .who { color: var(--muted); font-size: 12px; }

        .sidebar {
            position: fixed;
            top: var(--topbar);
            bottom: 0;
            left: 0;
            width: var(--sidebar);
            padding: 12px;
            overflow-y: auto;
            background: var(--panel);
            border-right: 1px solid var(--line);
        }

        .content {
            margin: var(--topbar) 0 0 var(--sidebar);
            padding: 20px;
            min-height: calc(100vh - var(--topbar));
        }

        @media (max-width: 860px) {
            .sidebar {
                position: static;
                width: auto;
                border-right: 0;
                border-bottom: 1px solid var(--line);
                max-height: 40vh;
            }
            .content { margin: 0; padding: 16px; }
            body { padding-top: var(--topbar); }
        }

        /* ------------------------------------------------------------ 왼쪽 자원 목록 */

        /* 검색칸과 첫 항목(대시보드)이 붙어 버리지 않게 띄운다. 분류 묶음은 제
           여백(.nav-group)을 갖지만 맨 위 항목 앞에는 묶음이 없다. */
        #nav { margin-top: 10px; }

        .nav-group { margin: 14px 0 4px; padding: 0 8px; color: var(--muted);
                     font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 7px 8px;
            background: none;
            border: 0;
            border-radius: 7px;
            color: var(--text);
            text-align: left;
            cursor: pointer;
        }

        .nav-item:hover { background: var(--panel-2); }
        .nav-item[aria-current="true"] { background: rgba(122, 162, 255, 0.16); color: var(--accent); }
        .nav-item .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }
        .nav-item .table-name { display: block; color: var(--muted); font-size: 11px; }

        /* ---------------------------------------------------------------- 공통 부품 */

        .btn {
            padding: 7px 12px;
            background: var(--accent);
            border: 0;
            border-radius: 7px;
            color: #0b0d12;
            font-weight: 600;
            cursor: pointer;
        }

        .btn.ghost { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); font-weight: 500; }
        .btn.danger { background: var(--danger); color: #170a0a; }
        .btn.small { padding: 4px 9px; font-size: 12px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .field {
            padding: 7px 10px;
            background: #0f1218;
            border: 1px solid var(--line);
            border-radius: 7px;
        }

        .field:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
        .field:disabled { opacity: 0.55; }

        .card {
            padding: 16px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
        }

        .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }

        .stat .k { color: var(--muted); font-size: 12px; }
        .stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

        .pill { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .pill.up { background: rgba(86, 211, 100, 0.16); color: var(--ok); }
        .pill.down { background: rgba(255, 107, 107, 0.16); color: var(--danger); }

        h2 { margin: 0 0 4px; font-size: 17px; letter-spacing: -0.01em; }
        h3 { margin: 24px 0 10px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
        .sub { margin: 0 0 16px; color: var(--muted); font-size: 12px; }

        /* -------------------------------------------------------------------- 표 */

        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0; }
        .toolbar .grow { flex: 1; min-width: 180px; }

        .table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }

        table { width: 100%; border-collapse: collapse; white-space: nowrap; }

        th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; }
        thead th { position: sticky; top: 0; background: var(--panel-2); color: var(--muted); font-weight: 600; font-size: 12px; }
        thead th.sortable { cursor: pointer; user-select: none; }
        thead th.sortable:hover { color: var(--text); }
        tbody tr:hover { background: rgba(255, 255, 255, 0.03); }
        tbody td { font-variant-numeric: tabular-nums; }
        td .cell { display: inline-block; max-width: 340px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
        td.actions { white-space: nowrap; }
        .muted { color: var(--muted); }
        .filter-row th { position: static; padding: 6px 8px; background: var(--panel); }
        .filter-row .field { width: 100%; padding: 4px 7px; font-size: 12px; }

        /* ------------------------------------------------------- FK 표시 · 썸네일 */

        /* FK 한 칸은 "대표값 + 번호" 다. 대표값이 링크(그 자원으로 건너가기)이고
           번호는 작게 곁들인다 — 번호를 지우면 요구가 사라지고, 크게 그리면 대표값이
           안 읽힌다. */
        .fk { display: inline-flex; align-items: center; gap: 6px; }
        .fk .primary { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fk .id { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

        /* 작은 이미지. 없는 자리도 같은 크기를 차지해야 표의 줄이 흔들리지 않는다. */
        .thumb {
            width: 28px;
            height: 28px;
            flex: 0 0 28px;
            border-radius: 6px;
            border: 1px solid var(--line);
            object-fit: cover;
            background: var(--panel-2);
        }

        /* 이미지가 없거나 못 받아왔을 때. 빈 자리를 남기면 "아직 안 불러왔다" 와
           구분되지 않아 화면이 거짓말을 한다. */
        /* 이름이 `empty` 가 아니라 `thumb-empty` 인 이유가 있다. 아래쪽의 `.empty` 는
           "조건에 맞는 행이 없습니다" 같은 **빈 화면 안내**를 그리는 별개 클래스이고
           `padding: 40px` 을 건다. 이 자리가 그 이름을 같이 쓰는 동안 `.thumb` 쪽은
           padding 을 선언하지 않았고, `box-sizing: border-box` 아래에서 좌우 40px 과
           테두리 2px 이 28px 를 밀어내 **82×82** 로 부풀었다 (S15P21A204-412).
           이름을 갈라 두면 `.empty` 를 나중에 어떻게 고쳐도 이 자리가 다시 끌려가지
           않는다. */
        .thumb.thumb-empty {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            /* 28×28 은 `.thumb` 이 정한다. 여백을 0 으로 못박아 바깥 규칙이 이 상자를
               넓히지 못하게 한다. */
            padding: 0;
            color: var(--muted);
            font-size: 15px;
            /* 글리프가 상자를 밀지 않게 한다 — 높이는 28px 하나로만 정해진다. */
            line-height: 1;
        }

        /* 상자 크기를 맞춰도 **줄 높이**는 아직 어긋난다. `.fk` 가 inline-flex 라
           글줄 기준선을 첫 항목에서 가져오는데, `<img>` 는 기준선이 없어 아래 모서리로
           대신 잡히면서 글꼴의 아래쪽 여유(6.8px)가 행에 그대로 더해진다. 이미지가
           있는 행만 51.8px, 없는 행은 45px 이 되던 이유다 (S15P21A204-412).
           썸네일이 든 FK 칸만 가운데 정렬로 돌려 45px 로 맞춘다 — `.fk` 전체에 걸면
           썸네일 없는 FK 칸의 글줄이 옆 칸과 0.08px 어긋난다.
           `:has()` 를 못 쓰는 브라우저에서는 이 줄만 빠지고 상자 크기는 그대로다. */
        .fk:has(.thumb) { vertical-align: middle; }

        .child-links { display: inline-flex; gap: 6px; flex-wrap: wrap; }

        /* ------------------------------------------------- 가사·구간 타임라인 */

        /* 시간축 위에 **가로로** 늘어놓는 자리. 표로만 나열하면 요구가 아니다 —
           시간 위치가 눈에 보여야 한다(S15P21A204-380-B). 각 항목은 트랙 안에서
           `left` 로 위치가 정해지고, 그 값을 `data-time-ms` 등에 그대로 남긴다.
           380-C 의 드래그가 그 자리를 읽는다. */
        .timeline { display: flex; flex-direction: column; gap: 14px; }

        .band { padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
        .band-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .band-head strong { font-size: 13px; }
        .band-head .muted { font-size: 11px; }

        /* 트랙은 시간축 그 자체다. 눈금을 배경으로 깔아 항목 위치가 읽히게 한다. */
        .track {
            position: relative;
            height: 54px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
        }

        /* 눈금은 10% 마다. 값이 아니라 **비율**이라 축 최대값이 바뀌어도 그대로다. */
        .track .grid-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(255, 255, 255, 0.06);
        }

        /* 항목 하나. `left`·`width` 가 시간에서 나온다. */
        .item {
            position: absolute;
            top: 5px;
            bottom: 5px;
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 11px;
            line-height: 1.35;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            cursor: pointer;
            border: 1px solid transparent;
            color: var(--text);
            background: rgba(122, 162, 255, 0.18);
            z-index: 1;
        }

        /* 구간은 폭을 가진 막대다. */
        .item.range { background: rgba(122, 162, 255, 0.16); border-color: rgba(122, 162, 255, 0.45); }

        /* 가사 한 줄은 시점(점)이다. 세로 눈금으로 그리고 글자는 옆에 붙인다 —
           폭을 시간 차이로 잡을 수 없기 때문이다(점에는 길이가 없다). */
        .item.point {
            top: 3px;
            bottom: 3px;
            width: auto;
            padding: 3px 6px 3px 8px;
            background: rgba(86, 211, 100, 0.14);
            border-left: 2px solid var(--ok);
        }

        /* 겹쳐도 읽히게 — 마우스를 올린 항목이 앞으로 나온다. */
        .item:hover, .item:focus-visible {
            z-index: 5;
            background: var(--panel);
            border-color: var(--accent);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        .item .at { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 5px; }
        .item.missing { background: rgba(227, 179, 65, 0.14); border-color: rgba(227, 179, 65, 0.4); }

        /* 부모의 시간을 빌린 항목(구간-분위기). 자기 시간이 없다는 사실을 색으로 말한다. */
        .item .borrowed { color: var(--warn); font-size: 10px; margin-left: 4px; }

        .axis-label {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            color: var(--muted);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }

        /* 시간 정보가 하나도 없을 때. 트랙을 그대로 두면 모든 항목이 0 위치에 겹쳐
           "시간이 있다" 는 거짓말이 된다. 눈금 없이 세로로 나열한다. */
        .track.no-axis { height: auto; padding: 8px; }
        .track.no-axis .item { position: static; display: block; margin-bottom: 4px; }

        /* ------------------------------------------- 드래그로 시각 옮기기 (380-C) */

        /* 끌 수 있는 항목. **커서 모양이 유일한 단서다** — 이게 없으면 사용자는 무엇을
           끌 수 있는지 알 방법이 없다. 무엇이 끌리는지는 `itemHtml` 이 축 선언을 보고
           정한다(시간이 없는 `missing` 항목은 여기 붙지 않는다). */
        .item.draggable { cursor: grab; }

        /* 끌고 있는 동안. 항목이 손끝을 따라가야 "어디로 옮기는지" 가 보인다. */
        .item.dragging {
            z-index: 6;
            cursor: grabbing;
            background: var(--panel);
            border-color: var(--accent);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
        }

        /* 드래그 중에는 글자가 잡히면 안 된다. 잡히면 놓을 때 파란 선택 영역이 남고,
           항목 밖으로 나갔을 때 브라우저가 선택을 늘리느라 움직임이 끊긴다. */
        body.timeline-dragging { user-select: none; -webkit-user-select: none; }

        /* 놓을 자리를 트랙에 세로줄로 보여 준다. 항목의 왼쪽 끝이 곧 위치지만, 항목이
           길면 어느 쪽 끝이 위치인지 헷갈린다. */
        .track .drop-guide {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--accent);
            z-index: 4;
        }

        /* 드래그 중 따라다니는 시각. **이것이 없으면 조절이 아니다** — 사용자가 어디로
           옮기는지 모르는 채로 손을 떼게 된다. 마우스를 따라오므로 `fixed` 다. */
        .drag-readout {
            position: fixed;
            z-index: 70;
            padding: 4px 8px;
            background: var(--panel-2);
            border: 1px solid var(--accent);
            border-radius: 8px;
            font-size: 11px;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            white-space: nowrap;
            pointer-events: none;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        }

        .drag-readout .was { color: var(--muted); }

        /* 저장이 실패해 원위치로 되돌린 항목. 왜 돌아왔는지는 토스트가 말한다. */
        .item.reverted { border-color: var(--danger); }

        /* --------------------------------------- 사용자 행동 타임라인 (430) */

        /* 날짜 막대. 창의 **모든 날**이 한 칸씩이고 높이가 그날 이벤트 수다.
           표로 나열하면 "언제 활발했나" 가 안 보인다 — 어느 날을 펼칠지 여기서 고른다. */
        .day-strip {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 88px;
            padding: 8px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .day {
            display: flex;
            flex: 1 1 0;
            min-width: 3px;
            align-items: flex-end;
            height: 100%;
            padding: 0;
            background: none;
            border: 0;
            border-radius: 3px;
            cursor: pointer;
        }

        .day:hover { background: rgba(255, 255, 255, 0.06); }

        /* 기록이 없는 날도 **자리를 차지한다.** 빼면 날짜 축에 구멍이 생겨 "그날은
           아무것도 안 했다" 와 "그날은 범위 밖" 이 구분되지 않는다. 그런 날은 바닥에
           얇은 선만 남는다 — 0 을 아예 안 그리면 칸이 비어 로딩 중처럼 보인다. */
        .day .bar {
            width: 100%;
            min-height: 2px;
            background: var(--accent);
            border-radius: 3px 3px 0 0;
            opacity: 0.55;
        }

        .day:hover .bar { opacity: 0.9; }
        .day.none .bar { background: var(--line); opacity: 1; }
        .day.selected { background: rgba(86, 211, 100, 0.12); }
        .day.selected .bar { background: var(--ok); opacity: 1; }

        .day-axis {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            color: var(--muted);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }

        /* 밴드마다 색이 다르다. 네 줄이 같은 색이면 세로로 훑을 때 어느 줄을 보고
           있는지 놓친다. 색은 밴드 이름표(`data-group`)가 정한다 — 항목마다 색을
           적어 보내면 응답이 그만큼 커지고, 화면이 이벤트 종류를 알아야 하게 된다. */
        .band[data-group="SESSION"] .item {
            background: rgba(122, 162, 255, 0.20);
            border-color: rgba(122, 162, 255, 0.55);
        }

        .band[data-group="PLAYBACK"] .item { background: rgba(122, 162, 255, 0.14); border-left-color: var(--accent); }
        .band[data-group="NAVIGATION"] .item { background: rgba(227, 179, 65, 0.16); border-left-color: var(--warn); }
        .band[data-group="FEEDBACK"] .item { background: rgba(86, 211, 100, 0.16); border-left-color: var(--ok); }
        .band[data-group="OTHER"] .item { background: rgba(139, 147, 167, 0.18); border-left-color: var(--muted); }

        /* 이 화면의 항목은 **고칠 수 없다** — 이벤트 원본은 쌓기만 하는 자료다.
           손 모양 커서를 두면 눌러도 아무 일이 없는 자리가 되어, 380-B 의 편집 가능한
           항목과 구분되지 않는다. */
        .band[data-group] .item { cursor: default; }

        /* ---------------------------------------------------- AI 선호도 (427) */

        /* 선 그래프는 SVG 한 장이다. 이 화면은 라이브러리를 넣지 않는다(380-C 와 같은
           제약) — viewBox 로 그리고 너비만 늘려 화면 폭을 따라가게 한다. */
        .ai-chart {
            padding: 8px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .ai-chart svg { display: block; width: 100%; height: auto; }
        .ai-chart .grid-y { stroke: var(--line); stroke-width: 1; }
        .ai-chart .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
        .ai-chart .line { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
        .ai-chart .line.main { stroke-width: 2.6; }
        .ai-chart .line.baseline { stroke-dasharray: 5 4; }
        /* 배치가 계산하지 않은 시간. "재생 0회" 와 달리 **모른다** 는 뜻이라 칠해 둔다. */
        .ai-chart .missing { fill: rgba(255, 107, 107, 0.08); }
        .ai-chart .hover { fill: transparent; }
        .ai-chart .hover:hover { fill: rgba(255, 255, 255, 0.05); }

        .ai-legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 2px 0; color: var(--muted); font-size: 12px; }
        .ai-legend .swatch { display: inline-block; width: 14px; height: 3px; margin-right: 6px; vertical-align: middle; border-radius: 2px; }
        .ai-legend .swatch.baseline { background: none !important; border-top: 2px dashed var(--muted); height: 0; }

        .pager { display: flex; align-items: center; gap: 10px; justify-content: flex-end; margin-top: 12px; color: var(--muted); }

        /* ------------------------------------------------------------------ 모달 */

        .backdrop {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            z-index: 40;
        }

        .modal {
            width: min(100%, 620px);
            max-height: 86vh;
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
        }

        .modal header, .modal footer { padding: 14px 18px; }
        .modal header { border-bottom: 1px solid var(--line); font-weight: 600; }
        .modal .body { padding: 18px; overflow-y: auto; }
        .modal footer { border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }

        .form-row { margin-bottom: 14px; }
        .form-row label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; }
        .form-row .field { width: 100%; }
        .form-row textarea.field { min-height: 90px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; }
        .form-row .note { margin-top: 4px; color: var(--muted); font-size: 11px; }
        .req { color: var(--warn); }

        /* ------------------------------------------------------------------ 알림 */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            padding: 10px 16px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 10px;
            z-index: 60;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
        }

        .toast.bad { border-color: rgba(255, 107, 107, 0.5); color: var(--danger); }

        .empty { padding: 40px; color: var(--muted); text-align: center; }

        /* -------------------------------------------------- ClickHouse 콘솔 */

        /* 콘솔은 ClickHouse 가 만든 화면을 그대로 띄우는 자리다. 내용 높이를 우리가
           알 수 없으므로 iframe 이 남은 세로를 전부 먹게 한다 (content 의 상하 여백
           20px 씩을 빼 준다). */
        .console {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: calc(100vh - var(--topbar) - 40px);
        }

        .console-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .console-bar .grow { flex: 1; }

        .console-frame {
            flex: 1;
            width: 100%;
            min-height: 420px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
        }

        @media (max-width: 860px) {
            .console { height: calc(100vh - var(--topbar) - 32px); }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="brand">Mupid <span>관리자</span></div>
    <div class="spacer"></div>
    <span class="who" id="who"></span>
    <button class="btn ghost small" id="reload">새로고침</button>
    <button class="btn ghost small" id="logout">로그아웃</button>
</header>

<aside class="sidebar">
    <input id="nav-filter" class="field" style="width:100%" placeholder="자원 이름 검색" autocomplete="off">
    <nav id="nav"></nav>
</aside>

<main class="content" id="content">
    <div class="empty">불러오는 중…</div>
</main>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
(function () {
    'use strict';

    var TOKEN_KEY = 'mupid.admin.token';
    var USER_KEY = 'mupid.admin.user';
    var LOGIN_URL = '/api/admin/login';
    var API = '/api/v1/admin';

    // 쪽 크기 선택지. 주소로 들어온 값도 이 목록에 있는 것만 받는다 — 목록에 없는 수는
    // 아래 <select> 에서 아무것도 선택되지 않은 것처럼 보인다.
    var PAGE_SIZES = [10, 25, 50, 100, 200];
    var DEFAULT_SIZE = 25;

    var state = {
        resources: [],
        dashboard: null,
        view: 'dashboard',
        console: null,
        consoleTab: 'play',
        consoleTimer: null,
        resource: null,
        schema: null,
        /**
         * 자원 이름 → 스키마. 타임라인이 **자기 밴드들의 스키마**를 미리 받아 둔다
         * (S15P21A204-380-C).
         *
         * <p>왜 미리 받는가. 드래그를 시작할 때 받으러 가면 첫 드래그가 눈에 띄게 느려지고,
         * 그 사이에 손을 떼면 **어느 컬럼에 저장할지 모른 채** 끝난다. 스키마는
         * `updatable` 여부를 알려 주므로 "끌 수 있는 항목인가" 의 판단 근거이기도 하다.
         *
         * <p>이미 받은 자원은 다시 받지 않는다 — 밴드 셋이 다 다른 자원이라 타임라인을
         * 열 때마다 세 번씩 더 부르면 낭비다. 자원 이름을 키로 둔다.
         */
        schemas: {},
        /** 가사·구간 타임라인 응답과 그 곡 번호 (S15P21A204-380-B). */
        timeline: null,
        timelineMusicId: null,
        /**
         * 사용자 행동 타임라인 (S15P21A204-430).
         *
         * <p>창(`userFrom`·`userTo`)과 펼친 날(`userDate`)을 **응답에서 받아 둔다.**
         * 화면이 기본값을 따로 계산하면 다음 요청이 서버가 그려 준 것과 다른 창을 묻게
         * 되고, 날짜 막대와 시간축이 서로 다른 기간을 가리킨다.
         */
        userTimeline: null,
        userTimelineUserId: null,
        userFrom: null,
        userTo: null,
        userDate: null,
        /**
         * AI 선호도 (S15P21A204-427). 창은 사용자 타임라인처럼 **응답에서 받아 둔다** —
         * 기본 창의 "오늘" 은 서버의 Asia/Seoul 이다. 지표는 화면만의 선택이라 서버에
         * 보내지 않고 주소에만 싣는다.
         */
        aiPreference: null,
        aiFrom: null,
        aiTo: null,
        aiMetric: 'engaged_rate',
        page: 0,
        size: DEFAULT_SIZE,
        sort: null,
        direction: 'desc',
        keyword: '',
        filters: {},
        rows: null
    };

    /**
     * 토큰이 필요한 이미지를 받아 둔 blob 주소. 주소 → blob URL.
     *
     * 표를 다시 그릴 때마다 같은 이미지를 새로 받으면 목록이 느려진다. 탭이 닫히면
     * 함께 사라지므로 회수(`revokeObjectURL`)는 하지 않는다 — 회수하면 같은 주소를
     * 쓰는 다음 표가 깨진 그림을 그린다.
     */
    var thumbCache = {};

    // ------------------------------------------------------------------ 인증

    function token() {
        return sessionStorage.getItem(TOKEN_KEY);
    }

    function toLogin() {
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(USER_KEY);
        location.replace(LOGIN_URL);
    }

    /**
     * 액세스 토큰은 한 시간짜리다. 만료되면 리프레시 토큰 쿠키로 한 번 되살려 보고,
     * 그것도 안 되면 로그인으로 돌려보낸다.
     *
     * 쿠키가 Secure 라 https 가 아닌 환경에서는 저장되지 않는다. 그때는 되살리기가
     * 실패하고 그냥 다시 로그인하게 된다 — 조용히 실패하는 것보다 낫다.
     */
    var refreshing = null;

    function refresh() {
        if (!refreshing) {
            refreshing = fetch('/api/v1/auth', { credentials: 'include' })
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('만료');
                    }
                    return response.json();
                })
                .then(function (body) {
                    sessionStorage.setItem(TOKEN_KEY, body.data.access_token);
                    return body.data.access_token;
                })
                .finally(function () {
                    refreshing = null;
                });
        }
        return refreshing;
    }

    function request(path, options, retried) {
        var config = Object.assign({ headers: {} }, options || {});
        config.headers = Object.assign({}, config.headers, {
            'Authorization': 'Bearer ' + token()
        });
        if (config.body) {
            config.headers['Content-Type'] = 'application/json';
        }

        return fetch(API + path, config).then(function (response) {
            if (response.status === 401 && !retried) {
                return refresh().then(function () {
                    return request(path, options, true);
                }, function () {
                    toLogin();
                    throw new Error('로그인이 필요합니다.');
                });
            }
            if (response.status === 204) {
                return null;
            }
            return response.json().catch(function () {
                return null;
            }).then(function (body) {
                if (!response.ok) {
                    throw new Error((body && body.message) || ('요청이 실패했습니다 (' + response.status + ')'));
                }
                return body ? body.data : null;
            });
        });
    }

    // -------------------------------------------------------------------- 유틸

    function el(id) {
        return document.getElementById(id);
    }

    function escape(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function number(value) {
        return Number(value).toLocaleString('ko-KR');
    }

    /**
     * 행 수. 서버가 세지 못했으면 -1 로 온다 — 0 으로 그리면 "비었다" 는 거짓말이 된다.
     */
    function count(value) {
        return Number(value) < 0 ? '?' : number(value);
    }

    function bytes(value) {
        var units = ['B', 'KB', 'MB', 'GB'];
        var size = Number(value);
        var unit = 0;
        while (size >= 1024 && unit + 1 < units.length) {
            size = size / 1024;
            unit = unit + 1;
        }
        return size.toFixed(unit === 0 ? 0 : 1) + ' ' + units[unit];
    }

    function duration(seconds) {
        var total = Number(seconds);
        var days = Math.floor(total / 86400);
        var hours = Math.floor((total % 86400) / 3600);
        var minutes = Math.floor((total % 3600) / 60);
        if (days > 0) {
            return days + '일 ' + hours + '시간';
        }
        if (hours > 0) {
            return hours + '시간 ' + minutes + '분';
        }
        return minutes + '분';
    }

    /**
     * 곡 내 시점(ms)을 사람이 읽는 표기로. `m:ss.t`.
     *
     * 타임라인의 항목과 축 눈금에 쓴다. 380-C 가 드래그로 값을 바꾸면 이 표기도 함께
     * 움직여야 하므로 한 곳에 둔다.
     */
    function formatMs(value) {
        var total = Number(value);
        if (!isFinite(total) || total < 0) {
            return '';
        }
        var minutes = Math.floor(total / 60000);
        var seconds = Math.floor((total % 60000) / 1000);
        var tenths = Math.floor((total % 1000) / 100);
        return minutes + ':' + (seconds < 10 ? '0' : '') + seconds + '.' + tenths;
    }

    function toast(message, bad) {
        var root = el('toast-root');
        root.innerHTML = '<div class="toast' + (bad ? ' bad' : '') + '">' + escape(message) + '</div>';
        setTimeout(function () {
            root.innerHTML = '';
        }, bad ? 5000 : 2400);
    }

    function fail(error) {
        toast(error && error.message ? error.message : '알 수 없는 오류입니다.', true);
    }

    // ---------------------------------------------------------------- 왼쪽 목록

    function renderNav() {
        var keyword = el('nav-filter').value.trim().toLowerCase();
        var html = '<button class="nav-item" data-view="dashboard" aria-current="'
            + (state.view === 'dashboard') + '"><strong>대시보드</strong></button>'
            + '<button class="nav-item" data-view="clickhouse" aria-current="'
            + (state.view === 'clickhouse') + '">'
            + '<span><strong>ClickHouse 콘솔</strong>'
            + '<span class="table-name">쿼리 · 차트</span></span></button>'
            + '<button class="nav-item" data-view="userTimeline" aria-current="'
            + (state.view === 'userTimeline') + '">'
            + '<span><strong>사용자 행동 타임라인</strong>'
            + '<span class="table-name">날짜 · 하루 24시간</span></span></button>'
            + '<button class="nav-item" data-view="aiPreference" aria-current="'
            + (state.view === 'aiPreference') + '">'
            + '<span><strong>AI 선호도</strong>'
            + '<span class="table-name">추천곡 재생 · 시간별</span></span></button>';

        var category = null;
        state.resources.forEach(function (resource) {
            var hit = !keyword
                || resource.label.toLowerCase().indexOf(keyword) >= 0
                || resource.name.toLowerCase().indexOf(keyword) >= 0
                || resource.table.toLowerCase().indexOf(keyword) >= 0;
            if (!hit) {
                return;
            }
            if (resource.category !== category) {
                category = resource.category;
                html += '<div class="nav-group">' + escape(category) + '</div>';
            }
            var current = state.view === 'resource' && state.resource === resource.name;
            html += '<button class="nav-item" data-resource="' + escape(resource.name) + '"'
                + ' aria-current="' + current + '">'
                + '<span><strong>' + escape(resource.label) + '</strong>'
                + '<span class="table-name">' + escape(resource.table) + '</span></span>'
                + '<span class="count">' + count(resource.count) + '</span>'
                + '</button>';
        });

        el('nav').innerHTML = html;
    }

    // ---------------------------------------------------------------- 대시보드

    function renderDashboard() {
        var data = state.dashboard;
        if (!data) {
            el('content').innerHTML = '<div class="empty">불러오는 중…</div>';
            return;
        }

        var runtime = data.runtime;
        var totalRows = data.resources.reduce(function (sum, resource) {
            return resource.count < 0 ? sum : sum + resource.count;
        }, 0);

        var html = '<h2>대시보드</h2>'
            + '<p class="sub">이 화면의 모든 수치는 요청한 순간의 값입니다.</p>';

        html += '<div class="grid">'
            + stat('전체 레코드', number(totalRows))
            + stat('관리 자원', number(data.resources.length) + '종')
            + stat('가동 시간', duration(runtime.uptimeSeconds))
            + stat('힙 사용량', bytes(runtime.heapUsed) + ' / ' + bytes(runtime.heapMax))
            + stat('스레드', number(runtime.threads))
            + stat('JVM', 'Java ' + escape(runtime.java) + ' · PID ' + runtime.pid)
            + '</div>';

        html += '<h3>연결 상태</h3><div class="table-wrap"><table><thead><tr>'
            + '<th>대상</th><th>상태</th><th>응답</th><th>비고</th>'
            + '</tr></thead><tbody>';
        data.dependencies.forEach(function (item) {
            var up = item.status === 'UP';
            html += '<tr><td><strong>' + escape(item.name) + '</strong>'
                + (item.target && item.target !== '-' ? ' <span class="muted">' + escape(item.target) + '</span>' : '')
                + '</td>'
                + '<td><span class="pill ' + (up ? 'up' : 'down') + '">' + item.status + '</span></td>'
                + '<td>' + (item.latency >= 0 ? item.latency + 'ms' : '-') + '</td>'
                + '<td class="muted"><span class="cell">' + escape(item.detail || '') + '</span></td></tr>';
        });
        html += '</tbody></table></div>';

        html += '<h3>회원 구성</h3><div class="grid">';
        Object.keys(data.users.byRole).forEach(function (role) {
            html += stat(role, number(data.users.byRole[role]));
        });
        Object.keys(data.users.byStatus).forEach(function (status) {
            html += stat(status, number(data.users.byStatus[status]));
        });
        html += '</div>';

        html += '<h3>레코드가 많은 자원</h3><div class="table-wrap"><table><thead><tr>'
            + '<th>자원</th><th>테이블</th><th>분류</th><th>행 수</th>'
            + '</tr></thead><tbody>';
        data.resources.slice().sort(function (a, b) {
            return b.count - a.count;
        }).slice(0, 10).forEach(function (resource) {
            html += '<tr><td><a href="#" data-resource="' + escape(resource.name) + '">'
                + escape(resource.label) + '</a></td>'
                + '<td class="muted">' + escape(resource.table) + '</td>'
                + '<td class="muted">' + escape(resource.category) + '</td>'
                + '<td>' + count(resource.count) + '</td></tr>';
        });
        html += '</tbody></table></div>';

        el('content').innerHTML = html;
    }

    function stat(key, value) {
        return '<div class="card stat"><div class="k">' + escape(key) + '</div>'
            + '<div class="v">' + value + '</div></div>';
    }

    // ----------------------------------------------------------- ClickHouse 콘솔

    /**
     * ClickHouse 가 스스로 서빙하는 화면(`/play`·`/dashboard`)을 iframe 으로 띄운다.
     *
     * ClickHouse 의 HTTP 포트는 밖으로 열려 있지 않다. iframe 이 부르는 주소는 전부
     * `/api/admin/clickhouse/**` 이고, 스프링이 그 뒤에서 대신 물어본다.
     *
     * 열람권은 **쿠키**로 온다 (`POST /api/v1/admin/clickhouse/console`). iframe 안에서
     * 도는 것은 우리 코드가 아니라 ClickHouse 가 만든 화면이라 Authorization 헤더를
     * 붙일 방법이 없기 때문이다. 그래서 iframe 을 띄우기 **전에** 반드시 한 번 연다.
     */
    function openConsole(tab) {
        state.view = 'clickhouse';
        state.resource = null;
        if (tab) {
            state.consoleTab = tab;
        }
        renderNav();
        el('content').innerHTML = '<div class="empty">콘솔을 여는 중…</div>';

        return request('/clickhouse/console', { method: 'POST' })
            .then(function (opened) {
                state.console = opened;
                scheduleConsoleRenew(opened.expires_in);
                if (state.view !== 'clickhouse') {
                    return;
                }
                renderConsole();
            })
            .catch(function (error) {
                fail(error);
                if (state.view !== 'clickhouse') {
                    return;
                }
                el('content').innerHTML = '<div class="empty">'
                    + escape((error && error.message) || '콘솔을 열지 못했습니다.')
                    + '</div>';
            });
    }

    /**
     * 만료 1분 전에 열람권만 새로 받는다. iframe 은 다시 그리지 않는다 — 쓰고 있던
     * 쿼리가 한 시간마다 사라지면 콘솔을 쓸 수 없다.
     */
    function scheduleConsoleRenew(seconds) {
        clearTimeout(state.consoleTimer);
        if (!seconds || seconds < 120) {
            return;
        }
        state.consoleTimer = setTimeout(function () {
            if (state.view !== 'clickhouse') {
                return;
            }
            request('/clickhouse/console', { method: 'POST' }).then(function (renewed) {
                state.console = renewed;
                scheduleConsoleRenew(renewed.expires_in);
            }, function () {
                // 실패하면 iframe 이 다음 요청에서 만료 안내를 받는다. 거기서 다시 연다.
            });
        }, (seconds - 60) * 1000);
    }

    function renderConsole() {
        var data = state.console;
        if (!data) {
            return;
        }

        var play = state.consoleTab !== 'dashboard';
        var src = play ? data.play_path : data.dashboard_path;

        el('content').innerHTML = '<div class="console">'
            + '<div class="console-bar">'
            + '<button class="btn small' + (play ? '' : ' ghost') + '"'
            + ' data-console-tab="play">쿼리 콘솔</button>'
            + '<button class="btn small' + (play ? ' ghost' : '') + '"'
            + ' data-console-tab="dashboard">차트 대시보드</button>'
            + '<span class="grow"></span>'
            + '<a class="btn ghost small" href="' + escape(src) + '" target="_blank"'
            + ' rel="noopener">새 탭으로</a>'
            + '<button class="btn ghost small" id="console-reopen">다시 열기</button>'
            + '</div>'
            + '<iframe class="console-frame" src="' + escape(src) + '"'
            + ' title="ClickHouse 콘솔"></iframe>'
            + '<p class="sub">ClickHouse 의 HTTP 포트는 밖으로 열려 있지 않습니다. 이 화면이 부르는'
            + ' 주소는 전부 <code>/api/admin/clickhouse</code> 이고, 접속 계정은 API 서버가'
            + ' 붙입니다. 열람권은 ' + number(Math.round(data.expires_in / 60))
            + '분마다 조용히 갱신됩니다.</p>'
            + '</div>';
    }

    // -------------------------------------------------------------------- 표

    /**
     * 표를 다시 그리면 입력 중이던 칸이 통째로 교체된다. 검색어를 한 글자 칠 때마다
     * 포커스가 날아가면 검색을 쓸 수 없으므로, 어디에 커서가 있었는지 기억했다 되돌린다.
     */
    function keepFocus(render) {
        var active = document.activeElement;
        var mark = null;
        if (active && active.dataset && (active.id === 'search' || active.dataset.filter)) {
            mark = {
                selector: active.id === 'search' ? '#search' : '[data-filter="' + active.dataset.filter + '"]',
                start: active.selectionStart,
                end: active.selectionEnd
            };
        }

        render();

        if (mark) {
            var restored = document.querySelector(mark.selector);
            if (restored) {
                restored.focus();
                if (restored.setSelectionRange && mark.start !== null) {
                    restored.setSelectionRange(mark.start, mark.end);
                }
            }
        }
    }

    function renderTable() {
        var schema = state.schema;
        var page = state.rows;
        if (!schema || !page) {
            el('content').innerHTML = '<div class="empty">불러오는 중…</div>';
            return;
        }

        var html = '<h2>' + escape(schema.label) + '</h2>'
            + '<p class="sub">' + escape(schema.table) + ' · ' + escape(schema.name)
            + ' · 전체 ' + number(page.total) + '행</p>';

        html += '<div class="toolbar">'
            + '<input id="search" class="field grow" placeholder="문자열 컬럼 전체에서 검색" value="'
            + escape(state.keyword) + '" autocomplete="off">'
            + '<button class="btn ghost small" id="clear-filters">필터 초기화</button>'
            + '<button class="btn small" id="create">새로 만들기</button>'
            + '</div>';

        html += '<div class="table-wrap"><table><thead><tr>';
        schema.fields.forEach(function (field) {
            var active = state.sort === field.name;
            var arrow = active ? (state.direction === 'asc' ? ' ↑' : ' ↓') : '';
            html += '<th class="sortable" data-sort="' + escape(field.name) + '">'
                + escape(field.label) + arrow
                + (field.id ? ' <span class="muted">#</span>' : '') + '</th>';
        });
        html += '<th></th></tr>';

        html += '<tr class="filter-row">';
        schema.fields.forEach(function (field) {
            html += '<th>' + filterInput(field) + '</th>';
        });
        html += '<th></th></tr></thead><tbody>';

        if (page.content.length === 0) {
            html += '<tr><td colspan="' + (schema.fields.length + 1) + '" class="empty">조건에 맞는 행이 없습니다.</td></tr>';
        }

        page.content.forEach(function (row) {
            html += '<tr>';
            schema.fields.forEach(function (field) {
                html += '<td>' + cell(field, row[field.name], row) + '</td>';
            });
            // 자식 자원으로 건너가는 링크(앨범 행의 "음악")와 편집·삭제가 한 칸에 모인다.
            // 타임라인 버튼은 스키마가 밴드를 선언한 자원(곡)에만 나온다 — 화면이 자원
            // 이름을 보고 판단하지 않는다 (`schema.timeline_axes`).
            html += '<td class="actions">'
                + timelineButton(row)
                + userTimelineButton(row)
                + childLinks(row)
                + ' <button class="btn ghost small" data-edit="' + escape(row._id) + '">편집</button> '
                + '<button class="btn ghost small" data-delete="' + escape(row._id) + '">삭제</button>'
                + '</td></tr>';
        });

        html += '</tbody></table></div>';

        html += '<div class="pager">'
            + '<select id="page-size" class="field">'
            + PAGE_SIZES.map(function (size) {
                return '<option value="' + size + '"' + (size === state.size ? ' selected' : '') + '>'
                    + size + '행</option>';
            }).join('')
            + '</select>'
            + '<span>' + (page.total === 0 ? 0 : page.page + 1) + ' / ' + page.pages + ' 페이지</span>'
            + '<button class="btn ghost small" id="prev"' + (page.page <= 0 ? ' disabled' : '') + '>이전</button>'
            + '<button class="btn ghost small" id="next"'
            + (page.page + 1 >= page.pages ? ' disabled' : '') + '>다음</button>'
            + '</div>';

        el('content').innerHTML = html;

        // 표를 그린 **뒤에** 토큰이 필요한 이미지를 받는다. 목록 자체는 이미 그려졌으므로
        // 이미지가 느리거나 실패해도 표를 읽는 데 지장이 없다.
        loadPrivateThumbnails();
    }

    // ------------------------------------------------- 가사·구간 타임라인 (380-B)

    /**
     * 곡 하나의 가사·구간을 **시간축 위에 가로로** 그린다.
     *
     * <p>표로만 나열하면 요구가 아니다 — 시간 위치가 눈에 보여야 한다. 밴드(가사·구간
     * 분석·구간-분위기)를 위에서 아래로 쌓고, 각 밴드 안에서 항목을 **왼쪽에서 오른쪽으로
     * 시간 위치에 맞춰** 놓는다.
     *
     * <h2>화면이 자원 이름을 모른다</h2>
     *
     * 어떤 밴드가 있고 무엇으로 정렬하는지는 **서버가 준 `axis`** 가 정한다
     * (`AdminTimelineAxis`). 여기에 `lyric`·`timeMs` 같은 이름을 적지 않는다 — 자원이
     * 늘어도 이 함수는 그대로다.
     *
     * <h2>380-C 가 붙을 자리</h2>
     *
     * 모든 항목에 **`data-time-ms`** 가 들어간다(구간은 `data-start-ms`·
     * `data-end-ms` 도). 380-C 의 드래그가 그 속성을 읽어 새 시각을 계산한다. 지금은
     * **배치까지만**이고 마우스 이벤트는 붙이지 않는다.
     */
    function renderTimeline() {
        var data = state.timeline;
        if (!data) {
            el('content').innerHTML = '<div class="empty">불러오는 중…</div>';
            return;
        }

        var html = '<h2>가사 · 구간 타임라인</h2>'
            + '<p class="sub">' + escape(data.title) + ' · 곡 #' + escape(data.music_id)
            + ' · 가로축 ' + (data.has_time ? formatMs(data.axis_max_ms) : '없음')
            + '</p>';

        html += '<div class="toolbar">'
            + '<button class="btn ghost small" data-timeline-back="true">← 목록으로</button>'
            + '<button class="btn ghost small" data-timeline-refresh="true">새로고침</button>'
            + '</div>';

        if (!data.has_time) {
            // 0 을 축으로 나누면 모든 항목이 0% 에 뭉쳐 "시간이 있다" 는 거짓말이 된다.
            html += '<p class="sub">이 곡에는 아직 시간 정보가 없습니다. 아래는 시간 순서 없이'
                + ' 나열한 것입니다 — 분석이 끝나면 시간축 위에 배치됩니다.</p>';
        }

        html += '<div class="timeline">';
        (data.bands || []).forEach(function (band) {
            html += bandHtml(band, data.axis_max_ms, data.has_time);
        });
        html += '</div>';

        el('content').innerHTML = html;
    }

    /**
     * 밴드 하나 = 자원 하나의 항목 줄.
     */
    function bandHtml(band, axisMax, hasTime) {
        var axis = band.axis || {};
        var rows = band.rows || [];
        var range = axis.kind === 'RANGE';

        var html = '<div class="band"><div class="band-head">'
            + '<strong>' + escape(axis.label) + '</strong>'
            + '<span class="muted">' + escape(axis.resource) + ' · ' + rows.length + '개</span>';

        if (band.truncated) {
            // 조용히 자르면 "이 곡에는 이것뿐" 이라는 거짓말이 된다.
            html += ' <span class="pill down">앞 ' + rows.length + '개만 표시 (전체 '
                + number(band.total) + '개)</span>';
        }
        if (!axis.owns_time) {
            // 구간-분위기는 자기 시간 컬럼이 없다. 부모 구간의 시간을 빌려 온다 —
            // 말해 두지 않으면 "왜 분위기에 시간이 있지" 로 보인다.
            html += ' <span class="muted">시간은 부모 구간(' + escape(axis.via_field) + ')에서</span>';
        }
        html += '</div>';

        if (rows.length === 0) {
            return html + '<p class="empty">항목이 없습니다.</p></div>';
        }

        if (!hasTime) {
            // 축이 없으면 위치를 만들 수 없다. 겹쳐 그리는 대신 세로로 나열한다.
            html += '<div class="track no-axis">';
            rows.forEach(function (row) {
                html += itemHtml(row, axis, range, null, null);
            });
            return html + '</div></div>';
        }

        html += '<div class="track" data-edit-resource="' + attr(axis.resource) + '">';
        for (var line = 1; line < 10; line++) {
            html += '<div class="grid-line" style="left:' + (line * 10) + '%"></div>';
        }
        rows.forEach(function (row) {
            // 시작 시각. 점이면 `_time_ms`, 구간이면 `_start_ms` 다 — 서버가 맞춰 보낸다.
            var start = Number(range ? row._start_ms : row._time_ms);
            if (!isFinite(start)) {
                start = null;
            }
            var end = range ? Number(row._end_ms) : null;
            if (!isFinite(end)) {
                end = null;
            }
            html += itemHtml(row, axis, range, start, end);
        });
        html += '</div>';

        html += '<div class="axis-label"><span>0:00.0</span>'
            + '<span>' + formatMs(axisMax) + '</span></div>';
        return html + '</div>';
    }

    /**
     * 항목 하나.
     *
     * **`data-time-ms` 는 언제나 들어간다** — 구간은 시작 시각이 그 값이다. 380-C 의 드래그가
     * 이 속성 위에 붙고, 없으면 붙을 자리가 없다.
     *
     * 시작 시각을 모르면(**시간 컬럼은 있는데 값이 비었다**) 0 으로 그리지 않는다. 0 은
     * "곡 맨 앞" 이라는 거짓 위치가 되므로 노란 항목(`missing`)으로 표시하고 `data-time-ms`
     * 를 붙이지 않는다 — 붙이면 드래그가 없는 시간을 편집하게 된다.
     */
    function itemHtml(row, axis, range, start, end) {
        var hasStart = start !== null && start !== undefined;
        var percent = 0;
        var width = 0;

        // 380-C: **끌 수 있는 항목인가.** 두 조건을 다 만족해야 한다.
        //
        //   1. 시간을 안다(`hasStart`). `missing` 항목에는 `data-time-ms` 가 없고 트랙 위
        //      위치도 없다 — **끌 시작점이 없다.** 380-B 가 의도적으로 속성을 빼 둔 이유가
        //      그것이고, 여기서 그 의도를 그대로 지킨다.
        //   2. 밴드가 **자기 시간 컬럼을 갖는다**(`owns_time`). 부모의 시간을 빌리는
        //      밴드(구간-분위기)의 행에는 시간 컬럼이 아예 없어서 `PATCH` 할 필드가 없다 —
        //      붙이면 저장이 `UNKNOWN_FIELD` 400 으로 떨어진다. 화면이 그 사실을 축 선언에서
        //      읽으므로 자원 이름을 알 필요가 없다.
        //
        // 두 조건 중 하나라도 빠지면 커서도 `grab` 이 아니고 이벤트도 붙지 않는다 —
        // "끌 수 있는 것처럼 보이는데 안 움직인다" 가 가장 나쁜 상태라서다.
        var draggable = hasStart && editableFields(axis, range) !== null;

        if (hasStart && state.timeline && state.timeline.axis_max_ms > 0) {
            var axisMax = state.timeline.axis_max_ms;
            percent = Math.min(100, Math.max(0, (start / axisMax) * 100));
            if (range && end !== null && end !== undefined) {
                // 구간은 폭이 길이다. 최소 폭을 둬서 아주 짧은 구간도 보이게 한다.
                width = Math.max(1.2, ((end - start) / axisMax) * 100);
            }
        }

        var style = '';
        // 위치는 **시작 시각을 알 때만** 준다. 모르는데 `left:0%` 를 주면 항목이 곡 맨 앞에
        // 있는 것처럼 그려진다 — 0 은 "맨 앞" 이라는 거짓 위치다(`missing` 색만으로는
        // 위치가 거짓인 것을 가릴 수 없다). 380-C 의 드래그도 이 자리를 집으면 안 된다.
        if (hasStart && state.timeline && state.timeline.has_time) {
            style = ' style="left:' + percent.toFixed(3) + '%';
            if (range) {
                // 오른쪽 끝이 트랙을 넘지 않게 자른다. 넘치면 잘려 보여 길이를 잘못 읽는다.
                style += ';width:' + Math.min(width, 100 - percent).toFixed(3) + '%';
            }
            style += '"';
        }

        var attrs = ' class="item ' + (range ? 'range' : 'point')
            + (hasStart ? '' : ' missing')
            + (draggable ? ' draggable' : '') + '"'
            + style;

        // 380-C 가 읽을 시간. 없으면 붙이지 않는다(위 주석 참고).
        if (hasStart) {
            attrs += ' data-time-ms="' + Number(start) + '"';
        }
        if (range) {
            if (hasStart) {
                attrs += ' data-start-ms="' + Number(start) + '"';
            }
            if (end !== null && end !== undefined) {
                attrs += ' data-end-ms="' + Number(end) + '"';
            }
        }

        // 어느 행을 고칠 것인가. 행의 모양이 목록 조회와 같아서 `_id` 가 그대로 있다.
        // 자원 이름은 **밴드 머리**(`bandHtml`)에 한 번만 둔다 — 항목마다 되풀이하면
        // 응답이 커지고, 같은 문자열이 항목 수만큼 DOM 에 중복된다.
        attrs += ' data-edit-id="' + attr(row._id) + '"'
            + ' tabindex="0"';
        if (hasStart) {
            // 380-C 의 드래그가 새 시각을 계산할 때 쓸 **지금 값**. `data-time-ms`(위치)와
            // 같은 값이지만 의미가 다르다 — 이쪽은 편집 대상의 현재 값이다.
            attrs += ' data-edit-time="' + Number(start) + '"';
        }
        if (range && end !== null && end !== undefined) {
            attrs += ' data-edit-end="' + Number(end) + '"';
        }

        var label = itemLabel(row, axis);
        var title = label + (hasStart ? ' @ ' + formatMs(start) : ' (시간 없음)');
        var html = '<div' + attrs + ' title="' + attr(title) + '">';
        if (hasStart) {
            html += '<span class="at">' + formatMs(start) + '</span>';
        }
        html += escape(label);
        if (!hasStart) {
            html += ' <span class="borrowed">시간 없음</span>';
        }
        return html + '</div>';
    }

    /**
     * 항목에 보일 한 줄. 무엇을 이어 붙일지는 **서버가 준 `title_fields`** 가 정한다 —
     * 화면에 자원별 컬럼 이름을 적지 않는다.
     *
     * FK 필드(`moodCode`)는 번호 대신 `_labels` 의 대표값을 쓴다. 번호만 보이면 어느
     * 분위기인지 알 수 없다(380-A 와 같은 규칙).
     */
    function itemLabel(row, axis) {
        var labels = row._labels || {};
        var parts = [];
        (axis.title_fields || []).forEach(function (name) {
            var value = row[name];
            if (value === null || value === undefined || value === '') {
                return;
            }
            if (labels[name] !== undefined && labels[name] !== null) {
                parts.push(String(labels[name]));
                return;
            }
            parts.push(String(value));
        });
        if (parts.length === 0) {
            return '#' + (row._id === null || row._id === undefined ? '?' : String(row._id));
        }
        return parts.join(' ');
    }

    /**
     * HTML 텍스트로 escape. 기존 `escape()` 와 같은 일이지만 이름을 따로 둔다 —
     * 이 화면의 값은 자원 `Map` 에서 온 것이라 무엇을 escape 하는지 코드에 드러내는 편이 낫다.
     */
    function escapeHtml(value) {
        return escape(value);
    }

    /**
     * **HTML 속성값**으로 escape. 기존 `escape()` 는 따옴표로 큰 속성에 그대로 쓰면 위험하다 —
     * `&quot;` 만 처리하고 `'` 를 남기는데, 이 화면의 JS 는 속성을 `'` 로 두는 곳이 많다.
     * 값은 대부분 서버에서 오지만 `text` 처럼 **사람이 넣은 문자열**도 섞여 있다.
     */
    function attr(value) {
        return escapeHtml(value)
            .replace(/'/g, '&#39;');
    }

    function filterInput(field) {
        var value = state.filters[field.name] || '';
        if (field.type === 'enum' || field.type === 'boolean') {
            var options = field.type === 'boolean' ? ['true', 'false'] : field.options;
            var html = '<select class="field" data-filter="' + escape(field.name) + '">'
                + '<option value="">전체</option>';
            options.forEach(function (option) {
                html += '<option value="' + escape(option) + '"'
                    + (value === option ? ' selected' : '') + '>' + escape(option) + '</option>';
            });
            if (field.nullable) {
                html += '<option value="__null__"' + (value === '__null__' ? ' selected' : '') + '>(비어 있음)</option>';
            }
            return html + '</select>';
        }
        return '<input class="field" data-filter="' + escape(field.name) + '" value="'
            + escape(value) + '" placeholder="일치" autocomplete="off">';
    }

    /**
     * FK 한 칸. **대표값과 번호를 함께** 그린다.
     *
     * 대표값이 무엇인지는 서버가 정한다 — 자원마다 다르고(회원=이메일, 아티스트=이름,
     * 앨범=제목) 화면이 자원 목록을 알고 있어야 나올 수 있는 판단이라 여기서 다시
     * 추론하지 않는다 (`field.representativeField`). 값은 목록 응답의 `row._labels` 에
     * 행 전체분이 한 번에 실려 온다 — 행마다 따로 물어보면 그대로 N+1 이 된다.
     */
    function relationCell(field, row, value) {
        var labels = row._labels || {};
        var label = labels[field.name];
        var html = '<span class="fk">'
            + thumbnail(field, row)
            + '<a href="#" data-relation="' + escape(field.relation) + '" data-id="'
            + escape(value) + '">'
            + (label === undefined || label === null
                ? '<span class="muted">' + escape(value) + '</span>'
                : escape(label))
            + '</a>'
            // 번호는 남긴다. 요구가 "대표값과 번호를 함께" 이고, 대표값이 중복될 수 있어서
            // (제목이 같은 앨범) 번호가 없으면 어느 행인지 특정할 수 없다.
            + '<span class="id">#' + escape(value) + '</span>'
            + '</span>';
        return html;
    }

    /**
     * 작은 이미지 한 자리.
     *
     * 서버가 `field.thumbnailable` 로 "이미지라는 개념이 있는 필드인가" 를 알려 준다.
     * 값이 없으면 **빈 자리를 쓰지 않고 `?` 를 그린다** — 빈칸은 "아직 안 불러왔다" 와
     * 구분되지 않아 화면이 거짓말을 하게 된다.
     *
     * 주소는 서버가 파일 번호로 만들어 보낸다(`_thumbnails`). 인증이 필요한지도 서버가
     * 판단해 값으로 준다 — 앨범·아티스트 표지는 공개지만(그래서 `<img src>` 로 바로 된다)
     * 프로필은 아니다(`ImageAccessPolicy.OWNER`). `<img src>` 에는 Authorization 헤더를
     * 붙일 수 없으므로, 필요한 것만 토큰을 붙여 받아 blob 주소로 바꾼다.
     */
    function thumbnail(field, row) {
        if (!field.thumbnailable) {
            return '';
        }
        var thumbnails = row._thumbnails || {};
        var found = thumbnails[field.name];
        if (!found) {
            return '<span class="thumb thumb-empty" title="이미지 없음">?</span>';
        }
        if (found.requires_authorization) {
            return '<span class="thumb thumb-empty" data-thumb="' + escape(found.url)
                + '" title="불러오는 중">…</span>';
        }
        return '<img class="thumb" src="' + escape(found.url) + '" alt="" loading="lazy"'
            // 주소는 있는데 실제로 못 받아오는 경우가 있다 — 저장소 객체가 사라졌거나
            // (파일 행은 남아 있다) 받아오는 중에 실패한 경우다. 그대로 두면 브라우저가
            // 깨진 그림 아이콘을 그려서 "이미지가 있는데 못 그렸다" 처럼 보인다.
            // 값이 없을 때와 **같은 `?`** 로 떨어뜨려 두 경우를 한 가지로 보이게 한다.
            + ' onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),'
            + '{className:\'thumb thumb-empty\', textContent:\'?\', title:\'이미지를 불러오지 못했습니다\'}))">';
    }

    /**
     * 토큰이 필요한 이미지를 받아 blob 주소로 바꿔 끼운다.
     *
     * 표를 그린 **뒤에** 돈다. 이미지 요청이 표 그리기를 붙잡으면 목록이 느려지고, 실패한
     * 자리는 `?` 로 남겨 두면 되기 때문이다. 표를 다시 그리면 이 자리도 다시 돈다.
     */
    function loadPrivateThumbnails() {
        var slots = document.querySelectorAll('[data-thumb]');
        Array.prototype.forEach.call(slots, function (slot) {
            var url = slot.dataset.thumb;
            // 이미 받아 둔 것은 다시 받지 않는다. 표를 다시 그릴 때마다 같은 이미지를
            // 매번 받으면 목록이 느려진다.
            if (thumbCache[url]) {
                paintThumbnail(slot, thumbCache[url]);
                return;
            }
            fetch(url, { headers: { 'Authorization': 'Bearer ' + token() } })
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('이미지를 받지 못했습니다.');
                    }
                    return response.blob();
                })
                .then(function (blob) {
                    var objectUrl = URL.createObjectURL(blob);
                    thumbCache[url] = objectUrl;
                    paintThumbnail(slot, objectUrl);
                })
                .catch(function () {
                    // 못 받아온 자리는 `?` 로 남긴다. 조용히 빈칸으로 두면 "없음" 과
                    // 구분되지 않는다.
                    slot.textContent = '?';
                    slot.title = '이미지를 받지 못했습니다';
                });
        });
    }

    function paintThumbnail(slot, objectUrl) {
        var image = document.createElement('img');
        image.className = 'thumb';
        image.alt = '';
        image.src = objectUrl;
        slot.replaceWith(image);
    }

    /**
     * 이 행의 가사·구간 타임라인으로 가는 버튼.
     *
     * 스키마가 밴드를 선언한 자원에만 나온다(`schema.timeline_axes`). 화면이 "곡이면
     * 타임라인" 이라고 판단하지 않는다 — 그 판단은 서버의 `TIMELINES` 선언에 있다.
     */
    function timelineButton(row) {
        var axes = state.schema.timeline_axes || [];
        if (!axes.length) {
            return '';
        }
        return '<button class="btn ghost small" data-timeline-id="' + attr(row._id) + '">'
            + '가사·구간</button> ';
    }

    /**
     * 이 행의 행동 타임라인으로 가는 단추 (S15P21A204-430).
     *
     * 스키마가 그렇다고 한 자원에만 나온다(`schema.event_timeline`). 화면이 "회원이면
     * 행동" 이라고 판단하지 않는다 — 그 판단은 서버의 `EVENT_TIMELINES` 선언에 있고,
     * 대상이 늘어도 이 함수는 그대로다 (`timelineButton` 과 같은 규칙).
     */
    function userTimelineButton(row) {
        if (!state.schema.event_timeline) {
            return '';
        }
        return '<button class="btn ghost small" data-user-timeline-id="' + attr(row._id) + '">'
            + '행동</button> ';
    }

    /**
     * 곡 하나의 타임라인을 연다 (S15P21A204-380-B).
     *
     * 표를 그리지 않고 **별도 보기**다. 표로만 나열하면 "가로로 시간순 배치" 라는 요구가
     * 사라진다. 다만 항목을 고칠 때는 목록 화면과 **같은 편집기**를 쓴다 — 행의 모양이
     * 같기 때문이다(`_id`·`_labels`).
     */
    function openTimeline(musicId) {
        state.view = 'timeline';
        state.timelineMusicId = musicId;
        renderNav();
        el('content').innerHTML = '<div class="empty">타임라인을 불러오는 중…</div>';

        return loadTimeline(musicId);
    }

    /**
     * 타임라인을 (다시) 불러온다. 저장 뒤에도 **이것을 부른다** — 저장했는데 화면이 옛
     * 값을 보여주면 사용자는 저장 실패로 읽는다.
     */
    function loadTimeline(musicId) {
        var asked = musicId;

        return request('/resource/music/' + encodeURIComponent(asked) + '/timeline')
            .then(function (timeline) {
                // 늦게 온 응답이 다른 화면을 덮어쓰지 않게 막는다.
                if (state.view !== 'timeline' || state.timelineMusicId !== asked) {
                    return;
                }
                state.timeline = timeline;
                renderTimeline();
                // 항목을 그린 **뒤에** 밴드들의 스키마를 받아 둔다 (380-C). 그래야 "끌 수
                // 있는 항목인가" 를 스키마의 `updatable` 로 판단할 수 있고, 드래그를
                // 시작하는 순간에 네트워크를 기다리지 않는다.
                loadTimelineSchemas();
            })
            .catch(function (error) {
                fail(error);
                if (state.view !== 'timeline' || state.timelineMusicId !== asked) {
                    return;
                }
                el('content').innerHTML = '<div class="empty">'
                    + escape((error && error.message) || '타임라인을 불러오지 못했습니다.')
                    + '</div>';
            });
    }

    /**
     * 타임라인 항목 하나를 편집한다.
     *
     * **목록 화면의 편집기를 그대로 쓴다.** 타임라인 응답의 행은 자원 목록의 행과 같은
     * 모양(`_id`·필드 이름)이라 같은 폼이 그대로 맞는다. 저장 경로도 같다 —
     * `PATCH /api/v1/admin/resource/{resource}/{id}`. 그래서 "저장 후 화면 갱신" 은
     * 목록을 다시 부르는 대신 **타임라인을 다시 부른다**: 목록이 아니라 타임라인을 보고
     * 있기 때문이다. 저장했는데 옛 값이 보이면 사용자는 저장 실패로 읽는다.
     */
    function openTimelineItem(resource, id) {
        var band = null;
        (state.timeline.bands || []).forEach(function (candidate) {
            if (candidate.axis && candidate.axis.resource === resource) {
                band = candidate;
            }
        });
        var row = null;
        if (band) {
            (band.rows || []).forEach(function (candidate) {
                if (String(candidate._id) === String(id)) {
                    row = candidate;
                }
            });
        }
        if (!row) {
            fail(new Error('항목을 찾지 못했습니다. 새로고침해 주세요.'));
            return;
        }

        // 이 자원의 스키마가 필요하다. 타임라인 항목은 목록 화면과 **같은 편집기**를 쓴다.
        request('/resource/' + resource + '/schema').then(function (schema) {
            schemaEditor(schema, resource, row, function () {
                return loadTimeline(state.timelineMusicId);
            });
        }).catch(fail);
    }

    /**
     * 이 밴드의 시간을 고칠 수 있는가. 고칠 수 있으면 **저장에 보낼 필드 이름**을, 아니면
     * `null` 을 돌려준다 (S15P21A204-380-C).
     *
     * <p>두 가지를 함께 본다.
     *
     * <ol>
     *   <li>밴드가 **자기 시간 컬럼을 갖는가**(`owns_time`). 부모의 시간을 빌리는 밴드
     *       (구간-분위기)의 행에는 시간 컬럼이 아예 없다 — 그 행을 `PATCH` 하면
     *       `UNKNOWN_FIELD` 400 이다. 화면이 그 사실을 **축 선언에서** 읽는다.</li>
     *   <li>그 컬럼이 자원 스키마에서 **수정 가능한가**(`updatable`). 식별자이거나
     *       `updatable = false` 인 컬럼이면 서버가 조용히 무시하므로, 보낸 척하지 않는다.</li>
     * </ol>
     *
     * <p>스키마는 아직 안 받아 왔을 수 있다. 그때는 **끌 수 없다고 본다** — 스키마 없이
     * 필드 이름을 추측하면 어느 컬럼에 넣을지 알 수 없고, 틀린 이름을 보내면 400 이다.
     *
     * <p>축 자체가 없을 때(`has_time=false`, 축 최대값 0)도 끌 수 없다. 항목이
     * `.track.no-axis` 안에 세로로 나열되어 `left%` 가 의미를 갖지 않고, 0 으로 나누면
     * 모든 위치가 같아진다. 커서가 `grab` 인데 아무 일도 안 일어나는 상태가 가장 나쁘므로
     * **여기서 미리 막는다** (`beginDrag` 도 같은 조건으로 한 번 더 막는다).
     */
    function editableFields(axis, range) {
        if (!axis || !axis.owns_time) {
            return null;
        }
        if (!(state.timeline && state.timeline.axis_max_ms > 0)) {
            return null;
        }
        var schema = state.schemas[axis.resource];
        if (!schema) {
            return null;
        }
        // 축 선언이 어느 컬럼인지 말한다. 점이면 `time_field`, 구간이면 `start_field`·
        // `end_field` 다 — 화면에 컬럼 이름을 박지 않는다는 380-B 규칙 그대로다.
        var startName = range ? axis.start_field : axis.time_field;
        var endName = range ? axis.end_field : null;

        var startField = fieldOf(schema, startName);
        if (!startField || !startField.updatable) {
            return null;
        }
        if (range) {
            var endField = fieldOf(schema, endName);
            // 구간은 양끝이 다 있어야 한다. 한쪽만 옮기면 길이가 조용히 늘어나는데,
            // 그건 사용자가 요청한 동작이 아니다.
            if (!endField || !endField.updatable) {
                return null;
            }
        }
        return { start: startName, end: range ? endName : null };
    }

    /**
     * 스키마에서 필드 하나를 찾는다. 없으면 `null`.
     */
    function fieldOf(schema, name) {
        var found = null;
        (schema.fields || []).forEach(function (field) {
            if (field.name === name) {
                found = field;
            }
        });
        return found;
    }

    /**
     * 필요한 자원 스키마를 받아 둔다. **없을 때만** 부른다.
     *
     * <p>드래그를 시작할 때 스키마를 받으러 가면 첫 드래그가 눈에 띄게 느려지고, 그 사이에
     * 사용자가 손을 떼면 저장할 필드 이름을 모른 채 끝난다. 그래서 타임라인을 그린 **뒤**
     * 밴드마다 한 번 받아 둔다. 이미 받은 것은 다시 받지 않는다.
     */
    function loadTimelineSchemas() {
        var data = state.timeline;
        if (!data) {
            return Promise.resolve();
        }
        var wanted = [];
        (data.bands || []).forEach(function (band) {
            var axis = band.axis || {};
            if (axis.resource && !state.schemas[axis.resource]) {
                wanted.push(axis.resource);
            }
        });
        if (wanted.length === 0) {
            // 이미 다 받아 뒀다. 다시 그리지 않는다 — 저장할 때마다 화면을 통째로
            // 갈아 끼우면 스크롤이 튀고, 방금 손으로 옮긴 항목이 사라진 것처럼 보인다.
            return Promise.resolve();
        }

        return Promise.all(wanted.map(function (resource) {
            return request('/resource/' + encodeURIComponent(resource) + '/schema')
                .then(function (schema) {
                    state.schemas[resource] = schema;
                })
                .catch(function () {
                    // 스키마를 못 받으면 그 밴드는 **끌 수 없게** 남는다(위 `editableFields`).
                    // 타임라인 자체는 볼 수 있으므로 화면을 죽이지 않는다.
                    return null;
                });
        })).then(function () {
            // 스키마가 늦게 도착했다면 그 사이에 그려진 항목은 `draggable` 표시가 없다.
            // 지금 화면이 아직 타임라인이면 다시 그려 커서와 이벤트를 붙인다.
            if (state.view === 'timeline' && state.timeline) {
                renderTimeline();
            }
        });
    }

    // ------------------------------------------------------------- 드래그 (380-C)

    /**
     * 항목을 끌어 **시각을 옮긴다** (S15P21A204-380-C).
     *
     * <h2>왜 라이브러리를 안 쓰는가</h2>
     *
     * 필요한 것은 `pointerdown`·`pointermove`·`pointerup` 셋과 좌표 → 시각 변환뿐이다.
     * 라이브러리를 넣으면 의존성과 번들 크기가 늘고, 무엇보다 이 화면의 `data-*` 계약
     * (`data-time-ms`·`data-edit-time`)에 맞추는 접착 코드가 오히려 늘어난다.
     *
     * <h2>클릭과 어떻게 구분하는가</h2>
     *
     * 380-B 는 항목 `click` 으로 편집 모달을 연다. **드래그를 붙이면서 클릭이 죽으면
     * 안 된다.** 그래서 `pointerdown` 에서 바로 잡지 않고 **임계값(4px)을 넘겨 움직였을
     * 때만** 드래그로 승격한다. 임계값 미만이면 아무것도 하지 않고 손을 떼므로 브라우저가
     * `click` 을 정상적으로 만들어 준다 — 클릭은 380-B 의 위임 핸들러가 그대로 받는다.
     *
     * <p>승격된 드래그에서는 `click` 이 따라오면 **한 번 삼킨다**. 안 삼키면 놓는 순간
     * 편집 모달이 함께 열려, 방금 옮긴 항목을 또 고치라는 창이 뜬다.
     *
     * <h2>낙관적 UI 와 실패</h2>
     *
     * 항목을 먼저 옮겨 놓고 저장한다(끌고 있는 동안 손끝을 따라가야 하므로). 저장이
     * 실패하면 **원위치로 되돌리고** 알린다 — 화면만 옮겨 두면 사용자는 저장된 줄 안다.
     */
    var DRAG_THRESHOLD_PX = 4;

    var drag = null;

    /**
     * 방금 드래그를 끝낸 항목. **놓은 직후 따라오는 `click` 을 삼키기 위해** 둔다.
     *
     * <p>깃발(`true`/`false`)이 아니라 항목과 시각을 남기는 이유는, 깃발로 두면
     * `click` 이 오지 않는 경우(포인터가 항목 밖에서 풀렸거나 드래그가 취소된 경우)
     * **다음에 오는 무관한 클릭을 삼켜** 편집 모달이 한 번 안 열리기 때문이다. 항목과
     * 시각을 함께 보면 "이 항목에, 방금" 일 때만 삼키고 나머지는 그대로 통과한다.
     */
    var lastDragEnd = null;

    /** 이 시간 안에 온 같은 항목의 클릭만 삼킨다. 사람이 두 번 누르는 간격보다 짧게. */
    var SWALLOW_CLICK_MS = 700;

    function beginDrag(event, item, track) {
        var axis = axisOfResource(track.dataset.editResource);
        var range = item.dataset.startMs !== undefined && item.dataset.endMs !== undefined;
        var editable = editableFields(axis, range);
        if (!editable) {
            // 여기 올 일이 없다 — `draggable` 표시가 같은 판단을 쓴다. 그래도 막아 둔다.
            return;
        }

        var axisMax = state.timeline ? state.timeline.axis_max_ms : 0;
        if (!(axisMax > 0)) {
            return;
        }

        var start = Number(item.dataset.editTime);
        if (!isFinite(start)) {
            return;
        }
        var end = range ? Number(item.dataset.editEnd) : null;
        if (range && !isFinite(end)) {
            return;
        }

        var rect = track.getBoundingClientRect();
        if (!(rect.width > 0)) {
            return;
        }

        drag = {
            item: item,
            track: track,
            axis: axis,
            editable: editable,
            range: range,
            axisMax: axisMax,
            rect: rect,
            // 손을 댄 x. 임계값 판정과 변환의 기준점이다.
            grabX: event.clientX,
            grabY: event.clientY,
            // 끌기 시작한 시각과 그때의 항목 값. **되돌릴 때 쓰는 값**이라 따로 둔다.
            fromStart: start,
            fromEnd: end,
            // 지금 계산된 값. 놓으면 이걸 저장한다.
            nextStart: start,
            nextEnd: end,
            moved: false,
            pointerId: event.pointerId,
            guide: null,
            readout: null
        };

        // 클릭을 먼저 막지 않는다. 여기서 `preventDefault` 를 부르면 임계값 미만으로
        // 손을 뗐을 때 브라우저가 `click` 을 만들지 않아 **380-B 의 편집 모달이 죽는다.**
        if (item.setPointerCapture) {
            try {
                item.setPointerCapture(event.pointerId);
            } catch (error) {
                // 캡처를 못 해도 문서 레벨 리스너가 받으므로 계속한다. 캡처의 이점은
                // 손이 항목 밖으로 나가도 이벤트가 계속 오는 것뿐이다.
            }
        }
        document.addEventListener('pointermove', onDragMove);
        document.addEventListener('pointerup', onDragEnd);
        // 취소는 **저장하지 않는다.** 브라우저가 터치 제스처·창 전환 등으로 드래그를
        // 끊었을 때 그 중간값이 저장되면, 사용자는 손대지 않은 값이 DB 에 들어간 것을
        // 나중에야 알게 된다.
        document.addEventListener('pointercancel', onDragCancel);
        document.addEventListener('keydown', onDragKey);
    }

    /** 브라우저가 드래그를 끊었다. 되돌린다. */
    function onDragCancel() {
        onDragEnd(null, true);
    }

    function onDragMove(event) {
        if (!drag) {
            return;
        }

        var dx = event.clientX - drag.grabX;
        var dy = event.clientY - drag.grabY;

        if (!drag.moved) {
            // 임계값 미만이면 아직 클릭일 수 있다. 여기서 승격하지 않는다.
            if (Math.abs(dx) < DRAG_THRESHOLD_PX && Math.abs(dy) < DRAG_THRESHOLD_PX) {
                return;
            }
            promoteDrag();
        }

        // 가로 이동만 시각이 된다. 세로는 쓰지 않는다 — 축은 하나뿐이다.
        var moved = (dx / drag.rect.width) * drag.axisMax;
        var next = drag.fromStart + moved;
        // 380-C 요구 4: **경계를 넘기지 않는다.** 화면 밖으로 나가면 되돌릴 수 없다.
        // 정수 ms 로 반올림한다 — 컬럼이 `int` 라 소수점을 보내면 서버가 잘라 낸다.
        next = Math.round(clamp(next, 0, drag.axisMax));

        if (drag.range) {
            // 구간은 **길이를 유지한 채** 통째로 옮긴다. 끝을 고정하면 길이가 변하는데,
            // "타이밍을 옮긴다" 는 요구에 그 동작은 들어 있지 않다.
            var span = drag.fromEnd - drag.fromStart;
            var start = clamp(next, 0, Math.max(0, drag.axisMax - span));
            drag.nextStart = Math.round(start);
            drag.nextEnd = Math.round(start + span);
        } else {
            drag.nextStart = next;
            drag.nextEnd = null;
        }

        paintDrag(event);
    }

    /**
     * 임계값을 넘겼다 — 이제 드래그다. 항목을 손끝에 붙이고 안내를 띄운다.
     */
    function promoteDrag() {
        drag.moved = true;
        drag.item.classList.add('dragging');
        document.body.classList.add('timeline-dragging');

        var guide = document.createElement('div');
        guide.className = 'drop-guide';
        drag.track.appendChild(guide);
        drag.guide = guide;

        var readout = document.createElement('div');
        readout.className = 'drag-readout';
        document.body.appendChild(readout);
        drag.readout = readout;
    }

    /**
     * 끌고 있는 동안의 화면. 항목 위치·놓을 자리 안내·시각 표시를 **같은 값에서** 만든다 —
     * 셋이 다른 값을 보여 주면 사용자가 무엇을 믿어야 할지 모른다.
     */
    function paintDrag(event) {
        var percent = (drag.nextStart / drag.axisMax) * 100;
        percent = Math.min(100, Math.max(0, percent));

        // 항목의 `left` 를 직접 옮긴다. `data-*` 는 아직 건드리지 않는다 — 놓을 때
        // 저장이 성공한 뒤에 맞춘다.
        drag.item.style.left = percent.toFixed(3) + '%';
        if (drag.range) {
            var width = ((drag.nextEnd - drag.nextStart) / drag.axisMax) * 100;
            drag.item.style.width = Math.min(width, 100 - percent).toFixed(3) + '%';
        }

        if (drag.guide) {
            drag.guide.style.left = percent.toFixed(3) + '%';
        }

        if (drag.readout) {
            // **시각이 보여야 한다.** 옮기기 전 값도 함께 둔다 — 얼마나 움직였는지가
            // 보이지 않으면 조절이 아니라 도박이다.
            drag.readout.innerHTML = formatMs(drag.nextStart)
                + (drag.range ? ' ~ ' + formatMs(drag.nextEnd) : '')
                + ' <span class="was">← ' + formatMs(drag.fromStart) + '</span>';
            drag.readout.style.left = (event.clientX + 14) + 'px';
            drag.readout.style.top = (event.clientY - 30) + 'px';
        }
    }

    /**
     * 손을 뗐다 — 드래그를 끝낸다.
     *
     * @param cancelled `true` 면 저장하지 않고 **원위치로 되돌린다**(`pointercancel`·Esc).
     *                  항목의 `left` 가 옮겨진 채로 남으면 화면이 저장된 것처럼 보이는데
     *                  DB 에는 들어가지 않았다.
     */
    function onDragEnd(event, cancelled) {
        if (!drag) {
            return;
        }
        var current = drag;
        drag = null;

        document.removeEventListener('pointermove', onDragMove);
        document.removeEventListener('pointerup', onDragEnd);
        document.removeEventListener('pointercancel', onDragCancel);
        document.removeEventListener('keydown', onDragKey);

        if (current.item.releasePointerCapture && current.pointerId !== undefined) {
            try {
                current.item.releasePointerCapture(current.pointerId);
            } catch (error) {
                // 이미 풀렸거나 캡처를 못 했던 경우다. 무시한다.
            }
        }

        if (!current.moved) {
            // 임계값 미만이었다 = **클릭이다.** 아무것도 붙이지 않았으므로 브라우저가
            // 만든 `click` 이 380-B 의 편집 모달을 연다. 여기서 끝낸다.
            return;
        }

        // 방금 놓은 `click` 을 한 번 삼킨다. 안 삼키면 편집 모달이 함께 열린다.
        lastDragEnd = { item: current.item, at: Date.now() };

        current.item.classList.remove('dragging');
        document.body.classList.remove('timeline-dragging');
        if (current.readout) {
            current.readout.remove();
            current.readout = null;
        }
        if (current.guide) {
            current.guide.remove();
            current.guide = null;
        }

        if (cancelled || (current.nextStart === current.fromStart
            && current.nextEnd === current.fromEnd)) {
            // 손을 뗐는데 제자리이거나, `pointercancel`·Esc 로 **취소**됐다. 취소는
            // 저장하지 않고 원위치로 되돌린다 — 항목의 `left` 가 옮겨진 채로 남으면
            // 화면이 저장된 것처럼 보이는데 DB 에는 안 들어갔다.
            revertDrag(current);
            return;
        }

        saveDrag(current);
    }

    /**
     * Esc — 끌던 것을 **취소**한다.
     *
     * <p>끌어 놓은 자리가 마음에 안 들 때 마우스를 제자리로 되돌려 놓는 방법밖에 없으면,
     * 되돌리는 도중에 실수로 다른 값이 저장된다. 취소할 수 있어야 조절할 수 있다.
     */
    function onDragKey(event) {
        if (event.key === 'Escape') {
            onDragEnd(null, true);
        }
    }

    /**
     * 놓은 자리를 저장한다.
     *
     * <p>경로는 380-B 가 정한 것을 그대로 쓴다 — `PATCH /resource/{resource}/{id}`. 타임라인
     * 행이 목록 행과 같은 `_id` 모양이라 새 경로가 필요 없다.
     *
     * <p>**보낸 필드는 시각 하나뿐이다.** 행을 통째로 되돌려 보내면 다른 사람이 방금 고친
     * 내용이 내 화면의 옛 값으로 덮인다.
     */
    function saveDrag(current) {
        var payload = {};
        payload[current.editable.start] = current.nextStart;
        if (current.range && current.editable.end) {
            payload[current.editable.end] = current.nextEnd;
        }

        var resource = current.track.dataset.editResource;
        var id = current.item.dataset.editId;

        return request('/resource/' + encodeURIComponent(resource) + '/' + encodeURIComponent(id), {
            method: 'PATCH',
            body: JSON.stringify(payload)
        }).then(function () {
            // 저장이 끝났다. 이제 DOM 의 값을 실제 값에 맞춘다 — 다음 드래그가 여기서
            // 시작하고, `data-time-ms`(위치)도 함께 고쳐야 다시 그리지 않아도 일관된다.
            commitDrag(current, current.nextStart, current.nextEnd);
            toast('가사 시각을 ' + formatMs(current.nextStart) + ' 로 옮겼습니다.');
            // 서버가 준 값이 그대로인지 **다시 받아 확인한다.** 화면이 혼자 옮겨 놓고
            // 저장됐다고 말하는 것보다, 서버가 말한 값을 그리는 편이 정직하다.
            return loadTimeline(state.timelineMusicId);
        }).catch(function (error) {
            // 380-C 요구 5: **낙관적 UI 의 실패는 되돌린다.** 화면만 옮겨 두면 사용자는
            // 저장된 줄 안다.
            revertDrag(current);
            fail(error);
            return null;
        });
    }

    /**
     * 저장이 성공한 뒤 DOM 을 실제 값에 맞춘다. `data-time-ms` 는 **위치**이고
     * `data-edit-time` 은 **편집 대상의 현재 값**이라, 둘 다 새 시각으로 고친다 —
     * 380-B 의 의미를 그대로 두고 값만 바꾼다.
     */
    function commitDrag(current, start, end) {
        var item = current.item;
        item.dataset.timeMs = String(start);
        item.dataset.editTime = String(start);
        if (current.range) {
            item.dataset.startMs = String(start);
            item.dataset.endMs = String(end);
            item.dataset.editEnd = String(end);
        }
        var at = item.querySelector('.at');
        if (at) {
            at.textContent = formatMs(start);
        }
    }

    /**
     * 저장 실패 — **원위치로 되돌린다.**
     *
     * <p>항목 위치를 끌기 전 값으로 되돌리고 표시를 남긴다. 잠시 뒤 표시를 지우는 이유는,
     * 빨간 테두리를 영구히 두면 다음에 정상 저장된 뒤에도 실패처럼 보이기 때문이다.
     */
    function revertDrag(current) {
        var percent = dragPercentOf(current.fromStart, current.axisMax);
        current.item.style.left = percent.toFixed(3) + '%';
        if (current.range) {
            var width = ((current.fromEnd - current.fromStart) / current.axisMax) * 100;
            current.item.style.width = Math.min(width, 100 - percent).toFixed(3) + '%';
        }
        current.item.classList.add('reverted');
        setTimeout(function () {
            current.item.classList.remove('reverted');
        }, 4000);
    }

    /** 시각 하나를 트랙 위 백분율로. 항목 배치(`itemHtml`)와 같은 식이어야 한다. */
    function dragPercentOf(ms, axisMax) {
        if (!(axisMax > 0)) {
            return 0;
        }
        return Math.min(100, Math.max(0, (ms / axisMax) * 100));
    }

    /** 축 선언을 자원 이름으로 찾는다. 밴드 목록에서 온다 — 화면에 이름을 박지 않는다. */
    function axisOfResource(resource) {
        var found = null;
        ((state.timeline && state.timeline.bands) || []).forEach(function (band) {
            if (band.axis && band.axis.resource === resource) {
                found = band.axis;
            }
        });
        return found;
    }

    function clamp(value, low, high) {
        if (!isFinite(value)) {
            return low;
        }
        return Math.min(high, Math.max(low, value));
    }

    /**
     * 이 행에서 건너갈 수 있는 자식 자원들 (앨범 행의 "음악").
     *
     * 링크는 자식 자원 목록을 **부모를 가리키는 필터로 걸어서** 연다. 자식 목록 API 가
     * 이미 `filter.<필드>=<값>` 을 받으므로 새 엔드포인트가 필요 없다.
     */
    function childLinks(row) {
        // 키는 응답 그대로 **snake_case** 다. 이 화면의 다른 값(`_labels`, `_thumbnails`,
        // `requires_authorization`)과 같다. camelCase 로 읽으면 조용히 `[]` 가 되어
        // 링크가 **아무 오류 없이** 사라진다 — 실제로 그렇게 만들었다가 브라우저에서
        // 칸 수가 맞지 않는 것으로 드러났다.
        var links = state.schema.child_links || [];
        if (!links.length) {
            return '';
        }
        var html = '<span class="child-links">';
        links.forEach(function (link) {
            html += '<button class="btn ghost small" data-child-resource="'
                + escape(link.child_resource) + '" data-child-field="' + escape(link.filter_field)
                + '" data-child-id="' + escape(row._id) + '">'
                + escape(link.label) + '</button>';
        });
        return html + '</span>';
    }

    function cell(field, value, row) {
        if (field.sensitive) {
            return '<span class="muted">••••••</span>';
        }
        if (value === null || value === undefined) {
            // 값이 없는 FK 도 이미지 자리는 보여 준다 — "사진 없는 회원" 과 "그런 필드가
            // 아님" 은 다르다.
            return (field.relation && field.thumbnailable ? thumbnail(field, row) : '')
                + '<span class="muted">-</span>';
        }
        if (field.relation) {
            return relationCell(field, row, value);
        }
        return '<span class="cell" title="' + escape(value) + '">' + escape(value) + '</span>';
    }

    // ------------------------------------------------------------------ 편집 폼

    function openEditor(row) {
        var resource = state.resource;
        schemaEditor(state.schema, resource, row, function () {
            loadRows();
            loadResources();
        });
    }

    /**
     * 자원 하나의 행을 폼으로 고친다.
     *
     * <p>목록 화면(`openEditor`)과 타임라인 항목이 **같은 함수를 쓴다.** 타임라인 응답의
     * 행은 자원 목록의 행과 같은 모양(`_id`·필드 이름)이라 같은 폼이 그대로 맞기 때문이다.
     * 편집기를 둘로 나누면 한쪽만 고쳐지는 일이 생긴다.
     *
     * @param onSaved 저장이 끝난 뒤 할 일. 화면마다 다시 불러올 대상이 다르다 —
     *                목록은 `loadRows()`, 타임라인은 `loadTimeline()`. 저장했는데 화면이
     *                옛 값을 보여주면 사용자는 저장 실패로 읽으므로 **반드시** 다시 부른다.
     */
    function schemaEditor(schema, resource, row, onSaved) {
        var creating = !row;
        var title = escape(schema.label) + (creating ? ' 추가' : ' 편집');

        var body = '';
        schema.fields.forEach(function (field) {
            var writable = creating ? field.insertable : field.updatable;
            var value = row ? row[field.name] : null;
            body += '<div class="form-row">'
                + '<label>' + escape(field.label)
                + (field.nullable || !writable ? '' : ' <span class="req">*</span>')
                + ' <span class="muted">' + escape(field.type)
