    // ----------------------------------------------------------- ClickHouse 콘솔

    /**
     * ClickHouse 가 스스로 서빙하는 화면(`/play`·`/dashboard`)을 iframe 으로 띄운다.
     *
     * ClickHouse 의 HTTP 포트는 밖으로 열려 있지 않다. iframe 이 부르는 주소는 전부
     * `/api/admin/clickhouse/**` 이고, 스프링이 그 뒤에서 대신 물어본다.
     *
     * 열람권은 **쿠키**로 온다 (`POST /api/v1/admin/clickhouse/console`). iframe 안에서
     * 도는 것은 우리 코드가 아니라 ClickHouse 가 만든 화면이라 Authorization 헤더를
     * 붙일 방법이 없기 때문이다. 그래서 iframe 을 띄우기 **전에** 반드시 한 번 연다.
     */
    function openConsole(tab) {
        state.view = 'clickhouse';
        state.resource = null;
        if (tab) {
            state.consoleTab = tab;
        }
        renderNav();
        el('content').innerHTML = '<div class="empty">콘솔을 여는 중…</div>';

        return request('/clickhouse/console', { method: 'POST' })
            .then(function (opened) {
                state.console = opened;
                scheduleConsoleRenew(opened.expires_in);
                if (state.view !== 'clickhouse') {
                    return;
                }
                renderConsole();
            })
            .catch(function (error) {
                fail(error);
                if (state.view !== 'clickhouse') {
                    return;
                }
                el('content').innerHTML = '<div class="empty">'
                    + escape((error && error.message) || '콘솔을 열지 못했습니다.')
                    + '</div>';
            });
    }

    /**
     * 만료 1분 전에 열람권만 새로 받는다. iframe 은 다시 그리지 않는다 — 쓰고 있던
     * 쿼리가 한 시간마다 사라지면 콘솔을 쓸 수 없다.
     */
    function scheduleConsoleRenew(seconds) {
        clearTimeout(state.consoleTimer);
        if (!seconds || seconds < 120) {
            return;
        }
        state.consoleTimer = setTimeout(function () {
            if (state.view !== 'clickhouse') {
                return;
            }
            request('/clickhouse/console', { method: 'POST' }).then(function (renewed) {
                state.console = renewed;
                scheduleConsoleRenew(renewed.expires_in);
            }, function () {
                // 실패하면 iframe 이 다음 요청에서 만료 안내를 받는다. 거기서 다시 연다.
            });
        }, (seconds - 60) * 1000);
    }

    function renderConsole() {
        var data = state.console;
        if (!data) {
            return;
        }

        var play = state.consoleTab !== 'dashboard';
        var src = play ? data.play_path : data.dashboard_path;

        el('content').innerHTML = '<div class="console">'
            + '<div class="console-bar">'
            + '<button class="btn small' + (play ? '' : ' ghost') + '"'
            + ' data-console-tab="play">쿼리 콘솔</button>'
            + '<button class="btn small' + (play ? ' ghost' : '') + '"'
            + ' data-console-tab="dashboard">차트 대시보드</button>'
            + '<span class="grow"></span>'
            + '<a class="btn ghost small" href="' + escape(src) + '" target="_blank"'
            + ' rel="noopener">새 탭으로</a>'
            + '<button class="btn ghost small" id="console-reopen">다시 열기</button>'
            + '</div>'
            + '<iframe class="console-frame" src="' + escape(src) + '"'
            + ' title="ClickHouse 콘솔"></iframe>'
            + '<p class="sub">ClickHouse 의 HTTP 포트는 밖으로 열려 있지 않습니다. 이 화면이 부르는'
            + ' 주소는 전부 <code>/api/admin/clickhouse</code> 이고, 접속 계정은 API 서버가'
            + ' 붙입니다. 열람권은 ' + number(Math.round(data.expires_in / 60))
            + '분마다 조용히 갱신됩니다.</p>'
            + '</div>';
    }

    // -------------------------------------------------------------------- 표

    /**
     * 표를 다시 그리면 입력 중이던 칸이 통째로 교체된다. 검색어를 한 글자 칠 때마다
     * 포커스가 날아가면 검색을 쓸 수 없으므로, 어디에 커서가 있었는지 기억했다 되돌린다.
     */
    function keepFocus(render) {
        var active = document.activeElement;
        var mark = null;
        if (active && active.dataset && (active.id === 'search' || active.dataset.filter)) {
            mark = {
                selector: active.id === 'search' ? '#search' : '[data-filter="' + active.dataset.filter + '"]',
                start: active.selectionStart,
                end: active.selectionEnd
            };
        }

        render();

        if (mark) {
            var restored = document.querySelector(mark.selector);
            if (restored) {
                restored.focus();
                if (restored.setSelectionRange && mark.start !== null) {
                    restored.setSelectionRange(mark.start, mark.end);
                }
            }
        }
    }

    function renderTable() {
        var schema = state.schema;
        var page = state.rows;
        if (!schema || !page) {
            el('content').innerHTML = '<div class="empty">불러오는 중…</div>';
            return;
        }

        var html = '<h2>' + escape(schema.label) + '</h2>'
            + '<p class="sub">' + escape(schema.table) + ' · ' + escape(schema.name)
            + ' · 전체 ' + number(page.total) + '행</p>';

        html += '<div class="toolbar">'
            + '<input id="search" class="field grow" placeholder="문자열 컬럼 전체에서 검색" value="'
            + escape(state.keyword) + '" autocomplete="off">'
            + '<button class="btn ghost small" id="clear-filters">필터 초기화</button>'
            + '<button class="btn small" id="create">새로 만들기</button>'
            + '</div>';

        html += '<div class="table-wrap"><table><thead><tr>';
        schema.fields.forEach(function (field) {
            var active = state.sort === field.name;
            var arrow = active ? (state.direction === 'asc' ? ' ↑' : ' ↓') : '';
            html += '<th class="sortable" data-sort="' + escape(field.name) + '">'
                + escape(field.label) + arrow
                + (field.id ? ' <span class="muted">#</span>' : '') + '</th>';
        });
        html += '<th></th></tr>';

        html += '<tr class="filter-row">';
        schema.fields.forEach(function (field) {
            html += '<th>' + filterInput(field) + '</th>';
        });
        html += '<th></th></tr></thead><tbody>';

        if (page.content.length === 0) {
            html += '<tr><td colspan="' + (schema.fields.length + 1) + '" class="empty">조건에 맞는 행이 없습니다.</td></tr>';
        }

        page.content.forEach(function (row) {
            html += '<tr>';
            schema.fields.forEach(function (field) {
                html += '<td>' + cell(field, row[field.name], row) + '</td>';
            });
            // 자식 자원으로 건너가는 링크(앨범 행의 "음악")와 편집·삭제가 한 칸에 모인다.
            // 타임라인 버튼은 스키마가 밴드를 선언한 자원(곡)에만 나온다 — 화면이 자원
            // 이름을 보고 판단하지 않는다 (`schema.timeline_axes`).
            html += '<td class="actions">'
                + timelineButton(row)
                + childLinks(row)
                + ' <button class="btn ghost small" data-edit="' + escape(row._id) + '">편집</button> '
                + '<button class="btn ghost small" data-delete="' + escape(row._id) + '">삭제</button>'
                + '</td></tr>';
        });

        html += '</tbody></table></div>';

        html += '<div class="pager">'
            + '<select id="page-size" class="field">'
            + [10, 25, 50, 100, 200].map(function (size) {
                return '<option value="' + size + '"' + (size === state.size ? ' selected' : '') + '>'
                    + size + '행</option>';
            }).join('')
            + '</select>'
            + '<span>' + (page.total === 0 ? 0 : page.page + 1) + ' / ' + page.pages + ' 페이지</span>'
            + '<button class="btn ghost small" id="prev"' + (page.page <= 0 ? ' disabled' : '') + '>이전</button>'
            + '<button class="btn ghost small" id="next"'
            + (page.page + 1 >= page.pages ? ' disabled' : '') + '>다음</button>'
            + '</div>';

        el('content').innerHTML = html;

        // 표를 그린 **뒤에** 토큰이 필요한 이미지를 받는다. 목록 자체는 이미 그려졌으므로
        // 이미지가 느리거나 실패해도 표를 읽는 데 지장이 없다.
        loadPrivateThumbnails();
    }

    // ------------------------------------------------- 가사·구간 타임라인 (380-B)

    /**
     * 곡 하나의 가사·구간을 **시간축 위에 가로로** 그린다.
     *
     * <p>표로만 나열하면 요구가 아니다 — 시간 위치가 눈에 보여야 한다. 밴드(가사·구간
     * 분석·구간-분위기)를 위에서 아래로 쌓고, 각 밴드 안에서 항목을 **왼쪽에서 오른쪽으로
     * 시간 위치에 맞춰** 놓는다.
     *
     * <h2>화면이 자원 이름을 모른다</h2>
     *
     * 어떤 밴드가 있고 무엇으로 정렬하는지는 **서버가 준 `axis`** 가 정한다
     * (`AdminTimelineAxis`). 여기에 `lyric`·`timeMs` 같은 이름을 적지 않는다 — 자원이
     * 늘어도 이 함수는 그대로다.
     *
     * <h2>380-C 가 붙을 자리</h2>
     *
     * 모든 항목에 **`data-time-ms`** 가 들어간다(구간은 `data-start-ms`·
     * `data-end-ms` 도). 380-C 의 드래그가 그 속성을 읽어 새 시각을 계산한다. 지금은
     * **배치까지만**이고 마우스 이벤트는 붙이지 않는다.
     */
    function renderTimeline() {
        var data = state.timeline;
        if (!data) {
            el('content').innerHTML = '<div class="empty">불러오는 중…</div>';
            return;
        }

        var html = '<h2>가사 · 구간 타임라인</h2>'
            + '<p class="sub">' + escape(data.title) + ' · 곡 #' + escape(data.music_id)
            + ' · 가로축 ' + (data.has_time ? formatMs(data.axis_max_ms) : '없음')
            + '</p>';

        html += '<div class="toolbar">'
            + '<button class="btn ghost small" data-timeline-back="true">← 목록으로</button>'
            + '<button class="btn ghost small" data-timeline-refresh="true">새로고침</button>'
            + '</div>';

        if (!data.has_time) {
            // 0 을 축으로 나누면 모든 항목이 0% 에 뭉쳐 "시간이 있다" 는 거짓말이 된다.
            html += '<p class="sub">이 곡에는 아직 시간 정보가 없습니다. 아래는 시간 순서 없이'
                + ' 나열한 것입니다 — 분석이 끝나면 시간축 위에 배치됩니다.</p>';
        }

        html += '<div class="timeline">';
        (data.bands || []).forEach(function (band) {
            html += bandHtml(band, data.axis_max_ms, data.has_time);
        });
        html += '</div>';

        el('content').innerHTML = html;
    }

    /**
     * 밴드 하나 = 자원 하나의 항목 줄.
     */
    function bandHtml(band, axisMax, hasTime) {
        var axis = band.axis || {};
        var rows = band.rows || [];
        var range = axis.kind === 'RANGE';

        var html = '<div class="band"><div class="band-head">'
            + '<strong>' + escape(axis.label) + '</strong>'
            + '<span class="muted">' + escape(axis.resource) + ' · ' + rows.length + '개</span>';

        if (band.truncated) {
            // 조용히 자르면 "이 곡에는 이것뿐" 이라는 거짓말이 된다.
            html += ' <span class="pill down">앞 ' + rows.length + '개만 표시 (전체 '
                + number(band.total) + '개)</span>';
        }
        if (!axis.owns_time) {
            // 구간-분위기는 자기 시간 컬럼이 없다. 부모 구간의 시간을 빌려 온다 —
            // 말해 두지 않으면 "왜 분위기에 시간이 있지" 로 보인다.
            html += ' <span class="muted">시간은 부모 구간(' + escape(axis.via_field) + ')에서</span>';
        }
        html += '</div>';

        if (rows.length === 0) {
            return html + '<p class="empty">항목이 없습니다.</p></div>';
        }

        if (!hasTime) {
            // 축이 없으면 위치를 만들 수 없다. 겹쳐 그리는 대신 세로로 나열한다.
            html += '<div class="track no-axis">';
            rows.forEach(function (row) {
                html += itemHtml(row, axis, range, null, null);
            });
            return html + '</div></div>';
        }

        html += '<div class="track" data-edit-resource="' + attr(axis.resource) + '">';
        for (var line = 1; line < 10; line++) {
            html += '<div class="grid-line" style="left:' + (line * 10) + '%"></div>';
        }
        rows.forEach(function (row) {
            // 시작 시각. 점이면 `_time_ms`, 구간이면 `_start_ms` 다 — 서버가 맞춰 보낸다.
            var start = Number(range ? row._start_ms : row._time_ms);
            if (!isFinite(start)) {
                start = null;
            }
            var end = range ? Number(row._end_ms) : null;
            if (!isFinite(end)) {
                end = null;
            }
            html += itemHtml(row, axis, range, start, end);
        });
        html += '</div>';

        html += '<div class="axis-label"><span>0:00.0</span>'
            + '<span>' + formatMs(axisMax) + '</span></div>';
        return html + '</div>';
    }

    /**
     * 항목 하나.
     *
     * **`data-time-ms` 는 언제나 들어간다** — 구간은 시작 시각이 그 값이다. 380-C 의 드래그가
     * 이 속성 위에 붙고, 없으면 붙을 자리가 없다.
     *
     * 시작 시각을 모르면(**시간 컬럼은 있는데 값이 비었다**) 0 으로 그리지 않는다. 0 은
     * "곡 맨 앞" 이라는 거짓 위치가 되므로 노란 항목(`missing`)으로 표시하고 `data-time-ms`
     * 를 붙이지 않는다 — 붙이면 드래그가 없는 시간을 편집하게 된다.
     */
    function itemHtml(row, axis, range, start, end) {
        var hasStart = start !== null && start !== undefined;
        var percent = 0;
        var width = 0;

        // 380-C: **끌 수 있는 항목인가.** 두 조건을 다 만족해야 한다.
        //
        //   1. 시간을 안다(`hasStart`). `missing` 항목에는 `data-time-ms` 가 없고 트랙 위
        //      위치도 없다 — **끌 시작점이 없다.** 380-B 가 의도적으로 속성을 빼 둔 이유가
        //      그것이고, 여기서 그 의도를 그대로 지킨다.
        //   2. 밴드가 **자기 시간 컬럼을 갖는다**(`owns_time`). 부모의 시간을 빌리는
        //      밴드(구간-분위기)의 행에는 시간 컬럼이 아예 없어서 `PATCH` 할 필드가 없다 —
        //      붙이면 저장이 `UNKNOWN_FIELD` 400 으로 떨어진다. 화면이 그 사실을 축 선언에서
        //      읽으므로 자원 이름을 알 필요가 없다.
        //
        // 두 조건 중 하나라도 빠지면 커서도 `grab` 이 아니고 이벤트도 붙지 않는다 —
        // "끌 수 있는 것처럼 보이는데 안 움직인다" 가 가장 나쁜 상태라서다.
        var draggable = hasStart && editableFields(axis, range) !== null;

        if (hasStart && state.timeline && state.timeline.axis_max_ms > 0) {
            var axisMax = state.timeline.axis_max_ms;
            percent = Math.min(100, Math.max(0, (start / axisMax) * 100));
            if (range && end !== null && end !== undefined) {
                // 구간은 폭이 길이다. 최소 폭을 둬서 아주 짧은 구간도 보이게 한다.
                width = Math.max(1.2, ((end - start) / axisMax) * 100);
            }
        }

        var style = '';
        // 위치는 **시작 시각을 알 때만** 준다. 모르는데 `left:0%` 를 주면 항목이 곡 맨 앞에
        // 있는 것처럼 그려진다 — 0 은 "맨 앞" 이라는 거짓 위치다(`missing` 색만으로는
        // 위치가 거짓인 것을 가릴 수 없다). 380-C 의 드래그도 이 자리를 집으면 안 된다.
        if (hasStart && state.timeline && state.timeline.has_time) {
            style = ' style="left:' + percent.toFixed(3) + '%';
            if (range) {
                // 오른쪽 끝이 트랙을 넘지 않게 자른다. 넘치면 잘려 보여 길이를 잘못 읽는다.
                style += ';width:' + Math.min(width, 100 - percent).toFixed(3) + '%';
            }
            style += '"';
        }

        var attrs = ' class="item ' + (range ? 'range' : 'point')
            + (hasStart ? '' : ' missing')
            + (draggable ? ' draggable' : '') + '"'
            + style;

        // 380-C 가 읽을 시간. 없으면 붙이지 않는다(위 주석 참고).
        if (hasStart) {
            attrs += ' data-time-ms="' + Number(start) + '"';
        }
        if (range) {
            if (hasStart) {
                attrs += ' data-start-ms="' + Number(start) + '"';
            }
            if (end !== null && end !== undefined) {
                attrs += ' data-end-ms="' + Number(end) + '"';
            }
        }

        // 어느 행을 고칠 것인가. 행의 모양이 목록 조회와 같아서 `_id` 가 그대로 있다.
        // 자원 이름은 **밴드 머리**(`bandHtml`)에 한 번만 둔다 — 항목마다 되풀이하면
        // 응답이 커지고, 같은 문자열이 항목 수만큼 DOM 에 중복된다.
        attrs += ' data-edit-id="' + attr(row._id) + '"'
            + ' tabindex="0"';
        if (hasStart) {
            // 380-C 의 드래그가 새 시각을 계산할 때 쓸 **지금 값**. `data-time-ms`(위치)와
            // 같은 값이지만 의미가 다르다 — 이쪽은 편집 대상의 현재 값이다.
            attrs += ' data-edit-time="' + Number(start) + '"';
        }
        if (range && end !== null && end !== undefined) {
            attrs += ' data-edit-end="' + Number(end) + '"';
        }

        var label = itemLabel(row, axis);
        var title = label + (hasStart ? ' @ ' + formatMs(start) : ' (시간 없음)');
        var html = '<div' + attrs + ' title="' + attr(title) + '">';
        if (hasStart) {
            html += '<span class="at">' + formatMs(start) + '</span>';
        }
        html += escape(label);
        if (!hasStart) {
            html += ' <span class="borrowed">시간 없음</span>';
        }
        return html + '</div>';
    }

    /**
     * 항목에 보일 한 줄. 무엇을 이어 붙일지는 **서버가 준 `title_fields`** 가 정한다 —
     * 화면에 자원별 컬럼 이름을 적지 않는다.
     *
     * FK 필드(`moodCode`)는 번호 대신 `_labels` 의 대표값을 쓴다. 번호만 보이면 어느
     * 분위기인지 알 수 없다(380-A 와 같은 규칙).
     */
    function itemLabel(row, axis) {
        var labels = row._labels || {};
        var parts = [];
        (axis.title_fields || []).forEach(function (name) {
            var value = row[name];
            if (value === null || value === undefined || value === '') {
                return;
            }
            if (labels[name] !== undefined && labels[name] !== null) {
                parts.push(String(labels[name]));
                return;
            }
            parts.push(String(value));
        });
        if (parts.length === 0) {
            return '#' + (row._id === null || row._id === undefined ? '?' : String(row._id));
        }
        return parts.join(' ');
    }

    /**
     * HTML 텍스트로 escape. 기존 `escape()` 와 같은 일이지만 이름을 따로 둔다 —
     * 이 화면의 값은 자원 `Map` 에서 온 것이라 무엇을 escape 하는지 코드에 드러내는 편이 낫다.
     */
    function escapeHtml(value) {
        return escape(value);
    }

    /**
     * **HTML 속성값**으로 escape. 기존 `escape()` 는 따옴표로 큰 속성에 그대로 쓰면 위험하다 —
     * `&quot;` 만 처리하고 `'` 를 남기는데, 이 화면의 JS 는 속성을 `'` 로 두는 곳이 많다.
     * 값은 대부분 서버에서 오지만 `text` 처럼 **사람이 넣은 문자열**도 섞여 있다.
     */
    function attr(value) {
        return escapeHtml(value)
            .replace(/'/g, '&#39;');
    }

    function filterInput(field) {
        var value = state.filters[field.name] || '';
        if (field.type === 'enum' || field.type === 'boolean') {
            var options = field.type === 'boolean' ? ['true', 'false'] : field.options;
            var html = '<select class="field" data-filter="' + escape(field.name) + '">'
                + '<option value="">전체</option>';
            options.forEach(function (option) {
                html += '<option value="' + escape(option) + '"'
                    + (value === option ? ' selected' : '') + '>' + escape(option) + '</option>';
            });
            if (field.nullable) {
                html += '<option value="__null__"' + (value === '__null__' ? ' selected' : '') + '>(비어 있음)</option>';
            }
            return html + '</select>';
        }
        return '<input class="field" data-filter="' + escape(field.name) + '" value="'
            + escape(value) + '" placeholder="일치" autocomplete="off">';
    }

    /**
     * FK 한 칸. **대표값과 번호를 함께** 그린다.
     *
     * 대표값이 무엇인지는 서버가 정한다 — 자원마다 다르고(회원=이메일, 아티스트=이름,
     * 앨범=제목) 화면이 자원 목록을 알고 있어야 나올 수 있는 판단이라 여기서 다시
     * 추론하지 않는다 (`field.representativeField`). 값은 목록 응답의 `row._labels` 에
     * 행 전체분이 한 번에 실려 온다 — 행마다 따로 물어보면 그대로 N+1 이 된다.
     */
    function relationCell(field, row, value) {
        var labels = row._labels || {};
        var label = labels[field.name];
        var html = '<span class="fk">'
            + thumbnail(field, row)
            + '<a href="#" data-relation="' + escape(field.relation) + '" data-id="'
            + escape(value) + '">'
            + (label === undefined || label === null
                ? '<span class="muted">' + escape(value) + '</span>'
                : escape(label))
            + '</a>'
            // 번호는 남긴다. 요구가 "대표값과 번호를 함께" 이고, 대표값이 중복될 수 있어서
            // (제목이 같은 앨범) 번호가 없으면 어느 행인지 특정할 수 없다.
            + '<span class="id">#' + escape(value) + '</span>'
            + '</span>';
        return html;
    }

    /**
     * 작은 이미지 한 자리.
     *
     * 서버가 `field.thumbnailable` 로 "이미지라는 개념이 있는 필드인가" 를 알려 준다.
     * 값이 없으면 **빈 자리를 쓰지 않고 `?` 를 그린다** — 빈칸은 "아직 안 불러왔다" 와
     * 구분되지 않아 화면이 거짓말을 하게 된다.
     *
     * 주소는 서버가 파일 번호로 만들어 보낸다(`_thumbnails`). 인증이 필요한지도 서버가
     * 판단해 값으로 준다 — 앨범·아티스트 표지는 공개지만(그래서 `<img src>` 로 바로 된다)
     * 프로필은 아니다(`ImageAccessPolicy.OWNER`). `<img src>` 에는 Authorization 헤더를
     * 붙일 수 없으므로, 필요한 것만 토큰을 붙여 받아 blob 주소로 바꾼다.
     */
    function thumbnail(field, row) {
        if (!field.thumbnailable) {
            return '';
        }
        var thumbnails = row._thumbnails || {};
        var found = thumbnails[field.name];
        if (!found) {
            return '<span class="thumb empty" title="이미지 없음">?</span>';
        }
        if (found.requires_authorization) {
            return '<span class="thumb empty" data-thumb="' + escape(found.url)
                + '" title="불러오는 중">…</span>';
        }
        return '<img class="thumb" src="' + escape(found.url) + '" alt="" loading="lazy"'
            // 주소는 있는데 실제로 못 받아오는 경우가 있다 — 저장소 객체가 사라졌거나
            // (파일 행은 남아 있다) 받아오는 중에 실패한 경우다. 그대로 두면 브라우저가
            // 깨진 그림 아이콘을 그려서 "이미지가 있는데 못 그렸다" 처럼 보인다.
            // 값이 없을 때와 **같은 `?`** 로 떨어뜨려 두 경우를 한 가지로 보이게 한다.
            + ' onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),'
            + '{className:\'thumb empty\', textContent:\'?\', title:\'이미지를 불러오지 못했습니다\'}))">';
    }

    /**
     * 토큰이 필요한 이미지를 받아 blob 주소로 바꿔 끼운다.
     *
     * 표를 그린 **뒤에** 돈다. 이미지 요청이 표 그리기를 붙잡으면 목록이 느려지고, 실패한
     * 자리는 `?` 로 남겨 두면 되기 때문이다. 표를 다시 그리면 이 자리도 다시 돈다.
     */
    function loadPrivateThumbnails() {
        var slots = document.querySelectorAll('[data-thumb]');
        Array.prototype.forEach.call(slots, function (slot) {
            var url = slot.dataset.thumb;
            // 이미 받아 둔 것은 다시 받지 않는다. 표를 다시 그릴 때마다 같은 이미지를
            // 매번 받으면 목록이 느려진다.
            if (thumbCache[url]) {
                paintThumbnail(slot, thumbCache[url]);
                return;
            }
            fetch(url, { headers: { 'Authorization': 'Bearer ' + token() } })
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('이미지를 받지 못했습니다.');
                    }
                    return response.blob();
                })
                .then(function (blob) {
                    var objectUrl = URL.createObjectURL(blob);
                    thumbCache[url] = objectUrl;
                    paintThumbnail(slot, objectUrl);
                })
                .catch(function () {
                    // 못 받아온 자리는 `?` 로 남긴다. 조용히 빈칸으로 두면 "없음" 과
                    // 구분되지 않는다.
                    slot.textContent = '?';
                    slot.title = '이미지를 받지 못했습니다';
                });
        });
    }

    function paintThumbnail(slot, objectUrl) {
        var image = document.createElement('img');
        image.className = 'thumb';
        image.alt = '';
        image.src = objectUrl;
        slot.replaceWith(image);
    }

    /**
     * 이 행의 가사·구간 타임라인으로 가는 버튼.
     *
     * 스키마가 밴드를 선언한 자원에만 나온다(`schema.timeline_axes`). 화면이 "곡이면
     * 타임라인" 이라고 판단하지 않는다 — 그 판단은 서버의 `TIMELINES` 선언에 있다.
     */
    function timelineButton(row) {
        var axes = state.schema.timeline_axes || [];
        if (!axes.length) {
            return '';
        }
        return '<button class="btn ghost small" data-timeline-id="' + attr(row._id) + '">'
            + '가사·구간</button> ';
    }

    /**
     * 곡 하나의 타임라인을 연다 (S15P21A204-380-B).
     *
     * 표를 그리지 않고 **별도 보기**다. 표로만 나열하면 "가로로 시간순 배치" 라는 요구가
     * 사라진다. 다만 항목을 고칠 때는 목록 화면과 **같은 편집기**를 쓴다 — 행의 모양이
     * 같기 때문이다(`_id`·`_labels`).
     */
    function openTimeline(musicId) {
        state.view = 'timeline';
        state.timelineMusicId = musicId;
        renderNav();
        el('content').innerHTML = '<div class="empty">타임라인을 불러오는 중…</div>';

        return loadTimeline(musicId);
    }

    /**
     * 타임라인을 (다시) 불러온다. 저장 뒤에도 **이것을 부른다** — 저장했는데 화면이 옛
     * 값을 보여주면 사용자는 저장 실패로 읽는다.
     */
    function loadTimeline(musicId) {
        var asked = musicId;

        return request('/resource/music/' + encodeURIComponent(asked) + '/timeline')
            .then(function (timeline) {
                // 늦게 온 응답이 다른 화면을 덮어쓰지 않게 막는다.
                if (state.view !== 'timeline' || state.timelineMusicId !== asked) {
                    return;
                }
                state.timeline = timeline;
                renderTimeline();
                // 항목을 그린 **뒤에** 밴드들의 스키마를 받아 둔다 (380-C). 그래야 "끌 수
                // 있는 항목인가" 를 스키마의 `updatable` 로 판단할 수 있고, 드래그를
                // 시작하는 순간에 네트워크를 기다리지 않는다.
                loadTimelineSchemas();
            })
            .catch(function (error) {
                fail(error);
                if (state.view !== 'timeline' || state.timelineMusicId !== asked) {
                    return;
                }
                el('content').innerHTML = '<div class="empty">'
                    + escape((error && error.message) || '타임라인을 불러오지 못했습니다.')
                    + '</div>';
            });
    }

    /**
     * 타임라인 항목 하나를 편집한다.
     *
     * **목록 화면의 편집기를 그대로 쓴다.** 타임라인 응답의 행은 자원 목록의 행과 같은
     * 모양(`_id`·필드 이름)이라 같은 폼이 그대로 맞는다. 저장 경로도 같다 —
     * `PATCH /api/v1/admin/resource/{resource}/{id}`. 그래서 "저장 후 화면 갱신" 은
     * 목록을 다시 부르는 대신 **타임라인을 다시 부른다**: 목록이 아니라 타임라인을 보고
     * 있기 때문이다. 저장했는데 옛 값이 보이면 사용자는 저장 실패로 읽는다.
     */
    function openTimelineItem(resource, id) {
        var band = null;
        (state.timeline.bands || []).forEach(function (candidate) {
            if (candidate.axis && candidate.axis.resource === resource) {
                band = candidate;
            }
        });
        var row = null;
        if (band) {
            (band.rows || []).forEach(function (candidate) {
                if (String(candidate._id) === String(id)) {
                    row = candidate;
                }
            });
        }
        if (!row) {
            fail(new Error('항목을 찾지 못했습니다. 새로고침해 주세요.'));
            return;
        }

        // 이 자원의 스키마가 필요하다. 타임라인 항목은 목록 화면과 **같은 편집기**를 쓴다.
        request('/resource/' + resource + '/schema').then(function (schema) {
            schemaEditor(schema, resource, row, function () {
                return loadTimeline(state.timelineMusicId);
            });
        }).catch(fail);
    }

    /**
     * 이 밴드의 시간을 고칠 수 있는가. 고칠 수 있으면 **저장에 보낼 필드 이름**을, 아니면
     * `null` 을 돌려준다 (S15P21A204-380-C).
     *
     * <p>두 가지를 함께 본다.
     *
     * <ol>
     *   <li>밴드가 **자기 시간 컬럼을 갖는가**(`owns_time`). 부모의 시간을 빌리는 밴드
     *       (구간-분위기)의 행에는 시간 컬럼이 아예 없다 — 그 행을 `PATCH` 하면
     *       `UNKNOWN_FIELD` 400 이다. 화면이 그 사실을 **축 선언에서** 읽는다.</li>
     *   <li>그 컬럼이 자원 스키마에서 **수정 가능한가**(`updatable`). 식별자이거나
     *       `updatable = false` 인 컬럼이면 서버가 조용히 무시하므로, 보낸 척하지 않는다.</li>
     * </ol>
     *
     * <p>스키마는 아직 안 받아 왔을 수 있다. 그때는 **끌 수 없다고 본다** — 스키마 없이
     * 필드 이름을 추측하면 어느 컬럼에 넣을지 알 수 없고, 틀린 이름을 보내면 400 이다.
     *
     * <p>축 자체가 없을 때(`has_time=false`, 축 최대값 0)도 끌 수 없다. 항목이
     * `.track.no-axis` 안에 세로로 나열되어 `left%` 가 의미를 갖지 않고, 0 으로 나누면
     * 모든 위치가 같아진다. 커서가 `grab` 인데 아무 일도 안 일어나는 상태가 가장 나쁘므로
     * **여기서 미리 막는다** (`beginDrag` 도 같은 조건으로 한 번 더 막는다).
     */
    function editableFields(axis, range) {
        if (!axis || !axis.owns_time) {
            return null;
        }
        if (!(state.timeline && state.timeline.axis_max_ms > 0)) {
            return null;
        }
        var schema = state.schemas[axis.resource];
        if (!schema) {
            return null;
        }
        // 축 선언이 어느 컬럼인지 말한다. 점이면 `time_field`, 구간이면 `start_field`·
        // `end_field` 다 — 화면에 컬럼 이름을 박지 않는다는 380-B 규칙 그대로다.
        var startName = range ? axis.start_field : axis.time_field;
        var endName = range ? axis.end_field : null;

        var startField = fieldOf(schema, startName);
        if (!startField || !startField.updatable) {
            return null;
        }
        if (range) {
            var endField = fieldOf(schema, endName);
            // 구간은 양끝이 다 있어야 한다. 한쪽만 옮기면 길이가 조용히 늘어나는데,
            // 그건 사용자가 요청한 동작이 아니다.
            if (!endField || !endField.updatable) {
                return null;
            }
        }
        return { start: startName, end: range ? endName : null };
    }

    /**
     * 스키마에서 필드 하나를 찾는다. 없으면 `null`.
     */
    function fieldOf(schema, name) {
        var found = null;
        (schema.fields || []).forEach(function (field) {
            if (field.name === name) {
                found = field;
            }
        });
        return found;
    }

    /**
     * 필요한 자원 스키마를 받아 둔다. **없을 때만** 부른다.
     *
     * <p>드래그를 시작할 때 스키마를 받으러 가면 첫 드래그가 눈에 띄게 느려지고, 그 사이에
     * 사용자가 손을 떼면 저장할 필드 이름을 모른 채 끝난다. 그래서 타임라인을 그린 **뒤**
     * 밴드마다 한 번 받아 둔다. 이미 받은 것은 다시 받지 않는다.
     */
    function loadTimelineSchemas() {
        var data = state.timeline;
        if (!data) {
            return Promise.resolve();
        }
        var wanted = [];
        (data.bands || []).forEach(function (band) {
            var axis = band.axis || {};
            if (axis.resource && !state.schemas[axis.resource]) {
                wanted.push(axis.resource);
            }
        });
        if (wanted.length === 0) {
            // 이미 다 받아 뒀다. 다시 그리지 않는다 — 저장할 때마다 화면을 통째로
            // 갈아 끼우면 스크롤이 튀고, 방금 손으로 옮긴 항목이 사라진 것처럼 보인다.
            return Promise.resolve();
        }

        return Promise.all(wanted.map(function (resource) {
            return request('/resource/' + encodeURIComponent(resource) + '/schema')
                .then(function (schema) {
                    state.schemas[resource] = schema;
                })
                .catch(function () {
                    // 스키마를 못 받으면 그 밴드는 **끌 수 없게** 남는다(위 `editableFields`).
                    // 타임라인 자체는 볼 수 있으므로 화면을 죽이지 않는다.
                    return null;
                });
        })).then(function () {
            // 스키마가 늦게 도착했다면 그 사이에 그려진 항목은 `draggable` 표시가 없다.
            // 지금 화면이 아직 타임라인이면 다시 그려 커서와 이벤트를 붙인다.
            if (state.view === 'timeline' && state.timeline) {
                renderTimeline();
            }
        });
    }

    // ------------------------------------------------------------- 드래그 (380-C)

    /**
     * 항목을 끌어 **시각을 옮긴다** (S15P21A204-380-C).
     *
     * <h2>왜 라이브러리를 안 쓰는가</h2>
     *
     * 필요한 것은 `pointerdown`·`pointermove`·`pointerup` 셋과 좌표 → 시각 변환뿐이다.
     * 라이브러리를 넣으면 의존성과 번들 크기가 늘고, 무엇보다 이 화면의 `data-*` 계약
     * (`data-time-ms`·`data-edit-time`)에 맞추는 접착 코드가 오히려 늘어난다.
     *
     * <h2>클릭과 어떻게 구분하는가</h2>
     *
     * 380-B 는 항목 `click` 으로 편집 모달을 연다. **드래그를 붙이면서 클릭이 죽으면
     * 안 된다.** 그래서 `pointerdown` 에서 바로 잡지 않고 **임계값(4px)을 넘겨 움직였을
     * 때만** 드래그로 승격한다. 임계값 미만이면 아무것도 하지 않고 손을 떼므로 브라우저가
     * `click` 을 정상적으로 만들어 준다 — 클릭은 380-B 의 위임 핸들러가 그대로 받는다.
     *
     * <p>승격된 드래그에서는 `click` 이 따라오면 **한 번 삼킨다**. 안 삼키면 놓는 순간
     * 편집 모달이 함께 열려, 방금 옮긴 항목을 또 고치라는 창이 뜬다.
     *
     * <h2>낙관적 UI 와 실패</h2>
     *
     * 항목을 먼저 옮겨 놓고 저장한다(끌고 있는 동안 손끝을 따라가야 하므로). 저장이
     * 실패하면 **원위치로 되돌리고** 알린다 — 화면만 옮겨 두면 사용자는 저장된 줄 안다.
     */
    var DRAG_THRESHOLD_PX = 4;

    var drag = null;

    /**
     * 방금 드래그를 끝낸 항목. **놓은 직후 따라오는 `click` 을 삼키기 위해** 둔다.
     *
     * <p>깃발(`true`/`false`)이 아니라 항목과 시각을 남기는 이유는, 깃발로 두면
     * `click` 이 오지 않는 경우(포인터가 항목 밖에서 풀렸거나 드래그가 취소된 경우)
     * **다음에 오는 무관한 클릭을 삼켜** 편집 모달이 한 번 안 열리기 때문이다. 항목과
     * 시각을 함께 보면 "이 항목에, 방금" 일 때만 삼키고 나머지는 그대로 통과한다.
     */
    var lastDragEnd = null;

    /** 이 시간 안에 온 같은 항목의 클릭만 삼킨다. 사람이 두 번 누르는 간격보다 짧게. */
    var SWALLOW_CLICK_MS = 700;

    function beginDrag(event, item, track) {
        var axis = axisOfResource(track.dataset.editResource);
        var range = item.dataset.startMs !== undefined && item.dataset.endMs !== undefined;
        var editable = editableFields(axis, range);
        if (!editable) {
            // 여기 올 일이 없다 — `draggable` 표시가 같은 판단을 쓴다. 그래도 막아 둔다.
            return;
        }

        var axisMax = state.timeline ? state.timeline.axis_max_ms : 0;
        if (!(axisMax > 0)) {
            return;
        }

        var start = Number(item.dataset.editTime);
        if (!isFinite(start)) {
            return;
        }
        var end = range ? Number(item.dataset.editEnd) : null;
        if (range && !isFinite(end)) {
            return;
        }

        var rect = track.getBoundingClientRect();
        if (!(rect.width > 0)) {
            return;
        }

        drag = {
            item: item,
            track: track,
            axis: axis,
            editable: editable,
            range: range,
            axisMax: axisMax,
            rect: rect,
            // 손을 댄 x. 임계값 판정과 변환의 기준점이다.
            grabX: event.clientX,
            grabY: event.clientY,
            // 끌기 시작한 시각과 그때의 항목 값. **되돌릴 때 쓰는 값**이라 따로 둔다.
            fromStart: start,
            fromEnd: end,
            // 지금 계산된 값. 놓으면 이걸 저장한다.
            nextStart: start,
            nextEnd: end,
            moved: false,
            pointerId: event.pointerId,
            guide: null,
            readout: null
        };

        // 클릭을 먼저 막지 않는다. 여기서 `preventDefault` 를 부르면 임계값 미만으로
        // 손을 뗐을 때 브라우저가 `click` 을 만들지 않아 **380-B 의 편집 모달이 죽는다.**
        if (item.setPointerCapture) {
            try {
                item.setPointerCapture(event.pointerId);
            } catch (error) {
                // 캡처를 못 해도 문서 레벨 리스너가 받으므로 계속한다. 캡처의 이점은
                // 손이 항목 밖으로 나가도 이벤트가 계속 오는 것뿐이다.
            }
        }
        document.addEventListener('pointermove', onDragMove);
        document.addEventListener('pointerup', onDragEnd);
        // 취소는 **저장하지 않는다.** 브라우저가 터치 제스처·창 전환 등으로 드래그를
        // 끊었을 때 그 중간값이 저장되면, 사용자는 손대지 않은 값이 DB 에 들어간 것을
        // 나중에야 알게 된다.
        document.addEventListener('pointercancel', onDragCancel);
        document.addEventListener('keydown', onDragKey);
    }

    /** 브라우저가 드래그를 끊었다. 되돌린다. */
    function onDragCancel() {
        onDragEnd(null, true);
    }

    function onDragMove(event) {
        if (!drag) {
            return;
        }

        var dx = event.clientX - drag.grabX;
        var dy = event.clientY - drag.grabY;

        if (!drag.moved) {
            // 임계값 미만이면 아직 클릭일 수 있다. 여기서 승격하지 않는다.
            if (Math.abs(dx) < DRAG_THRESHOLD_PX && Math.abs(dy) < DRAG_THRESHOLD_PX) {
                return;
            }
            promoteDrag();
        }

        // 가로 이동만 시각이 된다. 세로는 쓰지 않는다 — 축은 하나뿐이다.
        var moved = (dx / drag.rect.width) * drag.axisMax;
        var next = drag.fromStart + moved;
        // 380-C 요구 4: **경계를 넘기지 않는다.** 화면 밖으로 나가면 되돌릴 수 없다.
        // 정수 ms 로 반올림한다 — 컬럼이 `int` 라 소수점을 보내면 서버가 잘라 낸다.
        next = Math.round(clamp(next, 0, drag.axisMax));

        if (drag.range) {
            // 구간은 **길이를 유지한 채** 통째로 옮긴다. 끝을 고정하면 길이가 변하는데,
            // "타이밍을 옮긴다" 는 요구에 그 동작은 들어 있지 않다.
            var span = drag.fromEnd - drag.fromStart;
            var start = clamp(next, 0, Math.max(0, drag.axisMax - span));
            drag.nextStart = Math.round(start);
            drag.nextEnd = Math.round(start + span);
        } else {
            drag.nextStart = next;
            drag.nextEnd = null;
        }

        paintDrag(event);
    }

    /**
     * 임계값을 넘겼다 — 이제 드래그다. 항목을 손끝에 붙이고 안내를 띄운다.
     */
    function promoteDrag() {
        drag.moved = true;
        drag.item.classList.add('dragging');
        document.body.classList.add('timeline-dragging');

        var guide = document.createElement('div');
        guide.className = 'drop-guide';
        drag.track.appendChild(guide);
        drag.guide = guide;

        var readout = document.createElement('div');
        readout.className = 'drag-readout';
        document.body.appendChild(readout);
        drag.readout = readout;
    }

    /**
     * 끌고 있는 동안의 화면. 항목 위치·놓을 자리 안내·시각 표시를 **같은 값에서** 만든다 —
     * 셋이 다른 값을 보여 주면 사용자가 무엇을 믿어야 할지 모른다.
     */
    function paintDrag(event) {
        var percent = (drag.nextStart / drag.axisMax) * 100;
        percent = Math.min(100, Math.max(0, percent));

        // 항목의 `left` 를 직접 옮긴다. `data-*` 는 아직 건드리지 않는다 — 놓을 때
        // 저장이 성공한 뒤에 맞춘다.
        drag.item.style.left = percent.toFixed(3) + '%';
        if (drag.range) {
            var width = ((drag.nextEnd - drag.nextStart) / drag.axisMax) * 100;
            drag.item.style.width = Math.min(width, 100 - percent).toFixed(3) + '%';
        }

        if (drag.guide) {
            drag.guide.style.left = percent.toFixed(3) + '%';
        }

        if (drag.readout) {
            // **시각이 보여야 한다.** 옮기기 전 값도 함께 둔다 — 얼마나 움직였는지가
            // 보이지 않으면 조절이 아니라 도박이다.
            drag.readout.innerHTML = formatMs(drag.nextStart)
                + (drag.range ? ' ~ ' + formatMs(drag.nextEnd) : '')
                + ' <span class="was">← ' + formatMs(drag.fromStart) + '</span>';
            drag.readout.style.left = (event.clientX + 14) + 'px';
            drag.readout.style.top = (event.clientY - 30) + 'px';
        }
    }

    /**
     * 손을 뗐다 — 드래그를 끝낸다.
     *
     * @param cancelled `true` 면 저장하지 않고 **원위치로 되돌린다**(`pointercancel`·Esc).
     *                  항목의 `left` 가 옮겨진 채로 남으면 화면이 저장된 것처럼 보이는데
     *                  DB 에는 들어가지 않았다.
     */
    function onDragEnd(event, cancelled) {
        if (!drag) {
            return;
        }
        var current = drag;
        drag = null;

        document.removeEventListener('pointermove', onDragMove);
        document.removeEventListener('pointerup', onDragEnd);
        document.removeEventListener('pointercancel', onDragCancel);
        document.removeEventListener('keydown', onDragKey);

        if (current.item.releasePointerCapture && current.pointerId !== undefined) {
            try {
                current.item.releasePointerCapture(current.pointerId);
            } catch (error) {
                // 이미 풀렸거나 캡처를 못 했던 경우다. 무시한다.
            }
        }

        if (!current.moved) {
            // 임계값 미만이었다 = **클릭이다.** 아무것도 붙이지 않았으므로 브라우저가
            // 만든 `click` 이 380-B 의 편집 모달을 연다. 여기서 끝낸다.
            return;
        }

        // 방금 놓은 `click` 을 한 번 삼킨다. 안 삼키면 편집 모달이 함께 열린다.
        lastDragEnd = { item: current.item, at: Date.now() };

        current.item.classList.remove('dragging');
        document.body.classList.remove('timeline-dragging');
        if (current.readout) {
            current.readout.remove();
            current.readout = null;
        }
        if (current.guide) {
            current.guide.remove();
            current.guide = null;
        }

        if (cancelled || (current.nextStart === current.fromStart
            && current.nextEnd === current.fromEnd)) {
            // 손을 뗐는데 제자리이거나, `pointercancel`·Esc 로 **취소**됐다. 취소는
            // 저장하지 않고 원위치로 되돌린다 — 항목의 `left` 가 옮겨진 채로 남으면
            // 화면이 저장된 것처럼 보이는데 DB 에는 안 들어갔다.
            revertDrag(current);
            return;
        }

        saveDrag(current);
    }

    /**
     * Esc — 끌던 것을 **취소**한다.
     *
     * <p>끌어 놓은 자리가 마음에 안 들 때 마우스를 제자리로 되돌려 놓는 방법밖에 없으면,
     * 되돌리는 도중에 실수로 다른 값이 저장된다. 취소할 수 있어야 조절할 수 있다.
     */
    function onDragKey(event) {
        if (event.key === 'Escape') {
            onDragEnd(null, true);
        }
    }

    /**
     * 놓은 자리를 저장한다.
     *
     * <p>경로는 380-B 가 정한 것을 그대로 쓴다 — `PATCH /resource/{resource}/{id}`. 타임라인
     * 행이 목록 행과 같은 `_id` 모양이라 새 경로가 필요 없다.
     *
     * <p>**보낸 필드는 시각 하나뿐이다.** 행을 통째로 되돌려 보내면 다른 사람이 방금 고친
     * 내용이 내 화면의 옛 값으로 덮인다.
     */
    function saveDrag(current) {
        var payload = {};
        payload[current.editable.start] = current.nextStart;
        if (current.range && current.editable.end) {
            payload[current.editable.end] = current.nextEnd;
        }

        var resource = current.track.dataset.editResource;
        var id = current.item.dataset.editId;

        return request('/resource/' + encodeURIComponent(resource) + '/' + encodeURIComponent(id), {
            method: 'PATCH',
            body: JSON.stringify(payload)
        }).then(function () {
            // 저장이 끝났다. 이제 DOM 의 값을 실제 값에 맞춘다 — 다음 드래그가 여기서
            // 시작하고, `data-time-ms`(위치)도 함께 고쳐야 다시 그리지 않아도 일관된다.
            commitDrag(current, current.nextStart, current.nextEnd);
            toast('가사 시각을 ' + formatMs(current.nextStart) + ' 로 옮겼습니다.');
            // 서버가 준 값이 그대로인지 **다시 받아 확인한다.** 화면이 혼자 옮겨 놓고
            // 저장됐다고 말하는 것보다, 서버가 말한 값을 그리는 편이 정직하다.
            return loadTimeline(state.timelineMusicId);
        }).catch(function (error) {
            // 380-C 요구 5: **낙관적 UI 의 실패는 되돌린다.** 화면만 옮겨 두면 사용자는
            // 저장된 줄 안다.
            revertDrag(current);
            fail(error);
            return null;
        });
    }

    /**
     * 저장이 성공한 뒤 DOM 을 실제 값에 맞춘다. `data-time-ms` 는 **위치**이고
     * `data-edit-time` 은 **편집 대상의 현재 값**이라, 둘 다 새 시각으로 고친다 —
     * 380-B 의 의미를 그대로 두고 값만 바꾼다.
     */
    function commitDrag(current, start, end) {
        var item = current.item;
        item.dataset.timeMs = String(start);
        item.dataset.editTime = String(start);
        if (current.range) {
            item.dataset.startMs = String(start);
            item.dataset.endMs = String(end);
            item.dataset.editEnd = String(end);
        }
        var at = item.querySelector('.at');
        if (at) {
            at.textContent = formatMs(start);
        }
    }

    /**
     * 저장 실패 — **원위치로 되돌린다.**
     *
     * <p>항목 위치를 끌기 전 값으로 되돌리고 표시를 남긴다. 잠시 뒤 표시를 지우는 이유는,
     * 빨간 테두리를 영구히 두면 다음에 정상 저장된 뒤에도 실패처럼 보이기 때문이다.
     */
    function revertDrag(current) {
        var percent = dragPercentOf(current.fromStart, current.axisMax);
        current.item.style.left = percent.toFixed(3) + '%';
        if (current.range) {
            var width = ((current.fromEnd - current.fromStart) / current.axisMax) * 100;
            current.item.style.width = Math.min(width, 100 - percent).toFixed(3) + '%';
        }
        current.item.classList.add('reverted');
        setTimeout(function () {
            current.item.classList.remove('reverted');
        }, 4000);
    }

    /** 시각 하나를 트랙 위 백분율로. 항목 배치(`itemHtml`)와 같은 식이어야 한다. */
    function dragPercentOf(ms, axisMax) {
        if (!(axisMax > 0)) {
            return 0;
        }
        return Math.min(100, Math.max(0, (ms / axisMax) * 100));
    }

    /** 축 선언을 자원 이름으로 찾는다. 밴드 목록에서 온다 — 화면에 이름을 박지 않는다. */
    function axisOfResource(resource) {
        var found = null;
        ((state.timeline && state.timeline.bands) || []).forEach(function (band) {
            if (band.axis && band.axis.resource === resource) {
                found = band.axis;
            }
        });
        return found;
    }

    function clamp(value, low, high) {
        if (!isFinite(value)) {
            return low;
        }
        return Math.min(high, Math.max(low, value));
    }

    /**
     * 이 행에서 건너갈 수 있는 자식 자원들 (앨범 행의 "음악").
     *
     * 링크는 자식 자원 목록을 **부모를 가리키는 필터로 걸어서** 연다. 자식 목록 API 가
     * 이미 `filter.<필드>=<값>` 을 받으므로 새 엔드포인트가 필요 없다.
     */
    function childLinks(row) {
        // 키는 응답 그대로 **snake_case** 다. 이 화면의 다른 값(`_labels`, `_thumbnails`,
        // `requires_authorization`)과 같다. camelCase 로 읽으면 조용히 `[]` 가 되어
        // 링크가 **아무 오류 없이** 사라진다 — 실제로 그렇게 만들었다가 브라우저에서
        // 칸 수가 맞지 않는 것으로 드러났다.
        var links = state.schema.child_links || [];
        if (!links.length) {
            return '';
        }
        var html = '<span class="child-links">';
        links.forEach(function (link) {
            html += '<button class="btn ghost small" data-child-resource="'
                + escape(link.child_resource) + '" data-child-field="' + escape(link.filter_field)
                + '" data-child-id="' + escape(row._id) + '">'
                + escape(link.label) + '</button>';
        });
        return html + '</span>';
    }

    function cell(field, value, row) {
        if (field.sensitive) {
            return '<span class="muted">••••••</span>';
        }
        if (value === null || value === undefined) {
            // 값이 없는 FK 도 이미지 자리는 보여 준다 — "사진 없는 회원" 과 "그런 필드가
            // 아님" 은 다르다.
            return (field.relation && field.thumbnailable ? thumbnail(field, row) : '')
                + '<span class="muted">-</span>';
        }
        if (field.relation) {
            return relationCell(field, row, value);
        }
        return '<span class="cell" title="' + escape(value) + '">' + escape(value) + '</span>';
    }

    // ------------------------------------------------------------------ 편집 폼

    function openEditor(row) {
        var resource = state.resource;
        schemaEditor(state.schema, resource, row, function () {
            loadRows();
            loadResources();
        });
    }

    /**
     * 자원 하나의 행을 폼으로 고친다.
     *
     * <p>목록 화면(`openEditor`)과 타임라인 항목이 **같은 함수를 쓴다.** 타임라인 응답의
     * 행은 자원 목록의 행과 같은 모양(`_id`·필드 이름)이라 같은 폼이 그대로 맞기 때문이다.
     * 편집기를 둘로 나누면 한쪽만 고쳐지는 일이 생긴다.
     *
     * @param onSaved 저장이 끝난 뒤 할 일. 화면마다 다시 불러올 대상이 다르다 —
     *                목록은 `loadRows()`, 타임라인은 `loadTimeline()`. 저장했는데 화면이
     *                옛 값을 보여주면 사용자는 저장 실패로 읽으므로 **반드시** 다시 부른다.
     */
    function schemaEditor(schema, resource, row, onSaved) {
        var creating = !row;
        var title = escape(schema.label) + (creating ? ' 추가' : ' 편집');

        var body = '';
        schema.fields.forEach(function (field) {
            var writable = creating ? field.insertable : field.updatable;
            var value = row ? row[field.name] : null;
            body += '<div class="form-row">'
                + '<label>' + escape(field.label)
                + (field.nullable || !writable ? '' : ' <span class="req">*</span>')
                + ' <span class="muted">' + escape(field.type)
                + (field.relation ? ' → ' + escape(field.relation) : '') + '</span></label>'
                + editorInput(field, value, writable)
                + (writable ? '' : '<div class="note">읽기 전용입니다.</div>')
                + '</div>';
        });

        modal(title, body, '저장', function (close) {
            var payload = {};
            schema.fields.forEach(function (field) {
                var writable = creating ? field.insertable : field.updatable;
                if (!writable) {
                    return;
                }
                var input = document.querySelector('[data-input="' + field.name + '"]');
                if (!input) {
                    return;
                }
                var raw = input.value;
                if (field.sensitive) {
                    // 비워 두면 "안 바꿈" 이다. 빈 문자열을 보내면 서버가 그대로 해시한다.
                    if (raw !== '') {
                        payload[field.name] = raw;
                    }
                    return;
                }
                var next = raw === '' ? null : raw;
                if (!creating) {
                    var before = row[field.name];
                    if (String(before === null || before === undefined ? '' : before) === raw) {
                        // 바뀐 것만 보낸다. 손대지 않은 칸이 다른 사람의 수정을 덮어쓰지 않게.
                        return;
                    }
                }
                payload[field.name] = next;
            });

            var promise = creating
                ? request('/resource/' + resource, { method: 'POST', body: JSON.stringify(payload) })
                : request('/resource/' + resource + '/' + encodeURIComponent(row._id),
                    { method: 'PATCH', body: JSON.stringify(payload) });

            return promise.then(function () {
                close();
                toast(creating ? '추가했습니다.' : '수정했습니다.');
                if (onSaved) {
                    onSaved();
                }
            });
        });
    }

    function editorInput(field, value, writable) {
        var attrs = 'class="field" data-input="' + escape(field.name) + '"'
            + (writable ? '' : ' disabled');
        var text = value === null || value === undefined ? '' : String(value);

        if (field.sensitive) {
            return '<input type="password" ' + attrs + ' value="" placeholder="바꾸려면 새 비밀번호를 입력">';
        }
        if (field.type === 'enum' || field.type === 'boolean') {
            var options = field.type === 'boolean' ? ['true', 'false'] : field.options;
            var html = '<select ' + attrs + '>';
            if (field.nullable) {
                html += '<option value=""></option>';
            }
            options.forEach(function (option) {
                html += '<option value="' + escape(option) + '"'
                    + (text === option ? ' selected' : '') + '>' + escape(option) + '</option>';
            });
            return html + '</select>';
        }
        if (field.type === 'text') {
            return '<textarea ' + attrs + '>' + escape(text) + '</textarea>';
        }
        if (field.type === 'datetime') {
            // datetime-local 은 초 이하를 잘라 먹는다. 값이 있는 칸은 그대로 보이게 둔다.
            return '<input type="text" ' + attrs + ' value="' + escape(text)
                + '" placeholder="2026-09-14T21:30:00">';
        }
        if (field.type === 'date') {
            return '<input type="date" ' + attrs + ' value="' + escape(text) + '">';
        }
        if (field.type === 'number' || field.type === 'relation') {
            return '<input type="number" step="any" ' + attrs + ' value="' + escape(text) + '">';
        }
        return '<input type="text" ' + attrs + ' value="' + escape(text) + '">';
    }

    // -------------------------------------------------------------------- 모달

    /**
     * confirm()·alert() 를 쓰지 않는다. 브라우저 기본 대화상자는 페이지 스크립트를
     * 통째로 멈춰 세워서, 화면 자동화나 스크린샷 도구가 걸리면 아무 반응이 없어진다.
     */
    function modal(title, body, confirmLabel, onConfirm) {
        var root = el('modal-root');
        root.innerHTML = '<div class="backdrop"><div class="modal">'
            + '<header>' + title + '</header>'
            + '<div class="body">' + body + '</div>'
            + '<footer>'
            + '<button class="btn ghost" data-modal="cancel">취소</button>'
            + '<button class="btn" data-modal="confirm">' + escape(confirmLabel) + '</button>'
            + '</footer></div></div>';

        function close() {
            root.innerHTML = '';
            document.removeEventListener('keydown', onKey);
        }

        function onKey(event) {
            if (event.key === 'Escape') {
                close();
            }
        }

        document.addEventListener('keydown', onKey);

        root.querySelector('[data-modal="cancel"]').addEventListener('click', close);
        root.querySelector('.backdrop').addEventListener('mousedown', function (event) {
            if (event.target === event.currentTarget) {
                close();
            }
        });

        var confirmButton = root.querySelector('[data-modal="confirm"]');
        confirmButton.addEventListener('click', function () {
            confirmButton.disabled = true;
            Promise.resolve()
                .then(function () {
                    return onConfirm(close);
                })
                .catch(function (error) {
                    fail(error);
                })
                .then(function () {
                    confirmButton.disabled = false;
                });
        });
    }

    function confirmDelete(id) {
        modal('삭제', '<p>이 행을 지웁니다. 되돌릴 수 없습니다.</p>'
            + '<p class="muted">' + escape(state.schema.table) + ' · ' + escape(id) + '</p>',
            '삭제', function (close) {
                return request('/resource/' + state.resource + '/' + encodeURIComponent(id),
                    { method: 'DELETE' }).then(function () {
                    close();
                    toast('삭제했습니다.');
                    loadRows();
                    loadResources();
                });
            });
    }

    // ------------------------------------------------------------------ 불러오기

    function loadResources() {
        return request('/resource').then(function (resources) {
            state.resources = resources;
            renderNav();
        });
    }

    function loadDashboard() {
        state.view = 'dashboard';
        state.resource = null;
        renderNav();
        el('content').innerHTML = '<div class="empty">서버 상태를 확인하는 중…</div>';
        return request('/dashboard').then(function (dashboard) {
            state.dashboard = dashboard;
            state.resources = dashboard.resources;
            renderNav();
            // 기다리는 동안 다른 곳으로 옮겨 갔으면 그 화면을 덮어쓰지 않는다. 자원
            // 목록(renderNav)은 어느 화면에서나 쓰므로 위에서 먼저 갱신해 둔다.
            if (state.view !== 'dashboard') {
                return;
            }
            renderDashboard();
        }).catch(function (error) {
            fail(error);
            if (state.view !== 'dashboard') {
                return;
            }
            el('content').innerHTML = '<div class="empty">대시보드를 불러오지 못했습니다.</div>';
        });
    }

    function openResource(name) {
        state.view = 'resource';
        state.resource = name;
        state.schema = null;
        state.rows = null;
        state.page = 0;
        state.sort = null;
        state.direction = 'desc';
        state.keyword = '';
        state.filters = {};
        renderNav();
        el('content').innerHTML = '<div class="empty">불러오는 중…</div>';

        return request('/resource/' + name + '/schema').then(function (schema) {
            if (state.view !== 'resource' || state.resource !== name) {
                return;
            }
            state.schema = schema;
            state.sort = schema.ids[0];
            return loadRows();
        }).catch(fail);
    }

    /**
     * 자식 자원 목록을 부모로 걸러서 연다 (앨범 행 → 그 앨범의 음악들).
     *
     * `openResource` 를 그대로 쓴다. 자원을 여는 경로가 둘로 갈라지면 한쪽만 고쳐지는
     * 일이 생긴다 — 필터를 건 뒤 목록을 다시 부르는 것만 다르다.
     */
    function openChild(childResource, filterField, parentId) {
        return openResource(childResource).then(function () {
            // 늦게 온 응답이 다른 자원 화면을 덮어쓰지 않게 openResource 가 이미 걸러 준다.
            if (state.view !== 'resource' || state.resource !== childResource) {
                return;
            }
            state.filters[filterField] = parentId;
            state.page = 0;
            loadRows();
        });
    }

    function loadRows() {
        var params = new URLSearchParams();
        params.set('page', state.page);
        params.set('size', state.size);
        if (state.sort) {
            params.set('sort', state.sort);
        }
        params.set('direction', state.direction);
        if (state.keyword) {
            params.set('q', state.keyword);
        }
        Object.keys(state.filters).forEach(function (key) {
            if (state.filters[key] !== '') {
                params.set('filter.' + key, state.filters[key]);
            }
        });

        var asked = state.resource;

        return request('/resource/' + asked + '?' + params.toString())
            .then(function (rows) {
                // 응답이 늦는 사이에 다른 자원이나 화면으로 옮겨 갔으면 버린다.
                if (state.view !== 'resource' || state.resource !== asked) {
                    return;
                }
                state.rows = rows;
                keepFocus(renderTable);
            })
            .catch(function (error) {
                fail(error);
                if (state.view !== 'resource' || state.resource !== asked) {
                    return;
                }
                el('content').innerHTML = '<div class="empty">목록을 불러오지 못했습니다.</div>';
            });
    }

    // ---------------------------------------------------------------- 이벤트

    var searchTimer = null;

    /**
     * 항목을 끌기 시작할 수 있는 자리 (S15P21A204-380-C).
     *
     * <p><b>드래그도 클릭도 여기서는 판정하지 않는다.</b> 손을 댄 좌표만 기억해 두고,
     * 임계값을 넘겨 움직였을 때(=`onDragMove`) 그때 드래그로 승격한다. 그래야 임계값 미만의
     * 손놀림은 **아무 일도 일어나지 않은 것**이 되어 브라우저가 `click` 을 만들고,
     * 380-B 의 편집 모달이 그대로 열린다.
     *
     * <p>대상은 `[data-time-ms]` 를 가진 항목뿐이다. **`missing` 항목에는 그 속성이 없다** —
     * 380-B 가 의도적으로 뺀 것이고, 여기서 그 의도를 그대로 존중한다. 없는 시간을 편집하게
     * 만들면 안 된다.
     *
     * <p>`pointerdown` 을 쓰는 이유: 마우스·터치·펜이 같은 이벤트로 온다. `mousedown` 만
     * 쓰면 터치에서 안 움직인다. 이 저장소는 라이브러리를 넣지 않기로 했으므로(380-C 제약)
     * 좌표 → 시각 변환도 직접 한다.
     */
    document.addEventListener('pointerdown', function (event) {
        // 왼쪽 버튼만. 오른쪽 클릭은 브라우저 메뉴가 맞다.
        if (event.button !== 0 || !event.target || !event.target.closest) {
            return;
        }
        var item = event.target.closest('.item.draggable');
        if (!item) {
            return;
        }
        var track = item.closest('.track');
        if (!track || !track.dataset.editResource) {
            return;
        }
        // 항목 밖(트랙 빈 자리)을 눌러 드래그가 시작되지 않게 한다 — 눈금·여백은 끌 대상이
        // 아니다. 항목 안의 글자를 눌렀을 때도 항목이 잡히도록 `closest` 로 올라온다.
        beginDrag(event, item, track);
    });

    document.addEventListener('click', function (event) {
        if (!event.target || !event.target.closest) {
            return;
        }
        // 380-C: 방금 드래그를 끝냈다면 `click` 한 번을 **삼킨다.**
        //
        // 왜 필요한가. 드래그로 항목을 옮기고 손을 떼면 브라우저는 `click` 을 이어서
        // 만든다(누른 자리와 뗀 자리가 같은 요소라서). 그대로 두면 380-B 의 위임 핸들러가
        // 그 클릭을 받아 **편집 모달을 열어 버린다** — 방금 옮긴 항목을 또 고치라는 창이
        // 뜨는 셈이다.
        //
        // **클릭 자체는 살아 있다.** 두 가지가 그것을 보장한다.
        //   1. 임계값 미만으로 손을 뗐으면 `moved` 가 거짓이라 여기 표시를 남기지 않는다
        //      → 클릭이 그대로 모달을 연다.
        //   2. 표시는 **그 항목 + 0.7초 안** 일 때만 먹는다. 그 밖의 클릭(다른 항목,
        //      잠시 뒤의 클릭)은 그대로 통과한다. 깃발 하나로 두면 `click` 이 오지 않는
        //      경우 다음 무관한 클릭을 삼켜 "가끔 클릭이 안 먹는" 결함이 된다.
        if (lastDragEnd) {
            var ended = lastDragEnd;
            lastDragEnd = null;
            if (ended.item === event.target.closest('.item')
                && Date.now() - ended.at < SWALLOW_CLICK_MS) {
                return;
            }
        }
        var target = event.target.closest('[data-view], [data-resource], [data-relation],'
            + ' [data-edit], [data-delete], [data-sort], [data-console-tab],'
            + ' [data-child-resource], [data-timeline-id], [data-timeline-back],'
            + ' [data-timeline-refresh], [data-edit-time],'
            + ' #prev, #next, #create, #clear-filters, #console-reopen');
        if (!target) {
            return;
        }

        if (target.dataset.view === 'dashboard') {
            loadDashboard();
            return;
        }
        if (target.dataset.view === 'clickhouse') {
            openConsole();
            return;
        }
        if (target.dataset.consoleTab) {
            // 열람권은 그대로 쓰고 주소만 바꾼다.
            state.consoleTab = target.dataset.consoleTab;
            renderConsole();
            return;
        }
        if (target.id === 'console-reopen') {
            openConsole();
            return;
        }
        if (target.dataset.resource) {
            event.preventDefault();
            openResource(target.dataset.resource);
            return;
        }
        if (target.dataset.relation) {
            event.preventDefault();
            var relation = target.dataset.relation;
            var id = target.dataset.id;
            openResource(relation).then(function () {
                var idField = state.schema.ids[0];
                state.filters[idField] = id;
                state.page = 0;
                loadRows();
            });
            return;
        }
        if (target.dataset.childResource) {
            // 앨범 행의 "음악" 처럼 자식 자원으로 건너간다. 자식 목록을 부모를 가리키는
            // 필터로 걸어서 연다 — 새 엔드포인트 없이 기존 필터 규약을 그대로 쓴다.
            event.preventDefault();
            openChild(target.dataset.childResource, target.dataset.childField,
                target.dataset.childId);
            return;
        }
        if (target.dataset.timelineId) {
            // 곡 행의 "가사·구간" — 그 곡의 타임라인으로 간다 (S15P21A204-380-B).
            event.preventDefault();
            openTimeline(target.dataset.timelineId);
            return;
        }
        if (target.dataset.timelineBack) {
            // 목록으로 돌아간다. 열었던 자원이 그대로 남아 있으므로 다시 부르지 않는다 —
            // 표를 새로 그리면 스크롤과 필터가 날아간다.
            state.view = 'resource';
            state.timeline = null;
            renderNav();
            renderTable();
            return;
        }
        if (target.dataset.timelineRefresh) {
            loadTimeline(state.timelineMusicId);
            return;
        }
        if (target.dataset.editTime !== undefined && target.dataset.editId !== undefined) {
            // 타임라인 항목 클릭 (S15P21A204-380-B). 자원 이름은 항목마다 두지 않고
            // **트랙**(밴드)에 있다 — 항목 DOM 에 되풀이하면 응답과 DOM 이 함께 커진다.
            //
            // ⚠ 이 갈래가 **먼저** 와야 한다. 아래 `dataset.edit` 검사가 있고, 두 갈래 모두
            // `[data-edit*]` 속성을 쓰므로 위임 선택자에 `[data-edit-time]` 이 없으면
            // `closest()` 가 `null` 을 돌려주어 **클릭이 아무 일도 안 일으킨다** — 오류도
            // 로그도 없이 조용하다. 실제로 그렇게 만들었다가 브라우저 확인에서 드러났다.
            event.preventDefault();
            var track = target.closest('.track');
            var resource = track && track.dataset ? track.dataset.editResource : null;
            if (!resource) {
                fail(new Error('어느 자원인지 알 수 없습니다. 새로고침해 주세요.'));
                return;
            }
            openTimelineItem(resource, target.dataset.editId);
            return;
        }
        if (target.dataset.edit) {
            var row = state.rows.content.filter(function (candidate) {
                return String(candidate._id) === target.dataset.edit;
            })[0];
            openEditor(row);
            return;
        }
        if (target.dataset.delete) {
            confirmDelete(target.dataset.delete);
            return;
        }
        if (target.dataset.sort) {
            if (state.sort === target.dataset.sort) {
                state.direction = state.direction === 'asc' ? 'desc' : 'asc';
            } else {
                state.sort = target.dataset.sort;
                state.direction = 'asc';
            }
            state.page = 0;
            loadRows();
            return;
        }
        if (target.id === 'prev') {
            state.page = Math.max(state.page - 1, 0);
            loadRows();
            return;
        }
        if (target.id === 'next') {
            state.page = state.page + 1;
            loadRows();
            return;
        }
        if (target.id === 'create') {
            openEditor(null);
            return;
        }
        if (target.id === 'clear-filters') {
            state.filters = {};
            state.keyword = '';
            state.page = 0;
            loadRows();
        }
    });

    document.addEventListener('input', function (event) {
        if (event.target.id === 'nav-filter') {
            renderNav();
            return;
        }
        if (event.target.id === 'search') {
            state.keyword = event.target.value.trim();
            state.page = 0;
            clearTimeout(searchTimer);
            searchTimer = setTimeout(loadRows, 320);
        }
    });

    document.addEventListener('change', function (event) {
        if (event.target.dataset && event.target.dataset.filter) {
            state.filters[event.target.dataset.filter] = event.target.value.trim();
            state.page = 0;
            loadRows();
            return;
        }
        if (event.target.id === 'page-size') {
            state.size = Number(event.target.value);
            state.page = 0;
            loadRows();
        }
    });

    el('reload').addEventListener('click', function () {
        if (state.view === 'dashboard') {
            loadDashboard();
        } else if (state.view === 'clickhouse') {
            openConsole();
        } else {
            loadResources();
            loadRows();
        }
    });

    el('logout').addEventListener('click', function () {
        // 콘솔 열람권도 서버에서 지운다. 쿠키만 지우면(그마저 HttpOnly 라 못 지운다)
        // 남은 시간 동안 그 값을 들고 있는 누구든 분석 DB 를 계속 본다.
        clearTimeout(state.consoleTimer);
        fetch(API + '/clickhouse/console', {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token() },
            credentials: 'include'
        }).catch(function () {
            return null;
        });

        // 토큰을 서버의 차단 목록에도 올린다. 세션스토리지만 비우면 남은 한 시간 동안
        // 그 토큰이 그대로 살아 있다. 실패해도 화면에서는 어차피 나간다.
        fetch('/api/v1/auth', {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token() },
            credentials: 'include'
        }).catch(function () {
            return null;
        }).then(toLogin);
    });

    // -------------------------------------------------------------------- 시작

    if (!token()) {
        toLogin();
        return;
    }

    try {
        var user = JSON.parse(sessionStorage.getItem(USER_KEY) || '{}');
        el('who').textContent = user.email ? user.email + ' · ' + user.role : '';
    } catch (error) {
        el('who').textContent = '';
    }

    loadDashboard();
}());
</script>
</body>
</html>
