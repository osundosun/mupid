                + (field.relation ? ' → ' + escape(field.relation) : '') + '</span></label>'
                + editorInput(field, value, writable)
                + (writable ? '' : '<div class="note">읽기 전용입니다.</div>')
                + '</div>';
        });

        modal(title, body, '저장', function (close) {
            var payload = {};
            schema.fields.forEach(function (field) {
                var writable = creating ? field.insertable : field.updatable;
                if (!writable) {
                    return;
                }
                var input = document.querySelector('[data-input="' + field.name + '"]');
                if (!input) {
                    return;
                }
                var raw = input.value;
                if (field.sensitive) {
                    // 비워 두면 "안 바꿈" 이다. 빈 문자열을 보내면 서버가 그대로 해시한다.
                    if (raw !== '') {
                        payload[field.name] = raw;
                    }
                    return;
                }
                var next = raw === '' ? null : raw;
                if (!creating) {
                    var before = row[field.name];
                    if (String(before === null || before === undefined ? '' : before) === raw) {
                        // 바뀐 것만 보낸다. 손대지 않은 칸이 다른 사람의 수정을 덮어쓰지 않게.
                        return;
                    }
                }
                payload[field.name] = next;
            });

            var promise = creating
                ? request('/resource/' + resource, { method: 'POST', body: JSON.stringify(payload) })
                : request('/resource/' + resource + '/' + encodeURIComponent(row._id),
                    { method: 'PATCH', body: JSON.stringify(payload) });

            return promise.then(function () {
                close();
                toast(creating ? '추가했습니다.' : '수정했습니다.');
                if (onSaved) {
                    onSaved();
                }
            });
        });
    }

    function editorInput(field, value, writable) {
        var attrs = 'class="field" data-input="' + escape(field.name) + '"'
            + (writable ? '' : ' disabled');
        var text = value === null || value === undefined ? '' : String(value);

        if (field.sensitive) {
            return '<input type="password" ' + attrs + ' value="" placeholder="바꾸려면 새 비밀번호를 입력">';
        }
        if (field.type === 'enum' || field.type === 'boolean') {
            var options = field.type === 'boolean' ? ['true', 'false'] : field.options;
            var html = '<select ' + attrs + '>';
            if (field.nullable) {
                html += '<option value=""></option>';
            }
            options.forEach(function (option) {
                html += '<option value="' + escape(option) + '"'
                    + (text === option ? ' selected' : '') + '>' + escape(option) + '</option>';
            });
            return html + '</select>';
        }
        if (field.type === 'text') {
            return '<textarea ' + attrs + '>' + escape(text) + '</textarea>';
        }
        if (field.type === 'datetime') {
            // datetime-local 은 초 이하를 잘라 먹는다. 값이 있는 칸은 그대로 보이게 둔다.
            return '<input type="text" ' + attrs + ' value="' + escape(text)
                + '" placeholder="2026-09-14T21:30:00">';
        }
        if (field.type === 'date') {
            return '<input type="date" ' + attrs + ' value="' + escape(text) + '">';
        }
        if (field.type === 'number' || field.type === 'relation') {
            return '<input type="number" step="any" ' + attrs + ' value="' + escape(text) + '">';
        }
        return '<input type="text" ' + attrs + ' value="' + escape(text) + '">';
    }

    // -------------------------------------------------------------------- 모달

    /**
     * confirm()·alert() 를 쓰지 않는다. 브라우저 기본 대화상자는 페이지 스크립트를
     * 통째로 멈춰 세워서, 화면 자동화나 스크린샷 도구가 걸리면 아무 반응이 없어진다.
     */
    function modal(title, body, confirmLabel, onConfirm) {
        var root = el('modal-root');
        root.innerHTML = '<div class="backdrop"><div class="modal">'
            + '<header>' + title + '</header>'
            + '<div class="body">' + body + '</div>'
            + '<footer>'
            + '<button class="btn ghost" data-modal="cancel">취소</button>'
            + '<button class="btn" data-modal="confirm">' + escape(confirmLabel) + '</button>'
            + '</footer></div></div>';

        function close() {
            root.innerHTML = '';
            document.removeEventListener('keydown', onKey);
        }

        function onKey(event) {
            if (event.key === 'Escape') {
                close();
            }
        }

        document.addEventListener('keydown', onKey);

        root.querySelector('[data-modal="cancel"]').addEventListener('click', close);
        root.querySelector('.backdrop').addEventListener('mousedown', function (event) {
            if (event.target === event.currentTarget) {
                close();
            }
        });

        var confirmButton = root.querySelector('[data-modal="confirm"]');
        confirmButton.addEventListener('click', function () {
            confirmButton.disabled = true;
            Promise.resolve()
                .then(function () {
                    return onConfirm(close);
                })
                .catch(function (error) {
                    fail(error);
                })
                .then(function () {
                    confirmButton.disabled = false;
                });
        });
    }

    function confirmDelete(id) {
        modal('삭제', '<p>이 행을 지웁니다. 되돌릴 수 없습니다.</p>'
            + '<p class="muted">' + escape(state.schema.table) + ' · ' + escape(id) + '</p>',
            '삭제', function (close) {
                return request('/resource/' + state.resource + '/' + encodeURIComponent(id),
                    { method: 'DELETE' }).then(function () {
                    close();
                    toast('삭제했습니다.');
                    loadRows();
                    loadResources();
                });
            });
    }

    // ------------------------------------------------------------- 주소와 히스토리

    /**
     * 화면 상태를 히스토리에 싣는다. 이게 없으면 FK 링크로 참조 테이블에 들어간 뒤
     * 뒤로가기를 눌러도 브라우저가 돌아갈 곳을 찾지 못해 관리자 화면 밖으로 나가 버린다.
     *
     * <p><b>왜 주소(쿼리스트링)에까지 적는가.</b> history.state 객체만 써도 뒤로·앞으로가기는
     * 된다. 그런데 주소에 적어야 새로고침(F5)과 링크 공유가 같은 화면을 연다.
     * 검색어·필터가 주소에 드러나는 것은 감수한다 — <b>같은 값이 이미 목록 조회 요청의
     * 쿼리스트링(`q`, `filter.*`)으로 나가고 있어서</b>(loadRows 참조) 노출 경로가 늘지
     * 않는다. 페이지 자체는 `GET /api/admin` 경로로만 매칭되므로(SecurityConfig)
     * 쿼리스트링이 붙어도 서버 쪽 판정은 달라지지 않는다.
     *
     * <p><b>자격증명은 절대 싣지 않는다.</b> 액세스 토큰은 sessionStorage 에, ClickHouse
     * 열람권은 HttpOnly 쿠키에 있다. 둘 다 주소나 히스토리로 새어 나가면 안 되므로
     * 아래 snapshot() 이 담는 것은 "무엇을 보고 있었는가" 뿐이다.
     */

    /**
     * 이 문서 안에서 우리가 쌓은 항목의 깊이. 첫 진입 항목이 0 이다.
     *
     * <p>타임라인의 "목록으로" 단추가 `history.back()` 을 써도 되는지 판단하는 데 쓴다.
     * 0 이면 그 타임라인은 F5 나 공유된 링크로 바로 열린 것이라 되돌아갈 항목이 없다.
     */
    var depth = 0;

    function snapshot() {
        return {
            view: state.view,
            consoleTab: state.consoleTab,
            resource: state.resource,
            timelineMusicId: state.timelineMusicId,
            userTimelineUserId: state.userTimelineUserId,
            userFrom: state.userFrom,
            userTo: state.userTo,
            userDate: state.userDate,
            aiFrom: state.aiFrom,
            aiTo: state.aiTo,
            aiMetric: state.aiMetric,
            page: state.page,
            size: state.size,
            sort: state.sort,
            direction: state.direction,
            keyword: state.keyword,
            filters: Object.assign({}, state.filters),
            depth: depth
        };
    }

    function href(snap) {
        var params = new URLSearchParams();
        params.set('view', snap.view);
        if (snap.view === 'clickhouse') {
            params.set('tab', snap.consoleTab);
        }
        if (snap.view === 'timeline') {
            params.set('music', snap.timelineMusicId);
        }
        if (snap.view === 'userTimeline') {
            // 회원을 아직 안 골랐으면 적지 않는다. 빈 값을 적으면 F5 로 돌아왔을 때
            // "번호가 빈 회원" 을 조회하게 된다.
            if (snap.userTimelineUserId) {
                params.set('user', snap.userTimelineUserId);
            }
            // 창과 날은 **서버가 정해 준 값**이라 언제나 적는다. 안 적으면 새로고침할
            // 때마다 기본 창(오늘로 끝나는 30일)으로 되돌아가, 보던 기간이 사라진다.
            if (snap.userFrom && snap.userTo) {
                params.set('from', snap.userFrom);
                params.set('to', snap.userTo);
            }
            if (snap.userDate) {
                params.set('date', snap.userDate);
            }
        }
        if (snap.view === 'aiPreference') {
            // 창은 서버가 정해 준 값이라 받은 뒤에는 언제나 적는다. 지표는 기본값이면
            // 적지 않는다 — 주소가 짧아야 무엇을 바꿔 봤는지 한눈에 읽힌다.
            if (snap.aiFrom && snap.aiTo) {
                params.set('from', snap.aiFrom);
                params.set('to', snap.aiTo);
            }
            if (snap.aiMetric && snap.aiMetric !== 'engaged_rate') {
                params.set('metric', snap.aiMetric);
            }
        }
        // 타임라인에도 목록 맥락을 같이 적는다. 그래야 F5 로 타임라인에 바로 들어와도
        // "목록으로" 가 어느 목록의 몇 페이지로 돌아갈지 안다.
        if ((snap.view === 'resource' || snap.view === 'timeline') && snap.resource) {
            params.set('resource', snap.resource);
            // 기본값은 적지 않는다. 주소가 짧아야 무엇을 좁혀 봤는지 한눈에 읽힌다.
            if (snap.page) {
                params.set('page', snap.page);
            }
            if (snap.size !== DEFAULT_SIZE) {
                params.set('size', snap.size);
            }
            if (snap.sort) {
                params.set('sort', snap.sort);
            }
            if (snap.direction !== 'desc') {
                params.set('direction', snap.direction);
            }
            if (snap.keyword) {
                params.set('q', snap.keyword);
            }
            Object.keys(snap.filters).forEach(function (key) {
                if (snap.filters[key] !== '') {
                    params.set('filter.' + key, snap.filters[key]);
                }
            });
        }
        return location.pathname + '?' + params.toString();
    }

    /**
     * 주소를 상태로 되읽는다. 손으로 고친 주소나 오래된 링크가 들어올 수 있으므로
     * 값을 그대로 믿지 않고 아는 것만 받는다.
     */
    function parse(search) {
        var params = new URLSearchParams(search);
        var view = params.get('view');
        var size = Number(params.get('size'));
        var known = view === 'resource' || view === 'clickhouse' || view === 'timeline'
            || view === 'userTimeline' || view === 'aiPreference';
        var metric = params.get('metric');
        var snap = {
            view: known ? view : 'dashboard',
            consoleTab: params.get('tab') === 'dashboard' ? 'dashboard' : 'play',
            resource: params.get('resource'),
            timelineMusicId: params.get('music'),
            userTimelineUserId: params.get('user'),
            userFrom: params.get('from'),
            userTo: params.get('to'),
            userDate: params.get('date'),
            // 같은 `from`·`to` 를 읽지만 화면마다 따로 담는다 — 두 화면의 창은 기본값도
            // 상한도 달라서 한쪽 값을 다른 쪽으로 물려주면 400 이 난다.
            aiFrom: view === 'aiPreference' ? params.get('from') : null,
            aiTo: view === 'aiPreference' ? params.get('to') : null,
            // 모르는 지표는 받지 않는다. 받으면 선택 상자에 아무것도 선택되지 않는다.
            aiMetric: AI_METRICS.some(function (item) {
                return item.key === metric;
            }) ? metric : 'engaged_rate',
            page: Math.max(Math.floor(Number(params.get('page')) || 0), 0),
            size: PAGE_SIZES.indexOf(size) >= 0 ? size : DEFAULT_SIZE,
            sort: params.get('sort'),
            direction: params.get('direction') === 'asc' ? 'asc' : 'desc',
            keyword: params.get('q') || '',
            filters: {},
            depth: 0
        };
        params.forEach(function (value, key) {
            if (key.indexOf('filter.') === 0 && key.length > 7) {
                snap.filters[key.slice(7)] = value;
            }
        });
        if (snap.view === 'resource' && !snap.resource) {
            snap.view = 'dashboard';
        }
        if (snap.view === 'timeline' && !snap.timelineMusicId) {
            snap.view = snap.resource ? 'resource' : 'dashboard';
        }
        return snap;
    }

    /**
     * 지금 화면을 <b>현재</b> 히스토리 항목에 덮어쓴다. 새 항목은 만들지 않는다.
     *
     * <p>페이지 넘김·검색어·필터·정렬을 바꿀 때마다 항목이 쌓이면 뒤로가기가 한 글자씩
     * 되감겨서 쓸 수 없게 된다. 그래서 "같은 목록 안에서의 변화" 는 전부 덮어쓰기이고,
     * 새 항목은 다른 자원이나 화면으로 옮겨 갈 때만(navigate) 쌓는다.
     */
    function syncHistory() {
        var snap = snapshot();
        history.replaceState(snap, '', href(snap));
    }

    /**
     * 다른 화면으로 옮겨 가면서 히스토리에 항목을 하나 쌓는다.
     *
     * <p>옮기기 <b>전에</b> 지금 상태를 현재 항목에 굳히고(replaceState), 옮긴 <b>뒤에</b>
     * 새 항목을 쌓는다(pushState). 그래야 뒤로가기가 방금 보던 목록을 그때의
     * 페이지·검색어·필터까지 그대로 되살린다.
     *
     * <p>`run()` 의 동기 구간이 state 를 새 화면으로 바꿔 놓는다는 전제다. 스키마를 받아야
     * 알 수 있는 값(기본 정렬 컬럼, FK 필터)은 나중에 loadRows() 의 syncHistory() 가
     * 같은 항목에 채워 넣는다.
     */
    function navigate(run) {
        syncHistory();
        var result = run();
        depth = depth + 1;
        var snap = snapshot();
        history.pushState(snap, '', href(snap));
        return result;
    }

    /**
     * 히스토리 항목 하나를 화면으로 되살린다. 보던 것을 <b>다시 그리는</b> 것이 아니라
     * 다시 불러온다 — 돌아온 사이에 다른 사람이 고쳤을 수 있기 때문이다.
     */
    function restore(snap) {
        depth = snap.depth || 0;
        if (snap.view === 'clickhouse') {
            openConsole(snap.consoleTab);
            return;
        }
        if (snap.view === 'timeline' && snap.timelineMusicId) {
            // 목록 맥락도 같이 되돌려 둔다. 표를 부르지는 않는다 — 타임라인이 덮고 있어
            // 보이지도 않고, "목록으로" 를 누를 때 그때 불러도 늦지 않다.
            state.resource = snap.resource;
            state.page = snap.page;
            state.size = snap.size;
            state.sort = snap.sort;
            state.direction = snap.direction;
            state.keyword = snap.keyword;
            state.filters = Object.assign({}, snap.filters);
            openTimeline(snap.timelineMusicId);
            return;
        }
        if (snap.view === 'userTimeline') {
            // 회원 번호가 없어도 연다. 고르는 자리가 화면 안에 있어서 빈 화면이 되지
            // 않는다 — 대시보드로 떨어뜨리면 주소를 공유받은 사람이 엉뚱한 곳에 선다.
            openUserTimeline(snap.userTimelineUserId, snap);
            return;
        }
        if (snap.view === 'aiPreference') {
            openAiPreference(snap);
            return;
        }
        if (snap.view === 'resource' && snap.resource) {
            openResource(snap.resource, snap);
            return;
        }
        loadDashboard();
    }

    // ------------------------------------------------------------------ 불러오기

    function loadResources() {
        return request('/resource').then(function (resources) {
            state.resources = resources;
            renderNav();
        });
    }

    function loadDashboard() {
        state.view = 'dashboard';
        state.resource = null;
        renderNav();
        el('content').innerHTML = '<div class="empty">서버 상태를 확인하는 중…</div>';
        return request('/dashboard').then(function (dashboard) {
            state.dashboard = dashboard;
            state.resources = dashboard.resources;
            renderNav();
            // 기다리는 동안 다른 곳으로 옮겨 갔으면 그 화면을 덮어쓰지 않는다. 자원
            // 목록(renderNav)은 어느 화면에서나 쓰므로 위에서 먼저 갱신해 둔다.
            if (state.view !== 'dashboard') {
                return;
            }
            renderDashboard();
        }).catch(function (error) {
            fail(error);
            if (state.view !== 'dashboard') {
                return;
            }
            el('content').innerHTML = '<div class="empty">대시보드를 불러오지 못했습니다.</div>';
        });
    }

    /**
     * 자원 목록을 연다.
     *
     * @param saved      히스토리에서 되살리는 경우 그때의 페이지·검색어·필터. 없으면 처음
     *                   보는 화면으로 치고 전부 초기화한다 (쪽 크기만 유지).
     * @param beforeLoad 스키마를 받은 뒤 목록을 부르기 <b>전에</b> 한 번 불린다. FK 나 자식
     *                   자원으로 들어올 때 걸 필터 컬럼이 스키마에 있어서 이 자리가 필요하다 —
     *                   목록을 부른 뒤에 필터를 걸면 조회가 두 번 나간다.
     */
    function openResource(name, saved, beforeLoad) {
        state.view = 'resource';
        state.resource = name;
        state.schema = null;
        state.rows = null;
        state.page = saved ? saved.page : 0;
        state.size = saved ? saved.size : state.size;
        state.sort = saved ? saved.sort : null;
        state.direction = saved ? saved.direction : 'desc';
        state.keyword = saved ? saved.keyword : '';
        state.filters = saved ? Object.assign({}, saved.filters) : {};
        renderNav();
        el('content').innerHTML = '<div class="empty">불러오는 중…</div>';

        return request('/resource/' + name + '/schema').then(function (schema) {
            if (state.view !== 'resource' || state.resource !== name) {
                return;
            }
            state.schema = schema;
            if (!state.sort) {
                // 주소에 정렬이 없으면(=기본값) 식별자 컬럼으로 정렬한다.
                state.sort = schema.ids[0];
            }
            if (beforeLoad) {
                beforeLoad(schema);
            }
            return loadRows();
        }).catch(fail);
    }

    /**
     * 자식 자원 목록을 부모로 걸러서 연다 (앨범 행 → 그 앨범의 음악들).
     *
     * `openResource` 를 그대로 쓴다. 자원을 여는 경로가 둘로 갈라지면 한쪽만 고쳐지는
     * 일이 생긴다 — 필터를 건 뒤 목록을 다시 부르는 것만 다르다.
     */
    function openChild(childResource, filterField, parentId) {
        // 필터는 `beforeLoad` 에서 건다. 목록을 부른 뒤에 걸면 조회가 두 번 나가고,
        // 그 사이의 한 번이 히스토리 항목에 필터 없는 상태를 남긴다.
        return openResource(childResource, null, function () {
            state.filters[filterField] = parentId;
            state.page = 0;
        });
    }

    function loadRows() {
        // 목록을 부를 때마다 지금 상태를 현재 히스토리 항목에 굳힌다. 페이지·정렬·검색어·
        // 필터가 바뀌는 길목이 전부 여기로 모이므로 한 곳만 붙잡으면 된다.
        syncHistory();

        var params = new URLSearchParams();
        params.set('page', state.page);
        params.set('size', state.size);
        if (state.sort) {
            params.set('sort', state.sort);
        }
        params.set('direction', state.direction);
        if (state.keyword) {
            params.set('q', state.keyword);
        }
        Object.keys(state.filters).forEach(function (key) {
            if (state.filters[key] !== '') {
                params.set('filter.' + key, state.filters[key]);
            }
        });

        var asked = state.resource;

        return request('/resource/' + asked + '?' + params.toString())
            .then(function (rows) {
                // 응답이 늦는 사이에 다른 자원이나 화면으로 옮겨 갔으면 버린다.
                if (state.view !== 'resource' || state.resource !== asked) {
                    return;
                }
                state.rows = rows;
                keepFocus(renderTable);
            })
            .catch(function (error) {
                fail(error);
                if (state.view !== 'resource' || state.resource !== asked) {
                    return;
                }
                el('content').innerHTML = '<div class="empty">목록을 불러오지 못했습니다.</div>';
            });
    }

    // ----------------------------------------- 사용자 행동 타임라인 (430)

    /**
     * 하루의 길이(ms). 사용자 행동 타임라인의 **가로축 최대값**이다.
     *
     * 가사·구간 타임라인과 달리 서버에서 받지 않는다. 날마다 같은 값이라 보낼 이유가
     * 없고, 보내면 화면이 그것을 "언젠가 달라질 수 있는 값" 으로 다루게 된다.
     *
     * **그날 데이터에서 유도하지 않는 것이 핵심이다.** 유도하면 새벽에만 쓴 날과
     * 온종일 쓴 날의 눈금이 달라져, 날짜를 바꿀 때마다 같은 가로 위치가 다른 시각을
     * 뜻하게 된다 — 그 순간 타임라인끼리 비교할 수 없게 된다.
     */
    var DAY_MS = 24 * 60 * 60 * 1000;

    /** 기간 단추. 창의 **길이**이고, 끝(`to`)은 그대로 두고 시작만 옮긴다. */
    var RANGE_PRESETS = [7, 30, 90];

    /**
     * 회원 하나의 행동을 **두 층으로** 그린다 (S15P21A204-430).
     *
     * <p>위는 날짜 막대(창 전체), 아래는 그중 하루의 24시간 시간축이다. 하나만으로는
     * 요구가 되지 않는다 — 막대만 있으면 그날 무엇을 했는지가 없고, 시간축만 있으면
     * **어느 날을 봐야 하는지 알 방법이 없다.**
     *
     * <p>회원을 아직 안 골랐어도 화면은 열린다. 고르는 자리가 이 화면 안에 있어야
     * 왼쪽 목록에서 바로 들어올 수 있다.
     */
    function openUserTimeline(userId, saved) {
        state.view = 'userTimeline';
        state.resource = null;
        state.userTimelineUserId = userId || null;
        state.userTimeline = null;
        state.userFrom = saved ? saved.userFrom : null;
        state.userTo = saved ? saved.userTo : null;
        state.userDate = saved ? saved.userDate : null;
        renderNav();

        if (!state.userTimelineUserId) {
            renderUserTimeline();
            return Promise.resolve();
        }
        el('content').innerHTML = '<div class="empty">행동 기록을 불러오는 중…</div>';
        return loadUserTimeline();
    }

    /**
     * (다시) 불러온다. 창이나 날을 바꿀 때도 이것을 부른다 — 화면에서 날짜만 바꿔
     * 그리면 막대와 시간축이 서로 다른 날을 가리키게 된다.
     */
    function loadUserTimeline() {
        var asked = state.userTimelineUserId;
        if (!asked) {
            return Promise.resolve();
        }

        var params = new URLSearchParams();
        // **창은 둘 다 보내거나 둘 다 안 보낸다.** 한쪽만 보내면 서버가 400 이다 —
        // 나머지를 서버가 지어내면 화면은 자기가 요청한 창을 받았다고 믿게 된다.
        if (state.userFrom && state.userTo) {
            params.set('from', state.userFrom);
            params.set('to', state.userTo);
        }
        if (state.userDate) {
            params.set('date', state.userDate);
        }
        var query = params.toString();

        return request('/resource/user/' + encodeURIComponent(asked) + '/timeline'
                + (query ? '?' + query : ''))
            .then(function (data) {
                // 늦게 온 응답이 다른 화면이나 다른 회원을 덮어쓰지 않게 막는다.
                if (state.view !== 'userTimeline' || state.userTimelineUserId !== asked) {
                    return;
                }
                state.userTimeline = data;
                // 서버가 정한 창과 날을 그대로 받아 둔다. 기본값(30일·마지막 활동일)은
                // 서버만 알 수 있고, 화면이 따로 계산하면 다음 요청이 어긋난다.
                state.userFrom = data.from;
                state.userTo = data.to;
                state.userDate = data.date;
                renderUserTimeline();
                syncHistory();
            })
            .catch(function (error) {
                fail(error);
                if (state.view !== 'userTimeline' || state.userTimelineUserId !== asked) {
                    return;
                }
                // 고르는 자리는 남겨 둔다. 통째로 오류 문구로 덮으면 다른 회원이나 다른
                // 기간으로 바꿔 볼 방법이 사라져 새로고침밖에 할 수 없다.
                el('content').innerHTML = '<h2>사용자 행동 타임라인</h2>'
                    + userPickerHtml()
                    + '<div class="empty">'
                    + escape((error && error.message) || '행동 기록을 불러오지 못했습니다.')
                    + '</div>';
            });
    }

    function renderUserTimeline() {
        var data = state.userTimeline;
        var html = '<h2>사용자 행동 타임라인</h2>';

        if (!state.userTimelineUserId) {
            html += '<p class="sub">회원을 고르면 그 사람의 행동을 날짜별로, 그리고 하루'
                + ' 시간축 위에 그립니다. 회원 목록의 <strong>행동</strong> 단추로도 들어올 수'
                + ' 있습니다.</p>' + userPickerHtml();
            el('content').innerHTML = html;
            return;
        }
        if (!data) {
            el('content').innerHTML = html + userPickerHtml()
                + '<div class="empty">불러오는 중…</div>';
            return;
        }

        html += '<p class="sub">' + escape(data.email) + ' · ' + escape(data.nickname)
            + ' · 회원 #' + escape(data.user_id)
            // 탈퇴한 계정도 이벤트는 남아 있어 조회된다. 말해 두지 않으면 보는 사람이
            // 활동 중인 회원으로 읽는다.
            + (data.status ? ' · <span class="muted">' + escape(data.status) + '</span>' : '')
            + ' · 날짜 기준 ' + escape(data.time_zone) + '</p>';

        html += userPickerHtml();

        if (!data.has_activity) {
            // 빈 막대와 빈 시간축만 그리면 불러오기에 실패한 것처럼 보인다.
            html += '<p class="sub">이 기간에는 남은 행동 기록이 없습니다. 기간을 넓혀 보세요.</p>';
        }

        html += '<h3>날짜별 활동</h3>' + dayStripHtml(data);
        html += daySummaryHtml(data);

        html += '<div class="timeline">';
        (data.bands || []).forEach(function (band) {
            html += userBandHtml(band);
        });
        html += '</div>';

        el('content').innerHTML = html;
    }

    /**
     * 회원과 기간을 고르는 자리. **화면이 열려 있는 동안 늘 붙어 있다** — 오류가 났을
     * 때도 마찬가지다.
     */
    function userPickerHtml() {
        var html = '<div class="toolbar">'
            + '<input id="user-timeline-id" class="field" style="width:130px" placeholder="회원 번호"'
            + ' value="' + attr(state.userTimelineUserId === null ? '' : state.userTimelineUserId) + '"'
            + ' inputmode="numeric" autocomplete="off">'
            + '<button class="btn small" id="user-timeline-load">조회</button>';

        html += '<span class="muted">기간</span>';
        RANGE_PRESETS.forEach(function (days) {
            html += '<button class="btn ghost small" data-user-range="' + days + '">'
                + days + '일</button>';
        });

        html += '<input id="user-from" class="field" type="date" value="'
            + attr(state.userFrom || '') + '">'
            + '<span class="muted">~</span>'
            + '<input id="user-to" class="field" type="date" value="'
            + attr(state.userTo || '') + '">'
            + '<span class="grow"></span>'
            + '<button class="btn ghost small" data-user-refresh="true">새로고침</button>'
            + '</div>';
        return html;
    }

    /**
     * 날짜 막대. 높이는 **그 창 안의 최댓값에 대한 비율**이다.
     *
     * 절대 눈금을 두지 않는 이유는, 사람마다 하루 이벤트 수가 열 배씩 차이 나서 고정
     * 눈금으로는 대부분의 사용자가 바닥에 붙은 선으로만 보이기 때문이다. 여기서 읽을
     * 것은 "이 사람의 어느 날이 활발했나" 이고, 실제 수는 각 칸의 설명(title)과 아래
     * 요약이 말한다.
     */
    function dayStripHtml(data) {
        var days = data.days || [];
        var max = 0;
        days.forEach(function (day) {
            if (day.events > max) {
                max = day.events;
            }
        });

        var html = '<div class="day-strip">';
        days.forEach(function (day) {
            var height = max > 0 ? Math.max(3, (day.events / max) * 100) : 0;
            html += '<button class="day' + (day.selected ? ' selected' : '')
                + (day.events > 0 ? '' : ' none') + '"'
                + ' data-user-day="' + attr(day.date) + '"'
                + ' title="' + attr(dayTitle(day)) + '">'
                + '<span class="bar" style="height:'
                + (day.events > 0 ? height.toFixed(2) : '0') + '%"></span>'
                + '</button>';
        });
        html += '</div>';

        return html + '<div class="day-axis"><span>' + escape(data.from) + '</span>'
            + '<span>' + escape(data.to) + '</span></div>';
    }

    function dayTitle(day) {
        return day.date + '\n이벤트 ' + number(day.events) + '건'
            + ' · 재생 ' + number(day.plays) + '회'
            + ' · 곡 ' + number(day.tracks) + '개'
            + ' · 청취 ' + span(day.listened_ms);
    }

    function daySummaryHtml(data) {
        var html = '<h3>' + escape(data.date) + ' 하루</h3>'
            + '<div class="grid">'
            + stat('이벤트', number(data.day_events) + '건')
            + stat('청취 시간', span(data.day_listened_ms))
            + '</div>';

        if (data.heartbeat_events > 0) {
            // **감춘 것이 아니라 접은 것이다.** 말해 두지 않으면 위의 이벤트 수와
            // 시간축의 항목 수가 크게 어긋나 보여, 보는 사람이 화면을 의심하게 된다.
            html += '<p class="sub">5초 하트비트(PLAY_PROGRESS) '
                + number(data.heartbeat_events)
                + '건은 점으로 그리지 않고 <strong>재생 세션</strong> 막대로 묶었습니다.'
                + ' 막대의 길이는 걸린 시간이고, 실제 들은 시간은 각 막대의 설명에 있습니다.</p>';
        }
        return html;
    }

    /**
     * 밴드 하나 = 한 줄.
     *
     * 가사·구간 타임라인의 `bandHtml` 과 합치지 않았다. 그쪽 항목은 **고칠 수 있어야**
     * 해서 자원 이름·식별자·드래그 속성이 붙는데, 여기 항목은 ClickHouse 의 이벤트라
     * 고칠 대상이 아니다. 한 함수로 합치면 "편집 가능한 자원" 자리가 비어 있는 갈래가
     * 생기고, 380-C 의 드래그가 그 빈 자리를 집게 된다.
     */
    function userBandHtml(band) {
        var rows = band.rows || [];
        var range = band.kind === 'RANGE';

        var html = '<div class="band" data-group="' + attr(band.group) + '"><div class="band-head">'
            + '<strong>' + escape(band.label) + '</strong>'
            + '<span class="muted">' + number(rows.length) + '개</span>';
        if (band.truncated) {
            // 조용히 자르면 "이 사람은 그날 이것밖에 안 했다" 는 거짓말이 된다.
            html += ' <span class="pill down">앞 ' + number(rows.length) + '개만 표시 (전체 '
                + number(band.total) + '개)</span>';
        }
        html += '</div>';

        if (rows.length === 0) {
            return html + '<p class="empty">이 날에는 없습니다.</p></div>';
        }

        html += '<div class="track">';
        // 눈금은 두 시간마다. 하루는 축 최대값이 언제나 같으므로 **시각에 대응하는
        // 눈금**을 그릴 수 있다 — 곡 타임라인의 10% 눈금과 다른 점이 이것이다.
        for (var hour = 2; hour < 24; hour += 2) {
            html += '<div class="grid-line" style="left:' + ((hour / 24) * 100).toFixed(4) + '%"></div>';
        }
        rows.forEach(function (row) {
            html += userItemHtml(row, range);
        });
        html += '</div>';

        html += '<div class="axis-label"><span>00:00</span><span>06:00</span>'
            + '<span>12:00</span><span>18:00</span><span>24:00</span></div>';
        return html + '</div>';
    }

    /**
     * 항목 하나.
     *
     * 위치는 서버가 준 **하루 안의 ms**(`at_ms`)에서 나온다. 시각 문자열을 화면이 다시
     * 파싱하면 그 계산이 브라우저 시간대를 타서 항목이 몇 시간씩 밀린다 — 서버는
     * `Asia/Seoul` 자정을 기준으로 이미 계산해 두었다.
     */
    function userItemHtml(row, range) {
        var start = Number(row.at_ms);
        if (!isFinite(start)) {
            start = 0;
        }
        var percent = Math.min(100, Math.max(0, (start / DAY_MS) * 100));

        var style = ' style="left:' + percent.toFixed(4) + '%';
        if (range) {
            var end = Number(row.end_ms);
            if (!isFinite(end) || end < start) {
                end = start;
            }
            // 아주 짧은 재생(바로 넘긴 곡)도 보이게 최소 폭을 준다. 0 으로 두면 막대가
            // 사라져 "그 재생은 없었다" 가 된다.
            var width = Math.max(0.5, ((end - start) / DAY_MS) * 100);
            style += ';width:' + Math.min(width, 100 - percent).toFixed(4) + '%';
        }
        style += '"';

        return '<div class="item ' + (range ? 'range' : 'point') + '"' + style
            + ' title="' + attr(userItemTitle(row, range)) + '">'
            + '<span class="at">' + escape(row.at) + '</span>'
            + escape(userItemLabel(row, range)) + '</div>';
    }

    /**
     * 항목에 보일 한 줄. **곡이 있으면 곡이 먼저다** — 관리자가 이 화면에서 찾는 것은
     * 대개 "무엇에 대한 행동이었나" 이고, 종류는 밴드 색과 설명이 이미 말한다.
     */
    function userItemLabel(row, range) {
        var track = trackName(row);
        if (range) {
            return track || '재생';
        }
        var parts = [row.label];
        if (track) {
            parts.push(track);
        }
        if (row.detail) {
            parts.push(row.detail);
        }
        return parts.join(' · ');
    }

    /**
     * 마우스를 올렸을 때 보이는 전부. 좁은 항목은 글자가 잘리므로 **여기가 유일하게
     * 전체를 읽을 수 있는 자리**다.
     */
    function userItemTitle(row, range) {
        var lines = [row.at + '  ' + row.label];
        var track = trackName(row);
        if (track) {
            lines.push('곡: ' + track);
        }
        if (row.position_ms !== null && row.position_ms !== undefined) {
            lines.push('재생 위치: ' + formatMs(row.position_ms));
        }
        if (row.entry_path) {
            lines.push('진입: ' + row.entry_path);
        }
        if (row.detail) {
            lines.push(row.detail);
        }
        if (range) {
            lines.push('이벤트 ' + number(row.events) + '건');
            // 막대 길이(걸린 시간)와 실제 들은 시간은 다르다 — 일시정지와 앞으로감기가
            // 그 차이다. 둘을 함께 보여 주지 않으면 막대가 청취 시간으로 읽힌다.
            lines.push('실제 청취: ' + span(row.listened_ms));
        }
        lines.push('event_type: ' + row.event_type);
        return lines.join('\n');
    }

    /** 곡 이름. 제목을 못 찾았어도 **번호는 남긴다** — 둘 다 지우면 대상이 사라진다. */
    function trackName(row) {
        if (row.track_id === null || row.track_id === undefined) {
            return '';
        }
        return row.track_title
            ? row.track_title + ' (#' + row.track_id + ')'
            : '곡 #' + row.track_id;
    }

    /** 사람이 읽는 길이. `duration()` 은 초 단위라 ms 를 그대로 넘길 수 없다. */
    function span(ms) {
        var total = Math.floor(Number(ms) / 1000);
        if (!isFinite(total) || total <= 0) {
            return '0초';
        }
        var hours = Math.floor(total / 3600);
        var minutes = Math.floor((total % 3600) / 60);
        var seconds = total % 60;
        if (hours > 0) {
            return hours + '시간 ' + minutes + '분';
        }
        if (minutes > 0) {
            return minutes + '분 ' + seconds + '초';
        }
        return seconds + '초';
    }

    /**
     * 기간 단추. 창의 **끝은 그대로 두고 시작만** 옮긴다.
     *
     * "오늘" 을 화면에서 만들지 않는 것이 핵심이다. 서버의 오늘은 `Asia/Seoul` 기준인데
     * 브라우저는 다른 시간대일 수 있고, 그러면 미래 날짜를 보내 400 이 된다. 이미 받아
     * 둔 창의 끝을 기준점으로 쓰면 그 문제가 생기지 않는다.
     */
    function applyUserRange(days) {
        if (!state.userTo) {
            // 아직 한 번도 안 받아 왔다. 서버 기본 창으로 먼저 열고 나면 기준점이 생긴다.
            loadUserTimeline();
            return;
        }
        var from = shiftDate(state.userTo, -(days - 1));
        state.userFrom = from;
        if (state.userDate && state.userDate < from) {
            // 창 밖의 날을 그대로 보내면 서버가 거절한다. 어느 날을 펼칠지는 서버가
            // 다시 고르게 둔다 — 새 창 안에서 활동이 있었던 가장 최근 날이다.
            state.userDate = null;
        }
        loadUserTimeline();
    }

    /**
     * `YYYY-MM-DD` 를 며칠 옮긴다.
     *
     * **UTC 로 계산한다.** 현지 시간으로 `Date` 를 만들면 서머타임이나 시간대 경계에서
     * 하루가 밀리는 날이 생긴다. 여기서 다루는 것은 시각이 아니라 날짜 문자열이므로
     * 시간대가 끼어들 이유가 없다.
     */
    function shiftDate(iso, days) {
        var parts = String(iso).split('-');
        var date = new Date(Date.UTC(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2])));
        date.setUTCDate(date.getUTCDate() + days);
        return date.toISOString().slice(0, 10);
    }

    /**
     * 입력칸의 회원 번호로 연다.
     *
     * <p>같은 회원이면 히스토리 항목을 쌓지 않는다 — "조회" 를 두 번 누른 뒤의
     * 뒤로가기가 같은 화면으로 되돌아가면 뒤로가기가 안 먹는 것처럼 보인다.
     */
    function openUserTimelineFromInput() {
        var input = el('user-timeline-id');
        var value = input ? input.value.trim() : '';
        if (!value) {
            fail(new Error('회원 번호를 입력해 주세요.'));
            return;
        }
        if (value === state.userTimelineUserId) {
            loadUserTimeline();
            return;
        }
        navigate(function () {
            return openUserTimeline(value, null);
        });
    }

    // ------------------------------------------------------ AI 선호도 (427)

    /**
     * 그래프로 고를 수 있는 지표. `key` 는 응답 `AdminAiPreferenceStats` 의 필드 이름이다.
     *
     * 선호율이 맨 앞(기본값)인 것은 "AI 가 고른 곡을 사람들이 실제로 듣는가" 에 가장 곧게
     * 답하기 때문이다. 정의는 서버와 `knowledge/domain/ai-preference.md` 가 같이 들고 있다 —
     * 여기 문장을 바꾸면 그쪽도 고친다.
     */
    var AI_METRICS = [
        { key: 'engaged_rate', label: '선호율', rate: true,
          desc: '30초 이상 들었거나 끝까지 들은 재생의 비율' },
        { key: 'completion_rate', label: '완주율', rate: true, desc: '끝까지 들은 재생의 비율' },
        { key: 'skip_rate', label: '스킵률', rate: true, desc: '넘긴 재생의 비율' },
        { key: 'early_skip_rate', label: '조기 스킵률', rate: true, desc: '30초를 못 채우고 넘긴 재생의 비율' },
        { key: 'like_rate', label: '좋아요율', rate: true, desc: '재생 중에 좋아요를 누른 재생의 비율' },
        { key: 'share', label: '재생 비중', rate: true, desc: '그 시간 전체 재생 가운데 이 구분의 몫' },
        { key: 'plays', label: '재생 수', rate: false, desc: '시작한 재생의 수 (시작한 시간에 센다)' }
    ];

    /** 선 색. 구분 이름이 정한다 — 순서로 정하면 선이 하나 빠질 때 색이 밀린다. */
    var AI_COLORS = {
        AI: '#7aa2ff',
        HOME: '#56d364',
        SECTION: '#e3b341',
        CUSTOM: '#c792ea',
        UNTYPED: '#ff9e64',
        NON_AI: '#8b93a7'
    };

    /** 기간 단추. 창의 끝은 그대로 두고 시작만 옮긴다 (사용자 타임라인과 같은 방식). */
    var AI_RANGE_PRESETS = [1, 7, 14, 31];

    function aiMetric() {
        var found = AI_METRICS.filter(function (metric) {
            return metric.key === state.aiMetric;
        })[0];
        return found || AI_METRICS[0];
    }

    function openAiPreference(saved) {
        state.view = 'aiPreference';
        state.resource = null;
        state.aiPreference = null;
        state.aiFrom = saved ? saved.aiFrom : state.aiFrom;
        state.aiTo = saved ? saved.aiTo : state.aiTo;
        if (saved && saved.aiMetric) {
            state.aiMetric = saved.aiMetric;
        }
        renderNav();
        el('content').innerHTML = '<h2>AI 선호도</h2><div class="empty">집계를 불러오는 중…</div>';
        return loadAiPreference();
    }

    /**
     * (다시) 불러온다. 창을 바꿀 때도 이것을 부른다. **창은 둘 다 보내거나 둘 다 안
     * 보낸다** — 한쪽만 보내면 서버가 400 이다.
     */
    function loadAiPreference() {
        var params = new URLSearchParams();
        if (state.aiFrom && state.aiTo) {
            params.set('from', state.aiFrom);
            params.set('to', state.aiTo);
        }
        var query = params.toString();
        var asked = query;

        return request('/ai-preference' + (query ? '?' + query : ''))
            .then(function (data) {
                // 늦게 온 응답이 다른 화면이나 다른 창을 덮어쓰지 않게 막는다.
                var now = (state.aiFrom && state.aiTo)
                    ? new URLSearchParams({ from: state.aiFrom, to: state.aiTo }).toString() : '';
                if (state.view !== 'aiPreference' || now !== asked) {
                    return;
                }
                state.aiPreference = data;
                // 서버가 정한 창을 받아 둔다. 기본값(오늘로 끝나는 7일)의 "오늘" 은
                // 서버의 Asia/Seoul 이고, 화면이 따로 계산하면 브라우저 시간대를 탄다.
                state.aiFrom = data.from;
                state.aiTo = data.to;
                renderAiPreference();
                syncHistory();
            })
            .catch(function (error) {
                fail(error);
                if (state.view !== 'aiPreference') {
                    return;
                }
                // 고르는 자리는 남긴다. 오류 문구로 통째로 덮으면 기간을 바꿔 볼 길이 없다.
                el('content').innerHTML = '<h2>AI 선호도</h2>' + aiToolbarHtml()
                    + '<div class="empty">'
                    + escape((error && error.message) || '집계를 불러오지 못했습니다.') + '</div>';
            });
    }

    function renderAiPreference() {
        var data = state.aiPreference;
        var metric = aiMetric();
        var html = '<h2>AI 선호도</h2>'
            + '<p class="sub">AI 가 추천한 곡(오늘의 모먼트 · 구간 추천 · 챗봇)을 사람들이 실제로'
            + ' 듣는지 봅니다. <strong>선호율</strong>은 30초 이상 들었거나 끝까지 들은 재생의'
            + ' 비율이고, 점선은 AI 가 고르지 않은 재생(검색·재생 목록·큐 등)의 같은 값입니다.'
            + ' 재생은 시작한 시간에 셉니다 · 기준 ' + escape(data ? data.time_zone : 'Asia/Seoul') + '</p>';

        html += aiToolbarHtml();

        if (!data) {
            el('content').innerHTML = html + '<div class="empty">불러오는 중…</div>';
            return;
        }

        if (!data.computed_at) {
            // 빈 그래프만 그리면 불러오기에 실패한 것처럼 보인다.
            html += '<p class="sub"><span class="pill down">아직 집계되지 않음</span> 이 기간의 칸이'
                + ' 하나도 없습니다. 배치는 매시 5분에 직전 6시간만 계산합니다 — 지난 기간은'
                + ' <strong>다시 집계</strong>를 누르면 채워집니다.</p>';
        } else {
            html += '<p class="sub">마지막 집계 ' + escape(data.computed_at)
                + ' · 진행 중인 시간은 다음 정시 5분에 들어옵니다.</p>';
        }

        html += aiSummaryHtml(data);
        html += '<h3>' + escape(metric.label) + ' 추이 <span class="muted" style="font-weight:400;'
            + 'font-size:12px">' + escape(metric.desc) + '</span></h3>';
        html += aiChartHtml(data, metric);
        html += aiTableHtml(data);

        el('content').innerHTML = html;
    }

    function aiToolbarHtml() {
        var html = '<div class="toolbar"><span class="muted">기간</span>';
        AI_RANGE_PRESETS.forEach(function (days) {
            html += '<button class="btn ghost small" data-ai-range="' + days + '">' + days + '일</button>';
        });
        html += '<input id="ai-from" class="field" type="date" value="' + attr(state.aiFrom || '') + '">'
            + '<span class="muted">~</span>'
            + '<input id="ai-to" class="field" type="date" value="' + attr(state.aiTo || '') + '">'
            + '<span class="muted">지표</span><select id="ai-metric" class="field">';
        AI_METRICS.forEach(function (metric) {
            html += '<option value="' + attr(metric.key) + '"'
                + (metric.key === aiMetric().key ? ' selected' : '') + '>'
                + escape(metric.label) + '</option>';
        });
        html += '</select><span class="grow"></span>'
            + '<button class="btn ghost small" id="ai-aggregate">다시 집계</button>'
            + '<button class="btn ghost small" data-ai-refresh="true">새로고침</button></div>';
        return html;
    }

    function aiSeries(data, key) {
        return (data.series || []).filter(function (line) {
            return line.key === key;
        })[0] || null;
    }

    function aiPercent(value) {
        if (value === null || value === undefined || !isFinite(Number(value))) {
            return '–';
        }
        return (Number(value) * 100).toFixed(1) + '%';
    }

    function aiValueText(metric, value) {
        return metric.rate ? aiPercent(value) : (value === null ? '–' : number(value));
    }

    /**
     * 머리 수치. AI 와 기준선을 **나란히** 놓는다 — AI 선호율 40% 가 좋은지 나쁜지는
     * 사람들이 원래 곡을 얼마나 끝까지 듣는지와 견줘야 읽힌다.
     */
    function aiSummaryHtml(data) {
        var ai = aiSeries(data, 'AI');
        var base = aiSeries(data, 'NON_AI');
        if (!ai || !base) {
            return '';
        }
        return '<div class="grid">'
            + stat('AI 선호율', aiPercent(ai.total.engaged_rate))
            + stat('기준선 선호율 (AI 아닌 재생)', aiPercent(base.total.engaged_rate))
            + stat('AI 재생 비중', aiPercent(ai.total.share))
            + stat('AI 재생 수', number(ai.total.plays) + '회')
            + stat('AI 조기 스킵률', aiPercent(ai.total.early_skip_rate))
            + '</div>';
    }

    /**
     * 시간 칸 하나의 값. **계산 안 된 칸은 null** 이다 — 0 으로 그리면 "그 시간엔 아무도
     * 안 들었다" 가 된다. 비율은 서버가 이미 분모 0 을 null 로 준다.
     */
    function aiPointValue(data, line, index, metric) {
        var hour = data.hours[index];
        if (!hour || !hour.computed) {
            return null;
        }
        var point = line.points[index];
        if (!point) {
            return null;
        }
        var value = point[metric.key];
        return value === null || value === undefined ? null : Number(value);
    }

    /** 1·2·2.5·5 × 10ⁿ 으로 올린 눈금 최댓값. */
    function niceCeil(value) {
        if (!(value > 0)) {
            return 1;
        }
        var pow = Math.pow(10, Math.floor(Math.log10(value)));
        var steps = [1, 2, 2.5, 5, 10];
        for (var i = 0; i < steps.length; i++) {
            if (steps[i] * pow >= value) {
                return steps[i] * pow;
            }
        }
        return 10 * pow;
    }

    /**
     * 선 그래프. SVG 를 문자열로 만든다 — 다른 화면처럼 `innerHTML` 한 번으로 그린다.
     *
     * 가로 위치는 **칸의 번호**에서 나온다. 시각 문자열을 `Date` 로 파싱하면 브라우저
     * 시간대를 타서 칸이 밀린다 — 서버가 이미 빈틈없는 시간 목록을 준다.
     */
    function aiChartHtml(data, metric) {
        var hours = data.hours || [];
        var n = hours.length;
        if (n === 0) {
            return '<div class="ai-chart"><p class="empty">그릴 시간이 없습니다.'
                + ' 오늘 0시 직후에는 아직 끝난 시간이 없습니다.</p></div>';
        }
        var lines = data.series || [];

        var W = 960;
        var H = 300;
        var L = 48;
        var R = 12;
        var T = 12;
        var B = 30;
        var plotW = W - L - R;
        var plotH = H - T - B;
        var step = plotW / n;

        var max = 0;
        lines.forEach(function (line) {
            for (var i = 0; i < n; i++) {
                var value = aiPointValue(data, line, i, metric);
                if (value !== null && value > max) {
                    max = value;
                }
            }
        });
        // 비율은 100% 를 넘지 않는다. 값이 작으면 눈금을 줄여 선이 바닥에 붙지 않게 한다.
        var top = metric.rate ? Math.min(1, niceCeil(max || 1)) : niceCeil(max || 1);

        function x(i) {
            return L + (i + 0.5) * step;
        }
        function y(value) {
            return T + plotH * (1 - value / top);
        }

        var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="'
            + attr(metric.label + ' 시간별 추이') + '">';

        // 계산 안 된 시간 — 이어진 칸끼리 한 사각형으로 묶는다.
        var runStart = -1;
        for (var m = 0; m <= n; m++) {
            var missing = m < n && !hours[m].computed;
            if (missing && runStart < 0) {
                runStart = m;
            }
            if (!missing && runStart >= 0) {
                svg += '<rect class="missing" x="' + (L + runStart * step).toFixed(2) + '" y="' + T
                    + '" width="' + ((m - runStart) * step).toFixed(2) + '" height="' + plotH + '"></rect>';
                runStart = -1;
            }
        }

        for (var t = 0; t <= 4; t++) {
            var tickValue = (top * t) / 4;
            var ty = y(tickValue).toFixed(2);
            svg += '<line class="grid-y" x1="' + L + '" x2="' + (W - R) + '" y1="' + ty + '" y2="' + ty + '"></line>'
                + '<text class="tick" x="' + (L - 6) + '" y="' + ty + '" dy="4" text-anchor="end">'
                + escape(metric.rate ? Math.round(tickValue * 1000) / 10 + '%' : number(tickValue))
                + '</text>';
        }

        // 가로 눈금. 하루가 넘으면 날짜만(자정마다), 하루 이내면 세 시간마다 시각을 적는다.
        var days = Math.ceil(n / 24);
        var every = Math.max(1, Math.ceil(days / 10));
        var dayIndex = 0;
        for (var h = 0; h < n; h++) {
            var label = hours[h].hour;
            var clock = label.slice(11, 16);
            var text = null;
            if (n <= 24) {
                if (h % 3 === 0) {
                    text = clock;
                }
            } else if (clock === '00:00') {
                if (dayIndex % every === 0) {
                    text = label.slice(5, 10);
                }
                dayIndex = dayIndex + 1;
            }
            if (text !== null) {
                var tx = (L + h * step).toFixed(2);
                svg += '<line class="grid-y" x1="' + tx + '" x2="' + tx + '" y1="' + T + '" y2="' + (T + plotH) + '"></line>'
                    + '<text class="tick" x="' + tx + '" y="' + (H - 10) + '" text-anchor="start">'
                    + escape(text) + '</text>';
            }
        }

        // 선. 값이 null 인 칸에서 끊는다 — 이어 그리면 모르는 구간을 아는 것처럼 보인다.
        // 앞뒤가 다 끊긴 외딴 점은 선이 안 되므로 점으로 찍는다.
        lines.forEach(function (line) {
            var color = AI_COLORS[line.key] || '#e6e8ee';
            var cls = 'line' + (line.key === 'AI' ? ' main' : '') + (line.ai ? '' : ' baseline');
            var path = '';
            var dots = '';
            for (var i = 0; i < n; i++) {
                var value = aiPointValue(data, line, i, metric);
                if (value === null) {
                    continue;
                }
                var prev = i > 0 ? aiPointValue(data, line, i - 1, metric) : null;
                var next = i + 1 < n ? aiPointValue(data, line, i + 1, metric) : null;
                path += (prev === null ? 'M' : 'L') + x(i).toFixed(2) + ' ' + y(value).toFixed(2) + ' ';
                if (prev === null && next === null) {
                    dots += '<circle cx="' + x(i).toFixed(2) + '" cy="' + y(value).toFixed(2)
                        + '" r="2.5" fill="' + color + '"></circle>';
                }
            }
            if (path) {
                svg += '<path class="' + cls + '" stroke="' + color + '" d="' + path.trim() + '"></path>';
            }
            svg += dots;
        });

        // 마우스를 올리면 그 시간의 전부. 칸이 좁아 글자를 그릴 수 없으므로 여기가
        // 유일하게 건수까지 읽을 수 있는 자리다.
        for (var k = 0; k < n; k++) {
            svg += '<rect class="hover" x="' + (L + k * step).toFixed(2) + '" y="' + T
                + '" width="' + step.toFixed(2) + '" height="' + plotH + '"><title>'
                + escape(aiHourTitle(data, k, metric)) + '</title></rect>';
        }

        svg += '</svg>';

        var legend = '<div class="ai-legend">';
        lines.forEach(function (line) {
            legend += '<span><span class="swatch' + (line.ai ? '' : ' baseline') + '" style="background:'
                + (AI_COLORS[line.key] || '#e6e8ee') + '"></span>' + escape(line.label) + '</span>';
        });
        legend += '<span><span class="swatch" style="background:rgba(255,107,107,0.35)"></span>'
            + '집계 안 된 시간</span></div>';

        return '<div class="ai-chart">' + svg + legend + '</div>';
    }

    function aiHourTitle(data, index, metric) {
        var hour = data.hours[index];
        var lines = [hour.hour + (hour.computed ? '' : '  (집계 안 됨)')];
        if (!hour.computed) {
            return lines.join('\n');
        }
        (data.series || []).forEach(function (line) {
            var point = line.points[index] || {};
            lines.push(line.label + ': ' + aiValueText(metric, point[metric.key])
                + ' · 재생 ' + number(point.plays || 0) + '회'
                + (point.users === null || point.users === undefined ? '' : ' · ' + number(point.users) + '명'));
        });
        return lines.join('\n');
    }

    /** 창 전체의 합. 비율은 서버가 건수를 먼저 더한 뒤 나눈 값이다. */
    function aiTableHtml(data) {
        var html = '<h3>기간 합계</h3><div class="table-wrap"><table><thead><tr>'
            + '<th>구분</th><th>재생</th><th>선호율</th><th>완주율</th><th>스킵률</th>'
            + '<th>조기 스킵률</th><th>좋아요율</th><th>재생 비중</th><th>청취 시간</th>'
            + '</tr></thead><tbody>';
        (data.series || []).forEach(function (line) {
            var total = line.total;
            html += '<tr><td><span class="swatch" style="display:inline-block;width:10px;height:10px;'
                + 'border-radius:2px;margin-right:6px;background:' + (AI_COLORS[line.key] || '#e6e8ee')
                + '"></span>' + (line.key === 'AI' ? '<strong>' + escape(line.label) + '</strong>' : escape(line.label))
                + '</td><td>' + number(total.plays) + '</td>'
                + '<td>' + aiPercent(total.engaged_rate) + '</td>'
                + '<td>' + aiPercent(total.completion_rate) + '</td>'
                + '<td>' + aiPercent(total.skip_rate) + '</td>'
                + '<td>' + aiPercent(total.early_skip_rate) + '</td>'
                + '<td>' + aiPercent(total.like_rate) + '</td>'
                + '<td>' + aiPercent(total.share) + '</td>'
                + '<td>' + span(total.listened_ms) + '</td></tr>';
        });
        return html + '</tbody></table></div>';
    }

    function applyAiRange(days) {
        if (!state.aiTo) {
            loadAiPreference();
            return;
        }
        state.aiFrom = shiftDate(state.aiTo, -(days - 1));
        loadAiPreference();
    }

    /**
     * 지금 창을 원본에서 다시 센다. 되돌릴 일이 없는 동작이지만(몇 번을 해도 같은 값이다)
     * 원본을 하루씩 훑느라 몇 초 걸리므로 한 번 묻는다.
     */
    function confirmAiAggregate() {
        if (!state.aiFrom || !state.aiTo) {
            fail(new Error('기간을 먼저 불러와 주세요.'));
            return;
        }
        var from = state.aiFrom;
        var to = state.aiTo;
        modal('다시 집계', '<p>' + escape(from) + ' ~ ' + escape(to) + ' 를 청취 원본에서 다시 셉니다.</p>'
            + '<p class="muted">몇 번을 해도 같은 값이 됩니다. 기간이 길면 몇 초 걸립니다.</p>',
            '다시 집계', function (close) {
                return request('/ai-preference/aggregate?' + new URLSearchParams({ from: from, to: to }).toString(),
                    { method: 'POST' }).then(function (result) {
                    close();
                    toast(number(result.written) + '칸을 다시 집계했습니다.');
                    loadAiPreference();
                });
            });
    }

    // ---------------------------------------------------------------- 이벤트

    var searchTimer = null;

    /**
     * 항목을 끌기 시작할 수 있는 자리 (S15P21A204-380-C).
     *
     * <p><b>드래그도 클릭도 여기서는 판정하지 않는다.</b> 손을 댄 좌표만 기억해 두고,
     * 임계값을 넘겨 움직였을 때(=`onDragMove`) 그때 드래그로 승격한다. 그래야 임계값 미만의
     * 손놀림은 **아무 일도 일어나지 않은 것**이 되어 브라우저가 `click` 을 만들고,
     * 380-B 의 편집 모달이 그대로 열린다.
     *
     * <p>대상은 `[data-time-ms]` 를 가진 항목뿐이다. **`missing` 항목에는 그 속성이 없다** —
     * 380-B 가 의도적으로 뺀 것이고, 여기서 그 의도를 그대로 존중한다. 없는 시간을 편집하게
     * 만들면 안 된다.
     *
     * <p>`pointerdown` 을 쓰는 이유: 마우스·터치·펜이 같은 이벤트로 온다. `mousedown` 만
     * 쓰면 터치에서 안 움직인다. 이 저장소는 라이브러리를 넣지 않기로 했으므로(380-C 제약)
     * 좌표 → 시각 변환도 직접 한다.
     */
    document.addEventListener('pointerdown', function (event) {
        // 왼쪽 버튼만. 오른쪽 클릭은 브라우저 메뉴가 맞다.
        if (event.button !== 0 || !event.target || !event.target.closest) {
            return;
        }
        var item = event.target.closest('.item.draggable');
        if (!item) {
            return;
        }
        var track = item.closest('.track');
        if (!track || !track.dataset.editResource) {
            return;
        }
        // 항목 밖(트랙 빈 자리)을 눌러 드래그가 시작되지 않게 한다 — 눈금·여백은 끌 대상이
        // 아니다. 항목 안의 글자를 눌렀을 때도 항목이 잡히도록 `closest` 로 올라온다.
        beginDrag(event, item, track);
    });

    document.addEventListener('click', function (event) {
        if (!event.target || !event.target.closest) {
            return;
        }
        // 380-C: 방금 드래그를 끝냈다면 `click` 한 번을 **삼킨다.**
        //
        // 왜 필요한가. 드래그로 항목을 옮기고 손을 떼면 브라우저는 `click` 을 이어서
        // 만든다(누른 자리와 뗀 자리가 같은 요소라서). 그대로 두면 380-B 의 위임 핸들러가
        // 그 클릭을 받아 **편집 모달을 열어 버린다** — 방금 옮긴 항목을 또 고치라는 창이
        // 뜨는 셈이다.
        //
        // **클릭 자체는 살아 있다.** 두 가지가 그것을 보장한다.
        //   1. 임계값 미만으로 손을 뗐으면 `moved` 가 거짓이라 여기 표시를 남기지 않는다
        //      → 클릭이 그대로 모달을 연다.
        //   2. 표시는 **그 항목 + 0.7초 안** 일 때만 먹는다. 그 밖의 클릭(다른 항목,
        //      잠시 뒤의 클릭)은 그대로 통과한다. 깃발 하나로 두면 `click` 이 오지 않는
        //      경우 다음 무관한 클릭을 삼켜 "가끔 클릭이 안 먹는" 결함이 된다.
        if (lastDragEnd) {
            var ended = lastDragEnd;
            lastDragEnd = null;
            if (ended.item === event.target.closest('.item')
                && Date.now() - ended.at < SWALLOW_CLICK_MS) {
                return;
            }
        }
        var target = event.target.closest('[data-view], [data-resource], [data-relation],'
            + ' [data-edit], [data-delete], [data-sort], [data-console-tab],'
            + ' [data-child-resource], [data-timeline-id], [data-timeline-back],'
            + ' [data-timeline-refresh], [data-edit-time],'
            + ' [data-user-timeline-id], [data-user-day], [data-user-range],'
            + ' [data-user-refresh], [data-ai-range], [data-ai-refresh],'
            + ' #prev, #next, #create, #clear-filters, #console-reopen, #user-timeline-load,'
            + ' #ai-aggregate');
        if (!target) {
            return;
        }

        if (target.dataset.view === 'dashboard') {
            navigate(loadDashboard);
            return;
        }
        if (target.dataset.view === 'clickhouse') {
            // 콘솔에서 뒤로가기를 누르면 iframe 이 자기 히스토리를 먼저 되감아서 한 번은
            // 화면이 그대로다. iframe 안은 ClickHouse 가 만든 화면이라 우리가 손댈 수
            // 없다 — 한 번 더 누르면 나간다.
            navigate(openConsole);
            return;
        }
        if (target.dataset.consoleTab) {
            // 열람권은 그대로 쓰고 iframe 주소만 바꾼다. 히스토리 항목은 새로 쌓지 않는다 —
            // 같은 콘솔 안의 탭 전환이라 덮어쓰기로 충분하고, 그래야 뒤로가기가 콘솔을
            // 나가는 동작으로 남는다.
            state.consoleTab = target.dataset.consoleTab;
            renderConsole();
            syncHistory();
            return;
        }
        if (target.id === 'console-reopen') {
            openConsole();
            return;
        }
        if (target.dataset.view === 'userTimeline') {
            // 왼쪽 목록에서 들어올 때는 보던 회원을 이어서 연다. 매번 비우면 다른 화면에
            // 다녀올 때마다 회원 번호를 다시 쳐야 한다.
            var keptUser = state.userTimelineUserId;
            var keptRange = snapshot();
            navigate(function () {
                return openUserTimeline(keptUser, keptRange);
            });
            return;
        }
        if (target.dataset.view === 'aiPreference') {
            // 보던 창과 지표를 이어서 연다 (사용자 타임라인과 같은 판단).
            var keptAi = snapshot();
            navigate(function () {
                return openAiPreference(keptAi);
            });
            return;
        }
        if (target.dataset.aiRange) {
            applyAiRange(Number(target.dataset.aiRange));
            return;
        }
        if (target.dataset.aiRefresh) {
            loadAiPreference();
            return;
        }
        if (target.id === 'ai-aggregate') {
            confirmAiAggregate();
            return;
        }
        if (target.dataset.userTimelineId) {
            // 회원 행의 "행동" — 그 사람의 타임라인으로 간다 (S15P21A204-430).
            // 창은 물려주지 않는다. 다른 사람에게 옮겨 갈 때 남의 활동 기간을 그대로
            // 들고 가면 대개 빈 화면이 열린다 — 서버가 그 사람의 최근 활동일을 고른다.
            event.preventDefault();
            var userTimelineId = target.dataset.userTimelineId;
            navigate(function () {
                return openUserTimeline(userTimelineId, null);
            });
            return;
        }
        if (target.dataset.userDay) {
            // 날짜 막대를 눌러 그날을 펼친다. 히스토리 항목은 쌓지 않는다 — 같은 화면
            // 안의 이동이라 덮어쓰기로 충분하고, 그래야 뒤로가기가 이 화면을 나가는
            // 동작으로 남는다 (콘솔 탭 전환과 같은 판단).
            state.userDate = target.dataset.userDay;
            loadUserTimeline();
            return;
        }
        if (target.dataset.userRange) {
            applyUserRange(Number(target.dataset.userRange));
            return;
        }
        if (target.dataset.userRefresh) {
            loadUserTimeline();
            return;
        }
        if (target.id === 'user-timeline-load') {
            openUserTimelineFromInput();
            return;
        }
        if (target.dataset.resource) {
            event.preventDefault();
            var name = target.dataset.resource;
            navigate(function () {
                return openResource(name);
            });
            return;
        }
        if (target.dataset.relation) {
            event.preventDefault();
            var relation = target.dataset.relation;
            var id = target.dataset.id;
            // 참조 테이블로 옮겨 가되 지금 목록을 히스토리에 남긴다. 뒤로가기로 돌아올
            // 자리가 바로 여기다.
            navigate(function () {
                return openResource(relation, null, function (schema) {
                    state.filters[schema.ids[0]] = id;
                    state.page = 0;
                });
            });
            return;
        }
        if (target.dataset.childResource) {
            // 앨범 행의 "음악" 처럼 자식 자원으로 건너간다. 자식 목록을 부모를 가리키는
            // 필터로 걸어서 연다 — 새 엔드포인트 없이 기존 필터 규약을 그대로 쓴다.
            event.preventDefault();
            var childResource = target.dataset.childResource;
            var childField = target.dataset.childField;
            var childId = target.dataset.childId;
            navigate(function () {
                return openChild(childResource, childField, childId);
            });
            return;
        }
        if (target.dataset.timelineId) {
            // 곡 행의 "가사·구간" — 그 곡의 타임라인으로 간다 (S15P21A204-380-B).
            event.preventDefault();
            var timelineId = target.dataset.timelineId;
            navigate(function () {
                return openTimeline(timelineId);
            });
            return;
        }
        if (target.dataset.timelineBack) {
            // 화면 안의 "목록으로" 를 브라우저 뒤로가기와 **같은 동작**으로 맞춘다.
            // 둘이 따로 놀면 이 단추를 누른 뒤의 뒤로가기가 방금 떠난 타임라인을 다시
            // 열어서, 사용자는 "뒤로가기가 안 먹는다" 로 읽는다.
            //
            // depth 가 0 이면 F5 나 공유된 링크로 타임라인에 바로 들어온 것이라 되돌아갈
            // 항목이 없다. 그때만 목록을 직접 연다 — 주소에 실어 둔 자원·페이지·필터로.
            if (history.state && history.state.depth > 0) {
                history.back();
                return;
            }
            if (state.resource) {
                navigate(function () {
                    return openResource(state.resource, snapshot());
                });
            }
            return;
        }
        if (target.dataset.timelineRefresh) {
            loadTimeline(state.timelineMusicId);
            return;
        }
        if (target.dataset.editTime !== undefined && target.dataset.editId !== undefined) {
            // 타임라인 항목 클릭 (S15P21A204-380-B). 자원 이름은 항목마다 두지 않고
            // **트랙**(밴드)에 있다 — 항목 DOM 에 되풀이하면 응답과 DOM 이 함께 커진다.
            //
            // ⚠ 이 갈래가 **먼저** 와야 한다. 아래 `dataset.edit` 검사가 있고, 두 갈래 모두
            // `[data-edit*]` 속성을 쓰므로 위임 선택자에 `[data-edit-time]` 이 없으면
            // `closest()` 가 `null` 을 돌려주어 **클릭이 아무 일도 안 일으킨다** — 오류도
            // 로그도 없이 조용하다. 실제로 그렇게 만들었다가 브라우저 확인에서 드러났다.
            event.preventDefault();
            var track = target.closest('.track');
            var resource = track && track.dataset ? track.dataset.editResource : null;
            if (!resource) {
                fail(new Error('어느 자원인지 알 수 없습니다. 새로고침해 주세요.'));
                return;
            }
            openTimelineItem(resource, target.dataset.editId);
            return;
        }
        if (target.dataset.edit) {
            var row = state.rows.content.filter(function (candidate) {
                return String(candidate._id) === target.dataset.edit;
            })[0];
            openEditor(row);
            return;
        }
        if (target.dataset.delete) {
            confirmDelete(target.dataset.delete);
            return;
        }
        if (target.dataset.sort) {
            if (state.sort === target.dataset.sort) {
                state.direction = state.direction === 'asc' ? 'desc' : 'asc';
            } else {
                state.sort = target.dataset.sort;
                state.direction = 'asc';
            }
            state.page = 0;
            loadRows();
            return;
        }
        if (target.id === 'prev') {
            state.page = Math.max(state.page - 1, 0);
            loadRows();
            return;
        }
        if (target.id === 'next') {
            state.page = state.page + 1;
            loadRows();
            return;
        }
        if (target.id === 'create') {
            openEditor(null);
            return;
        }
        if (target.id === 'clear-filters') {
            state.filters = {};
            state.keyword = '';
            state.page = 0;
            loadRows();
        }
    });

    document.addEventListener('input', function (event) {
        if (event.target.id === 'nav-filter') {
            renderNav();
            return;
        }
        if (event.target.id === 'search') {
            state.keyword = event.target.value.trim();
            state.page = 0;
            clearTimeout(searchTimer);
            searchTimer = setTimeout(loadRows, 320);
        }
    });

    document.addEventListener('change', function (event) {
        if (event.target.dataset && event.target.dataset.filter) {
            state.filters[event.target.dataset.filter] = event.target.value.trim();
            state.page = 0;
            loadRows();
            return;
        }
        if (event.target.id === 'page-size') {
            state.size = Number(event.target.value);
            state.page = 0;
            loadRows();
            return;
        }
        if (event.target.id === 'user-from' || event.target.id === 'user-to') {
            var from = el('user-from').value;
            var to = el('user-to').value;
            if (!from || !to) {
                // 한쪽만 보내면 서버가 400 이다. 나머지를 채울 때까지 기다린다 —
                // 여기서 한쪽을 지어내면 화면은 자기가 고른 창을 받았다고 믿게 된다.
                return;
            }
            state.userFrom = from;
            state.userTo = to;
            if (state.userDate && (state.userDate < from || state.userDate > to)) {
                // 창 밖의 날은 서버가 거절한다. 어느 날을 펼칠지는 서버가 다시 고른다.
                state.userDate = null;
            }
            loadUserTimeline();
            return;
        }
        if (event.target.id === 'ai-from' || event.target.id === 'ai-to') {
            var aiFrom = el('ai-from').value;
            var aiTo = el('ai-to').value;
            if (!aiFrom || !aiTo) {
                // 한쪽만 보내면 서버가 400 이다. 나머지를 채울 때까지 기다린다.
                return;
            }
            state.aiFrom = aiFrom;
            state.aiTo = aiTo;
            loadAiPreference();
            return;
        }
        if (event.target.id === 'ai-metric') {
            // 지표는 이미 받은 응답 안에 전부 있다. 다시 부르지 않고 다시 그리기만 한다.
            state.aiMetric = event.target.value;
            if (state.aiPreference) {
                renderAiPreference();
            }
            syncHistory();
        }
    });

    /**
     * 회원 번호 칸에서 엔터. 단추를 누르는 것과 같게 한다 — 번호를 치고 엔터를 눌렀는데
     * 아무 일도 안 일어나면 화면이 멈춘 것으로 읽힌다.
     */
    document.addEventListener('keydown', function (event) {
        if (event.key !== 'Enter' || !event.target || event.target.id !== 'user-timeline-id') {
            return;
        }
        event.preventDefault();
        openUserTimelineFromInput();
    });

    /**
     * 뒤로·앞으로가기. 브라우저가 돌려주는 state 객체를 그대로 쓰되, 없으면
     * (주소를 손으로 고쳤거나 오래된 항목) 주소에서 읽는다.
     */
    window.addEventListener('popstate', function (event) {
        restore(event.state || parse(location.search));
    });

    el('reload').addEventListener('click', function () {
        if (state.view === 'dashboard') {
            loadDashboard();
        } else if (state.view === 'clickhouse') {
            openConsole();
        } else if (state.view === 'userTimeline') {
            loadUserTimeline();
        } else if (state.view === 'aiPreference') {
            loadAiPreference();
        } else if (state.view === 'timeline') {
            loadTimeline(state.timelineMusicId);
        } else {
            loadResources();
            loadRows();
        }
    });

    el('logout').addEventListener('click', function () {
        // 콘솔 열람권도 서버에서 지운다. 쿠키만 지우면(그마저 HttpOnly 라 못 지운다)
        // 남은 시간 동안 그 값을 들고 있는 누구든 분석 DB 를 계속 본다.
        clearTimeout(state.consoleTimer);
        fetch(API + '/clickhouse/console', {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token() },
            credentials: 'include'
        }).catch(function () {
            return null;
        });

        // 토큰을 서버의 차단 목록에도 올린다. 세션스토리지만 비우면 남은 한 시간 동안
        // 그 토큰이 그대로 살아 있다. 실패해도 화면에서는 어차피 나간다.
        fetch('/api/v1/auth', {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token() },
            credentials: 'include'
        }).catch(function () {
            return null;
        }).then(toLogin);
    });

    // -------------------------------------------------------------------- 시작

    if (!token()) {
        toLogin();
        return;
    }

    try {
        var user = JSON.parse(sessionStorage.getItem(USER_KEY) || '{}');
        el('who').textContent = user.email ? user.email + ' · ' + user.role : '';
    } catch (error) {
        el('who').textContent = '';
    }

    // 첫 진입 때 지금 화면을 히스토리 항목에 심어 둔다. 이게 없으면 FK 를 한 번 누른 뒤의
    // 첫 뒤로가기가 state 없는 항목을 만나 빈 화면이 된다.
    var entry = parse(location.search);
    state.consoleTab = entry.consoleTab;
    state.size = entry.size;
    history.replaceState(entry, '', href(entry));

    if (entry.view !== 'dashboard') {
        // 대시보드를 거치지 않고 바로 들어오면(F5·공유된 링크) 왼쪽 목록을 채울 데이터가
        // 없다. 대시보드 응답이 겸하던 일을 여기서 따로 한 번 한다.
        loadResources().catch(fail);
    }

    restore(entry);
}());
</script>
</body>
</html>
