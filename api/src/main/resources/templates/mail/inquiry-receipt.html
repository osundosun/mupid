<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/fragments/layout :: base('문의가 접수되었습니다', ~{::content})}">
<body>

<!--
  문의자 접수 통보 메일 (S15P21A204-384).

  대화상자가 "답변은 가입한 메일로 발송돼요" 라고 약속하므로, 이 메일이 그 약속의
  첫 조각이다 — 접수됐다는 사실을 문의자에게 돌려준다.

  모델 변수
    contentHtml : 접수된 문의 내용 (필수). InquiryNotifier.toHtmlBody 가 escape 를
                  끝낸 HTML 조각이라 아래에서 th:utext 로 그린다.
    senderName  : 문의자 닉네임
-->
<th:block th:fragment="content">

    <p style="font-size: 15px; color: #4a6ea8; line-height: 1.7; margin: 0; text-align: center; word-break: keep-all;">
        <span th:text="${senderName} ?: ''">닉네임</span><span th:if="${!#strings.isEmpty(senderName)}">님, </span>문의가
        잘 접수되었습니다.<br />
        확인하고 답변드릴게요.
    </p>

    <!-- 접수된 내용을 그대로 돌려준다. 사용자가 자기가 쓴 글을 확인할 수 있다. -->
    <p style="margin: 26px 0 10px 0; font-size: 12px; letter-spacing: 0.04em; color: #8ba2c4;">보내주신 내용</p>
    <div style="background-color: #ffffff; border: 1px solid #e2ecfa; border-radius: 16px; padding: 20px; font-size: 15px; color: #33507f; line-height: 1.75; word-break: break-word;"
         th:utext="${contentHtml}">문의 내용</div>

    <p style="font-size: 13px; color: #8ba2c4; line-height: 1.6; margin: 22px 0 0 0; text-align: center;">
        답변은 이 메일 주소로 보내드립니다.
    </p>

</th:block>

</body>
</html>
