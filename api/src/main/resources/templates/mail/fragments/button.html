<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  메일 본문 CTA 버튼.

  사용법:
    <th:block th:replace="~{mail/fragments/button :: primaryButton(${verifyUrl}, '인증하기')}"></th:block>

  url 이 아래 중 하나면 버튼 전체(보조 안내문 포함)가 렌더링되지 않습니다.
    - 변수 자체가 모델에 없는 경우 (null)
    - 빈 문자열
    - 공백만 있는 문자열
-->
<div th:fragment="primaryButton(url, label)"
     th:if="${!#strings.isEmpty(#strings.trim(url))}"
     style="margin: 28px 0 0 0; text-align: center;">

    <a th:href="${url}" th:text="${label}" href="#" target="_blank" rel="noopener noreferrer"
       style="display: inline-block; padding: 14px 34px; background-color: #2563eb; color: #ffffff;
              font-size: 15px; font-weight: bold; text-decoration: none; border-radius: 8px;
              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">인증하기</a>

    <p style="margin: 16px 0 0 0; font-size: 12px; color: #94a3b8; line-height: 1.5; word-break: break-all;">
        버튼이 동작하지 않으면 아래 주소를 복사해 브라우저에 붙여넣어 주세요.<br />
        <span th:text="${url}" style="color: #64748b;">https://example.com</span>
    </p>
</div>

</body>
</html>
