<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  6자리 인증 코드 박스.
  - 코드를 한 글자씩 6개의 칸에 나누어 표시합니다.
  - 클립보드 복사 스크립트는 두지 않습니다. 메일 클라이언트가 <script> 를 제거해
    대부분의 환경에서 동작하지 않기 때문입니다. 대신 슬롯 영역에 user-select: all 을
    걸어 두어, 한 번의 클릭으로 코드 전체가 선택되고 Ctrl+C 로 복사됩니다.
  - 슬롯 span 은 반드시 공백 없이 한 줄로 두어야 합니다.
    (사이에 줄바꿈이 들어가면 선택/복사 결과에 공백이 섞입니다.)
-->
<div th:fragment="codeBox(code)"
     style="margin: 26px 0 0 0; text-align: center;">

    <div style="-webkit-user-select: all; -moz-user-select: all; -ms-user-select: all; user-select: all;"><span th:each="i : ${#numbers.sequence(0, 5)}" th:text="${#strings.length(code) > i} ? ${#strings.substring(code, i, i + 1)} : ''" style="display: inline-block; width: 44px; line-height: 58px; margin: 0 3px; text-align: center; background-color: #ffffff; border: 1px solid #d5e5fb; border-radius: 12px; font-size: 28px; font-weight: bold; letter-spacing: 0.02em; color: #2f4f85; font-family: 'Segoe UI', Roboto, monospace;">1</span></div>

</div>

</body>
</html>
