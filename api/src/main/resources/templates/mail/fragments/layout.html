<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="base(title, content)">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title}">뮤피드</title>
</head>

<!--
  메일 공통 레이아웃.
  서비스 화면과 같은 톤(옅은 하늘색 배경 + 푸른 잉크 + 넉넉한 라운드)을 따릅니다.
  메일 클라이언트는 스타일 시트와 스크립트를 자주 잘라내므로 색과 여백은 전부
  인라인 스타일로 둡니다.

  모델 변수
    logoUrl : 로고 이미지 절대 주소 (선택). 웹사이트 주소가 설정돼 있을 때만
              전달되며, 없으면 글자 워드마크로 대체됩니다. 원격 이미지를
              차단하는 클라이언트를 위해 alt 에도 서비스명을 둡니다.
-->
<body style="margin: 0; padding: 0; background-color: #eef4fd; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', Roboto, sans-serif;">
    <table role="presentation" align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; margin: 0 auto;">
        <tr>
            <td style="height: 40px; line-height: 40px; font-size: 0;">&nbsp;</td>
        </tr>

        <!-- 본체 카드 -->
        <tr>
            <td style="background-color: #ffffff; border: 1px solid #dce7f8; border-radius: 28px;">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">

                    <!-- 브랜드 헤더 -->
                    <tr>
                        <!--
                          로고는 옅은 하늘색 선과 흰 면으로 그려져 있어 바탕이 진하면 뭉갭니다.
                          서비스 헤더(#fbfdff)와 같은 거의 흰 바탕 위에 둡니다.
                        -->
                        <td style="padding: 32px 32px 26px 32px; text-align: center; background-color: #f8fbff; border-bottom: 1px solid #e9f1fc; border-radius: 28px 28px 0 0;">
                            <img th:if="${!#strings.isEmpty(logoUrl)}" th:src="${logoUrl}" src="#"
                                 alt="뮤피드" width="196" height="100"
                                 style="display: block; width: 196px; max-width: 70%; height: auto; margin: 0 auto; border: 0; outline: none; text-decoration: none;" />
                            <p th:if="${#strings.isEmpty(logoUrl)}"
                               style="margin: 0; font-size: 26px; font-weight: bold; letter-spacing: -0.01em; color: #36588e;">뮤피드</p>
                            <p style="margin: 14px 0 0 0; font-size: 13px; letter-spacing: 0.04em; color: #6b8bc2;">
                                좋아했던 순간이 다음 음악이 되는 곳
                            </p>
                        </td>
                    </tr>

                    <!-- 메일 제목 -->
                    <tr>
                        <td style="padding: 36px 36px 0 36px; text-align: center;">
                            <h1 style="margin: 0; font-size: 21px; font-weight: bold; line-height: 1.45; color: #2f4f85;" th:text="${title}">이메일 인증 안내</h1>
                        </td>
                    </tr>

                    <!--
                      본문 패널.
                      위아래 여백을 넉넉히 두어 카드의 흰 배경이 패널을 감싸도록 합니다.
                    -->
                    <tr>
                        <td style="padding: 28px 28px 44px 28px;">
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
                                   style="background-color: #f6faff; border: 1px solid #e2ecfa; border-radius: 22px;">
                                <tr>
                                    <td style="padding: 34px 28px;">
                                        <th:block th:replace="${content}">
                                            <p>본문 영역</p>
                                        </th:block>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- 서비스 소개 푸터 -->
                    <tr>
                        <td style="padding: 26px 32px 30px 32px; background-color: #f4f8ff; border-top: 1px solid #e4edfb; border-radius: 0 0 28px 28px;">
                            <p style="margin: 0; font-size: 13px; line-height: 1.7; color: #7d92b4;">
                                좋아요를 누른 곡, 오래 들은 앨범, 남겨둔 한 줄의 감상.
                                뮤피드는 그 순간들을 이어 다음에 들을 음악을 골라 주는 음악 추천 서비스입니다.
                            </p>
                            <p style="margin: 18px 0 0 0; font-size: 12px; line-height: 1.7; color: #9bafcc;">
                                본인이 요청한 것이 아니라면 본 메일을 무시하셔도 됩니다.<br />
                                이 메일은 발신 전용으로 회신하지 마세요.
                            </p>
                            <p style="margin: 12px 0 0 0; font-size: 12px; color: #aec0d9;">&copy; Mupid</p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>

        <tr>
            <td style="height: 40px; line-height: 40px; font-size: 0;">&nbsp;</td>
        </tr>
    </table>
</body>
</html>
