<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="base(title, content)">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title}">뮤피드</title>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; margin: 40px auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <tr>
            <td style="padding: 36px 40px; text-align: center; background-color: #2563eb; color: #ffffff;">
                <h1 style="margin: 0; font-size: 24px;" th:text="${title}">뮤피드</h1>
            </td>
        </tr>
        <tr>
            <td style="padding: 32px 32px 24px 32px;">
                <!-- 본문 패널: 흰 카드 위에 옅은 배경을 한 겹 더 얹어 본문 영역을 구분합니다. -->
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
                       style="background-color: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 10px;">
                    <tr>
                        <td style="padding: 32px 28px;">
                            <th:block th:replace="${content}">
                                <p>본문 영역</p>
                            </th:block>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td style="padding: 0 32px 32px 32px;">
                <p style="font-size: 13px; color: #94a3b8; line-height: 1.5; margin: 0 0 6px 0;">
                    본인이 요청한 것이 아니라면 본 메일을 무시하셔도 됩니다.
                </p>
                <p style="font-size: 13px; color: #94a3b8; line-height: 1.5; margin: 0;">
                    이 메일은 발신 전용으로 회신하지 마세요.
                </p>
            </td>
        </tr>
    </table>

    <script th:replace="~{mail/fragments/code-box :: copyScript}"></script>
</body>
</html>
