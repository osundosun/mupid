<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/fragments/layout :: base('이메일 인증 안내', ~{::content})}">
<body>

<!--
  모델 변수
    code : 인증 코드 (필수)
-->
<th:block th:fragment="content">
    <p style="font-size: 15px; color: #4a6ea8; line-height: 1.7; margin: 0; text-align: center; word-break: keep-all;">
        요청하신 이메일 인증 코드입니다.<br />
        아래 여섯 자리를 입력창에 그대로 입력해 주세요.
    </p>

    <th:block th:replace="~{mail/fragments/code-box :: codeBox(${code})}"></th:block>

    <p style="font-size: 13px; color: #8ba2c4; line-height: 1.6; margin: 22px 0 0 0; text-align: center;">
        인증 코드는 발급 후 15분 동안만 유효합니다.
    </p>
</th:block>

</body>
</html>
