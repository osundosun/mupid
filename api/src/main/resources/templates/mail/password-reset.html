<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/fragments/layout :: base('패스워드 변경 안내', ~{::content})}">
<body>

<!--
  모델 변수
    code      : 인증 코드 (필수)
    userName  : 회원 닉네임 (필수)
    verifyUrl : 인증 페이지 링크 (선택, 없거나 비어 있으면 버튼이 표시되지 않습니다)
-->
<th:block th:fragment="content">
    <p style="font-size: 16px; color: #333333; margin: 0 0 24px 0;">
        안녕하세요, <strong th:text="${userName}">홍길동</strong>님!
    </p>
    <p style="font-size: 14px; color: #666666; line-height: 1.6; margin: 0;">
        요청하신 패스워드 변경을 위한 인증 코드입니다. 아래 코드를 입력창에 입력해 주세요.
    </p>

    <th:block th:replace="~{mail/fragments/code-box :: codeBox(${code})}"></th:block>
    <th:block th:replace="~{mail/fragments/button :: primaryButton(${verifyUrl}, '인증하기')}"></th:block>
</th:block>

</body>
</html>
