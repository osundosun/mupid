<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
</head>

<body style="margin: 0; padding: 0; background-color: #f4f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; margin: 40px auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <tr>
            <td style="padding: 36px 40px; text-align: center; background-color: #2563eb; color: #ffffff;">
                <h1 style="margin: 0; font-size: 24px;">이메일 인증 안내</h1>
            </td>
        </tr>
        <tr>
            <td style="padding: 40px;">
                <p style="font-size: 14px; color: #666666; line-height: 1.6;">
                    요청하신 이메일 인증 코드입니다. 아래 코드를 입력창에 입력해 주세요.
                </p>
                
                <!-- 인증 코드 박스 -->
                <div style="background-color: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 6px; padding: 20px; text-align: center; margin: 30px 0;">
                    <span style="font-size: 32px; font-weight: bold; letter-spacing: 6px; color: #1e293b;" th:text="${code}">123456</span>
                </div>

                <p style="font-size: 13px; color: #94a3b8; line-height: 1.5;">
                    본인이 요청한 것이 아니라면 본 메일을 무시하셔도 됩니다.
                </p>
                <p style="font-size: 13px; color: #94a3b8; line-height: 1.5;">
                    이 메일은 발신 전용으로 회신하지 마세요.
                </p>
            </td>
        </tr>
    </table>
</body>
</html>
