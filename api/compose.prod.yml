# 운영용: 스프링까지 전부 컨테이너로 실행한다.
#   docker compose -f compose.prod.yml up -d --build
# 로컬 개발(스프링을 호스트에서 직접 실행)은 compose.yml 을 사용할 것.
name: mupid

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: mupid-nginx
    restart: unless-stopped
    environment:
      # nginx/templates 의 ${API_UPSTREAM} 치환값
      API_UPSTREAM: api:8800
      NGINX_ENVSUBST_FILTER: "^API_UPSTREAM$$"
      TZ: Asia/Seoul
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    ports:
      - "${MUPID_NGINX_PORT:-8080}:80"
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mupid-api:latest
    container_name: mupid-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MUPID_MYSQL_URL: jdbc:mysql://mysql:3306/mupid?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      MUPID_REDIS_HOST: redis
      MUPID_REDIS_PORT: 6379
      # ClickHouse 클러스터(Keeper + 서버 2노드 + Kafka)는 이 compose 가 띄우지 않는다.
      # EC2 역할 분리에 따라 별도 호스트에 두고, MUPID_CLICKHOUSE_URL 을 .env 에서
      # 그 주소로 지정한다. 개발용 .env 값(jdbc:clickhouse://localhost:18123/default)은
      # 컨테이너 안에서 통하지 않으므로 운영 .env 에서 반드시 덮어써야 한다.
      # 로컬에서 클러스터까지 함께 띄우는 구성은 compose.yml 을 볼 것.
      # 같은 이유로 MUPID_KAFKA_BOOTSTRAP 도 운영 .env 에서 덮어써야 한다.
      # 개발용 값 localhost:19092 는 컨테이너 안에서 통하지 않는다.
    expose:
      - "8800"
    networks:
      - frontend
      - backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: mupid-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MUPID_MYSQL_PASSWORD}
      MYSQL_DATABASE: mupid
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: mupid-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  # nginx <-> api
  frontend:
    name: mupid-frontend
    driver: bridge
  # api <-> mysql/redis (nginx 는 붙지 않는다)
  backend:
    name: mupid-backend
    driver: bridge

volumes:
  mysql-data:
    name: mupid-mysql-data
  redis-data:
    name: mupid-redis-data
