# 운영용: 스프링까지 전부 컨테이너로 실행한다.
#   docker compose -f compose.prod.yml up -d --build
# 로컬 개발(스프링을 호스트에서 직접 실행)은 compose.yml 을 사용할 것.
name: mupid

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: mupid-nginx
    restart: unless-stopped
    environment:
      # nginx/templates 의 ${API_UPSTREAM} 치환값
      API_UPSTREAM: api:8800
      NGINX_ENVSUBST_FILTER: "^API_UPSTREAM$$"
      TZ: Asia/Seoul
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    ports:
      - "${MUPID_NGINX_PORT:-8080}:80"
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mupid-api:latest
    container_name: mupid-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # .env 값은 호스트(localhost) 기준이라 컨테이너 네트워크 기준으로 덮어쓴다
      MUPID_MYSQL_URL: jdbc:mysql://mysql:3306/mupid?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      MUPID_REDIS_HOST: redis
      MUPID_REDIS_PORT: 6379
    # 외부 노출은 nginx 만 담당한다. 직접 붙어야 하면 ports 로 바꿀 것.
    expose:
      - "8800"
    networks:
      - frontend
      - backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: mupid-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MUPID_MYSQL_PASSWORD}
      MYSQL_DATABASE: mupid
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # 호스트로 노출하지 않는다. backend 네트워크 안에서 api 만 접근한다.
    # 직접 붙어야 할 땐: docker compose -f compose.prod.yml exec mysql mysql -uroot -p mupid
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: mupid-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # 호스트로 노출하지 않는다. backend 네트워크 안에서 api 만 접근한다.
    # 직접 붙어야 할 땐: docker compose -f compose.prod.yml exec redis redis-cli
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  # nginx <-> api
  frontend:
    name: mupid-frontend
    driver: bridge
  # api <-> mysql/redis (nginx 는 붙지 않는다)
  backend:
    name: mupid-backend
    driver: bridge

volumes:
  mysql-data:
    name: mupid-mysql-data
  redis-data:
    name: mupid-redis-data
