# ${API_UPSTREAM} 는 컨테이너 기동 시 envsubst 로 치환된다.
#   - 운영(compose.yml)     : api:8800
#   - 개발(compose.dev.yml) : host.docker.internal:8800  (호스트에서 직접 띄운 스프링)
upstream mupid_api {
    server ${API_UPSTREAM};
    keepalive 32;
}

upstream seaweedfs_filer {
    server storage:8888;
    keepalive 64;
}

proxy_cache_path /var/cache/nginx/audio_cache 
    levels=1:2 
    keys_zone=AUDIO_CACHE:50m 
    max_size=10g 
    inactive=7d 
    use_temp_path=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # nginx 자체 헬스체크 (백엔드와 무관하게 200)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://mupid_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # SSE / 스트리밍 응답 대비
        proxy_buffering off;
    }

    location /storage/ {
        internal; # 외부에서 바로 접근할 수 없음

        # URI 앞부분을 떼고 SeaweedFS Filer의 실제 경로로 매핑
        rewrite ^/storage/(.*)$ /$1 break;

        proxy_pass http://seaweedfs_filer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 파일 스트리밍 커널 최적화
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # 스트리밍 지연 방지 (버퍼링 끄고 바로 클라이언트로 방출)
        proxy_buffering off;
        proxy_max_temp_file_size 0;

        # Opus MIME 타입 강제 (브라우저 decodeAudioData 인식용)
        default_type audio/ogg;
        add_header Content-Type audio/ogg;

        # CORS 허용 (Web Audio API/AudioContext는 CORS 통과 필수)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Authorization" always;

        # Nginx 로컬 디스크 캐싱 (SeaweedFS I/O 완화)
        proxy_cache AUDIO_CACHE;
        proxy_cache_valid 200 206 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location ~ ^/api/internal/upload/(.*)$ {
        # 허용할 IP(연구용 서버)만 화이트리스트 지정 가능
        # allow 192.168.1.100;
        # deny all;

        # Filer로 바로 바이트 전송 (Spring Boot 바이패스)
        rewrite ^/api/internal/upload/(.*)$ /$1 break;
        proxy_pass http://seaweedfs_filer;
        proxy_http_version 1.1;

        # 업로드 최적화
        client_max_body_size 50M;
        proxy_request_buffering off; # 디스크 임시 파일 거치지 않고 바로 Filer로 스트림 업로드
    }
}
