plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2-SNAPSHOT'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.osundosun.mupid'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://repo.spring.io/snapshot' }
}

// lz4-java 를 서로 다른 좌표로 가져오는 의존성이 둘이라 런타임 클래스패스가 충돌한다.
//
//   clickhouse-jdbc  -> org.lz4:lz4-java:1.8.0
//   kafka-clients    -> at.yawk.lz4:lz4-java:1.10.1
//
// at.yawk 쪽은 원본이 관리되지 않아 나온 재배포판이고, 같은 net.jpountz 클래스를
// 담으면서 'org.lz4:lz4-java' capability 를 스스로 선언한다. 즉 둘은 서로를 대체할 수
// 있다는 뜻이고, Gradle 은 그 선언을 보고 "둘 중 하나만 고르라" 며 빌드를 세운다.
// 높은 버전을 고른다. 어느 쪽을 exclude 해도 남은 하나가 lz4 압축을 잃는다.
//
// 이 충돌은 :runtimeClasspath 에서만 드러난다. clickhouse-jdbc 가 runtimeOnly 라
// compileJava 는 통과하고 bootJar 에서 터진다 — 검증은 CI 와 같은 build -x test 로 한다.
configurations.all {
	resolutionStrategy.capabilitiesResolution.withCapability('org.lz4:lz4-java') {
		selectHighestVersion()
	}
}

dependencies {
	// SpringBoot 관련
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Lombok 관련
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	// RDBMS 관련
	runtimeOnly 'com.mysql:mysql-connector-j'

	// ClickHouse(분석 DB) 관련
	// 드라이버 클래스는 문자열로만 참조하므로 mysql 과 같이 runtimeOnly 로 둔다.
	runtimeOnly 'com.clickhouse:clickhouse-jdbc:0.9.0'

	// Kafka(이벤트 발행) 관련
	// 프로듀서 빈을 직접 만들므로 라이브러리만 있으면 된다. spring.kafka.* 자동설정은 쓰지 않는다.
	//
	// 압축 코덱 둘을 뺀다. 우리 프로듀서는 compression.type 을 지정하지 않아(none) 쓰지
	// 않는데, 둘 다 전 플랫폼용 네이티브 바이너리를 담고 있어 실행 jar 을 9.2MB 불린다
	// (zstd-jni 7.0MB + snappy-java 2.2MB). lz4-java 는 남긴다 — ClickHouse JDBC 가 쓴다.
	//
	// ⚠ 나중에 compression.type 을 zstd 나 snappy 로 바꾸려면 해당 exclude 를 먼저
	//   지워야 한다. 안 지우면 런타임에 NoClassDefFoundError 로 발행이 통째로 실패한다.
	implementation('org.springframework.kafka:spring-kafka') {
		exclude group: 'com.github.luben', module: 'zstd-jni'
		exclude group: 'org.xerial.snappy', module: 'snappy-java'
	}

	// JWT 관련
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	// Json 관련
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// Gmail 관련
    implementation 'com.google.api-client:google-api-client:2.7.0'
    implementation 'com.google.http-client:google-http-client-gson:1.45.0'
    implementation 'com.google.apis:google-api-services-gmail:v1-rev20240520-2.0.0'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.24.1'
	implementation 'jakarta.mail:jakarta.mail-api:2.1.3'
    implementation 'org.eclipse.angus:jakarta.mail:2.0.3'

	// S3(오브젝트 스토리지) 관련
	implementation platform('software.amazon.awssdk:bom:2.25.16')
	implementation 'software.amazon.awssdk:s3'

	// 테스트 관련
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-batch-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-batch-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
