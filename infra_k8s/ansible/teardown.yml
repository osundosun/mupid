---
# NODE_A 의 Compose 배포를 걷어낸다.
#
# **이 플레이북은 운영 데이터를 지운다.** mupid-mysql-data · storage-data ·
# redis-data 와 `/srv/mupid` 전체가 사라지고, 백업 외에 되돌릴 방법이 없다.
# 운영 데이터를 버리고 처음부터 구축하기로 한 팀 결정 때문에 존재한다.
#
#   ansible-playbook -i inventory.ini teardown.yml -e confirm_destroy=DESTROY
#
# 가드 없이는 아무것도 하지 않는다. cluster.yml 과 합치지 않은 이유도 같다 —
# k3s 설치를 다시 돌리다가 데이터가 지워지는 일이 없어야 한다.
#
# 건드리지 않는 것
#   - NODE_B 의 GitLab Runner. 아직 CI 를 담당한다. CONTROLLER 로 옮긴 뒤에
#     따로 내린다(Phase 5).
#   - /etc/letsencrypt. 인증서는 그대로 쓴다. 웹루트 경로만 옮긴다.

- name: Check the connection values from .env before any SSH
  hosts: k3s
  gather_facts: false
  become: false
  connection: local
  tags: [always]
  roles: [env_check]

- name: Remove the Compose deployment from the edge node
  hosts: k3s_server
  gather_facts: true
  become: true
  vars:
    confirm_destroy: ''
    compose_root: /srv/mupid
    k8s_root: /srv/mupid-k8s
  tasks:
    - name: Refuse to run without an explicit confirmation
      ansible.builtin.assert:
        that: confirm_destroy == 'DESTROY'
        fail_msg: >-
          이 플레이북은 {{ compose_root }} 와 MySQL·SeaweedFS 볼륨을 영구 삭제한다.
          의도한 것이면 -e confirm_destroy=DESTROY 를 준다.
        quiet: true

    - name: Is there anything to remove
      ansible.builtin.stat:
        path: "{{ compose_root }}/config/compose.yml"
      register: compose_file

    # 데이터는 버리지만 자격증명은 다르다. MUPID_GMAIL_* 는 Google OAuth 에서
    # 발급받은 값이라 서버에서 다시 만들 수 없고, 다시 받으려면 콘솔 작업이다.
    # config/ 의 ClickHouse XML 과 s3.json 도 마찬가지로 저장소에 없다.
    - name: Keep the credentials before the tree goes
      when: compose_file.stat.exists
      block:
        - name: Make a place for them outside the tree being removed
          ansible.builtin.file:
            path: "{{ k8s_root }}/salvage"
            state: directory
            owner: root
            group: root
            mode: '0700'

        - name: Copy .env and the server configuration aside
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: "{{ k8s_root }}/salvage/"
            remote_src: true
            owner: root
            group: root
            mode: '0600'
            # Without this the directory itself is created 0600 — no execute
            # bit, so nothing can enter it and the salvaged files are as good
            # as gone. `mode` alone only covers the files.
            directory_mode: '0700'
          loop:
            - "{{ compose_root }}/.env"
            - "{{ compose_root }}/config"
          failed_when: false

    # /srv/mupid 를 대상으로 하므로 트리가 사라지면 매번 실패한다.
    - name: Stop the backup timer
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: [mupid-backup.timer, mupid-backup.service]
      failed_when: false

    - name: Bring the stack down and remove its volumes
      ansible.builtin.command:
        cmd: >-
          docker compose --env-file {{ compose_root }}/.env
          -f {{ compose_root }}/config/compose.yml down --volumes --remove-orphans
      when: compose_file.stat.exists
      register: composedown
      changed_when: composedown.rc == 0
      failed_when: false

    - name: Remove any container the compose file did not own
      ansible.builtin.shell:
        cmd: docker rm -f $(docker ps -aq --filter 'name=^mupid-') 2>/dev/null || true
      register: strays
      changed_when: strays.stdout | length > 0

    - name: Remove the named volumes if they outlived the stack
      ansible.builtin.command:
        cmd: docker volume rm {{ item }}
      loop:
        - mupid-mysql-data
        - mupid-storage-data
        - mupid-redis-data
        - mupid-clickhouse-data
        - mupid-ch-keeper-data
        - mupid-kafka-data
      register: volumes
      changed_when: volumes.rc == 0
      failed_when: false

    # BASELINE #6: mupid-api 태그가 22개, /var/lib/containerd 7.2G. k3s 가 별도
    # containerd 에 다시 쌓으므로 여기서 비워 두는 편이 낫다.
    - name: Reclaim the disk the old images held
      ansible.builtin.command:
        cmd: docker image prune --all --force
      register: pruned
      changed_when: "'Total reclaimed space: 0B' not in pruned.stdout"

    - name: Remove the Compose tree
      ansible.builtin.file:
        path: "{{ compose_root }}"
        state: absent

    - name: Confirm nothing is listening on 80 or 443 any more
      ansible.builtin.shell:
        cmd: ss -lntH 'sport = :80 or sport = :443' | wc -l
      register: bound
      changed_when: false
      failed_when: bound.stdout | trim != '0'

# 웹루트가 방금 지운 트리 안에 있었다. 설정을 옮겨 두지 않으면 다음 갱신이
# 챌린지를 쓸 곳을 잃는다.
#
# 여기서 `certbot renew --dry-run` 을 돌리지 않는 것은, 새 웹루트를 실제로
# 서빙하는 것이 아직 없기 때문이다(엣지 Pod 는 Phase 3 에서 뜬다). 그때까지
# 갱신은 동작하지 않는다 — 인증서 만료는 2026-12-06 이라 시간은 있고,
# 검증은 OPERATIONS-K8S.md 의 기동 후 점검에 있다.
- name: Move the acme webroot out of the removed tree
  hosts: k3s_server
  gather_facts: false
  become: true
  vars:
    confirm_destroy: ''
    k8s_root: /srv/mupid-k8s
  tasks:
    - name: Refuse to run without an explicit confirmation
      ansible.builtin.assert:
        that: confirm_destroy == 'DESTROY'
        quiet: true

    - name: Create the webroot the edge pod will mount
      ansible.builtin.file:
        path: "{{ k8s_root }}/acme/.well-known/acme-challenge"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Find the renewal configurations
      ansible.builtin.find:
        paths: /etc/letsencrypt/renewal
        patterns: '*.conf'
      register: renewals

    - name: Point certbot at the new webroot
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '/srv/mupid/acme'
        replace: "{{ k8s_root }}/acme"
      loop: "{{ renewals.files }}"
      loop_control: {label: "{{ item.path }}"}

    - name: Report what certbot will use now
      ansible.builtin.shell:
        cmd: grep -h webroot_path /etc/letsencrypt/renewal/*.conf || true
      register: webroots
      changed_when: false

    - name: Show it
      ansible.builtin.debug:
        var: webroots.stdout_lines
