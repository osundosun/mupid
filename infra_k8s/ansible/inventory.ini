# ansible_host is the address the CONTROL NODE dials (public, via the PEM).
# k3s_node_ip is the address the two nodes use to talk to EACH OTHER (private,
# same VPC). They are different on purpose: k3s must never advertise the public
# address, or 6443 ends up exposed to the internet.
#
# Fill ansible_user and the PEM path, or pass them on the command line:
#   ansible-playbook -i inventory.ini cluster.yml \
#     -e ansible_user=ubuntu -e ansible_ssh_private_key_file=~/mupid.pem
#
# Running ON one of the nodes instead of from a laptop: override its connection.
#   -e ansible_connection=local

[k3s_server]
node-a ansible_host=3.38.166.108 k3s_node_ip=172.26.6.231 node_role=edge

[k3s_agent]
node-b ansible_host=52.78.64.52 k3s_node_ip=172.26.0.168 node_role=ai

[k3s:children]
k3s_server
k3s_agent

[k3s:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
# Path on the control node (the Raspberry Pi), not a secret. Override for any
# other control node: -e ansible_ssh_private_key_file=...
ansible_ssh_private_key_file=/home/pipi/.ssh/J15A204T.pem
