# 접속 값은 저장소에 두지 않는다. infra_k8s/.env 에서 환경변수로 들어온다.
#
#   set -a; . ../.env; set +a
#   ansible-playbook -i inventory.ini preflight.yml
#
# .env 를 내보내지 않고 돌리면 값이 빈 문자열이 되는데, 두 플레이북 첫머리의
# env_check 가 SSH 를 시도하기 전에 멈춘다. UNREACHABLE 로 끝나지 않는다.
#
# ansible_host 는 CONTROLLER 가 접속할 공인 주소이고, k3s_node_ip 는
# NODE_A·NODE_B 가 서로를 부를 사설 주소다. 일부러 다르다 — k3s 가 공인 주소를
# 광고하면 6443 이 인터넷에 열린다. env_check 가 매 실행마다 단언한다.
#
# 명령줄로 덮어쓸 수 있다:
#   -e ansible_user=ubuntu -e ansible_ssh_private_key_file=~/mupid.pem
# 노드 위에서 직접 돌릴 때:
#   -e ansible_connection=local
#
# node_role 은 접속 정보가 아니라 이 저장소가 정한 배치 축이라 여기 남는다.
# kubelet 의 system_reserved(group_vars/all.yml)와 매니페스트의 nodeSelector 가
# 이 값을 쓴다.

[k3s_server]
node-a node_role=edge ansible_host="{{ lookup('env', 'MUPID_NODE_A_HOST_PUBLIC') }}" k3s_node_ip="{{ lookup('env', 'MUPID_NODE_A_HOST_PRIVATE') }}" ansible_user="{{ lookup('env', 'MUPID_NODE_A_SSH_USER') }}" ansible_ssh_private_key_file="{{ lookup('env', 'MUPID_NODE_A_SSH_KEY') }}"

[k3s_agent]
node-b node_role=ai ansible_host="{{ lookup('env', 'MUPID_NODE_B_HOST_PUBLIC') }}" k3s_node_ip="{{ lookup('env', 'MUPID_NODE_B_HOST_PRIVATE') }}" ansible_user="{{ lookup('env', 'MUPID_NODE_B_SSH_USER') }}" ansible_ssh_private_key_file="{{ lookup('env', 'MUPID_NODE_B_SSH_KEY') }}"

[k3s:children]
k3s_server
k3s_agent

[k3s:vars]
ansible_python_interpreter=/usr/bin/python3
