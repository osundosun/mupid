# k8s deployment jobs. Manual only.
#
# Every job here is `when: manual`. The cluster does not exist yet, and until it
# does these must never fire on a push — infra/ci/* is still the path that
# serves production and nothing in this file touches it.
#
# At cutover the rules below become the same ones infra/ci/release.yml uses
# (protected develop + MUPID_DEPLOY_ENABLED) and the includes for the Compose
# jobs come out of .gitlab-ci.yml. Until then this is a button.
#
# Required CI variables, separate from the Compose ones so neither credential
# can drive the other path:
#   MUPID_DEPLOY_K8S_SSH_KEY      file  private key for mupid-deploy-k8s
#   MUPID_DEPLOY_K8S_KNOWN_HOSTS  file  verified host key for the edge node
#   MUPID_K8S_BASE_URL            var   https://...:8443 before cutover
.k8s-changes: &k8s_changes
  - api/**/*
  - frontend/**/*
  - infra_k8s/**/*
  - .gitlab-ci.yml

.k8s-image:
  tags: [mupid-ci]
  image:
    name: moby/buildkit@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    entrypoint: ['']
    docker:
      user: '0'
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  timeout: 40m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_COMMIT_BRANCH == "develop"'
      changes: *k8s_changes
      when: manual
      allow_failure: true

# The API image is the one infra/ci/package-image.sh already builds; the archive
# it writes is a docker archive, which is what `k3s ctr images import` takes.
k8s-package-api:
  extends: .k8s-image
  stage: package
  interruptible: true
  needs:
    - job: backend-verify
      artifacts: false
  script:
    - sh infra/ci/package-image.sh
  artifacts:
    expire_in: 1 day
    paths: [.release/image.tar.gz, .release/image.tar.gz.sha256]

k8s-package-web:
  extends: .k8s-image
  stage: package
  interruptible: true
  needs:
    - job: frontend-verify
      artifacts: true
  script:
    - sh infra_k8s/ci/package-web.sh
  artifacts:
    expire_in: 1 day
    paths: [.release/web/image.tar.gz, .release/web/image.tar.gz.sha256]

.k8s-deploy:
  stage: deploy
  image: alpine:3.22
  tags: [mupid-ci]
  # One at a time: the receiver takes an exclusive lock and a second job would
  # be refused rather than queued.
  resource_group: mupid-k8s
  environment:
    name: demo-k8s
    url: https://j15a204.p.ssafy.io
  timeout: 15m
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_COMMIT_BRANCH == "develop"'
      when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache curl openssh-client

k8s-deploy-api:
  extends: .k8s-deploy
  needs: [k8s-package-api]
  script:
    - sh infra_k8s/ci/deploy-k8s.sh api

k8s-deploy-web:
  extends: .k8s-deploy
  needs: [k8s-package-web]
  script:
    - sh infra_k8s/ci/deploy-k8s.sh web
