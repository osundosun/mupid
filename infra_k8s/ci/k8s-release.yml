# k8s deployment jobs. Protected master only.
#
# **Build and transmit in one job.** The image never becomes a GitLab artifact:
# the API tar is ~220MB and the coordinator refuses it with 413. The Compose
# pipeline had the same rule for the same reason; splitting package and deploy
# into two jobs is what reintroduced the upload.
#
# Required CI variables, separate from the Compose ones so neither credential
# can drive the other path:
#   MUPID_DEPLOY_K8S_SSH_KEY      file  private key for mupid-deploy-k8s
#   MUPID_DEPLOY_K8S_KNOWN_HOSTS  file  verified host key for the edge node
#   MUPID_K8S_BASE_URL            var   https://j15a204.p.ssafy.io
#   MUPID_DEPLOY_ENABLED          var   "true" — the switch that arms deployment
#
# backend-verify and frontend-verify still come from infra/ci/. Only the Compose
# deployment jobs were retired — the verify jobs are not Compose-specific and the
# jobs below need them as gates. Neither deliverable travels as an artifact: the
# jar and the frontend bundle are both compiled inside the image build here.
#
# 배포는 **변경 경로를 보지 않는다.** master 에 올라가면 api·web 을 다시 굽고
# 올린다.
#
# 예전에는 `changes:` 로 걸렀는데, 그러면 "코드는 그대로인데 설정만 바뀐" 경우가
# 통째로 빠진다. 실제로 환경변수를 바꿨는데 배포가 뜨지 않아 반영되지 않은 일이
# 있었다. 러너를 맥으로 옮긴 뒤 api 173초·web 45초라 매번 돌려도 부담이 크지
# 않고, 같은 이미지를 다시 올리면 수신기가 ALREADY_DEPLOYED 로 끝낸다.
#
# master 푸시에는 라벨이 없다(CI_MERGE_REQUEST_LABELS 는 MR 파이프라인 전용).
# 그래서 "라벨이 있으면 배포" 를 그대로 쓸 수 없고, 대신 거르지 않는 쪽을 택했다.

.api-changes: &api_changes
  - api/**/*
  - infra/image/**/*
  - infra/ci/package-image.sh
  - infra_k8s/base/api.yaml
  - infra_k8s/ci/**/*
  - .gitlab-ci.yml

.web-changes: &web_changes
  - frontend/**/*
  - infra_k8s/image/**/*
  - infra_k8s/base/edge.yaml
  - infra_k8s/base/nginx/**/*
  - infra_k8s/ci/**/*
  - .gitlab-ci.yml

.k8s-deploy:
  stage: deploy
  tags: [mupid-ci]
  # buildkit builds the image and ssh sends it, in this one container.
  image:
    name: moby/buildkit@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    entrypoint: ['']
    docker:
      user: '0'
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  # One at a time: the receiver takes an exclusive lock and a second job would
  # be refused rather than queued.
  resource_group: mupid-k8s
  environment:
    name: demo
    url: https://j15a204.p.ssafy.io
  # Build and transmit on a Raspberry Pi over an SD card, so this is generous.
  timeout: 90m
  # A deployment must not be cancelled half way by the next push.
  interruptible: false
  before_script:
    - apk add --no-cache curl openssh-client

# platform=linux/amd64 is pinned inside package-image.sh, so the arm64 runner
# still produces an image the x86_64 nodes can execute.
k8s-deploy-api:
  extends: .k8s-deploy
  needs:
    # 매니페스트가 먼저다. 새 매니페스트가 요구하는 것(볼륨·Secret 키)이
    # 없는 상태로 이미지만 바뀌면 파드가 못 뜬다.
    - job: k8s-deploy-manifests
      artifacts: false
    - job: backend-verify
      artifacts: false
      # Skipped when the commit changed nothing under api/. This job's own
      # rules keep it from running then, but `optional` keeps the pipeline
      # from failing to generate.
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true"'
      when: manual
  script:
    - sh infra/ci/package-image.sh
    - sh infra_k8s/ci/deploy-k8s.sh api

k8s-deploy-web:
  extends: .k8s-deploy
  needs:
    # 매니페스트가 먼저다. 새 매니페스트가 요구하는 것(볼륨·Secret 키)이
    # 없는 상태로 이미지만 바뀌면 파드가 못 뜬다.
    - job: k8s-deploy-manifests
      artifacts: false
    - job: frontend-verify
      # 게이트일 뿐이다. 이 job 이 프론트엔드를 소스부터 다시 굽는다 —
      # package-web.sh 참고. api 쪽과 같은 모양이다.
      artifacts: false
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true"'
      when: manual
  script:
    - sh infra_k8s/ci/package-web.sh
    - sh infra_k8s/ci/deploy-k8s.sh web

# 운영 환경변수를 갈아 끼운다. **이미지와 무관하다** — 코드가 그대로여도
# MUPID_API_ENV 가 바뀌면 여기서 반영된다.
#
# CI 는 내용을 보내기만 하고 Secret 을 만드는 것은 노드의 root 다. 배포 계정의
# RBAC 은 secrets 를 막고 있고(rbac.yaml), 열면 CI 키를 훔친 쪽이 DB 비밀번호와
# JWT 서명키를 읽는다.
#
# 내용이 예전과 같으면 수신기가 UNCHANGED 를 돌려주고 아무것도 하지 않는다.
# 그래서 master 푸시마다 돌려도 api 가 매번 재시작하지 않는다.
k8s-deploy-env:
  stage: deploy
  image: alpine:3
  tags: [mupid-ci]
  needs:
    - job: k8s-deploy-manifests
      artifacts: false
  resource_group: mupid-k8s
  interruptible: false
  timeout: 15m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true" && $MUPID_API_ENV'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true" && $MUPID_API_ENV'
      when: manual
  before_script:
    - apk add --no-cache openssh-client
  script:
    - sh infra_k8s/ci/deploy-env.sh

# 추천 서버 환경변수를 갈아 끼운다. **위와 나눠 둔 이유가 있다.**
#
# 여기에는 곡·순간 메타데이터를 읽을 `ROLE_SYSTEM` 리프레시 토큰이 들어 있다. 공용
# `MUPID_API_ENV` 에 섞으면 Spring 파드도 쓰지 않는 자격을 함께 받고, AI 값 하나
# 고치자고 api 까지 롤아웃된다. 나누면 각 파드가 제 몫만 보고 ai 만 재시작한다.
#
# `k8s-deploy-env` 뒤에 둔다 — 둘이 같은 노드의 kubectl 을 쓰므로 순서를 못 박는
# 편이 낫다.
#
# `MUPID_AI_SERVER_ENV` 가 없으면 이 job 자체가 생기지 않는다. 없는 상태에서도 배포는
# 돌아야 하고, 그때 추천 서버는 `/internal/ready` 가 false 로 남으면서 이유를
# `/health` 의 `metadata_source` 에 적는다 — 조용히 장르 없는 추천을 내보내지 않는다.
k8s-deploy-ai-env:
  stage: deploy
  image: alpine:3
  tags: [mupid-ci]
  needs:
    - job: k8s-deploy-env
      artifacts: false
      optional: true
  resource_group: mupid-k8s
  interruptible: false
  timeout: 15m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true" && $MUPID_AI_SERVER_ENV'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true" && $MUPID_AI_SERVER_ENV'
      when: manual
  before_script:
    - apk add --no-cache openssh-client
  script:
    - sh infra_k8s/ci/deploy-ai-env.sh

# 매니페스트를 클러스터에 적용한다. **이미지와 무관하다.**
#
# 저장소에서 고쳐 머지해도 클러스터는 모른다 — 사람이 노드에 올려 mupid-apply 를
# 돌려야 반영된다. 그 탓에 하루에 세 번 같은 사고가 났다: Secret 은 갱신됐는데
# 파드가 그 키를 안 읽고, nginx 수정이 k8s 사본에만 없고, APK 는 올라갔는데
# /download/ 가 404 였다. 셋 다 "머지했으니 됐다" 고 생각한 뒤 한참 뒤에 드러났다.
#
# 이미지 배포보다 **먼저** 돈다. 새 매니페스트가 요구하는 것(볼륨·Secret 키)이
# 없는 상태로 이미지만 바뀌면 파드가 못 뜬다.
#
# kubectl apply 는 멱등이라 매 푸시마다 돌려도 바뀐 게 없으면 unchanged 만 찍는다.
k8s-deploy-manifests:
  stage: deploy
  image: alpine:3
  tags: [mupid-ci]
  resource_group: mupid-k8s
  interruptible: false
  timeout: 20m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true"'
      when: manual
  before_script:
    # tar 도 깐다. alpine 기본은 busybox tar 라 --sort·--mtime·--owner 를 모르고
    # 도움말만 뱉는다. 그 옵션들은 같은 내용이면 같은 체크섬이 나오게 하는 것이라
    # 버리지 않는다 — 로그에서 "이번에 뭐가 바뀌었나" 를 체크섬으로 본다.
    - apk add --no-cache openssh-client tar
  script:
    - sh infra_k8s/ci/deploy-manifests.sh

# 추천 서버 이미지. **파드는 아직 0 이다** — 배포 경로를 먼저 세워 두고 나중에
# replicas 만 올린다. 목록에서 빼 두면 올릴 때가 되어서야 처음 돌려 보게 되고,
# 그때 문제가 나면 원인이 배포인지 코드인지 가려내기 어렵다.
#
# 이미지는 torch 가 없어 순수 파이썬 휠만 받는다. 크로스 빌드가 파일 복사에
# 가까워 QEMU 를 타지 않는다.
#
# **서빙 가중치는 여기서 굽는다** (S15P21A204-454). models.lock 에 채택된 버전이 있으면
# package-ai.sh 가 서빙 파일을 Object Storage 에서 받아(system-ci, X-Accel-Redirect) sha256 을
# 확인하고 이미지의 모델 자리에 넣는다. 없으면 지금처럼 판의 가중치로 돈다. 롤아웃이 끝나면
# 채택을 알린다 — 새 가중치가 든 이미지로 파드가 바뀐 것이 곧 채택이다.
# JupyterHub 는 부르지 않는다. 그쪽이 죽어도 코드 배포는 된다.
k8s-deploy-ai:
  extends: .k8s-deploy
  needs:
    - job: k8s-deploy-manifests
      artifacts: false
    - job: ai-server-verify
      artifacts: false
      optional: true
    # models.lock 이 바뀐 커밋에만 있다. 올린 뒤에 받아야 한다.
    - job: model-publish
      artifacts: false
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true"'
      changes: &ai_changes
        - ai_server/**/*
        - infra_k8s/base/ai.yaml
        - infra_k8s/ci/package-ai.sh
        - models.lock
        - infra/ci/model_publish.py
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true"'
      when: manual
  before_script:
    # 굽기·채택(model_publish.py)이 파이썬과 PyYAML 을 쓴다. Spring 은 표준 라이브러리로 부른다.
    - apk add --no-cache curl openssh-client python3 py3-yaml
  script:
    - sh infra_k8s/ci/package-ai.sh
    - sh infra_k8s/ci/deploy-k8s.sh ai
    # 수신기가 rollout status(readinessProbe 통과)까지 기다린 뒤라 여기 닿았으면 배포 성공이다.
    - python3 infra/ci/model_publish.py adopt
