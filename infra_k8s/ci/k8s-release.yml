# k8s deployment jobs. Protected master only.
#
# **Build and transmit in one job.** The image never becomes a GitLab artifact:
# the API tar is ~220MB and the coordinator refuses it with 413. The Compose
# pipeline had the same rule for the same reason; splitting package and deploy
# into two jobs is what reintroduced the upload.
#
# Required CI variables, separate from the Compose ones so neither credential
# can drive the other path:
#   MUPID_DEPLOY_K8S_SSH_KEY      file  private key for mupid-deploy-k8s
#   MUPID_DEPLOY_K8S_KNOWN_HOSTS  file  verified host key for the edge node
#   MUPID_K8S_BASE_URL            var   https://j15a204.p.ssafy.io
#   MUPID_DEPLOY_ENABLED          var   "true" — the switch that arms deployment
#
# backend-verify and frontend-verify still come from infra/ci/. Only the Compose
# deployment jobs were retired — the verify jobs are not Compose-specific and the
# jobs below need them as gates. Neither deliverable travels as an artifact: the
# jar and the frontend bundle are both compiled inside the image build here.
#
# 배포는 **변경 경로를 보지 않는다.** master 에 올라가면 api·web 을 다시 굽고
# 올린다.
#
# 예전에는 `changes:` 로 걸렀는데, 그러면 "코드는 그대로인데 설정만 바뀐" 경우가
# 통째로 빠진다. 실제로 환경변수를 바꿨는데 배포가 뜨지 않아 반영되지 않은 일이
# 있었다. 러너를 맥으로 옮긴 뒤 api 173초·web 45초라 매번 돌려도 부담이 크지
# 않고, 같은 이미지를 다시 올리면 수신기가 ALREADY_DEPLOYED 로 끝낸다.
#
# master 푸시에는 라벨이 없다(CI_MERGE_REQUEST_LABELS 는 MR 파이프라인 전용).
# 그래서 "라벨이 있으면 배포" 를 그대로 쓸 수 없고, 대신 거르지 않는 쪽을 택했다.

.api-changes: &api_changes
  - api/**/*
  - infra/image/**/*
  - infra/ci/package-image.sh
  - infra_k8s/base/api.yaml
  - infra_k8s/ci/**/*
  - .gitlab-ci.yml

.web-changes: &web_changes
  - frontend/**/*
  - infra_k8s/image/**/*
  - infra_k8s/base/edge.yaml
  - infra_k8s/base/nginx/**/*
  - infra_k8s/ci/**/*
  - .gitlab-ci.yml

.k8s-deploy:
  stage: deploy
  tags: [mupid-ci]
  # buildkit builds the image and ssh sends it, in this one container.
  image:
    name: moby/buildkit@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    entrypoint: ['']
    docker:
      user: '0'
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  # One at a time: the receiver takes an exclusive lock and a second job would
  # be refused rather than queued.
  resource_group: mupid-k8s
  environment:
    name: demo
    url: https://j15a204.p.ssafy.io
  # Build and transmit on a Raspberry Pi over an SD card, so this is generous.
  timeout: 90m
  # A deployment must not be cancelled half way by the next push.
  interruptible: false
  before_script:
    - apk add --no-cache curl openssh-client

# platform=linux/amd64 is pinned inside package-image.sh, so the arm64 runner
# still produces an image the x86_64 nodes can execute.
k8s-deploy-api:
  extends: .k8s-deploy
  needs:
    - job: backend-verify
      artifacts: false
      # Skipped when the commit changed nothing under api/. This job's own
      # rules keep it from running then, but `optional` keeps the pipeline
      # from failing to generate.
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true"'
      when: manual
  script:
    - sh infra/ci/package-image.sh
    - sh infra_k8s/ci/deploy-k8s.sh api

k8s-deploy-web:
  extends: .k8s-deploy
  needs:
    - job: frontend-verify
      # 게이트일 뿐이다. 이 job 이 프론트엔드를 소스부터 다시 굽는다 —
      # package-web.sh 참고. api 쪽과 같은 모양이다.
      artifacts: false
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true"'
      when: manual
  script:
    - sh infra_k8s/ci/package-web.sh
    - sh infra_k8s/ci/deploy-k8s.sh web

# 운영 환경변수를 갈아 끼운다. **이미지와 무관하다** — 코드가 그대로여도
# MUPID_API_ENV 가 바뀌면 여기서 반영된다.
#
# CI 는 내용을 보내기만 하고 Secret 을 만드는 것은 노드의 root 다. 배포 계정의
# RBAC 은 secrets 를 막고 있고(rbac.yaml), 열면 CI 키를 훔친 쪽이 DB 비밀번호와
# JWT 서명키를 읽는다.
#
# 내용이 예전과 같으면 수신기가 UNCHANGED 를 돌려주고 아무것도 하지 않는다.
# 그래서 master 푸시마다 돌려도 api 가 매번 재시작하지 않는다.
k8s-deploy-env:
  stage: deploy
  image: alpine:3
  tags: [mupid-ci]
  resource_group: mupid-k8s
  interruptible: false
  timeout: 15m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true" && $MUPID_API_ENV'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true" && $MUPID_API_ENV'
      when: manual
  before_script:
    - apk add --no-cache openssh-client
  script:
    - sh infra_k8s/ci/deploy-env.sh
