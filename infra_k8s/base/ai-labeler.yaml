# 선호 라벨 야간 배치.
#
# 라벨이 없으면 **오류 없이 모든 사용자가 콜드스타트**가 된다. 서버는 정상으로 보이고
# 개인화만 없다 — 그래서 이 작업은 반드시 주기적으로 돌아야 한다.
#
#   listen_events ──(pull_signals)──> events_service.jsonl ──(labeler)──> section_labels
#
# 추천 서버와 **같은 이미지**를 쓴다. 배치가 쓰는 코드가 서빙이 쓰는 코드와 갈리면
# 라벨의 의미가 달라진다 — 등급 판정은 한 곳에서만 해야 한다(labeler 문서).
#
# ## 왜 CronJob 인가
#
# 원천이 클러스터 안에 있다(ClickHouse). 밖에서 끌어올 것이 아니고, 색인도 이 노드의
# 디스크에 있다. GitLab 스케줄로 돌리면 러너가 색인과 ClickHouse 양쪽에 닿아야 한다.
#
# ## 쓰는 자리를 나눈다
#
# 색인 마운트는 **읽기 전용**이다. 여러 파드가 함께 읽는 것이고, 판마다 새 디렉터리로
# 올라와 `current` 링크가 갈아 끼워진다. 배치가 거기에 쓰면
#
#   · 읽기 전용이라 그 순간 실패하고
#   · 설령 열어 준다 해도 색인을 교체할 때마다 워터마크가 사라져 신호를 처음부터
#     다시 당긴다
#
# 그래서 `MUPID_AI_STATE_DIR` 로 나눈다. 상태는 판과 무관하게 한 자리에 쌓인다.
apiVersion: batch/v1
kind: CronJob
metadata: {name: ai-labeler, namespace: mupid}
spec:
  # 한국시간 04:00. MySQL 백업이 03:00~03:05 에 돌므로 겹치지 않게 뒤로 뺐다
  # (infra/README.md). 컨테이너의 TZ 가 Asia/Seoul 이라 이 값도 그 기준이다.
  schedule: "0 4 * * *"
  timeZone: Asia/Seoul
  # 겹쳐 돌지 않는다. 라벨러는 전체 사용자를 한 번에 훑고 `section_labels` 를 판째로
  # 갈아 끼우므로, 두 판이 동시에 들어가면 어느 쪽이 최신인지 뒤섞인다.
  concurrencyPolicy: Forbid
  # 노드가 꺼져 있었다면 지난 실행을 따라잡지 않는다. 라벨은 최신 한 판이면 된다.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # 두 시간을 넘기면 무언가 잘못된 것이다. 붙잡고 있으면 다음 판이 막힌다.
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          # 색인이 이 노드의 디스크에 있다. 추천 서버와 같은 자리에 묶는다.
          nodeSelector: {mupid.io/role: ai}
          # hostPath 는 kubelet 이 **root 소유로** 만든다(DirectoryOrCreate).
          # 컨테이너는 비root(uid 100)로 돌기 때문에 그대로면 첫 쓰기에서
          # Permission denied 다 — 실제로 겪었다. 배치가 신호를 다 읽고 워터마크를
          # 저장하다 죽었다.
          #
          # fsGroup 은 hostPath 에 적용되지 않는다. 그래서 root 로 한 번 맞춰 준다.
          # 색인(`/artifacts`)은 읽기만 하므로 건드리지 않는다.
          initContainers:
            - name: own-state
              image: mupid-ai:placeholder
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "chown -R 100:101 /state"]
              securityContext: {runAsUser: 0}
              volumeMounts:
                - {name: state, mountPath: /state}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 200m, memory: 128Mi}
          containers:
            - name: labeler
              # 추천 서버와 같은 태그를 쓴다. mupid-apply 가 치환한다 —
              # 직접 apply 하면 placeholder 가 그대로 올라가 ImagePullBackOff 다.
              image: mupid-ai:placeholder
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                # 두 단계다. 신호를 당기고(증분·멱등) 라벨을 만든다.
                # `set -e` 로 앞이 실패하면 뒤를 돌리지 않는다 — 반쯤 당긴 이벤트로
                # 라벨을 만들면 그 판이 최신으로 잡힌다.
                - |
                  set -e
                  python -m ai_server.tools.pull_signals
                  python -m ai_server.tools.run_labeler --json
              env:
                - {name: MUPID_AI_ARTIFACT_DIR, value: /artifacts/current}
                # 배치가 쓰는 자리. 색인과 나뉘어 있다.
                - {name: MUPID_AI_STATE_DIR, value: /state}
                - {name: MUPID_CLICKHOUSE_URL, value: 'http://clickhouse:8123'}
                - {name: MUPID_CLICKHOUSE_USER, value: mupid}
                - name: MUPID_CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: mupid-secrets, key: MUPID_CLICKHOUSE_PASSWORD}
                # 카탈로그를 통째로 올리므로 스레드가 코어 수만큼 뜨면 한도를 넘는다.
                - {name: OMP_NUM_THREADS, value: '2'}
                - {name: OPENBLAS_NUM_THREADS, value: '2'}
                - {name: MKL_NUM_THREADS, value: '2'}
              resources:
                # 서빙 파드와 같은 카탈로그를 올린다. 밤에 도는 것이라 CPU 는 넉넉히
                # 주되, 요청은 낮게 잡아 평소 스케줄링을 방해하지 않는다.
                requests: {cpu: 250m, memory: 512Mi}
                limits: {cpu: 2000m, memory: 2Gi}
              volumeMounts:
                - {name: artifacts, mountPath: /artifacts, readOnly: true}
                - {name: state, mountPath: /state}
          volumes:
            - name: artifacts
              hostPath: {path: /srv/mupid-k8s/ai-artifacts, type: DirectoryOrCreate}
            # 배치가 쌓는 것들 — 워터마크·이벤트 로그·라벨 중간물·선호 구간.
            # 색인과 **다른 자리**다. 색인은 판마다 갈리지만 이쪽은 이어져야 한다.
            - name: state
              hostPath: {path: /srv/mupid-k8s/ai-state, type: DirectoryOrCreate}
