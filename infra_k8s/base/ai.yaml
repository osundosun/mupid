# ai_server. Not exposed through nginx — /internal has no authentication and
# only the Spring API is meant to call it.
#
# **아직 띄우지 않는다 (replicas: 0).** 배포 경로를 먼저 만들어 두고 파드는
# 나중에 올린다. 코드가 아직 파일 산출물에 의존하고 있어서 지금 띄우면
# /internal/ready 가 503 이라 트래픽을 받지 못한다. 준비되면 숫자만 올린다.
#
# ## 볼륨이 없다
#
# 인계 문서(infra/AI-SERVER-K8S-HANDOVER.md)는 산출물 513MB 를 /artifacts 로
# 마운트하는 전제였다. 구조를 따져 보니 나눌 수 있었다.
#
#   임베딩 385MB   -> Pinecone (외부 벡터DB)
#   구간 벡터 33MB -> Pinecone
#   특징값 93MB    -> 서빙 경로가 읽지 않는다 (legacy/m10_features.py 뿐)
#   라벨           -> ClickHouse. 원천이 거기이고 ai_server 는 이미 붙어 있다
#   id_map         -> 필요 없다. 계약이 문자열 ID 다 (RecommenderDto 주석)
#   모델 가중치    -> 352KB. 이미지에 구워 보낸다
#
# 그래서 파드가 **무상태**다. PVC 도 initContainer 도 hostPath 도 없다.
# 레플리카를 늘리는 것도 숫자만 올리면 된다.
#
# Pinned to the AI node: the image is imported per node (레지스트리가 없다).
apiVersion: v1
kind: Service
metadata: {name: ai, namespace: mupid}
spec:
  selector: {app: ai}
  ports: [{port: 8100, targetPort: 8100}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ai, namespace: mupid}
spec:
  # 0 이다. 위 주석 참고 — 준비되면 1 로 올린다.
  replicas: 0
  selector: {matchLabels: {app: ai}}
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata: {labels: {app: ai}}
    spec:
      nodeSelector: {mupid.io/role: ai}
      containers:
        - name: ai
          image: mupid-ai:placeholder
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8100}]
          env:
            - {name: MUPID_AI_PORT, value: '8100'}
            # 행동 데이터를 요청마다 직접 읽는다 — 배치로 파일에 옮겨 담지
            # 않는다 (app/clickhouse.py 의 설명). 라벨도 여기로 옮긴다.
            - {name: MUPID_CLICKHOUSE_URL, value: 'http://clickhouse:8123'}
            - {name: MUPID_CLICKHOUSE_USER, value: mupid}
            - name: MUPID_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: {name: mupid-secrets, key: MUPID_CLICKHOUSE_PASSWORD}
            # Spring 과 나누는 /internal 공유 비밀. **양쪽을 동시에 켠다** —
            # 여기만 켜고 Spring 의 MUPID_RECOMMENDER_INTERNAL_TOKEN 을 비우면
            # 추천 호출이 전부 401 이다. 배포 설정만으로 조용히 죽는 형태다.
            - name: MUPID_AI_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: {name: mupid-secrets, key: MUPID_AI_INTERNAL_TOKEN, optional: true}
            # Empty leaves /internal/recommendations/search answering 501, which
            # is the defined behaviour until the resolver exists (S15P21A204-219).
            - {name: MUPID_AI_NLP_URL, value: ''}
            # torch and numpy start one thread per HOST core by default. This node
            # has 4 vCPU and the CPU limit below is 3, so without these the pod
            # oversubscribes its own quota and gets slower, not faster.
            - {name: OMP_NUM_THREADS, value: '3'}
            - {name: OPENBLAS_NUM_THREADS, value: '3'}
            - {name: MKL_NUM_THREADS, value: '3'}
          resources:
            # 임베딩이 Pinecone 으로 가면 385MB 를 파드가 들고 있지 않다.
            # 인계 문서 실측은 산출물 없이 유휴 80MB 였다. 띄운 뒤 다시 본다.
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: 3000m, memory: 2Gi}
          # /health is process liveness. /internal/ready additionally checks that
          # the four indexes agree row-for-row and that every candidate maps to a
          # numeric ID. It answers 503 until the MySQL mapping is loaded — that is
          # correct, and it keeps this pod out of the Service until then.
          startupProbe:
            httpGet: {path: /health, port: 8100}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /internal/ready, port: 8100}
            periodSeconds: 15
            failureThreshold: 4
          livenessProbe:
            httpGet: {path: /health, port: 8100}
            periodSeconds: 30
            failureThreshold: 5
