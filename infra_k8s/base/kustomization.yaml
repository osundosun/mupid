apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mupid
resources:
  - namespace.yaml
  - config.yaml
  - mysql.yaml
  - redis.yaml
  - storage.yaml
  - clickhouse.yaml
  - kafka.yaml
  - dbstudio.yaml
  - api.yaml
  - edge.yaml
  # ai.yaml 은 들어오되 **replicas 가 0 이다.** 배포 경로(이미지 빌드·전송·태그
  # 교체)를 먼저 세워 두고 파드는 나중에 올린다 — 코드가 아직 파일 산출물에
  # 의존해서 지금 띄우면 /internal/ready 가 503 이다.
  #
  # 목록에서 빼 두면 배포 경로를 시험할 수 없고, 올릴 때가 되어서야 처음 돌려
  # 보게 된다. 그때 문제가 나면 원인이 배포인지 코드인지 가려내기 어렵다.
  - ai.yaml
  # 라벨 야간 배치. 라벨이 없으면 오류 없이 모든 사용자가 콜드스타트다.
  - ai-labeler.yaml
# The hash suffix is deliberate: editing nginx.conf produces a new ConfigMap name
# and therefore a new pod. Without it the file would change on disk while the
# running nginx kept the old configuration.
configMapGenerator:
  - name: edge-nginx
    files:
      - default.conf=nginx/default.conf
  # Same reason as above: editing one of these XML files renames the ConfigMap,
  # so the pods restart and pick it up. ClickHouse re-reads config.d at runtime
  # for some settings but not for macros or remote_servers, so a restart is the
  # only way to be sure the change took.
  - name: clickhouse-server
    files:
      - clickhouse/server/00-cluster.xml
      - clickhouse/server/01-keeper.xml
      - clickhouse/server/02-server.xml
      - clickhouse/server/10-macros.xml
  - name: clickhouse-users
    files:
      - clickhouse/users/00-profile.xml
      - clickhouse/users/10-mupid-user.xml
  - name: clickhouse-keeper
    files:
      - clickhouse/keeper/keeper_config.xml
# Both are created on the server from /srv/mupid-k8s/.env by an administrator and
# are never committed. Declaring them here makes `kustomize build` fail loudly if
# a manifest references a key that was not planned for.
#   kubectl -n mupid create secret generic mupid-secrets --from-env-file=/srv/mupid-k8s/.env
#   kubectl -n mupid create secret generic mupid-storage-s3 --from-file=s3.json=/srv/mupid-k8s/s3.json
