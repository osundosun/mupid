# DB Studio — 마스터 1 + 리플리카 1.
#
# 노드마다 자기 SQLite 를 갖고 마스터가 행 단위로 복제를 흘려 보낸다. 파일을
# 공유하지 않으므로 "같은 SQLite 를 두 프로세스가 연다"는 제약과 어긋나지 않는다.
#
# **마스터는 자동으로 바뀌지 않는다.** 합의 프로토콜이 없어 자동 승격은 진실을
# 둘로 만든다. 그래서 승격은 사람이 한다 — 워크로드를 둘로 나눈 이유가 이것이다.
# 하나의 StatefulSet 에 ordinal 로 역할을 주면 옛 마스터만 골라 멈출 수가 없는데,
# 승격 절차의 1번이 "옛 마스터를 확실히 멈추고 자동 재시작도 끈다" 이다. 여기서는
# `kubectl scale sts/dbstudio --replicas=0` 이 정확히 그 뜻이 된다.
#
# 마스터를 NODE_B 에 둔 이유: 지표 수집·매크로 정기 실행·감사 기록이 전부 마스터
# 몫이라 일이 더 많은데, NODE_A 는 requests.cpu 가 1,850m/2,000m 이라 여유가 없다.
#
# 세 가지가 두 노드에서 같아야 한다.
#   DBSTUDIO_CLUSTER_SECRET  다르면 리플리카가 401 을 받고 복제가 시작되지 않는다
#   DBSTUDIO_MASTER_KEY      다르면 복제는 되는데 그 노드가 DB 자격증명을 못 푼다
#   앱 버전                  다르면 조용히 일부만 복제된다 — 가장 찾기 어렵다
# 앞의 둘은 같은 Secret 을 양쪽이 참조해서, 버전은 같은 digest 를 박아서 맞춘다.
# 테스트가 셋 다 검사한다.
#
# **호스트 포트를 열지 않는다.** 등록해 둔 모든 DB 자격증명이 여기 있으므로
# 노드의 포트로 내놓지 않고, 내부 서비스를 통한 프록시로만 접근한다. 아래 두
# Service 는 ClusterIP 이고 nodePort 도 hostPort 도 없다. nginx.conf 에도
# dbstudio 업스트림이 없다 — 테스트가 셋 다 검사한다.
---
apiVersion: v1
kind: Service
metadata: {name: dbstudio, namespace: mupid}
spec:
  selector: {app: dbstudio, dbstudio.io/role: master}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: dbstudio-replica, namespace: mupid}
spec:
  selector: {app: dbstudio, dbstudio.io/role: replica}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: dbstudio, namespace: mupid}
spec:
  serviceName: dbstudio
  replicas: 1
  selector: {matchLabels: {app: dbstudio, dbstudio.io/role: master}}
  template:
    metadata: {labels: {app: dbstudio, dbstudio.io/role: master}}
    spec:
      nodeSelector: {mupid.io/role: ai}
      containers:
        - name: dbstudio
          # :alpine 은 지금 0.1.21-alpine 과 같은 digest 다. 태그가 아니라 digest
          # 로 고정한 이유는 SeaweedFS 와 같고, 여기서는 하나 더 있다 — 두 노드의
          # 버전이 갈리면 복제가 조용히 일부만 된다.
          image: ghcr.io/yejun614/db-studio@sha256:afd38385d0c70a24aeb6352f32b7e0947e93d8ad775266a0e1367feac9005851
          env:
            - {name: TZ, value: Asia/Seoul}
            - {name: DBSTUDIO_ADDR, value: ':8080'}
            - {name: DBSTUDIO_DATA, value: /data}
            - {name: DBSTUDIO_TRUST_PROXY, value: '1'}
            - {name: DBSTUDIO_CLUSTER_ROLE, value: master}
            # 다른 노드가 이 노드를 부를 주소. 비우면 요청을 넘길 수 없고 담당
            # 노드로 고를 수도 없다.
            - {name: DBSTUDIO_CLUSTER_ADVERTISE, value: 'http://dbstudio:8080'}
            - {name: DBSTUDIO_CLUSTER_NODE_NAME, value: master-node-b}
            # 환경변수로만 준다. 명령줄 인자는 프로세스 목록에 그대로 보이고,
            # 이 값 하나로 클러스터의 모든 데이터를 받아 갈 수 있다.
            - name: DBSTUDIO_CLUSTER_SECRET
              valueFrom: {secretKeyRef: {name: dbstudio-secrets, key: DBSTUDIO_CLUSTER_SECRET}}
            # 저장된 접속 정보를 푸는 키. 두 노드가 같아야 한다.
            - name: DBSTUDIO_MASTER_KEY
              valueFrom: {secretKeyRef: {name: dbstudio-secrets, key: DBSTUDIO_MASTER_KEY}}
          ports: [{containerPort: 8080}]
          resources:
            # 마스터가 지표 폴링과 매크로 정기 실행을 맡는다.
            requests: {cpu: 150m, memory: 192Mi}
            limits: {memory: 768Mi}
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe:
            httpGet: {path: /api/v1/health, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /api/v1/health, port: 8080}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
  volumeClaimTemplates:
    # dbstudio.db(메타)·master.key·node.id 가 여기 생긴다. **이 디렉터리를 복사해
    # 새 노드를 만들면 안 된다** — node.id 가 같아져 두 노드가 노드 목록의 한 줄을
    # 서로 덮어쓴다. 새 노드는 빈 PVC 로 띄운다(여기서는 클레임이 따로라 자동).
    #
    # 스냅샷 재동기화 때 메타 DB 크기만큼의 여유가 더 필요하다(snapshot-out.db).
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: dbstudio-replica, namespace: mupid}
spec:
  serviceName: dbstudio-replica
  replicas: 1
  selector: {matchLabels: {app: dbstudio, dbstudio.io/role: replica}}
  template:
    metadata: {labels: {app: dbstudio, dbstudio.io/role: replica}}
    spec:
      nodeSelector: {mupid.io/role: edge}
      containers:
        - name: dbstudio
          # 마스터와 같은 digest 여야 한다. 다르면 마스터에만 있는 컬럼을 건너뛰고
          # 스냅샷에 없는 표는 손대지 않은 채, 어디에도 오류를 남기지 않는다.
          image: ghcr.io/yejun614/db-studio@sha256:afd38385d0c70a24aeb6352f32b7e0947e93d8ad775266a0e1367feac9005851
          env:
            - {name: TZ, value: Asia/Seoul}
            - {name: DBSTUDIO_ADDR, value: ':8080'}
            - {name: DBSTUDIO_DATA, value: /data}
            - {name: DBSTUDIO_TRUST_PROXY, value: '1'}
            - {name: DBSTUDIO_CLUSTER_ROLE, value: replica}
            # Service 이름으로 부른다. 승격할 때 이 값을 새 마스터로 바꿔야 하는데,
            # 이름을 쓰면 Service 의 selector 만 옮겨도 된다.
            - {name: DBSTUDIO_CLUSTER_MASTER, value: 'http://dbstudio:8080'}
            - {name: DBSTUDIO_CLUSTER_ADVERTISE, value: 'http://dbstudio-replica:8080'}
            - {name: DBSTUDIO_CLUSTER_NODE_NAME, value: replica-node-a}
            - name: DBSTUDIO_CLUSTER_SECRET
              valueFrom: {secretKeyRef: {name: dbstudio-secrets, key: DBSTUDIO_CLUSTER_SECRET}}
            - name: DBSTUDIO_MASTER_KEY
              valueFrom: {secretKeyRef: {name: dbstudio-secrets, key: DBSTUDIO_MASTER_KEY}}
          ports: [{containerPort: 8080}]
          resources:
            # 리플리카는 폴링·정기 실행·감사 기록을 하지 않는다.
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe:
            httpGet: {path: /api/v1/health, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /api/v1/health, port: 8080}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: {requests: {storage: 5Gi}}
