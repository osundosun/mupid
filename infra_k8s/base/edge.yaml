# The edge. nginx.conf is the audited production file, byte-identical to
# infra/deploy/nginx.conf — tests/test_manifests.py fails if the copy drifts.
# It is not rewritten as Ingress annotations because the audio path depends on
# auth_request and X-Accel-Redirect with internal locations.
#
# Two things the Compose deployment needs and this one does not:
#   - upstreams are Services, whose ClusterIP is stable, so recreating the
#     storage pod no longer forces an nginx recreate to re-resolve the address.
#   - nginx still resolves upstream names once at startup, so the Service
#     objects must exist before this pod starts. They are in the same overlay,
#     and a pod that starts too early simply restarts.
#
# Ports carry no hostPort here; each overlay sets them (8080/8443 while running
# beside the Compose stack, 80/443 after cutover).
apiVersion: apps/v1
kind: Deployment
metadata: {name: edge, namespace: mupid}
spec:
  replicas: 1
  selector: {matchLabels: {app: edge}}
  strategy:
    # hostPort cannot be held by two pods at once, so the old pod must go first.
    type: Recreate
  template:
    metadata: {labels: {app: edge}}
    spec:
      nodeSelector: {mupid.io/role: edge}
      containers:
        - name: nginx
          # nginx plus the frontend build. The static files used to live in
          # /srv/mupid/web with a `current` symlink the front-end receiver
          # moved; baking them in makes the delivery path identical to the
          # API's and the rollback a single `kubectl rollout undo`.
          #
          # The tag is the commit SHA, imported into k3s containerd by the
          # deployment receiver — there is no registry, hence IfNotPresent and
          # the node pin above.
          image: mupid-web:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 80}
            - {name: https, containerPort: 443}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            # certbot stays on the host and owns renewal. Read-only here.
            - {name: letsencrypt, mountPath: /etc/letsencrypt, readOnly: true}
            - {name: acme, mountPath: /var/www/acme, readOnly: true}
            - {name: downloads, mountPath: /srv/web/downloads, readOnly: true}
          readinessProbe:
            httpGet: {path: /healthz, port: 80}
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /healthz, port: 80}
            periodSeconds: 20
            failureThreshold: 5
      volumes:
        - name: conf
          configMap: {name: edge-nginx}
        # The only two host paths left, both read-only and both certbot's: it
        # keeps owning renewal on the host. /srv/mupid/web is gone — the site is
        # in the image — and the acme webroot has moved under /srv/mupid-k8s,
        # so nothing here reads /srv/mupid any more and that tree can be removed
        # once the cutover has settled.
        #
        # certbot has to be repointed at the new webroot before this is applied,
        # or renewal writes its challenge where nginx is not looking. Both
        # directories must exist on the node: type: Directory means the pod does
        # not start otherwise. See OPERATIONS-K8S.md.
        - name: letsencrypt
          hostPath: {path: /etc/letsencrypt, type: Directory}
        - name: acme
          hostPath: {path: /srv/mupid-k8s/acme, type: Directory}
        # 안드로이드 APK 를 두는 곳. receive-apk.py 가 쓰고 nginx 가 읽는다.
        # 웹 이미지에 굽지 않는 이유는 프론트 배포마다 수십 MB 를 다시 실어
        # 보내게 되기 때문이다 — nginx/default.conf 의 /download/ 참고.
        #
        # DirectoryOrCreate 다. Directory 로 두면 APK 를 한 번도 올리지 않은
        # 클러스터에서 엣지 파드가 아예 뜨지 않는다.
        - name: downloads
          hostPath: {path: /srv/mupid-k8s/downloads, type: DirectoryOrCreate}
