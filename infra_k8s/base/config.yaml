# Non-sensitive configuration only.
#
# The split: values that are structural (they point at a Kubernetes Service, or
# are fixed by these manifests) live here and are committed. Values that come
# from /srv/mupid-k8s/.env live in the Secret `mupid-secrets`, which an
# administrator creates on the server and which is never committed.
#
# The few plain values below are already published in infra/deploy/.env.example,
# so committing them adds no exposure.
apiVersion: v1
kind: ConfigMap
metadata: {name: api-config, namespace: mupid}
data:
  MUPID_PORT: '8800'
  MUPID_MYSQL_USER: mupid_app
  # Host is the Service name, so this string is identical to the Compose one.
  MUPID_MYSQL_URL: jdbc:mysql://mysql:3306/mupid?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
  MUPID_REDIS_HOST: redis
  MUPID_REDIS_PORT: '6379'
  MUPID_REDIS_KEY_PREFIX: mupid:prod
  MUPID_CLIENT_WEBSITE: https://j15a204.p.ssafy.io
  # application.yaml reads these with no default, so the API fails to start if
  # they are absent. The ClickHouse pool and the Kafka producer are both created
  # lazily, so neither service has to exist for the API to come up. Analytics is
  # out of scope until Phase 6; these point at names that do not resolve yet,
  # which is the same situation the Compose deployment is in today.
  MUPID_CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/default
  MUPID_CLICKHOUSE_USER: mupid
  MUPID_KAFKA_BOOTSTRAP: kafka:9092
  MUPID_KAFKA_TOPIC: mupid.listen.events
  # LLM 게이트웨이. **바깥 주소다** — OpenAI 호환 API 의 `/chat/completions`
  # 앞까지를 가리킨다 (application.yaml 의 `ai.base-url`).
  #
  # 예전에 여기에 http://ai:8100 이 들어 있었다. 그 이름을 추천 서버 주소로
  # 착각한 것인데, 그 탓에 **대화 요청이 LLM 이 아니라 클러스터에 있지도 않은
  # 주소로 나가고 있었다.** application.yaml 의 주석이 정확히 그 경우를
  # 경고한다 — "거기에 추천 서버 주소를 넣으면 대화가 추천 서버로 나간다".
  #
  # 추천 서버(ai_server)는 MUPID_RECOMMENDER_BASE_URL 이라는 **다른 이름**을
  # 쓴다. 둘은 서로 다른 서버다: 이쪽은 대화를 만들고 저쪽은 곡을 고른다.
  # MUPID_AI_BASE_URL · MUPID_AI_MODEL · MUPID_AI_GMS_KEY 는 여기 두지 않는다.
  # 셋 다 MUPID_API_ENV 한 곳에서 관리한다 — 개발 환경의 api/.env 와 같은
  # 묶음이라 나눠 두면 어느 쪽이 이기는지 헷갈린다.
  #
  # 대신 api.yaml 이 셋을 secretKeyRef 로 읽는다(optional: true). Secret 에
  # 없으면 스프링 기본값으로 간다 — 주소와 모델은 기본값이 맞는 값이고,
  # 키가 비면 /api/v1/ai/chat 만 503 이다.
  #
  # **여기에 같은 이름을 다시 넣지 않는다.** env 로 지정한 값이 envFrom 을
  # 이기므로 ConfigMap 쪽은 조용히 무시되고, 읽는 사람만 헷갈린다.
  #
  # 짝이 되는 MUPID_AI_GMS_KEY 는 비밀이라 여기 두지 않는다 — mupid-secrets 로
  # 간다(MUPID_API_ENV). 그 키가 비면 /api/v1/ai/chat 이 503 이다.

  # --- 추천 서버(ai_server) -------------------------------------------------
  # 아직 클러스터에 배포하지 않았다. 개발이 끝나면 아래 둘을 채운다.
  #
  #   MUPID_RECOMMENDER_BASE_URL        `/internal` 앞까지의 주소
  #   MUPID_RECOMMENDER_INTERNAL_TOKEN  공유 비밀 (비밀이므로 Secret 으로)
  #
  # **양쪽을 동시에** 설정해야 한다. 추천 서버의 MUPID_AI_INTERNAL_TOKEN 과
  # 같은 값이어야 하고, 한쪽만 켜면 추천이 통째로 401 이다.
  #
  # 지금처럼 비어 있으면 곡 추천만 503 이고 대화는 그대로 된다 — 그래서
  # ai_server 없이도 서비스가 뜬다.
---
apiVersion: v1
kind: ConfigMap
metadata: {name: storage-filer, namespace: mupid}
data:
  filer.toml: |
    [leveldb2]
    enabled = true
    dir = "/data/filer"
