# AI 추천 서비스 검증. **산출물(모델·색인) 없이 도는 것만** 돌린다.
#
# `tests/test_smoke.py` 는 색인이 있어야 의미가 있어 CI 에서 통째로 건너뛴다. 그러면
# "전부 건너뛰고 초록불" 이 되므로, 오프라인 계약 테스트가 실제로 몇 건 돌았는지를
# 확인한다 — 경로 해석·오류 코드·응답 문장 회귀는 색인 없이도 잡을 수 있고, 잡아야 한다.
#
# torch 는 설치하지 않는다. 오프라인 테스트가 닿는 경로에는 없고, CPU 빌드라도 수백 MB 라
# 설치 시간과 캐시가 낭비된다. 랭킹 모델을 실제로 불러오는 것은 smoke 쪽 일이다.
ai-server-verify:
  stage: verify
  # 의존성을 미리 구워 둔 이미지다 (infra/runner/images/ai.Dockerfile).
  # 이 job 은 20초 중 13.5초가 pip install 이었다 — 실제 pytest 는 2.6초다.
  # 레지스트리에 없고 러너 호스트의 도커 데몬에만 있으므로 pull_policy 가
  # 필요하다. 기본값 always 로는 도커 허브에서 찾다가 실패한다.
  image:
    name: mupid-ci-ai:1
    pull_policy: if-not-present
  tags: [mupid-ci]
  interruptible: true
  timeout: 10m
  needs:
    # 모자란 라벨은 area-preflight 가 먼저 막는다. 순서일 뿐 게이트가 아니다.
    - job: area-preflight
      artifacts: false
      optional: true
  # GitLab 의 `cache:` 로 pip 캐시를 나르던 것을 걷어냈다. backend·frontend 에서
  # 걷어낸 것과 같은 이유이고(압축·해제가 일보다 오래 걸린다), 이제는 캐시가
  # 아니라 이미지에 들어 있어 나를 것 자체가 없다.
  before_script:
    # 이미지에 구운 의존성이 저장소와 다르면 여기서 멈춘다. 낡은 환경으로
    # 조용히 통과하는 것이 제일 나쁘다 — 통과한 코드가 서버에서 처음 깨진다.
    # 줄바꿈은 걷어내고 내용만 본다. 이미지를 윈도우 체크아웃에서 구우면
    # CRLF 가 들어오는데 CI 체크아웃은 LF 다 — 같은 내용을 다르다고 하면
    # 가드가 아니라 방해물이 된다.
    - |
      tr -d '\r' < ai_server/requirements.txt > /tmp/requirements.txt
      if ! cmp -s /opt/mupid/requirements.txt /tmp/requirements.txt; then
        echo "job 이미지에 구운 의존성이 저장소와 다릅니다."
        echo
        diff /opt/mupid/requirements.txt /tmp/requirements.txt || true
        echo
        echo "러너 호스트에서 다시 구우세요:  sh infra/runner/build-images.sh"
        exit 1
      fi
  rules:
    # MR 에서는 라벨이 고른다 — infra/ci/labels.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)\s*AI\s*(,|$)/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # 브랜치 파이프라인에는 CI_MERGE_REQUEST_LABELS 가 없다. 경로로 판단한다.
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"'
      changes:
        - ai_server/**/*
        - infra/ci/ai-server.yml
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/'
  script:
    # 설치 단계가 없다. 의존성은 이미지에 들어 있다.
    - python -m pytest ai_server/tests -q --junitxml=ai-server-junit.xml
    # 색인이 없으면 smoke 가 통째로 건너뛴다. 그 상태로 초록불이 나오면 CI 가 아무것도
    # 지키지 않는 것과 같다. 오프라인 계약 테스트가 실제로 돌았는지 본다.
    - |
      python - <<'PY'
      import xml.etree.ElementTree as ET
      s = ET.parse("ai-server-junit.xml").getroot()
      ts = s if s.tag == "testsuite" else s.find("testsuite")
      total = int(ts.get("tests", 0))
      skipped = int(ts.get("skipped", 0))
      ran = total - skipped
      print(f"실행 {ran}건 / 건너뜀 {skipped}건")
      assert ran >= 90, f"산출물 없이 도는 테스트가 {ran}건만 돌았다 — 수집이 깨졌는지 본다"
      PY
    # 이 영역을 실제로 검증했다는 증거. area-gate 가 이것을 읽는다.
    - mkdir -p .areas && printf '%s\n' AI > .areas/AI
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .areas/AI
    reports:
      junit: ai-server-junit.xml
