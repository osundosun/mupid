# Build and transmit in one job: no JAR artifacts or Generic Packages uploads.
.backend-image:
  tags: [mupid-ci]
  image:
    name: moby/buildkit@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    entrypoint: ['']
    docker:
      user: '0'
  needs:
    - job: backend-verify
      artifacts: false
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  timeout: 40m

# Optional image-build check; no deployment credentials or persistent upload.
backend-package:
  extends: .backend-image
  stage: package
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &backend_changes
        - api/**/*
        - infra/image/**/*
        - infra/ci/backend.yml
        - infra/ci/release.yml
        - infra/ci/package-image.sh
        - infra/ci/deploy.sh
        - infra/ci/release.sh
        - infra/deploy/compose.yml
        - infra/deploy/receive.sh
        - infra/deploy/ssh-entrypoint.sh
        - .gitlab-ci.yml
      when: manual
      allow_failure: true
  script:
    - sh infra/ci/package-image.sh

backend-deploy:
  extends: .backend-image
  stage: deploy
  resource_group: mupid-demo
  environment:
    name: demo
    url: https://j15a204.p.ssafy.io
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true"'
      changes: *backend_changes
  script:
    - apk add --no-cache curl openssh-client
    - sh infra/ci/release.sh
