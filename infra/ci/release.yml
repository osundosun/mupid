# Build the exact JAR that passed verification; no Docker daemon/socket in jobs.
backend-package:
  stage: package
  tags: [mupid-ci]
  image:
    name: moby/buildkit@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    entrypoint: ['']
    docker:
      user: '0'
  needs:
    - job: backend-verify
      artifacts: true
  timeout: 20m
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [api/**/*, infra/image/**/*, infra/ci/backend.yml, infra/ci/release.yml, infra/ci/package-image.sh, infra/ci/deploy.sh, infra/deploy/compose.yml, infra/deploy/receive.sh, .gitlab-ci.yml]
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"'
      changes: [api/**/*, infra/image/**/*, infra/ci/backend.yml, infra/ci/release.yml, infra/ci/package-image.sh, infra/ci/deploy.sh, infra/deploy/compose.yml, infra/deploy/receive.sh, .gitlab-ci.yml]
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - apk add --no-cache curl
    - sh infra/ci/package-image.sh

backend-deploy:
  stage: deploy
  image: alpine:3.22
  tags: [mupid-ci]
  needs: [backend-package]
  resource_group: mupid-demo
  environment:
    name: demo
    url: https://j15a204.p.ssafy.io
  timeout: 15m
  interruptible: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true"'
      changes: [api/**/*, infra/image/**/*, infra/ci/deploy.sh, infra/deploy/compose.yml, infra/deploy/receive.sh]
  script:
    - apk add --no-cache curl openssh-client
    - sh infra/ci/deploy.sh
