# 영역 라벨이 MR 파이프라인을 고른다. Frontend · Backend · AI · Data · Infra.
#
# **왜 rules 가 아니라 script 인가.**
#
# GitLab 은 job 의 rules 를 **파이프라인을 만들 때 한 번** 평가하고, 그 job 을
# 다시 돌려도(retry) 그 결과를 바꾸지 않는다. 문서 그대로다 — "The configuration
# for a pipeline is only fetched when the pipeline is created. When you rerun a job,
# uses the same configuration each time."
#
# 실측으로도 확인했다. 라벨 없이 만들어진 MR 파이프라인(200778)에서 라벨 게이트를
# 재시도한 job(556721)은 스크립트가 최신 라벨("AI,Backend,Data,Frontend")을 보고도
# 실패했다. 스크립트는 실행 시점에 변수를 읽고 rules 는 생성 시점에 읽기 때문이다.
# 그 파이프라인의 job 목록에는 영역 verify 가 **아예 없었고**, 재시도로도 생기지
# 않는다. job 재시도가 만드는 것은 job 의 실행이지 job 자체가 아니다.
#
# 그래서 판정을 실행 시점으로 옮겼다. 이 job 은 **변경 경로를 스스로 계산해**
# (git diff) 라벨과 맞춰 보고, 모자라면 그 자리에서 실패한다. 라벨이 job 을 고르는
# 구조는 그대로 두되, "고른 것이 무엇이든 검증은 다 돌았다" 를 뒤의 area-gate 가
# marker 로 다시 확인한다 — 그래서 빠진 job 이 흔적 없이 사라질 수 없다.
#
# area-gate 는 **별도 stage** 에 있고 needs 가 없다(infra/ci/area-gate.yml).
# 영역 job 을 needs 로 걸면 그 job 이 실패했을 때 게이트가 skipped 로 가서
# 누락 원인을 말해 줄 사람이 사라지기 때문이다.
#
# **라벨을 나중에 붙였다면 새 파이프라인을 만들어야 한다.** job 재시도는 안 된다.
# 로그가 붙여넣을 수 있는 복구 명령을 그대로 찍어 준다.
#
# 라벨을 새로 추가하려면 세 곳을 같이 고친다: infra/ci/area_diff.py 의 표,
# 그 영역 job 의 rules 와 marker, infra_k8s/tests 의 AreaRoutingTest.
# 테스트가 세 곳이 어긋나면 실패한다.
#
# 이 job 은 **MR 파이프라인에만** 있다. develop·master 는 보호 브랜치라 직접
# push 가 없어(develop push 권한 "No one", 실측) 영역 판정이 개입할 자리가 없다.

area-preflight:
  stage: verify
  image: alpine:3
  tags: [mupid-ci]
  interruptible: true
  timeout: 5m
  variables:
    # 변경 경로를 계산한다(base..head). 얕은 체크아웃이면 기준 커밋을 못 찾아
    # "검증 대상 없음" 이 되고, 그러면 게이트가 통째로 무력해진다.
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git python3
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  artifacts:
    # area-gate 가 이 목록을 근거로 삼는다 — 판정의 단일 출처.
    # always 인 이유는 실패했을 때도 남겨야 원인을 볼 수 있기 때문이다.
    when: always
    expire_in: 1 day
    paths:
      - .areas/expected.txt
  script:
    - python3 infra/ci/area_diff.py preflight
