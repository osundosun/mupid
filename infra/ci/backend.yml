# Build-only CI by team decision; application tests are not executed.
backend-verify:
  stage: verify
  image: azul-zulu:21-jdk
  tags: [mupid-ci]
  interruptible: true
  timeout: 15m
  variables:
    # 러너의 /cache 볼륨에 직접 둔다. GitLab 의 `cache:` 기능을 쓰지 않는 이유는
    # 그것이 캐시를 **zip 으로 말았다 푸는** 데 있다. 실측으로 이 job 286초 중
    # 복원 80초 + 저장 71초가 압축·해제였고(53%), 실제 Gradle 빌드는 97초였다.
    # 캐시가 약 470MB 인데 러너가 라즈베리파이 4 이고 SD카드 쓰기가 10.9 MB/s 다.
    #
    # /cache 는 러너가 프로젝트마다 붙여 주는 도커 볼륨이라 job 사이에 그대로
    # 남는다 — 압축 없이 같은 효과를 낸다.
    #
    # 러너를 맥으로 옮기며 동시성을 2 로 올렸다. backend-verify 와
    # frontend-verify 는 /cache/gradle 과 /cache/npm 으로 갈라져 서로 안 겹치고,
    # backend-verify 두 개가 겹치는 경우(MR 두 개)는 Gradle 이 GRADLE_USER_HOME
    # 에 프로세스 간 잠금을 걸어 처리한다. 잠금 경합이 보이면 동시성을 1 로
    # 되돌린다 — infra/runner/configure.py 의 MUPID_RUNNER_CONCURRENT 다.
    GRADLE_USER_HOME: /cache/gradle
  needs:
    # area-preflight 가 모자란 라벨을 먼저 막는다. 순서일 뿐 게이트가 아니다.
    - job: area-preflight
      artifacts: false
      optional: true
  rules:
    # MR 에서는 라벨이 고른다 (infra/ci/labels.yml). 경로가 아니라 라벨인 이유는
    # api/ 를 건드리지 않는 Backend 작업도 있고, 라벨 없는 MR 은 아예 막기
    # 때문이다 — area-preflight 가 그 일을 한다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)\s*Backend\s*(,|$)/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # 브랜치 파이프라인에는 CI_MERGE_REQUEST_LABELS 가 없다. 경로로 판단한다.
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"'
      changes:
        - api/**/*
        - infra/image/**/*
        - infra/ci/backend.yml
        - infra/ci/package-image.sh
        - infra_k8s/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/'
  script:
    - cd api
    - bash gradlew --no-daemon --console=plain build -x test
    # 이 영역을 실제로 검증했다는 증거. area-gate 가 이것을 읽는다.
    - cd .. && mkdir -p .areas && printf '%s\n' Backend > .areas/Backend
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - .areas/Backend
