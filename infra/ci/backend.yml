# Test credentials below are disposable CI-only values, never production secrets.
backend-verify:
  stage: verify
  image: azul-zulu:21-jdk
  tags: [mupid-ci]
  interruptible: true
  timeout: 15m
  services:
    - name: mysql:8.4
      alias: mysql
    - name: redis:7.4-alpine
      alias: redis
  variables:
    MYSQL_DATABASE: mupid_ci
    MYSQL_ROOT_PASSWORD: ci-only-root-password
    MYSQL_USER: mupid_ci
    MYSQL_PASSWORD: ci-only-app-password
    MUPID_MYSQL_URL: jdbc:mysql://mysql:3306/mupid_ci?allowPublicKeyRetrieval=true&useSSL=false
    MUPID_MYSQL_USER: mupid_ci
    MUPID_MYSQL_PASSWORD: ci-only-app-password
    MUPID_REDIS_HOST: redis
    MUPID_REDIS_PORT: '6379'
    MUPID_REDIS_KEY_PREFIX: 'mupid:ci:'
    # Context startup only: these values do not provide live storage or email.
    # Tests that exercise external calls need mocks or isolated test services.
    MUPID_S3_ENDPOINT: 'http://127.0.0.1:19000'
    MUPID_S3_ACCESS_KEY: ci-only-access-key
    MUPID_S3_SECRET: ci-only-secret-key
    MUPID_S3_BUCKET: mupid-ci
    MUPID_GMAIL_CLIENT_ID: ci-only-client-id
    MUPID_GMAIL_CLIENT_SECRET: ci-only-client-secret
    MUPID_GMAIL_TOKEN: ci-only-refresh-token
    MUPID_GMAIL_SEND_ADDRESS: ci@example.invalid
    MUPID_CLIENT_WEBSITE: 'http://127.0.0.1:13000'
    MUPID_JWT_SECRET: Y2ktb25seS10ZXN0LWtleS1ub3QtZm9yLXByb2R1Y3Rpb24=
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-ci
  cache:
    key:
      files:
        - api/gradle/wrapper/gradle-wrapper.properties
        - api/build.gradle
    paths:
      - .gradle-ci/caches/
      - .gradle-ci/wrapper/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - api/**/*
        - infra/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"'
      changes:
        - api/**/*
        - infra/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - cd api
    - bash ../infra/ci/wait-services.sh
    - bash gradlew --no-daemon --console=plain build
    - mkdir -p build/release
    - find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' -exec cp {} build/release/app.jar \;
    - test -s build/release/app.jar
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: api/build/test-results/test/TEST-*.xml
    paths:
      - api/build/reports/tests/test/
      - api/build/release/app.jar
