# Test credentials below are disposable CI-only values, never production secrets.
backend-verify:
  stage: verify
  image: azul-zulu:21-jdk
  tags: [mupid-ci]
  interruptible: true
  timeout: 15m
  services:
    - name: mysql:8.4
      alias: mysql
    - name: redis:7.4-alpine
      alias: redis
  variables:
    MYSQL_DATABASE: mupid_ci
    MYSQL_ROOT_PASSWORD: ci-only-root-password
    MYSQL_USER: mupid_ci
    MYSQL_PASSWORD: ci-only-app-password
    MUPID_MYSQL_URL: jdbc:mysql://mysql:3306/mupid_ci?allowPublicKeyRetrieval=true&useSSL=false
    MUPID_MYSQL_USER: mupid_ci
    MUPID_MYSQL_PASSWORD: ci-only-app-password
    MUPID_REDIS_HOST: redis
    MUPID_REDIS_PORT: '6379'
    MUPID_JWT_SECRET: Y2ktb25seS10ZXN0LWtleS1ub3QtZm9yLXByb2R1Y3Rpb24=
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-ci
  cache:
    key:
      files:
        - api/gradle/wrapper/gradle-wrapper.properties
        - api/build.gradle
    paths:
      - .gradle-ci/caches/
      - .gradle-ci/wrapper/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - api/**/*
        - infra/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"'
      changes:
        - api/**/*
        - infra/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - cd api
    - bash ../infra/ci/wait-services.sh
    - bash gradlew --no-daemon --console=plain build
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: api/build/test-results/test/TEST-*.xml
    paths:
      - api/build/reports/tests/test/
