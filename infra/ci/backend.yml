# Build-only CI by team decision; application tests are not executed.
backend-verify:
  stage: verify
  image: azul-zulu:21-jdk
  tags: [mupid-ci]
  interruptible: true
  timeout: 15m
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-ci
  cache:
    key:
      files:
        - api/gradle/wrapper/gradle-wrapper.properties
        - api/build.gradle
    paths:
      - .gradle-ci/caches/
      - .gradle-ci/wrapper/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - api/**/*
        - infra/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"'
      changes:
        - api/**/*
        - infra/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - cd api
    - bash gradlew --no-daemon --console=plain build -x test
    - mkdir -p build/release
    - find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' -exec cp {} build/release/app.jar \;
    - test -s build/release/app.jar
  artifacts:
    expire_in: 7 days
    paths:
      - api/build/release/app.jar
