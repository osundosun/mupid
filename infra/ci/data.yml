# Data 영역 — music_preprocessing (청킹·카탈로그 배치).
#
# 배포 대상이 k8s 가 아니라 JupyterHub 배치 서버다. 그 서버는 SSH 가 닫혀 있고
# 80/443 만 열려 있어서(확인함) 다른 배포처럼 이미지 tar 를 밀어 넣지 못한다.
# infra/ci/deploy-jupyter.py 가 JupyterHub HTTP API 로 파일을 올리고 배치를
# 돌린다. cron 은 쓰지 못한다 — 그 계정은 cron 스풀에 쓸 권한이 없다.
# 스케줄은 GitLab 파이프라인 스케줄이 대신한다 (data-batch).

# MR 에서는 라벨이 고른다 — infra/ci/labels.yml
data-verify:
  stage: verify
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  tags: [mupid-ci]
  interruptible: true
  timeout: 10m
  variables:
    # backend·frontend 와 같은 이유로 GitLab 의 `cache:` 를 쓰지 않는다.
    # /cache 는 러너가 붙여 주는 도커 볼륨이라 job 사이에 그대로 남는다.
    UV_CACHE_DIR: /cache/uv
  needs:
    # 모자란 라벨은 area-preflight 가 먼저 막는다. 순서일 뿐 게이트가 아니다.
    - job: area-preflight
      artifacts: false
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)\s*Data\s*(,|$)/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # 브랜치 파이프라인에는 CI_MERGE_REQUEST_LABELS 가 없다. 경로로 판단한다.
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"'
      changes: &data_paths
        - music_preprocessing/**/*
        - infra/ci/data.yml
        - infra/ci/deploy-jupyter.py
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/'
  script:
    # --python 3.12 를 명시한다. 저장소의 .python-version 은 3.14 인데 배치
    # 서버의 기본 파이썬은 3.12 다. CI 가 3.14 로 통과시키면 서버에서 처음
    # 깨진다 — 검증은 서버가 쓰는 버전으로 한다.
    - cd music_preprocessing
    - uv sync --frozen --python 3.12
    - uv run music-preprocessing --help
    # 배포가 무엇을 올릴지 여기서 미리 확인한다. 서버를 건드리지 않는다.
    - cd ..
    - uv run --python 3.12 --with requests --with websocket-client
        python infra/ci/deploy-jupyter.py --dry-run
    # 이 영역을 실제로 검증했다는 증거. area-gate 가 이것을 읽는다.
    - mkdir -p .areas && printf '%s\n' Data > .areas/Data
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - .areas/Data

# 수동 job 은 web 과 api 두 소스에서 뜬다.
#
#   web   GitLab UI 의 Run pipeline
#   api   POST /projects/:id/pipeline
#
# 둘은 권한이 같다. 어느 쪽이든 그 ref 에 파이프라인을 만들 수 있는 사람이어야
# 하고, 보호 브랜치라면 보호 브랜치 권한이 필요하다. 그래서 api 를 받아도
# 넓어지는 것이 없다 — 대신 자동화(스크립트·에이전트)가 UI 를 거치지 않고
# 수동 job 을 띄울 수 있다. 민감한 job 은 그 위에 CI_COMMIT_REF_PROTECTED 와
# 변수 존재 조건을 따로 걸어 둔다.

# 서버에 붙어 상태만 읽는다. 아무것도 쓰지 않는다.
#
# 첫 배포 전에 눌러 본다. 설정이 실재하는 곳을 가리키는지 여기서 확인한다 —
# 경로가 하나 틀리면 배치가 오류 없이 0곡을 처리하고 끝나서, 로그를 봐도
# 한참 모른다.
data-check:
  stage: verify
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  tags: [mupid-ci]
  timeout: 15m
  variables:
    UV_CACHE_DIR: /cache/uv
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DATA_ENV'
      when: manual
      allow_failure: true
  script:
    - uv run --python 3.12 --with requests --with websocket-client
        python infra/ci/deploy-jupyter.py --check

data-deploy:
  stage: deploy
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  tags: [mupid-ci]
  needs:
    - job: data-verify
      artifacts: false
      optional: true
  # 한 번에 하나만. 배치가 도는 중에 코드를 갈아 끼우면 반쪽짜리 상태가 된다.
  resource_group: mupid-jupyter
  # 배포가 중간에 끊기면 코드 일부만 올라간 상태가 된다.
  interruptible: false
  timeout: 30m
  environment:
    name: jupyter-batch
    url: https://lab.tailf237b8.ts.net
  variables:
    UV_CACHE_DIR: /cache/uv
  rules:
    # MUPID_DATA_ENV 가 없으면 아예 돌지 않는다. 변수를 넣기 전까지는
    # master 푸시마다 빨간 파이프라인이 뜨는 편보다 이쪽이 낫다.
    #
    # 배포에 필요한 모든 것이 그 변수 하나에 들어간다 — 접속 정보, 배치 설정,
    # 토큰. .env 와 같은 KEY=VALUE 형식이고 **File 형식**·**보호된** 변수다.
    #
    #   File   내용이 아니라 경로가 환경에 들어간다. echo 해도 값이 새지 않고,
    #          비밀번호가 8자 미만이라 마스킹이 거부되는 문제도 비껴간다.
    #          배포 SSH 키를 이미 그 형식으로 넣고 있다.
    #   보호   보호 변수는 보호 브랜치 파이프라인에만 주어진다. 누구나 올릴 수
    #          있는 기능 브랜치에서 job 을 하나 만들어 값을 빼 가는 길이 막힌다.
    #          아래 두 규칙이 CI_COMMIT_REF_PROTECTED 를 요구하는 것과 같은 방향.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true" && $MUPID_DATA_ENV'
      changes: *data_paths
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DATA_ENV'
      when: manual
  script:
    - uv run --python 3.12 --with requests --with websocket-client
        python infra/ci/deploy-jupyter.py

# 배치 한 바퀴. **cron 을 대신한다.**
#
# 그 계정은 cron 스풀에 쓸 권한이 없다 — `crontab -` 가
# `/var/spool/cron/: mkstemp: Permission denied` 로 실패한다(실측). 그래서
# "언제" 는 GitLab 파이프라인 스케줄이 정하고, "무엇을" 은 저장소의
# music_preprocessing/run_batch.sh 가 정한다. 순서와 명령이 저장소에 있어야
# 리뷰와 이력이 남는다.
#
# 스케줄은 Settings → CI/CD → Pipeline schedules 에 있다. 스케줄을 끄면
# 배치가 멈춘다.
data-batch:
  stage: deploy
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  tags: [mupid-ci]
  # 배포와 겹치면 안 된다. 코드를 갈아 끼우는 중에 배치가 돌면 반쪽짜리
  # 상태로 실행된다.
  resource_group: mupid-jupyter
  interruptible: false
  # 청킹이 길다. 서버에서 분리해 띄우고 로그만 따라가므로 러너는 거의 놀지만,
  # job 이 먼저 끝나 버리면 결과를 못 본다.
  timeout: 6h
  variables:
    UV_CACHE_DIR: /cache/uv
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $MUPID_DATA_ENV'
    # 손으로 한 바퀴 돌리고 싶을 때.
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DATA_ENV'
      when: manual
  script:
    - uv run --python 3.12 --with requests --with websocket-client
        python infra/ci/deploy-jupyter.py --batch
