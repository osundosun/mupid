# 매니페스트·배포 스크립트 정적 검사.
#
# **이 테스트를 도는 job 이 없었다.** 82개가 개발자 로컬에서만 돌고 있었고,
# 그 사이에 실제 드리프트가 생겼다 — 프론트 수정(S15P21A204-349)이 요구한
# nginx 변경이 Compose 사본에만 들어가고 k8s 사본에는 빠져서, 엣지 파드가
# 그 수정 없이 돌고 있었다. NginxCopyTest 가 바로 그것을 잡는 테스트다.
#
# 검사만 한다. 클러스터에도 도커 데몬에도 붙지 않는다(파일 첫 줄 참고).
manifests-verify:
  stage: verify
  image: python:3.12-slim
  tags: [mupid-ci]
  interruptible: true
  timeout: 10m
  rules:
    # 영역을 가리지 않는다. infra_k8s 는 네 영역이 모두 건드리는 곳이고,
    # 라벨로 걸러 두면 라벨을 안 붙인 쪽 변경이 그대로 새어 나간다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/'
  script:
    - python -m pip install --quiet PyYAML
    # kubectl 이 없으면 kustomize 를 쓰는 테스트는 스스로 건너뛴다. 파일 단위
    # 검사는 그대로 돌아서, 사본 드리프트·규칙 누락은 여기서 잡힌다.
    - python -B -m unittest discover -s infra_k8s/tests -v
