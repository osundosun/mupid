# 검증 누락을 막는 뒷단 게이트.
#
# **왜 필요한가.** 앞단 area-preflight 는 라벨이 모자란 MR 을 막지만, 라벨이
# **맞게** 붙었는데도 영역 job 이 안 돈 경우를 혼자서는 설명하지 못한다. 그리고
# 그 경우가 이 저장소에서 실제로 여러 번 있었다 — 라벨을 하나만 붙여 어떤 영역의
# verify 가 조용히 빠졌고, 빠진 job 은 파이프라인 상태에 아무 흔적을 남기지 않아
# 초록으로 보였다(b0130b2 는 infra/ci/data.yml 을 건드렸는데 data-verify 가 돌지
# 않았고 파이프라인 200362 는 success 였다).
#
# 이 job 은 job 목록이 아니라 **영역 job 이 남긴 marker** 를 본다. 그 차이가
# 핵심이다:
#
#   job 목록   파이프라인을 만들 때 확정된다. job 을 재시도해도 바뀌지 않는다.
#   marker     실행 시점의 사실이다. 실제로 돌아서 성공한 job 만 남긴다.
#
# 그래서 라벨 없이 만들어진 파이프라인을 재시도하는 흔한 오해를 정확히 잡는다 —
# area-preflight 가 이미 그 파이프라인에 대해 "라벨을 붙이고 새 파이프라인을
# 만들라" 고 말하고, 이 게이트는 "이 파이프라인에는 그 영역 검증이 없다" 를
# 사실로 확인해 준다. 어느 쪽으로도 '아무것도 안 본 초록불' 이 나오지 않는다.
#
# needs 의 optional 은 파이프라인 생성을 깨뜨리지 않기 위한 것이다. 라벨이 그
# 영역을 켜지 않았으면 그 job 은 파이프라인에 없고, optional 이 없으면 이 job 의
# needs 가 파이프라인 YAML 자체를 실패시킨다.
area-gate:
  stage: verify
  image: alpine:3
  tags: [mupid-ci]
  interruptible: true
  timeout: 5m
  needs:
    # 기대 영역 목록. 판정의 단일 출처다.
    - job: area-preflight
      artifacts: true
    # artifacts: true 는 기본값이지만 **명시한다** — 이 job 의 존재 이유가
    # marker 이므로, 나중에 누가 needs 를 손볼 때 이 의도가 보여야 한다.
    - job: frontend-verify
      artifacts: true
      optional: true
    - job: backend-verify
      artifacts: true
      optional: true
    - job: ai-server-verify
      artifacts: true
      optional: true
    - job: data-verify
      artifacts: true
      optional: true
    - job: infra-verify
      artifacts: true
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    # git 은 필요 없다 — 판정도 marker 대조도 파일만 본다.
    - apk add --no-cache python3
  script:
    - python3 infra/ci/area_diff.py gate
