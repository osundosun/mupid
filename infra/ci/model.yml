# 모델 묶음 — models.lock (S15P21A204-454, infra/VECTOR-STORE-DESIGN.md §6.3).
#
# models.lock 이 운영에 쓸 모델의 정본이고, 그 파일을 바꾸는 MR 의 병합이 모델 교체의
# 방아쇠다. 스크립트는 infra/ci/model_publish.py 하나이고 명령만 다르다.
#
#   MR      model-verify   JupyterHub 에서 받아 sha256 을 대조하고 manifest 지표를 남긴다.
#                          **올리지 않는다.**
#   master  model-publish  받기 → 대조(다르면 멈춘다) → 재계산 관문 → 453 API 3단계 → CANDIDATE
#   master  k8s-deploy-ai  (infra_k8s/ci/k8s-release.yml) 서빙 파일을 Object Storage 에서 받아
#                          이미지에 굽고, 롤아웃이 끝나면 채택을 알린다
#
# models.lock 이 "채택 없음"(stage1: null) 이면 셋 다 아무것도 하지 않고 성공한다.
#
# **JupyterHub 는 공용 서버다.** 여기서는 contents API 의 GET 만 부른다 — deploy-jupyter.py
# 머리말의 규칙(상태 파일을 건드리지 않는다)을 그대로 따르고, 쓰는 것이 하나도 없다.
# 모델이 바뀌지 않는 평소 배포는 JupyterHub 를 부르지 않는다(굽기는 Object Storage 에서 받는다).

# 라벨이 아니라 경로로 고른다. 영역 job 이 아니다 — models.lock 은 AI 영역이라
# (infra/ci/area_diff.py) 그 MR 에는 ai-server-verify 가 따로 돈다.
model-verify:
  stage: verify
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  tags: [mupid-ci]
  interruptible: true
  timeout: 15m
  variables:
    UV_CACHE_DIR: /cache/uv
  needs:
    - job: area-preflight
      artifacts: false
      optional: true
  rules:
    # MUPID_DATA_ENV 는 보호 변수라 기능 브랜치 MR 에는 주어지지 않는다. 그때는 형식만
    # 보고 경고와 함께 지나간다 — 같은 대조를 병합 뒤 model-publish 가 멈추는 쪽으로 한다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - models.lock
        - infra/ci/model_publish.py
        - infra/ci/model.yml
  script:
    - uv run --python 3.12 --with requests --with websocket-client --with pyyaml
        python infra/ci/model_publish.py verify --report .model/models-lock.md
  artifacts:
    when: always
    expire_in: 1 week
    # MR 화면에 링크로 뜬다. 리뷰어가 job 로그를 뒤지지 않고 지표를 본다.
    # 이름에는 글자·숫자·공백·-·_ 만 된다(점이 들어가면 파이프라인이 job 없이 실패한다).
    expose_as: models lock 대조
    paths:
      - .model/models-lock.md

# k8s-deploy-ai 가 needs 로 기다린다 — 올리기 전에 굽기를 시작하면 받을 파일이 없다.
#
# 수동 규칙을 두지 않는다. 수동 job 을 needs 로 건 k8s-deploy-ai 가 그 job 이 돌 때까지
# 멈춰 서기 때문이다. 다시 올려야 하면 그 파이프라인의 이 job 을 재시도한다 — 이미 완료된
# 파일은 건너뛰므로(453 의 멱등) 몇 번을 돌려도 같다.
model-publish:
  stage: deploy
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  tags: [mupid-ci]
  # 같은 버전을 두 파이프라인이 동시에 올리지 않게.
  resource_group: mupid-model
  interruptible: false
  timeout: 30m
  variables:
    UV_CACHE_DIR: /cache/uv
  rules:
    # 보호 브랜치에서만 — JupyterHub 자격(MUPID_DATA_ENV)과 system-ci 토큰은 보호 변수다.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true" && $MUPID_DEPLOY_ENABLED == "true"'
      changes:
        - models.lock
  script:
    - uv run --python 3.12 --with requests --with websocket-client --with pyyaml
        python infra/ci/model_publish.py publish
