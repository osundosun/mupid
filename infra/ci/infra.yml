# Infra 영역 — 매니페스트·CI·배포 스크립트의 정적 검사.
#
# 사람이 로컬에서만 돌리던 unittest 를 CI 로 옮긴다 (master 의 manifests-verify 와
# 같은 명령). 서버에도 도커 데몬에도 네트워크에도 붙지 않는다.
#
# **이 job 이 없던 동안 실제로 드리프트가 생겼다.** k8s nginx 사본이 RSC 블록을
# 놓친 채 돌고 있었다 — infra/deploy/nginx.conf 는 a48dab9(S15P21A204-349)에서 그
# 블록을 얻었는데 k8s 사본은 그 이전 상태를 복사했고, 76건이 개발자 로컬에서만
# 돌아서 아무도 몰랐다. NginxCopyTest 가 그걸 잡는 테스트다.
#
# MR 에서는 Infra 라벨이 고른다. 경로가 아니라 라벨인 것은 다른 영역과 같은
# 이유다 — infra_k8s 는 여러 영역이 함께 건드리는 곳이라 경로 규칙이 넓어지고,
# 라벨 없는 MR 은 area-preflight 가 막기 때문이다.
infra-verify:
  stage: verify
  image: python:3.12-slim
  tags: [mupid-ci]
  interruptible: true
  timeout: 10m
  needs:
    # 앞단 판정을 먼저 통과해야 한다. optional 인 이유는 브랜치 파이프라인에
    # area-preflight 가 없기 때문이다 — 없으면 이 needs 는 무시된다.
    - job: area-preflight
      artifacts: false
      optional: true
  before_script:
    # 이 이미지에는 git 이 없다. 테스트가 저장소 이력을 읽는다 —
    # 어떤 최상위 경로가 있는지(새 영역이 표에 들어왔는지)와 실제 병합 커밋의
    # 변경 범위. 그 검사가 app/ 을 잡아낸 검사라 CI 에서 건너뛰게 두면 안 된다.
    - apt-get update && apt-get install -y --no-install-recommends git
    - python -m pip install --quiet PyYAML
  rules:
    # MR 에서는 라벨이 고른다 — infra/ci/labels.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)\s*Infra\s*(,|$)/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # 브랜치 파이프라인에는 CI_MERGE_REQUEST_LABELS 가 없다. 경로로 판단한다.
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"'
      changes:
        - infra/**/*
        - infra_k8s/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/'
  script:
    # kubectl 이 없으면 kustomize 를 쓰는 테스트는 스스로 건너뛴다.
    # 파일 단위 검사(NginxCopyTest·AreaRoutingTest)는 그대로 돌아, 드리프트와
    # 라우팅 규약 어긋남은 여기서 잡힌다.
    - python -B -m unittest discover -s infra_k8s/tests -v
    - mkdir -p .areas && printf '%s\n' Infra > .areas/Infra
  artifacts:
    # '이 영역을 실제로 검증했다' 는 증거. area-gate 가 이것을 읽는다.
    # on_success 인 이유는 검증이 실패했는데 '검증했다' 고 주장하면 안 되기 때문이다.
    when: on_success
    expire_in: 1 day
    paths:
      - .areas/Infra
