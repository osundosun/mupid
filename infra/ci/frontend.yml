frontend-verify:
  stage: verify
  image: node:22-bookworm-slim
  tags: [mupid-ci]
  interruptible: true
  timeout: 15m
  variables:
    MUPID_DEPLOY_TARGET: ec2
    NEXT_TELEMETRY_DISABLED: '1'
    # backend-verify 와 같은 이유로 GitLab 의 `cache:` 를 쓰지 않는다 — 압축·해제가
    # 빌드보다 오래 걸린다. /cache 는 러너가 붙여 주는 도커 볼륨이라 job 사이에
    # 그대로 남는다.
    npm_config_cache: /cache/npm
  needs:
    # 앞단 판정 뒤에 돈다. 게이트가 아니라 순서다 — 모자란 라벨은 area-preflight
    # 가 자기 job 에서 빨강으로 만든다. 여기서 먼저 멈추면 검증 자체가 시작되지
    # 않아 '아무것도 안 본 초록불' 이 나오지 않는다.
    - job: area-preflight
      artifacts: false
      optional: true
  rules:
    # MR 에서는 라벨이 고른다 — infra/ci/labels.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)\s*Frontend\s*(,|$)/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # 브랜치 파이프라인에는 CI_MERGE_REQUEST_LABELS 가 없다. 경로로 판단한다.
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"'
      changes: [frontend/**/*, app/**/*, infra/ci/frontend.yml, infra_k8s/**/*, .gitlab-ci.yml]
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/'
  script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run build
    - test -f dist/client/index.html
    # 이 영역을 실제로 검증했다는 증거. area-gate 가 이것을 읽는다.
    - cd .. && mkdir -p .areas && printf '%s\n' Frontend > .areas/Frontend
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - .areas/Frontend

# 아티팩트를 만들지 않는다. 예전에는 dist/client 를 올려 k8s-deploy-web 이
# 받아 썼는데, 그러면 배포되는 바이트가 코디네이터를 한 번 왕복한다. 백엔드가
# jar 를 아티팩트로 만들지 않고 이미지 빌드 안에서 컴파일하듯, 프론트엔드도
# infra_k8s/ci/package-web.sh 가 소스부터 굽는다. 이 job 은 MR 게이트로 남는다
# — 빌드가 깨졌는지 여기서 먼저 걸린다.
#
# frontend-package·frontend-deploy 는 Compose 배포 전용이라 제거했다.
