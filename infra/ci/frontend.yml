frontend-verify:
  stage: verify
  image: node:22-bookworm-slim
  tags: [mupid-ci]
  interruptible: true
  timeout: 15m
  variables:
    MUPID_DEPLOY_TARGET: ec2
    NEXT_TELEMETRY_DISABLED: '1'
    # backend-verify 와 같은 이유로 GitLab 의 `cache:` 를 쓰지 않는다 — 압축·해제가
    # 빌드보다 오래 걸린다. /cache 는 러너가 붙여 주는 도커 볼륨이라 job 사이에
    # 그대로 남는다.
    npm_config_cache: /cache/npm
  needs:
    # 앞단 판정 뒤에 돈다. 게이트가 아니라 순서다 — 모자란 라벨은 area-preflight
    # 가 자기 job 에서 빨강으로 만든다. 여기서 먼저 멈추면 검증 자체가 시작되지
    # 않아 '아무것도 안 본 초록불' 이 나오지 않는다.
    - job: area-preflight
      artifacts: false
      optional: true
  rules:
    # MR 에서는 라벨이 고른다 — infra/ci/labels.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)\s*Frontend\s*(,|$)/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # 브랜치 파이프라인에는 CI_MERGE_REQUEST_LABELS 가 없다. 경로로 판단한다.
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"'
      changes: [frontend/**/*, app/**/*, infra/ci/frontend.yml, infra_k8s/**/*, .gitlab-ci.yml]
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/'
  script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run build
    - test -f dist/client/index.html
    # 프론트엔드 시험. **없던 동안 40여 개가 로컬에서만 돌았다.**
    #
    # 그래서 실제로 놓쳤다 — `checkForUpdates` 가 상태를 두 번 읽는 것을 아무도
    # 몰랐고(기동마다 매니페스트 왕복이 배로 늘었다), 매니페스트 중복 요청도
    # 실기기 로그를 보고서야 찾았다. 시험이 있으면 그 자리에서 잡혔을 것들이다.
    #
    # **여기(빌드 job)에 얹는다.** 별도 job 으로 두려 했는데 `AreaRoutingTest`
    # 가 "영역당 job 하나" 를 강제한다 — `area-gate` 는 영역 job 이 남긴 marker
    # 를 세고, 그 관계가 1:1 이라는 것이 게이트의 근거다. 계약을 깨는 것보다
    # 빌드 뒤에 한 줄 더 도는 편이 낫다.
    #
    # **기준선 검사를 거친다.** 이 시험들은 오래 CI 에서 빠져 있었고 그 사이
    # `origin/develop` 에 39개 실패가 쌓였다(CSS 값·레이아웃 단언 드리프트).
    # 그대로 걸면 모든 MR 이 빨간불이 되고, 그러면 결국 job 을 끄게 된다.
    # `tests/failures-baseline.txt` 에 이미 깨진 시험 이름을 적어 두고
    # **그 목록에 없는 실패만** 막는다 — 즉 이번 변경이 깨뜨린 것만 잡는다.
    #
    # **NODE_ENV 를 비운다.** 이 러너 셸에는 상시 production 이 걸려 있을 수
    # 있고, 그러면 devDependencies 가 빠져 시험이 못 돈다.
    - unset NODE_ENV
    - node tests/check-test-baseline.mjs
    # 이 영역을 실제로 검증했다는 증거. area-gate 가 이것을 읽는다.
    - cd .. && mkdir -p .areas && printf '%s\n' Frontend > .areas/Frontend
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - .areas/Frontend

# 아티팩트를 만들지 않는다. 예전에는 dist/client 를 올려 k8s-deploy-web 이
# 받아 썼는데, 그러면 배포되는 바이트가 코디네이터를 한 번 왕복한다. 백엔드가
# jar 를 아티팩트로 만들지 않고 이미지 빌드 안에서 컴파일하듯, 프론트엔드도
# infra_k8s/ci/package-web.sh 가 소스부터 굽는다. 이 job 은 MR 게이트로 남는다
# — 빌드가 깨졌는지 여기서 먼저 걸린다.
#
# frontend-package·frontend-deploy 는 Compose 배포 전용이라 제거했다.
