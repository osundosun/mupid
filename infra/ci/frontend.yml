frontend-verify:
  stage: verify
  image: node:22-bookworm-slim
  tags: [mupid-ci]
  interruptible: true
  timeout: 15m
  variables:
    MUPID_DEPLOY_TARGET: ec2
    NEXT_TELEMETRY_DISABLED: '1'
  cache:
    key:
      files: [frontend/package-lock.json]
      prefix: frontend-npm
    paths: [frontend/.npm/]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [frontend/**/*, infra/ci/frontend.yml, infra_k8s/**/*, .gitlab-ci.yml]
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"'
      changes: [frontend/**/*, infra/ci/frontend.yml, infra_k8s/**/*, .gitlab-ci.yml]
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run build
    - test -f dist/client/index.html
  artifacts:
    expire_in: 7 days
    paths: [frontend/dist/client/]

# frontend-package·frontend-deploy 는 Compose 배포 전용이라 제거했다.
# 프론트엔드는 이제 infra_k8s/ci/k8s-release.yml 이 이미지로 구워 배포한다.
