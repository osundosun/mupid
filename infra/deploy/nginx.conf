upstream mupid_api { server api:8800; keepalive 32; }
# 오브젝트 스토리지(SeaweedFS filer). 음원 바이트는 전부 여기로 오간다.
# storage 컨테이너를 재생성하면 IP 가 바뀌므로 nginx 도 함께 재생성해야 한다
# (api 를 교체할 때 receive.sh 가 nginx 를 force-recreate 하는 것과 같은 이유).
upstream mupid_storage { server storage:8888; keepalive 16; }
server {
    listen 80;
    server_name j15a204.p.ssafy.io;
    location = /healthz { access_log off; return 200 'ok\n'; }
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://j15a204.p.ssafy.io$request_uri; }
}
server {
    listen 443 ssl;
    server_name j15a204.p.ssafy.io;
    ssl_certificate /etc/letsencrypt/live/j15a204.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15a204.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 20m;
    location = /healthz { access_log off; return 200 'ok\n'; }

    # -------------------------------------------------------------------------
    # 음원 바이트는 스프링을 거치지 않는다. 스프링은 인증과 스토리지 경로 결정만 한다.
    # 고용량 음원이 JVM 힙에 올라오는 것을 막으려는 구조다.
    #   업로드   : auth_request      (본문 없는 선행 서브요청)
    #   다운로드 : X-Accel-Redirect  (응답 헤더)
    # 자세한 배경은 api/knowledge/decision/0016-audio-upload-three-step.md 참고.
    #
    # 이 블록이 없으면 업로드는 404, 다운로드는 404 가 된다. 스프링만 띄워서는
    # 음원을 올리거나 받을 수 없다.
    # -------------------------------------------------------------------------

    # 청크 업로드. 정규식이라 아래 `location /storage/`·`location /` 보다 먼저 매칭된다.
    location ~ ^/upload/chunk/(?<stream_id>[0-9]+)/(?<chunk_index>[0-9]+)$ {
        auth_request /internal/chunk-upload-auth;
        auth_request_set $storage_path $upstream_http_x_storage_path;
        # 거절 사유를 살려 보낸다. nginx 가 본문을 버리고 500 으로 접어도 이 헤더는 남는다.
        auth_request_set $mupid_error $upstream_http_x_mupid_error;
        add_header X-Mupid-Error $mupid_error always;

        # 디스크에 받아 두지 않고 받는 즉시 스토리지로 흘린다.
        proxy_request_buffering off;
        # 실제 상한 정책은 스프링(ChunkServiceImpl.CHUNK_FILE_MAX_SIZE)이 갖는다.
        # 여기 값은 Content-Length 없이 오는 요청까지 막는 최후의 방어선이다.
        client_max_body_size 100m;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        # 클라이언트의 액세스 토큰이 스토리지로 새지 않게 지운다.
        proxy_set_header Authorization '';

        proxy_pass http://mupid_storage$storage_path;
    }

    # auth_request 전용. 본문 없이 스프링에 인증·경로만 묻는다.
    #
    # nginx 는 이 서브요청의 401/403 만 클라이언트로 그대로 넘기고,
    # 그 밖의 4xx(404·409·413 등)는 전부 500 으로 바꿔 버린다.
    # 사유는 응답의 X-Mupid-Error 헤더로 살려 보낸다 (본문은 사라진다).
    location = /internal/chunk-upload-auth {
        internal;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_pass_request_body off;
        proxy_set_header Content-Length '';
        # 스프링이 용량 상한을 검사할 수 있도록 원래 본문 길이를 넘긴다.
        proxy_set_header X-Original-Content-Length $content_length;
        proxy_set_header Host $host;

        proxy_pass http://mupid_api/api/v1/chunk/$stream_id/$chunk_index/upload-auth;
    }

    # 스프링이 내려준 X-Accel-Redirect 를 받아 오브젝트 스토리지에서
    # 실제 청크 바이트를 읽어 클라이언트에 보낸다. internal 이라 외부에서 직접 못 친다.
    location /storage/ {
        internal;
        proxy_pass http://mupid_storage/;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        # 원 요청의 Authorization 이 스토리지로 새지 않도록 지운다.
        proxy_set_header Authorization '';

        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://mupid_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    # 안드로이드 APK 내려받기.
    #
    # /srv/web/downloads 는 노드의 /srv/mupid-k8s/downloads 를 그대로 읽는다
    # (edge.yaml 의 hostPath). 웹 이미지 안에 굽지 않는 이유는 프론트 배포마다
    # 수십 MB 를 다시 실어 보내게 되기 때문이다. APK 는 app/ 이나 frontend/ 가
    # 바뀔 때만 새로 올라간다.
    #
    # mupid.apk 는 mupid-<커밋>.apk 를 가리키는 심볼릭 링크다. 무엇이 올라가
    # 있는지는 같은 이름의 .sha256 으로 확인한다.
    location = /download/mupid.apk {
        alias /srv/web/downloads/mupid.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="mupid.apk"';
        # 새 APK 가 올라갔는데 예전 것을 받아 가면 안 된다.
        add_header Cache-Control 'no-store';
    }
    location = /download/mupid.apk.sha256 {
        alias /srv/web/downloads/mupid.apk.sha256;
        default_type text/plain;
        add_header Cache-Control 'no-store';
    }

    # 네이티브 갈래 매니페스트. 앱은 "새 APK 가 있나" 를 **이 파일로만** 판단한다 —
    # APK 와 함께 놓이는 .sha256 에는 sha256 밖에 없어서, 내 것보다 새것인지를
    # 거기서 알 수 없다(versionCode 가 없다).
    #
    # no-store 가 핵심이다. 중간 캐시가 이 값을 붙들면 새 APK 를 올려도 안내가
    # 영영 뜨지 않는다.
    location = /download/native.json {
        alias /srv/web/downloads/native.json;
        default_type application/json;
        add_header Cache-Control 'no-store';
    }

    # 웹 번들 갈래. APK 와 **같은 디렉터리**에 얹는다 — 마운트도 수신기도 이미
    # 있다(/srv/mupid-k8s/downloads → /srv/web/downloads, readOnly).
    #
    # 이름에 빌드 타임스탬프가 들어가므로(web-<builtAt>.tar.gz) 내용이 바뀌지
    # 않는다. 그래서 오래 캐시해도 되고, **그래야** 같은 판을 다시 받지 않는다.
    # 반대로 매니페스트(web.json)는 no-store 다 — 그쪽이 스위치다.
    location ~ ^/download/(?<bundle>web-[0-9]+\.tar\.gz)$ {
        alias /srv/web/downloads/$bundle;
        default_type application/gzip;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    location = /download/web.json {
        alias /srv/web/downloads/web.json;
        default_type application/json;
        # 새 번들이 올라갔는데 예전 것을 보면 영영 업데이트가 안 뜬다.
        add_header Cache-Control 'no-store';
    }

    root /srv/web/current;

    # -------------------------------------------------------------------------
    # 화면을 옮길 때 라우터가 받아 가는 RSC 페이로드.
    #
    # 라우터는 `/explore?_rsc` 처럼 **화면 주소에 표시만 붙여서** 요청한다. RSC
    # 서버가 있을 때는 그 표시를 보고 HTML 대신 페이로드를 내주지만, 여기서는
    # 아래 `try_files` 가 `explore.html` 을 그대로 준다. 라우터는 그것이 RSC
    # 응답이 아닌 것을 보고 **문서를 통째로 다시 읽는다** — 메뉴를 옮길 때마다
    # 듣던 곡이 끊기고 현재 곡·재생 위치·재생 목록이 초기화되던 원인이다.
    #
    # 그래서 `RSC: 1` 이 붙은 요청만 같은 경로의 `.rsc` 파일로 돌린다. Tauri 앱
    # 셸이 `app/src/lib.rs` 의 `serve_rsc` 로 하는 것과 같은 협상이고, 빌드는
    # 화면마다 `.rsc` 를 함께 내보낸다 (`frontend/dist/client/explore.rsc`).
    #
    # `if` 를 화면 경로 안에만 두어 위의 API·업로드·스토리지 규칙은 건드리지
    # 않는다. `if` 안에 `rewrite ... last` 만 두는 것은 nginx 가 안전하다고
    # 밝혀 둔 쓰임이다.
    # -------------------------------------------------------------------------
    location / {
        if ($http_rsc = "1") { rewrite ^(.*)/$ $1/index.rsc last; }
        if ($http_rsc = "1") { rewrite ^(.+[^/])$ $1.rsc last; }
        try_files $uri $uri.html $uri/index.html =404;
    }

    # `.rsc` 는 mime.types 에 없어 그냥 두면 `application/octet-stream` 으로 나간다.
    # 형식이 틀리면 라우터는 역시 전체 새로고침으로 떨어지므로 여기서 직접 박는다.
    location ~ \.rsc$ {
        default_type text/x-component;
        try_files $uri =404;
    }
}
