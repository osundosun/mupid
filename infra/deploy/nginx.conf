upstream mupid_api { server api:8800; keepalive 32; }
server {
    listen 80;
    server_name j15a204.p.ssafy.io;
    location = /healthz { access_log off; return 200 'ok\n'; }
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://j15a204.p.ssafy.io$request_uri; }
}
server {
    listen 443 ssl;
    server_name j15a204.p.ssafy.io;
    ssl_certificate /etc/letsencrypt/live/j15a204.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15a204.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 20m;
    location = /healthz { access_log off; return 200 'ok\n'; }
    location /api/ {
        proxy_pass http://mupid_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    root /srv/web/current;
    location / { try_files $uri $uri.html $uri/index.html =404; }
}
